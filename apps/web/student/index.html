<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuteur IA — Élève</title>
<style>
  :root { --fond:#f6f7f9; --carte:#fff; --texte:#1d2330; --doux:#667085; --accent:#1f7a5c; --eleve:#e7f3ee; --bord:#dde1e7; --choix:#fff7e0; --choix-bord:#f0b429; }
  @media (prefers-color-scheme: dark) { :root { --fond:#14171c; --carte:#1d2128; --texte:#e8eaee; --doux:#9aa3b2; --accent:#4cc196; --eleve:#1f3a30; --bord:#2c323c; --choix:#33290f; --choix-bord:#f0b429; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Noto Naskh Arabic", "Segoe UI", sans-serif; background:var(--fond); color:var(--texte); }
  main { max-width: 640px; margin: 0 auto; min-height: 100dvh; display:flex; flex-direction:column; padding: 16px; gap: 12px; }
  h1 { font-size: 1.2rem; margin: 0; }
  .carte { background:var(--carte); border:1px solid var(--bord); border-radius:14px; padding:16px; }
  input, textarea, button { font: inherit; font-size: 1.05rem; }
  input, textarea { width:100%; padding:12px; border:1px solid var(--bord); border-radius:10px; background:var(--fond); color:var(--texte); }
  button { padding: 12px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  button.secondaire { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.5; cursor:wait; }
  #fil { flex:1; display:flex; flex-direction:column; gap:10px; overflow-y:auto; }
  .msg { padding:12px 14px; border-radius:14px; max-width:90%; white-space:pre-wrap; line-height:1.7; font-size:1.1rem; }
  .tuteur { background:var(--carte); border:1px solid var(--bord); align-self:flex-start; }
  .eleve { background:var(--eleve); align-self:flex-end; }
  .saisie { display:flex; gap:8px; }
  .saisie textarea { resize:none; height:52px; }
  #choix { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  #choix button { background:var(--choix); color:var(--texte); border:2px solid var(--choix-bord); min-width:88px; font-size:1.4rem; }
  .erreur { color:#c0392b; min-height:1.2em; margin:0; }
  .entete { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  [hidden] { display:none !important; }
  #nombres button { min-width:64px; font-size:1.4rem; }
  #nombres button.choisi { outline:4px solid var(--choix-bord); }

  /* Mode CP : grosses lettres vocalisées, réponses par boutons, pas de clavier. */
  body.mode-cp .msg { font-size: 1.9rem; line-height: 2.1; }
  body.mode-cp .msg.eleve { font-size: 1.6rem; }
  body.mode-cp #choix button { font-size: 2.6rem; min-width: 110px; min-height: 96px; border-radius: 20px; }
  body.mode-cp #choix button.simple { font-size: 1.6rem; min-height: 72px; }
  body.mode-cp .saisie, body.mode-cp #question { display:none; }
  body.mode-cp #commencer { font-size: 1.8rem; padding: 20px 28px; border-radius: 20px; }

  /* Voix (mode CP) */
  .ecouter { background:transparent; border:0; color:var(--accent); font-size:1.4rem; padding:4px 8px; cursor:pointer; }
  .msg.tuteur .ecouter { display:inline-block; margin-inline-start:8px; vertical-align:middle; }
  .option { display:flex; flex-direction:column; align-items:center; gap:4px; }
  #choix .option .ecouter { display:inline-block; background:transparent; border:0; min-width:0; min-height:0; font-size:1.3rem; padding:0; }
  body.mode-cp #choix .option .ecouter { font-size:1.6rem; }
</style>
</head>
<body>
<main>
  <div class="entete"><h1>Tuteur IA — arabe</h1><span><span id="qui"></span> <button id="changer" class="secondaire" hidden style="padding:4px 10px;font-size:.9rem">Changer d'enfant</button></span></div>

  <section id="ecran-famille" class="carte" hidden>
    <p style="font-size:1.3rem">Qui es-tu ? Touche ton prénom.</p>
    <div id="enfants" style="display:flex;flex-wrap:wrap;gap:12px"></div>
    <p class="erreur" id="erreur-famille"></p>
  </section>

  <section id="ecran-code" class="carte" hidden>
    <p style="font-size:1.2rem">Bonjour ! Écris ton prénom et ton mot secret.</p>
    <input id="entree-prenom" dir="auto" autocomplete="username" placeholder="Ton prénom">
    <input id="entree-secret" type="password" autocomplete="current-password" placeholder="Ton mot secret" style="margin-top:8px">
    <p class="erreur" id="erreur-code"></p>
    <button id="valider-secret">Entrer</button>
    <p style="margin-top:16px"><button id="avec-code" class="lien" style="background:none;color:var(--accent);padding:0">J'ai un code à 6 chiffres</button></p>
    <div id="zone-code" hidden>
      <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456">
      <button id="valider-code" style="margin-top:8px">Entrer avec le code</button>
    </div>
  </section>

  <section id="ecran-accueil" class="carte" hidden>
    <p id="mon-palier"></p>
    <p id="invite-positionnement" hidden>Avant de commencer, un petit test pour savoir où tu en es.</p>
    <p class="erreur" id="erreur-accueil"></p>
    <div id="zone-nombre" hidden>
      <p>Combien d'exercices aujourd'hui ?</p>
      <div id="nombres" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px"></div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <button id="test-positionnement" hidden>Faire le test</button>
      <button id="commencer">Commencer la séance</button>
      <button id="test-passage" class="secondaire" hidden>🏆 Test de passage</button>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px">
      <button id="test-voix" class="secondaire">🔊 Tester la voix</button>
      <label for="vitesse-voix">Vitesse de la voix</label>
      <select id="vitesse-voix" style="width:auto">
        <option value="0.5">Très lente</option><option value="0.65">Lente</option>
        <option value="0.8">Moyenne</option><option value="1">Normale</option>
      </select>
    </div>
    <p class="doux" id="info-voix" style="color:var(--doux)"></p>
  </section>

  <section id="ecran-test" class="carte" hidden>
    <p class="doux" id="test-progression" style="color:var(--doux)"></p>
    <div id="test-question" class="msg tuteur" dir="auto" style="max-width:100%"></div>
    <p id="test-retour" style="font-size:1.4rem;min-height:1.6em;margin:8px 0"></p>
    <div id="test-choix" style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center"></div>
    <div class="saisie" id="test-saisie">
      <textarea id="test-texte" dir="auto" placeholder="Écris ta réponse…"></textarea>
      <button id="test-envoyer">Valider</button>
    </div>
    <p class="erreur" id="erreur-test"></p>
    <button id="test-fin" class="secondaire" hidden>Retour</button>
  </section>

  <section id="ecran-seance" hidden style="display:flex;flex-direction:column;gap:12px;flex:1">
    <div id="fil" aria-live="polite"></div>
    <p class="erreur" id="erreur-seance"></p>
    <div id="choix"></div>
    <div class="saisie">
      <textarea id="texte" dir="auto" placeholder="Écris ta réponse…"></textarea>
      <button id="envoyer">Répondre</button>
    </div>
    <button id="question" class="secondaire" title="Écris ta question dans la case, puis touche ce bouton">❓ Poser une question</button>
    <button id="terminer" class="secondaire">Terminer la séance</button>
  </section>
  <p id="version" style="color:var(--doux);font-size:.75rem;text-align:center;margin-top:24px"></p>
</main>
<script>
const $ = (id) => document.getElementById(id);
// Réponses simples proposées au CP quand aucun exercice n'est en cours (l'enfant n'a jamais à écrire).
const REPONSES_CP = ["نَعَمْ", "لَا", "لَمْ أَفْهَمْ"];
let seanceId = null, profil = null, occupeEnCours = false;

async function api(chemin, corps) {
  const r = await fetch(chemin, {
    method: corps === undefined ? "GET" : "POST",
    headers: { "content-type": "application/json" },
    body: corps === undefined ? undefined : JSON.stringify(corps),
    credentials: "same-origin",
  });
  const donnees = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof donnees.detail === "string" ? donnees.detail : "Erreur, réessaie.");
  return donnees;
}

function afficher(ecran) {
  for (const id of ["ecran-famille", "ecran-code", "ecran-accueil", "ecran-seance", "ecran-test"]) $(id).hidden = id !== ecran;
}

function choisirProfil(p) {
  profil = p;
  document.body.classList.toggle("mode-cp", p === "P1");
}

// --- Voix du téléphone (synthèse vocale intégrée au navigateur, gratuite, rien n'est envoyé) ---
const voix = { liste: [] };
function chargerVoix() {
  if (!("speechSynthesis" in window)) return;
  voix.liste = speechSynthesis.getVoices().filter((v) => (v.lang || "").toLowerCase().startsWith("ar"));
}
if ("speechSynthesis" in window) { chargerVoix(); speechSynthesis.onvoiceschanged = chargerVoix; }

function meilleureVoix() {
  // Préférence : arabe du Maroc, puis toute voix arabe.
  return voix.liste.find((v) => v.lang.toLowerCase() === "ar-ma") || voix.liste[0] || null;
}

function texteAPrononcer(texte) {
  return texte
    .replace(/\p{Extended_Pictographic}/gu, "")       // emojis
    .replace(/\u0640/g, "")                            // tatweel des formes de lettres (مـ ـمـ ـم)
    .replace(/[A-Za-zÀ-ÿ]+/g, "")                      // le tuteur ne lit que l'arabe
    .replace(/[«»"()\/]/g, " ")
    .replace(/[*_#`~|>=\[\]{}<•→←]/g, " ")             // mise en forme (gras, titres, puces) : jamais lue
    .replace(/(^|\n)\s*[-–]\s+/g, "$1")                // tirets de liste en début de ligne
    .replace(/\s+/g, " ").trim();
}

function parler(texte) {
  if (!("speechSynthesis" in window)) return false;
  const t = texteAPrononcer(texte);
  if (!t) return false;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "ar"; u.rate = vitesseVoix();               // réglable sur l'écran d'accueil
  const v = meilleureVoix(); if (v) { u.voice = v; u.lang = v.lang; }
  speechSynthesis.speak(u);
  return true;
}

// Vitesse : choisie sur cet appareil (gardée dans le navigateur) ; par défaut lente au CP, moyenne sinon.
function vitesseVoix() {
  let v = null;
  try { v = localStorage.getItem("vitesse-voix"); } catch {}
  return Number(v) || (profil === "P1" ? 0.65 : 0.8);
}
$("vitesse-voix").onchange = () => {
  try { localStorage.setItem("vitesse-voix", $("vitesse-voix").value); } catch {}
  parler("بَ بُ بِ. بَابٌ.");
};

function boutonEcouter(texte) {
  const b = document.createElement("button");
  b.className = "ecouter"; b.textContent = "🔊"; b.title = "Écouter"; b.type = "button";
  b.onclick = (e) => { e.stopPropagation(); parler(texte); };
  return b;
}

$("test-voix").onclick = () => {
  chargerVoix();
  const v = meilleureVoix();
  const ok = parler("بَ بُ بِ. بَابٌ.");
  $("info-voix").textContent = !ok ? "Ce navigateur ne sait pas lire à voix haute."
    : v ? `Voix utilisée : ${v.name} (${v.lang}).`
    : "Aucune voix arabe trouvée sur cet appareil : installez-en une dans les réglages du téléphone (Synthèse vocale).";
};

// Gras **mot** affiché en gras ; les autres symboles de mise en forme (# titres, * isolés) sont retirés.
// Construit avec des nœuds texte : aucun HTML venant du modèle n'est interprété.
function afficherMisEnForme(div, texte) {
  const propre = texte.replace(/^#+\s*/gm, "").replace(/(^|\n)\s*\*\s+/g, "$1• ");
  propre.split(/\*\*(.+?)\*\*/gs).forEach((morceau, i) => {
    const sansEtoiles = morceau.replace(/\*/g, "");
    if (i % 2) { const b = document.createElement("strong"); b.textContent = sansEtoiles; div.appendChild(b); }
    else div.appendChild(document.createTextNode(sansEtoiles));
  });
}

function ajouter(texte, qui) {
  const div = document.createElement("div");
  div.className = "msg " + qui;
  div.dir = "auto";
  if (qui === "tuteur") afficherMisEnForme(div, texte); else div.textContent = texte;
  if (qui === "tuteur") {
    div.appendChild(boutonEcouter(texte));
    if (profil === "P1") parler(texte);  // au CP, le tuteur lit son message à voix haute
  }
  $("fil").appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
}

// Boutons de réponse : ceux de l'exercice en cours, sinon (au CP) les réponses simples.
// Au CP, « لَمْ أَفْهَمْ » est toujours proposé : indice, puis explication, puis (seulement alors) l'IA.
const PAS_COMPRIS = "لَمْ أَفْهَمْ";
function boutons(choix) {
  const zone = $("choix"); zone.innerHTML = "";
  const avecChoix = choix && choix.length;
  const liste = avecChoix ? [...choix, PAS_COMPRIS] : (profil === "P1" ? REPONSES_CP : [PAS_COMPRIS]);
  for (const c of liste) {
    const b = document.createElement("button");
    b.textContent = c; b.dir = "auto";
    if (!avecChoix || c === PAS_COMPRIS) b.className = "simple";
    b.onclick = () => envoyer(c);
    const option = document.createElement("div");
    option.className = "option";
    option.append(b, boutonEcouter(c));  // au CP, l'enfant peut écouter chaque choix avant de toucher
    zone.appendChild(option);
  }
}

async function occupe(action, zoneErreur) {
  if (occupeEnCours) return;
  occupeEnCours = true;
  document.querySelectorAll("button").forEach((b) => (b.disabled = true));
  $(zoneErreur).textContent = "";
  try { await action(); } catch (e) { $(zoneErreur).textContent = e.message; }
  finally { occupeEnCours = false; document.querySelectorAll("button").forEach((b) => (b.disabled = false)); }
}

// Accueil : position dans le parcours, et les boutons utiles à ce moment-là.
function accueil(eleve) {
  const DERNIER_PALIER = eleve.dernier_palier;
  $("qui").textContent = eleve.prenom; choisirProfil(eleve.profil); $("changer").hidden = false;
  $("vitesse-voix").value = String(vitesseVoix());
  const positionne = eleve.palier !== null && eleve.palier !== undefined;
  $("mon-palier").textContent = positionne ? `Ton palier : ${eleve.palier}/${DERNIER_PALIER} · ${eleve.titre_palier}` : "";
  $("mon-palier").dir = "auto";
  $("invite-positionnement").hidden = positionne;
  $("test-positionnement").hidden = positionne;
  $("commencer").hidden = !positionne;
  $("test-passage").hidden = !positionne || eleve.palier >= DERNIER_PALIER;
  // Nombre d'exercices : celui réglé par le parent est proposé, l'enfant peut en choisir un autre.
  $("zone-nombre").hidden = !positionne;
  const parDefaut = eleve.exercices_par_seance || 10;
  const nombres = [...new Set([5, 10, 15, 20, parDefaut])].sort((a, b) => a - b);
  nombreChoisi = parDefaut; $("nombres").innerHTML = "";
  for (const n of nombres) {
    const b = document.createElement("button");
    b.className = "secondaire" + (n === parDefaut ? " choisi" : ""); b.textContent = n;
    b.onclick = () => { nombreChoisi = n; document.querySelectorAll("#nombres button").forEach((x) => x.classList.toggle("choisi", x === b)); };
    $("nombres").appendChild(b);
  }
  afficher("ecran-accueil");
}
let nombreChoisi = null;

// Appareil partagé (ordinateur de la maison) : l'enfant se déconnecte ; le suivant entre son propre code.
$("changer").onclick = async () => {
  if (seanceId && !$("ecran-seance").hidden) {
    if (!confirm("Terminer la séance et changer d'enfant ?")) return;
    await api(`/eleve/seances/${seanceId}/fin`, {}).catch(() => {});
  }
  await api("/eleve/deconnexion", {}).catch(() => {});
  seanceId = null; $("qui").textContent = ""; $("changer").hidden = true; $("code").value = "";
  demarrer();  // appareil de la famille : retour au choix du prénom ; sinon, écran du code
};

// Au démarrage : l'enfant déjà connecté sur cet appareil ; sinon, sur l'appareil de la famille, le choix
// du prénom (sans code) ; sinon le code donné par le parent.
async function demarrer() {
  try { accueil(await api("/eleve/moi")); return; } catch {}
  try {
    const enfants = await api("/famille/eleves");
    $("enfants").innerHTML = "";
    for (const e of enfants) {
      const b = document.createElement("button");
      b.textContent = e.prenom; b.dir = "auto"; b.style.cssText = "font-size:1.8rem;padding:18px 26px;border-radius:16px";
      b.onclick = () => occupe(async () => {
        await api(`/famille/eleves/${e.id}/entrer`, {});
        accueil(await api("/eleve/moi"));
      }, "erreur-famille");
      $("enfants").appendChild(b);
    }
    afficher("ecran-famille");
  } catch { afficher("ecran-code"); }
}

// --- Tests de positionnement et de passage (corrigés automatiquement) ---
let testId = null;
function poserQuestion(q) {
  $("test-progression").textContent = `Palier ${q.palier} · ${q.titre_palier} · question ${q.numero}`;
  // Les choix s'affichent en boutons : on les retire de l'énoncé affiché.
  const enonce = q.choix.length ? q.enonce.replace(/\s*\([^()]*\/[^()]*\)\s*$/, "") : q.enonce;
  $("test-question").textContent = enonce;
  $("test-question").appendChild(boutonEcouter(q.enonce));
  if (profil === "P1") parler(q.enonce);
  const zone = $("test-choix"); zone.innerHTML = "";
  for (const c of q.choix) {
    const b = document.createElement("button");
    b.textContent = c; b.dir = "auto";
    b.style.cssText = "background:var(--choix);color:var(--texte);border:2px solid var(--choix-bord);min-width:88px;font-size:1.6rem";
    b.onclick = () => repondreTest(c);
    const option = document.createElement("div"); option.className = "option";
    option.append(b, boutonEcouter(c)); zone.appendChild(option);
  }
  $("test-saisie").hidden = q.choix.length > 0;  // exercices à choix : boutons seulement
  $("test-texte").value = "";
}

async function lancerTest(type) {
  await occupe(async () => {
    const r = await api("/eleve/tests", { type });
    testId = r.test_id;
    $("test-retour").textContent = ""; $("test-fin").hidden = true; $("erreur-test").textContent = "";
    afficher("ecran-test"); poserQuestion(r.question);
  }, "erreur-accueil");
}
$("test-positionnement").onclick = () => lancerTest("positionnement");
$("test-passage").onclick = () => lancerTest("passage");

function repondreTest(texte) {
  texte = (texte || "").trim(); if (!texte) return;
  return occupe(async () => {
    const r = await api(`/eleve/tests/${testId}/reponses`, { reponse: texte });
    const retour = { juste: "✓ أَحْسَنْتَ!", faux: "✗", a_vocaliser: "اُكْتُبِ الجَوَابَ بِالشَّكْلِ" }[r.verdict];
    $("test-retour").textContent = retour; $("test-retour").dir = "auto";
    if (r.resultat) return finTest(r.resultat);
    if (r.question) poserQuestion(r.question);
  }, "erreur-test");
}
$("test-envoyer").onclick = () => repondreTest($("test-texte").value);

function finTest(res) {
  $("test-choix").innerHTML = ""; $("test-saisie").hidden = true;
  $("test-question").textContent = res.statut === "a_confirmer"
    ? `Bravo ! 🎉 Ton parent va confirmer ton palier : ${res.titre_palier}.`
    : "Pas encore… Continue à t'entraîner avec le tuteur, tu pourras réessayer. 💪";
  $("test-progression").textContent = "Test terminé";
  $("test-fin").hidden = false;
}
$("test-fin").onclick = () => demarrer();

$("valider-secret").onclick = () => occupe(async () => {
  await api("/eleve/entrer", { prenom: $("entree-prenom").value.trim(), secret: $("entree-secret").value });
  $("entree-secret").value = "";
  accueil(await api("/eleve/moi"));
}, "erreur-code");
$("entree-secret").addEventListener("keydown", (e) => { if (e.key === "Enter") $("valider-secret").click(); });
$("avec-code").onclick = () => { $("zone-code").hidden = !$("zone-code").hidden; };

$("valider-code").onclick = () => occupe(async () => {
  await api("/eleve/connexion", { code: $("code").value.trim() });
  accueil(await api("/eleve/moi"));
}, "erreur-code");

$("commencer").onclick = () => occupe(async () => {
  const r = await api("/eleve/seances", nombreChoisi ? { nombre: nombreChoisi } : {});
  seanceId = r.seance_id; $("fil").innerHTML = "";
  afficher("ecran-seance");
  ajouter(r.reponse, "tuteur");
  boutons(r.choix);
}, "erreur-accueil");

// question : « Poser une question » (le texte va à l'IA) ; sinon c'est une réponse, corrigée par le serveur.
function envoyer(texte, question = false) {
  texte = (texte || "").trim();
  if (!texte) { if (question) $("texte").focus(); return; }
  return occupe(async () => {
    ajouter(texte, "eleve"); $("texte").value = ""; $("choix").innerHTML = "";
    const r = await api(`/eleve/seances/${seanceId}/messages`, question ? { texte, question: true } : { texte });
    ajouter(r.reponse, "tuteur");
    if (r.terminee) return finDeSeance();  // temps écoulé : pause imposée
    boutons(r.choix);
  }, "erreur-seance");
}

$("envoyer").onclick = () => envoyer($("texte").value);
$("question").onclick = () => envoyer($("texte").value, true);
$("texte").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); envoyer($("texte").value); }
});

$("terminer").onclick = () => occupe(async () => {
  const r = await api(`/eleve/seances/${seanceId}/fin`, {});
  ajouter(r.reponse, "tuteur");
  finDeSeance();
}, "erreur-seance");

function finDeSeance() {
  $("choix").innerHTML = "";
  setTimeout(() => demarrer(), 6000);
}

demarrer();
fetch("/version").then((r) => r.json()).then((v) => { document.getElementById("version").textContent = "Version " + v.version; }).catch(() => {});
</script>
