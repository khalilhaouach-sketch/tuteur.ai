      مَدْخُولٌ: خلط بين اسم المكان وغيره
    indice: عَلَى وَزْنِ «مَفْعَلٌ».
    explication: '«مَدْخَلٌ» اسْمُ مَكَانٍ: مَكَانُ الدُّخُولِ.'
  - id: makan-7
    difficulte: 2
    enonce: '«مَطْلَعُ» فِي «اسْتَيْقَظْتُ مَطْلَعَ الفَجْرِ»: اسْمُ زَمَانٍ أَمِ اسْمُ مَكَانٍ؟ (اسْمُ زَمَانٍ / اسْمُ مَكَانٍ)'
    reponses:
    - اسْمُ زَمَانٍ
    erreurs:
      اسْمُ مَكَانٍ: خلط بين اسم الزمان واسم المكان
    indice: هَلْ يَدُلُّ عَلَى وَقْتٍ أَمْ عَلَى مَوْضِعٍ؟
    explication: '«مَطْلَعُ الفَجْرِ» وَقْتُ طُلُوعِهِ: اسْمُ زَمَانٍ.'
  - id: makan-8
    difficulte: 2
    enonce: '«مَلْعَبٌ» فِي «لَعِبْنَا فِي المَلْعَبِ»: اسْمُ زَمَانٍ أَمِ اسْمُ مَكَانٍ؟ (اسْمُ زَمَانٍ / اسْمُ مَكَانٍ)'
    reponses:
    - اسْمُ مَكَانٍ
    erreurs:
      اسْمُ زَمَانٍ: خلط بين اسم الزمان واسم المكان
    indice: هَلْ يَدُلُّ عَلَى وَقْتٍ أَمْ عَلَى مَوْضِعٍ؟
    explication: «مَلْعَبٌ» اسْمُ مَكَانٍ.
  - id: makan-9
    difficulte: 2
    enonce: مَا اسْمُ المَكَانِ مِنْ «نَزَلَ» (يَنْزِلُ)؟ (مَنْزَلٌ / مَنْزِلٌ / نَازِلٌ)
    reponses:
