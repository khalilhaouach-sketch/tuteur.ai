    indice: إِذَا كَانَ المُضَارِعُ مَكْسُورَ العَيْنِ فَالوَزْنُ «مَفْعِلٌ».
    explication: «مَنْزِلٌ» عَلَى وَزْنِ «مَفْعِلٌ» لِأَنَّ المُضَارِعَ «يَنْزِلُ».
  - id: makan-10
    difficulte: 2
    enonce: مَا اسْمُ المَكَانِ مِنْ «سَبَحَ»؟ (سَبَّاحٌ / مَسْبَحٌ / سِبَاحَةٌ)
    reponses:
    - مَسْبَحٌ
    erreurs:
      سَبَّاحٌ: خلط بين اسم المكان وغيره
      سِبَاحَةٌ: خلط بين اسم المكان وغيره
    indice: عَلَى وَزْنِ «مَفْعَلٌ».
    explication: '«مَسْبَحٌ» اسْمُ مَكَانٍ: مَكَانُ السِّبَاحَةِ.'
  - id: makan-11
    difficulte: 3
    enonce: مَا اسْمُ المَكَانِ مِنْ «اجْتَمَعَ»؟ (مُجْتَمِعٌ / مُجْتَمَعٌ / اجْتِمَاعٌ)
    reponses:
    - مُجْتَمَعٌ
    erreurs:
      مُجْتَمِعٌ: خطأ في وزن اسم المكان
      اجْتِمَاعٌ: خطأ في وزن اسم المكان
    indice: 'مِنْ غَيْرِ الثُّلَاثِيِّ: عَلَى وَزْنِ اسْمِ المَفْعُولِ.'
    explication: «مُجْتَمَعٌ» اسْمُ مَكَانٍ مِنَ «اجْتَمَعَ» (عَلَى وَزْنِ اسْمِ المَفْعُولِ).
  - id: makan-12
    difficulte: 3
    enonce: مَا اسْمُ المَكَانِ مِنْ «غَرَبَتِ الشَّمْسُ»؟ (مَغْرِبٌ / غَارِبٌ / غُرُوبٌ)
    reponses:
    - مَغْرِبٌ
    erreurs:
      غَارِبٌ: خلط بين اسم المكان وغيره
      غُرُوبٌ: خلط بين اسم المكان وغيره
    indice: المُضَارِعُ «تَغْرُبُ»، لَكِنَّ العَرَبَ قَالَتْ «مَغْرِبٌ».
    explication: «مَغْرِبٌ» اسْمُ مَكَانٍ (وَزَمَانٍ) لِلْغُرُوبِ.
  - id: makan-13
    difficulte: 3
    enonce: بِأَيِّ حَرْفٍ يَبْدَأُ اسْمُ المَكَانِ مِنَ الفِعْلِ الثُّلَاثِيِّ؟ (المِيمُ / التَّاءُ / الهَمْزَةُ)
