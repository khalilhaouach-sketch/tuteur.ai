      مَنْشُورٌ: خلط بين اسم الآلة وغيره
    indice: اسْمُ الآلَةِ يَدُلُّ عَلَى أَدَاةٍ نَعْمَلُ بِهَا.
    explication: «مِنْشَارٌ» اسْمُ آلَةٍ عَلَى وَزْنِ «مِفْعَالٌ».
  - id: ala-5
    difficulte: 1
    enonce: 'اِخْتَرِ اسْمَ الآلَةِ: (مَشْرُوبٌ / مِشْرَطٌ / شَارِبٌ)'
