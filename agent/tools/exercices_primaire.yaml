      اليَاءُ: خلط بين جمع المؤنث وجمع المذكر
    indice: جَمْعُ المُؤَنَّثِ السَّالِمُ يُنْصَبُ بِعَلَامَةٍ فَرْعِيَّةٍ.
    explication: «المُعَلِّمَاتِ» مَفْعُولٌ بِهِ مَنْصُوبٌ وَعَلَامَةُ نَصْبِهِ الكَسْرَةُ، لِأَنَّهُ جَمْعُ مُؤَنَّثٍ سَالِمٌ.
  - id: muthanna-4
    difficulte: 1
    enonce: مَا عَلَامَةُ رَفْعِ المُثَنَّى؟ (الأَلِفُ / الوَاوُ / الضَّمَّةُ)
    reponses:
    - الأَلِفُ
    erreurs:
      الوَاوُ: خطأ في إعراب المثنى
      الضَّمَّةُ: خطأ في إعراب المثنى
    indice: 'مِثَالٌ: جَاءَ التِّلْمِيذَانِ.'
    explication: يُرْفَعُ المُثَنَّى بِالأَلِفِ.
  - id: muthanna-5
    difficulte: 1
    enonce: 'اِخْتَرِ الصَّحِيحَ: فَازَ ... (اللَّاعِبَانِ / اللَّاعِبَيْنِ / اللَّاعِبُونَ)'
    reponses:
    - اللَّاعِبَانِ
    erreurs:
