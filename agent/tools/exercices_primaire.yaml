    enonce: 'اِخْتَرِ الصَّحِيحَ: مَرَرْتُ بِـ... (الفَلَّاحُونَ / الفَلَّاحِينَ / الفَلَّاحَانِ)'
    reponses:
    - الفَلَّاحِينَ
    erreurs:
      الفَلَّاحُونَ: خطأ في إعراب الجمع المذكر السالم
      الفَلَّاحَانِ: خطأ في إعراب الجمع المذكر السالم
    indice: 'الاِسْمُ المَجْرُورُ جَمْعُ مُذَكَّرٍ سَالِمٌ: يُجَرُّ بِاليَاءِ.'
    explication: 'نَقُولُ: مَرَرْتُ بِالفَلَّاحِينَ.'
  - id: muthanna-12
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: إِنَّ ... مُتَعَاوِنَتَانِ. (الجَارَتَانِ / الجَارَتَيْنِ / الجَارَاتُ)'
    reponses:
