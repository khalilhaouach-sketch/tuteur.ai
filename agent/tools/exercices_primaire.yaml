- notion: الأفعال الخمسة
  exercices:
  - id: khamsa-f-1
    difficulte: 1
    enonce: أَيُّ فِعْلٍ مِنَ الأَفْعَالِ الخَمْسَةِ؟ (يَكْتُبُ / يَكْتُبُونَ / كَتَبُوا)
    reponses:
    - يَكْتُبُونَ
    erreurs:
      يَكْتُبُ: فعل لم تتصل به ألف الاثنين أو واو الجماعة أو ياء المخاطبة
      كَتَبُوا: الأفعال الخمسة أفعال مضارعة
    indice: الأَفْعَالُ الخَمْسَةُ أَفْعَالٌ مُضَارِعَةٌ اتَّصَلَتْ بِهَا أَلِفُ الاِثْنَيْنِ أَوْ وَاوُ الجَمَاعَةِ أَوْ يَاءُ المُخَاطَبَةِ.
    explication: '«يَكْتُبُونَ» مِنَ الأَفْعَالِ الخَمْسَةِ: فِعْلٌ مُضَارِعٌ اتَّصَلَتْ بِهِ وَاوُ الجَمَاعَةِ.'
  - id: khamsa-f-2
    difficulte: 2
    enonce: 'مَا عَلَامَةُ رَفْعِ «تَلْعَبَانِ» فِي: أَنْتُمَا تَلْعَبَانِ؟ (الضَّمَّةُ / حَذْفُ النُّونِ / ثُبُوتُ النُّونِ)'
    reponses:
    - ثُبُوتُ النُّونِ
    erreurs:
      الضَّمَّةُ: إغفال حكم الأفعال الخمسة
      حَذْفُ النُّونِ: خلط بين علامة الرفع وعلامة النصب والجزم
    indice: الأَفْعَالُ الخَمْسَةُ تُرْفَعُ بِعَلَامَةٍ خَاصَّةٍ.
    explication: «تَلْعَبَانِ» مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ ثُبُوتُ النُّونِ، لِأَنَّهُ مِنَ الأَفْعَالِ الخَمْسَةِ.
  - id: khamsa-f-3
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: أَنْتِ لَمْ ... الدَّرْسَ. (تَفْهَمِينَ / تَفْهَمِ / تَفْهَمِي)'
    reponses:
    - تَفْهَمِي
    erreurs:
      تَفْهَمِينَ: عدم حذف النون في الجزم
      تَفْهَمِ: حذف ياء المخاطبة
    indice: «لَمْ» تَجْزِمُ، وَالأَفْعَالُ الخَمْسَةُ تُجْزَمُ بِحَذْفِ النُّونِ.
    explication: 'نَقُولُ «أَنْتِ لَمْ تَفْهَمِي الدَّرْسَ»: مَجْزُومٌ بِحَذْفِ النُّونِ، وَتَبْقَى يَاءُ المُخَاطَبَةِ.'
  - id: khamsa-f-4
    difficulte: 1
    enonce: أَيُّ فِعْلٍ مِنَ الأَفْعَالِ الخَمْسَةِ؟ (يَلْعَبُ / يَلْعَبُونَ / لَعِبَ)
    reponses:
    - يَلْعَبُونَ
    erreurs:
      يَلْعَبُ: خلط بين الأفعال الخمسة وغيرها
      لَعِبَ: خلط بين الأفعال الخمسة وغيرها
    indice: الأَفْعَالُ الخَمْسَةُ مُضَارِعٌ اتَّصَلَ بِأَلِفِ الاِثْنَيْنِ أَوْ وَاوِ الجَمَاعَةِ أَوْ يَاءِ المُخَاطَبَةِ.
    explication: '«يَلْعَبُونَ» مِنَ الأَفْعَالِ الخَمْسَةِ: مُضَارِعٌ مَعَ وَاوِ الجَمَاعَةِ.'
  - id: khamsa-f-5
    difficulte: 1
    enonce: أَيُّ فِعْلٍ مِنَ الأَفْعَالِ الخَمْسَةِ؟ (تَكْتُبِينَ / تَكْتُبُ / كَتَبْتِ)
    reponses:
    - تَكْتُبِينَ
    erreurs:
      تَكْتُبُ: خلط بين الأفعال الخمسة وغيرها
      كَتَبْتِ: خلط بين الأفعال الخمسة وغيرها
    indice: اِبْحَثْ عَنْ يَاءِ المُخَاطَبَةِ مَعَ المُضَارِعِ.
    explication: «تَكْتُبِينَ» مِنَ الأَفْعَالِ الخَمْسَةِ.
  - id: khamsa-f-6
    difficulte: 1
    enonce: مَا عَلَامَةُ رَفْعِ الأَفْعَالِ الخَمْسَةِ؟ (الضَّمَّةُ / ثُبُوتُ النُّونِ / حَذْفُ النُّونِ)
    reponses:
    - ثُبُوتُ النُّونِ
    erreurs:
      الضَّمَّةُ: خطأ في علامة إعراب الأفعال الخمسة
      حَذْفُ النُّونِ: خطأ في علامة إعراب الأفعال الخمسة
    indice: 'مِثَالٌ: التَّلَامِيذُ يَدْرُسُونَ.'
    explication: تُرْفَعُ الأَفْعَالُ الخَمْسَةُ بِثُبُوتِ النُّونِ.
  - id: khamsa-f-7
    difficulte: 2
    enonce: مَا عَلَامَةُ نَصْبِ الأَفْعَالِ الخَمْسَةِ؟ (الفَتْحَةُ / ثُبُوتُ النُّونِ / حَذْفُ النُّونِ)
    reponses:
    - حَذْفُ النُّونِ
    erreurs:
      الفَتْحَةُ: خطأ في علامة إعراب الأفعال الخمسة
      ثُبُوتُ النُّونِ: خطأ في علامة إعراب الأفعال الخمسة
    indice: 'مِثَالٌ: لَنْ يَتَأَخَّرُوا.'
    explication: تُنْصَبُ الأَفْعَالُ الخَمْسَةُ وَتُجْزَمُ بِحَذْفِ النُّونِ.
  - id: khamsa-f-8
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: التِّلْمِيذَانِ لَنْ ... (يَتَأَخَّرَانِ / يَتَأَخَّرَا / يَتَأَخَّرُ)'
    reponses:
    - يَتَأَخَّرَا
    erreurs:
      يَتَأَخَّرَانِ: خطأ في نصب الأفعال الخمسة
      يَتَأَخَّرُ: خطأ في نصب الأفعال الخمسة
    indice: بَعْدَ «لَنْ» يُنْصَبُ الفِعْلُ بِحَذْفِ النُّونِ.
    explication: 'نَقُولُ: التِّلْمِيذَانِ لَنْ يَتَأَخَّرَا.'
  - id: khamsa-f-9
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: أَنْتُمْ لَمْ ... الوَاجِبَ. (تُنْجِزُونَ / تُنْجِزُوا / تُنْجِزْ)'
    reponses:
    - تُنْجِزُوا
    erreurs:
      تُنْجِزُونَ: خطأ في جزم الأفعال الخمسة
      تُنْجِزْ: خطأ في جزم الأفعال الخمسة
    indice: بَعْدَ «لَمْ» يُجْزَمُ الفِعْلُ بِحَذْفِ النُّونِ.
    explication: 'نَقُولُ: أَنْتُمْ لَمْ تُنْجِزُوا الوَاجِبَ.'
  - id: khamsa-f-10
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: الأَوْلَادُ ... فِي الحَدِيقَةِ. (يَلْعَبُوا / يَلْعَبُونَ / يَلْعَبُ)'
    reponses:
    - يَلْعَبُونَ
    erreurs:
      يَلْعَبُوا: خطأ في رفع الأفعال الخمسة
      يَلْعَبُ: خطأ في رفع الأفعال الخمسة
    indice: الفِعْلُ مَرْفُوعٌ (لَا نَاصِبَ وَلَا جَازِمَ قَبْلَهُ).
    explication: 'نَقُولُ: الأَوْلَادُ يَلْعَبُونَ؛ مَرْفُوعٌ بِثُبُوتِ النُّونِ.'
  - id: khamsa-f-11
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: يَا مَرْيَمُ، لَا ... (تَتَأَخَّرِينَ / تَتَأَخَّرِي / تَتَأَخَّرْ)'
    reponses:
    - تَتَأَخَّرِي
    erreurs:
      تَتَأَخَّرِينَ: خطأ في جزم الأفعال الخمسة
      تَتَأَخَّرْ: خطأ في جزم الأفعال الخمسة
    indice: «لَا» النَّاهِيَةُ تَجْزِمُ.
    explication: 'نَقُولُ: لَا تَتَأَخَّرِي؛ مَجْزُومٌ بِحَذْفِ النُّونِ.'
  - id: khamsa-f-12
    difficulte: 3
    enonce: 'مَا عَلَامَةُ إِعْرَابِ «يُسَافِرُوا» فِي: يُرِيدُ الضُّيُوفُ أَنْ يُسَافِرُوا؟ (حَذْفُ النُّونِ لِأَنَّهُ مَنْصُوبٌ / حَذْفُ النُّونِ لِأَنَّهُ مَجْزُومٌ / ثُبُوتُ النُّونِ)'
    reponses:
    - حَذْفُ النُّونِ لِأَنَّهُ مَنْصُوبٌ
    erreurs:
      حَذْفُ النُّونِ لِأَنَّهُ مَجْزُومٌ: خطأ في علامة إعراب الأفعال الخمسة
      ثُبُوتُ النُّونِ: خطأ في علامة إعراب الأفعال الخمسة
    indice: «أَنْ» حَرْفُ نَصْبٍ.
    explication: «يُسَافِرُوا» مَنْصُوبٌ بِـ«أَنْ» وَعَلَامَةُ نَصْبِهِ حَذْفُ النُّونِ.
  - id: khamsa-f-13
    difficulte: 3
    enonce: كَمْ عَدَدُ صُوَرِ الأَفْعَالِ الخَمْسَةِ؟ (ثَلَاثٌ / خَمْسٌ / سِتٌّ)
    reponses:
    - خَمْسٌ
    erreurs:
      ثَلَاثٌ: خطأ في تعريف الأفعال الخمسة
      سِتٌّ: خطأ في تعريف الأفعال الخمسة
    indice: يَفْعَلَانِ، تَفْعَلَانِ، يَفْعَلُونَ، تَفْعَلُونَ، تَفْعَلِينَ.
    explication: 'صُوَرُهَا خَمْسٌ: يَفْعَلَانِ، تَفْعَلَانِ، يَفْعَلُونَ، تَفْعَلُونَ، تَفْعَلِينَ.'
- notion: الأسماء الخمسة
  exercices:
  - id: khamsa-a-1
    difficulte: 1
    enonce: 'اِخْتَرِ الصَّحِيحَ: جَاءَ ... أَحْمَدَ. (أَخَا / أَخُو / أَخِي)'
    reponses:
    - أَخُو
    erreurs:
      أَخَا: خطأ في رفع الأسماء الخمسة
      أَخِي: خطأ في رفع الأسماء الخمسة
    indice: الاِسْمُ هُنَا فَاعِلٌ مَرْفُوعٌ، وَالأَسْمَاءُ الخَمْسَةُ تُرْفَعُ بِالوَاوِ.
    explication: 'نَقُولُ «جَاءَ أَخُو أَحْمَدَ»: فَاعِلٌ مَرْفُوعٌ بِالوَاوِ لِأَنَّهُ مِنَ الأَسْمَاءِ الخَمْسَةِ.'
  - id: khamsa-a-2
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: رَأَيْتُ ... (أَبُوكَ / أَبِيكَ / أَبَاكَ)'
    reponses:
    - أَبَاكَ
    erreurs:
      أَبُوكَ: خطأ في نصب الأسماء الخمسة
      أَبِيكَ: خطأ في نصب الأسماء الخمسة
    indice: الاِسْمُ هُنَا مَفْعُولٌ بِهِ مَنْصُوبٌ، وَالأَسْمَاءُ الخَمْسَةُ تُنْصَبُ بِالأَلِفِ.
    explication: 'نَقُولُ «رَأَيْتُ أَبَاكَ»: مَفْعُولٌ بِهِ مَنْصُوبٌ بِالأَلِفِ.'
  - id: khamsa-a-3
    difficulte: 3
    enonce: 'مَا عَلَامَةُ جَرِّ «ذِي» فِي: سَلَّمْتُ عَلَى ذِي العِلْمِ؟ (الكَسْرَةُ / اليَاءُ / الأَلِفُ)'
    reponses:
    - اليَاءُ
    erreurs:
      الكَسْرَةُ: إغفال حكم الأسماء الخمسة
      الأَلِفُ: خلط بين علامة النصب وعلامة الجر
    indice: «ذُو» مِنَ الأَسْمَاءِ الخَمْسَةِ، وَهِيَ تُجَرُّ بِعَلَامَةٍ خَاصَّةٍ.
    explication: «ذِي» اسْمٌ مَجْرُورٌ بِـ«عَلَى» وَعَلَامَةُ جَرِّهِ اليَاءُ، لِأَنَّهُ مِنَ الأَسْمَاءِ الخَمْسَةِ.
  - id: khamsa-a-4
    difficulte: 1
    enonce: مَا الأَسْمَاءُ الخَمْسَةُ؟ (أَبٌ، أَخٌ، حَمٌ، فُو، ذُو / أَبٌ، أُمٌّ، أَخٌ، أُخْتٌ، جَدٌّ / أَنَا، أَنْتَ، هُوَ، نَحْنُ، هُمْ)
    reponses:
    - أَبٌ، أَخٌ، حَمٌ، فُو، ذُو
    erreurs:
      أَبٌ، أُمٌّ، أَخٌ، أُخْتٌ، جَدٌّ: خطأ في تعريف الأسماء الخمسة
      أَنَا، أَنْتَ، هُوَ، نَحْنُ، هُمْ: خطأ في تعريف الأسماء الخمسة
    indice: خَمْسَةُ أَسْمَاءٍ تُعْرَبُ بِالحُرُوفِ.
    explication: 'الأَسْمَاءُ الخَمْسَةُ: أَبٌ، أَخٌ، حَمٌ، فُو، ذُو.'
  - id: khamsa-a-5
    difficulte: 1
    enonce: مَا عَلَامَةُ رَفْعِ الأَسْمَاءِ الخَمْسَةِ؟ (الضَّمَّةُ / الوَاوُ / الأَلِفُ)
    reponses:
    - الوَاوُ
    erreurs:
      الضَّمَّةُ: خطأ في علامة إعراب الأسماء الخمسة
      الأَلِفُ: خطأ في علامة إعراب الأسماء الخمسة
    indice: 'مِثَالٌ: جَاءَ أَبُوكَ.'
    explication: 'تُرْفَعُ الأَسْمَاءُ الخَمْسَةُ بِالوَاوِ: أَبُوكَ.'
  - id: khamsa-a-6
    difficulte: 1
    enonce: 'اِخْتَرِ الصَّحِيحَ: سَافَرَ ... (أَخُوكَ / أَخَاكَ / أَخِيكَ)'
    reponses:
    - أَخُوكَ
    erreurs:
      أَخَاكَ: خطأ في إعراب الأسماء الخمسة
      أَخِيكَ: خطأ في إعراب الأسماء الخمسة
    indice: «أَخُوكَ» فَاعِلٌ مَرْفُوعٌ.
    explication: 'نَقُولُ: سَافَرَ أَخُوكَ؛ مَرْفُوعٌ بِالوَاوِ.'
  - id: khamsa-a-7
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: زُرْتُ ... (أَبُوكَ / أَبَاكَ / أَبِيكَ)'
    reponses:
    - أَبَاكَ
    erreurs:
      أَبُوكَ: خطأ في إعراب الأسماء الخمسة
      أَبِيكَ: خطأ في إعراب الأسماء الخمسة
    indice: «أَبَاكَ» مَفْعُولٌ بِهِ مَنْصُوبٌ بِالأَلِفِ.
    explication: 'نَقُولُ: زُرْتُ أَبَاكَ.'
  - id: khamsa-a-8
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: سَلَّمْتُ عَلَى ... (أَخِيكَ / أَخَاكَ / أَخُوكَ)'
    reponses:
    - أَخِيكَ
    erreurs:
      أَخَاكَ: خطأ في إعراب الأسماء الخمسة
      أَخُوكَ: خطأ في إعراب الأسماء الخمسة
    indice: بَعْدَ حَرْفِ الجَرِّ تُجَرُّ بِاليَاءِ.
    explication: 'نَقُولُ: سَلَّمْتُ عَلَى أَخِيكَ.'
  - id: khamsa-a-9
    difficulte: 2
    enonce: 'مَا عَلَامَةُ نَصْبِ «ذَا» فِي: أَحْتَرِمُ ذَا الخُلُقِ؟ (الفَتْحَةُ / الأَلِفُ / اليَاءُ)'
    reponses:
    - الأَلِفُ
    erreurs:
      الفَتْحَةُ: خطأ في علامة إعراب الأسماء الخمسة
      اليَاءُ: خطأ في علامة إعراب الأسماء الخمسة
    indice: «ذَا» مَفْعُولٌ بِهِ مِنَ الأَسْمَاءِ الخَمْسَةِ.
    explication: «ذَا» مَنْصُوبٌ وَعَلَامَةُ نَصْبِهِ الأَلِفُ.
  - id: khamsa-a-10
    difficulte: 2
    enonce: مَا شَرْطُ إِعْرَابِ الأَسْمَاءِ الخَمْسَةِ بِالحُرُوفِ؟ (أَنْ تَكُونَ مُضَافَةً إِلَى غَيْرِ يَاءِ المُتَكَلِّمِ / أَنْ تَكُونَ نَكِرَةً / أَنْ تَكُونَ مُثَنَّاةً)
    reponses:
    - أَنْ تَكُونَ مُضَافَةً إِلَى غَيْرِ يَاءِ المُتَكَلِّمِ
    erreurs:
      أَنْ تَكُونَ نَكِرَةً: خطأ في شروط الأسماء الخمسة
      أَنْ تَكُونَ مُثَنَّاةً: خطأ في شروط الأسماء الخمسة
    indice: 'قَارِنْ: جَاءَ أَبُوكَ / جَاءَ أَبٌ / جَاءَ أَبِي.'
    explication: 'تُعْرَبُ بِالحُرُوفِ إِذَا أُضِيفَتْ إِلَى غَيْرِ يَاءِ المُتَكَلِّمِ: أَبُوكَ، أَبُو عَلِيٍّ.'
  - id: khamsa-a-11
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: إِنَّ ... رَجُلٌ كَرِيمٌ. (أَبُوكَ / أَبَاكَ / أَبِيكَ)'
    reponses:
    - أَبَاكَ
    erreurs:
      أَبُوكَ: خطأ في إعراب الأسماء الخمسة
      أَبِيكَ: خطأ في إعراب الأسماء الخمسة
    indice: اسْمُ «إِنَّ» مَنْصُوبٌ.
    explication: 'نَقُولُ: إِنَّ أَبَاكَ رَجُلٌ كَرِيمٌ.'
  - id: khamsa-a-12
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: كَانَ ... مُسَافِرًا. (أَخُوهَا / أَخَاهَا / أَخِيهَا)'
    reponses:
    - أَخُوهَا
    erreurs:
      أَخَاهَا: خطأ في إعراب الأسماء الخمسة
      أَخِيهَا: خطأ في إعراب الأسماء الخمسة
    indice: اسْمُ «كَانَ» مَرْفُوعٌ.
    explication: 'نَقُولُ: كَانَ أَخُوهَا مُسَافِرًا.'
  - id: khamsa-a-13
    difficulte: 3
    enonce: 'مَا إِعْرَابُ «أَبِي» فِي: جَاءَ أَبِي؟ (فَاعِلٌ مَرْفُوعٌ بِالضَّمَّةِ المُقَدَّرَةِ / فَاعِلٌ مَرْفُوعٌ بِالوَاوِ / فَاعِلٌ مَجْرُورٌ بِاليَاءِ)'
    reponses:
    - فَاعِلٌ مَرْفُوعٌ بِالضَّمَّةِ المُقَدَّرَةِ
    erreurs:
      فَاعِلٌ مَرْفُوعٌ بِالوَاوِ: خطأ في شروط الأسماء الخمسة
      فَاعِلٌ مَجْرُورٌ بِاليَاءِ: خطأ في شروط الأسماء الخمسة
    indice: «أَبِي» مُضَافٌ إِلَى يَاءِ المُتَكَلِّمِ.
    explication: «أَبِي» مَرْفُوعٌ بِضَمَّةٍ مُقَدَّرَةٍ، لِأَنَّهُ مُضَافٌ إِلَى يَاءِ المُتَكَلِّمِ.
- notion: إعراب المثنى والجمع السالم
  exercices:
  - id: muthanna-1
    difficulte: 1
    enonce: 'اِخْتَرِ الصَّحِيحَ: نَجَحَ ... (التِّلْمِيذَيْنِ / التِّلْمِيذَانِ)'
    reponses:
    - التِّلْمِيذَانِ
    erreurs:
      التِّلْمِيذَيْنِ: خطأ في رفع المثنى
    indice: الكَلِمَةُ فَاعِلٌ مَرْفُوعٌ، وَالمُثَنَّى يُرْفَعُ بِالأَلِفِ.
    explication: 'نَقُولُ «نَجَحَ التِّلْمِيذَانِ»: فَاعِلٌ مَرْفُوعٌ بِالأَلِفِ لِأَنَّهُ مُثَنًّى.'
  - id: muthanna-2
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: شَكَرْتُ ... (المُعَلِّمُونَ / المُعَلِّمِينَ)'
    reponses:
    - المُعَلِّمِينَ
    erreurs:
