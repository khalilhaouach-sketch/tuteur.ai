      المُهَنْدِسَانِ: خطأ في إعراب الجمع المذكر السالم
    indice: الفَاعِلُ مَرْفُوعٌ، وَجَمْعُ المُذَكَّرِ السَّالِمِ يُرْفَعُ بِالوَاوِ.
    explication: 'نَقُولُ: حَضَرَ المُهَنْدِسُونَ.'
  - id: muthanna-8
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: شَكَرَ المُدِيرُ ... (العَامِلُونَ / العَامِلِينَ / العَامِلَانِ)'
    reponses:
