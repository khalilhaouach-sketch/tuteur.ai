    indice: المَفْعُولُ بِهِ مَنْصُوبٌ، وَالمُثَنَّى يُنْصَبُ بِاليَاءِ.
    explication: 'نَقُولُ: رَأَيْتُ العُصْفُورَيْنِ.'
  - id: muthanna-7
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: حَضَرَ ... (المُهَنْدِسُونَ / المُهَنْدِسِينَ / المُهَنْدِسَانِ)'
