# Banque d'exercices des paliers du primaire (2AP à 6AP) — à relire par le professeur.
# Ajoutée palier par palier, 13 exercices par leçon (les 10 derniers à choix). Même format que exercices_1ac.yaml.

niveau: P2
notions:
- notion: الفاعل
  exercices:
  - id: fail-1
    difficulte: 1
    enonce: 'حَدِّدِ الفَاعِلَ: كَتَبَ التِّلْمِيذُ الدَّرْسَ. (كَتَبَ / التِّلْمِيذُ / الدَّرْسَ)'
    reponses:
    - التِّلْمِيذُ
    erreurs:
      كَتَبَ: خلط بين الفعل والفاعل
      الدَّرْسَ: خلط بين الفاعل والمفعول به
    indice: 'الفَاعِلُ هُوَ مَنْ قَامَ بِالفِعْلِ: مَنِ الَّذِي كَتَبَ؟'
    explication: 'الفَاعِلُ هُوَ «التِّلْمِيذُ»: هُوَ الَّذِي كَتَبَ، وَهُوَ مَرْفُوعٌ بِالضَّمَّةِ.'
  - id: fail-2
    difficulte: 2
    enonce: 'حَدِّدِ الفَاعِلَ: يَزْرَعُ الفَلَّاحُ القَمْحَ فِي الحَقْلِ. (القَمْحَ / الفَلَّاحُ / الحَقْلِ)'
    reponses:
    - الفَلَّاحُ
    erreurs:
      القَمْحَ: خلط بين الفاعل والمفعول به
      الحَقْلِ: خلط بين الفاعل والاسم المجرور
    indice: 'اِسْأَلْ: مَنِ الَّذِي يَزْرَعُ؟'
    explication: 'الفَاعِلُ هُوَ «الفَلَّاحُ»: هُوَ الَّذِي يَزْرَعُ.'
  - id: fail-3
    difficulte: 3
    enonce: 'مَا الفَاعِلُ فِي: لَعِبْنَا فِي السَّاحَةِ؟ (السَّاحَةِ / نَا / لَعِبَ)'
    reponses:
    - نَا
    erreurs:
      السَّاحَةِ: خلط بين الفاعل والاسم المجرور
      لَعِبَ: خلط بين الفعل والفاعل
    indice: الفَاعِلُ هُنَا ضَمِيرٌ مُتَّصِلٌ بِالفِعْلِ.
    explication: 'الفَاعِلُ هُوَ الضَّمِيرُ «نَا»: نَحْنُ الَّذِينَ لَعِبْنَا.'
  - id: fail-4
    difficulte: 1
    enonce: 'حَدِّدِ الفَاعِلَ: شَرِبَ القِطُّ الحَلِيبَ. (شَرِبَ / القِطُّ / الحَلِيبَ)'
    reponses:
    - القِطُّ
    erreurs:
      شَرِبَ: خلط بين الفاعل وغيره
      الحَلِيبَ: خلط بين الفاعل وغيره
    indice: مَنِ الَّذِي شَرِبَ؟
    explication: 'الفَاعِلُ «القِطُّ»: هُوَ الَّذِي شَرِبَ، وَهُوَ مَرْفُوعٌ بِالضَّمَّةِ.'
  - id: fail-5
    difficulte: 1
    enonce: 'حَدِّدِ الفَاعِلَ: نَامَ الطِّفْلُ مُبَكِّرًا. (الطِّفْلُ / نَامَ / مُبَكِّرًا)'
    reponses:
    - الطِّفْلُ
    erreurs:
      نَامَ: خلط بين الفاعل وغيره
      مُبَكِّرًا: خلط بين الفاعل وغيره
    indice: مَنِ الَّذِي نَامَ؟
    explication: 'الفَاعِلُ «الطِّفْلُ»: هُوَ الَّذِي نَامَ.'
  - id: fail-6
    difficulte: 1
    enonce: 'حَدِّدِ الفَاعِلَ: تَطِيرُ العَصَافِيرُ فِي السَّمَاءِ. (السَّمَاءِ / تَطِيرُ / العَصَافِيرُ)'
    reponses:
    - العَصَافِيرُ
    erreurs:
      السَّمَاءِ: خلط بين الفاعل وغيره
      تَطِيرُ: خلط بين الفاعل وغيره
    indice: مَنِ الَّتِي تَطِيرُ؟
    explication: 'الفَاعِلُ «العَصَافِيرُ»: هِيَ الَّتِي تَطِيرُ.'
  - id: fail-7
    difficulte: 2
    enonce: 'حَدِّدِ الفَاعِلَ: فَتَحَتِ الأُمُّ النَّافِذَةَ. (النَّافِذَةَ / الأُمُّ / فَتَحَتِ)'
    reponses:
    - الأُمُّ
    erreurs:
      النَّافِذَةَ: خلط بين الفاعل والمفعول به
      فَتَحَتِ: خلط بين الفاعل والمفعول به
    indice: مَنِ الَّتِي فَتَحَتْ؟
    explication: الفَاعِلُ «الأُمُّ»، أَمَّا «النَّافِذَةَ» فَمَفْعُولٌ بِهِ.
  - id: fail-8
    difficulte: 2
    enonce: 'حَدِّدِ الفَاعِلَ: يَرْسُمُ الفَنَّانُ لَوْحَةً جَمِيلَةً. (لَوْحَةً / جَمِيلَةً / الفَنَّانُ)'
    reponses:
    - الفَنَّانُ
    erreurs:
      لَوْحَةً: خلط بين الفاعل والمفعول به
      جَمِيلَةً: خلط بين الفاعل والمفعول به
    indice: مَنِ الَّذِي يَرْسُمُ؟
    explication: 'الفَاعِلُ «الفَنَّانُ»: هُوَ الَّذِي يَرْسُمُ.'
  - id: fail-9
    difficulte: 2
    enonce: 'مَا عَلَامَةُ رَفْعِ الفَاعِلِ فِي: جَاءَ المُعَلِّمُ؟ (الضَّمَّةُ / الفَتْحَةُ / الكَسْرَةُ)'
    reponses:
    - الضَّمَّةُ
    erreurs:
      الفَتْحَةُ: خطأ في علامة الإعراب
      الكَسْرَةُ: خطأ في علامة الإعراب
    indice: الفَاعِلُ هُوَ مَنْ قَامَ بِالفِعْلِ، وَهُوَ مَرْفُوعٌ.
    explication: «المُعَلِّمُ» فَاعِلٌ مَرْفُوعٌ، وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ.
  - id: fail-10
    difficulte: 2
    enonce: 'اِخْتَرِ الكَلِمَةَ الصَّحِيحَةَ: قَرَأَ ... الكِتَابَ. (التِّلْمِيذَ / التِّلْمِيذُ / التِّلْمِيذِ)'
    reponses:
    - التِّلْمِيذُ
    erreurs:
      التِّلْمِيذَ: خطأ في علامة الإعراب
      التِّلْمِيذِ: خطأ في علامة الإعراب
    indice: الفَاعِلُ هُوَ مَنْ قَامَ بِالفِعْلِ، وَهُوَ مَرْفُوعٌ.
    explication: 'نَقُولُ: قَرَأَ التِّلْمِيذُ الكِتَابَ؛ الفَاعِلُ مَرْفُوعٌ بِالضَّمَّةِ.'
  - id: fail-11
    difficulte: 3
    enonce: 'مَا الفَاعِلُ فِي: كَتَبْتُ رِسَالَةً؟ (رِسَالَةً / التَّاءُ / كَتَبَ)'
    reponses:
    - التَّاءُ
    erreurs:
      رِسَالَةً: خلط بين الفاعل وغيره
      كَتَبَ: خلط بين الفاعل وغيره
    indice: الفَاعِلُ هُنَا ضَمِيرٌ مُتَّصِلٌ بِالفِعْلِ.
    explication: 'الفَاعِلُ هُوَ تَاءُ المُتَكَلِّمِ فِي «كَتَبْتُ»: أَنَا الَّذِي كَتَبْتُ.'
  - id: fail-12
    difficulte: 3
    enonce: 'مَا الفَاعِلُ فِي: الأَطْفَالُ لَعِبُوا؟ (الأَطْفَالُ / الوَاوُ / لَعِبَ)'
    reponses:
    - الوَاوُ
    erreurs:
      الأَطْفَالُ: خلط بين الفاعل والمبتدأ
      لَعِبَ: خلط بين الفاعل والمبتدأ
    indice: فِي «لَعِبُوا» ضَمِيرٌ مُتَّصِلٌ يَدُلُّ عَلَى الجَمَاعَةِ.
    explication: الفَاعِلُ وَاوُ الجَمَاعَةِ فِي «لَعِبُوا»، أَمَّا «الأَطْفَالُ» فَمُبْتَدَأٌ.
  - id: fail-13
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: ... البِنْتُ القِصَّةَ. (قَرَأَتِ / قَرَأَ / قَرَأُوا)'
    reponses:
    - قَرَأَتِ
    erreurs:
      قَرَأَ: خطأ في مطابقة الفعل والفاعل
      قَرَأُوا: خطأ في مطابقة الفعل والفاعل
    indice: 'الفَاعِلُ مُؤَنَّثٌ: نُضِيفُ إِلَى الفِعْلِ تَاءَ التَّأْنِيثِ.'
    explication: 'نَقُولُ: قَرَأَتِ البِنْتُ القِصَّةَ، لِأَنَّ الفَاعِلَ مُؤَنَّثٌ.'
- notion: المفعول به
  exercices:
  - id: mafoul-1
    difficulte: 1
    enonce: 'حَدِّدِ المَفْعُولَ بِهِ: قَرَأَ أَحْمَدُ القِصَّةَ. (أَحْمَدُ / القِصَّةَ / قَرَأَ)'
    reponses:
    - القِصَّةَ
    erreurs:
      أَحْمَدُ: خلط بين المفعول به والفاعل
      قَرَأَ: خلط بين الفعل والمفعول به
    indice: 'المَفْعُولُ بِهِ هُوَ مَا وَقَعَ عَلَيْهِ الفِعْلُ: مَاذَا قَرَأَ أَحْمَدُ؟'
    explication: المَفْعُولُ بِهِ هُوَ «القِصَّةَ»، وَهُوَ مَنْصُوبٌ بِالفَتْحَةِ.
  - id: mafoul-2
    difficulte: 2
    enonce: 'حَدِّدِ المَفْعُولَ بِهِ: شَرِبَ الطِّفْلُ الحَلِيبَ صَبَاحًا. (الحَلِيبَ / الطِّفْلُ / صَبَاحًا)'
    reponses:
    - الحَلِيبَ
    erreurs:
      الطِّفْلُ: خلط بين المفعول به والفاعل
      صَبَاحًا: خلط بين المفعول به والظرف
    indice: 'اِسْأَلْ: مَاذَا شَرِبَ الطِّفْلُ؟'
    explication: المَفْعُولُ بِهِ هُوَ «الحَلِيبَ». أَمَّا «صَبَاحًا» فَيَدُلُّ عَلَى الزَّمَانِ.
  - id: mafoul-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'اِخْتَرِ الكَلِمَةَ الصَّحِيحَةَ: رَسَمَتْ مَرْيَمُ ... (وَرْدَةٌ / وَرْدَةً / وَرْدَةٍ)'
    reponses:
    - وَرْدَةً
    erreurs:
      وَرْدَةٌ: نسيان نصب المفعول به
      وَرْدَةٍ: نسيان نصب المفعول به
    indice: الكَلِمَةُ النَّاقِصَةُ مَفْعُولٌ بِهِ، وَالمَفْعُولُ بِهِ مَنْصُوبٌ.
    explication: 'نَقُولُ «رَسَمَتْ مَرْيَمُ وَرْدَةً»: المَفْعُولُ بِهِ مَنْصُوبٌ بِالفَتْحَةِ.'
  - id: mafoul-4
    difficulte: 1
    enonce: 'حَدِّدِ المَفْعُولَ بِهِ: أَكَلَ الوَلَدُ التُّفَّاحَةَ. (الوَلَدُ / التُّفَّاحَةَ / أَكَلَ)'
    reponses:
    - التُّفَّاحَةَ
    erreurs:
      الوَلَدُ: خلط بين المفعول به وغيره
      أَكَلَ: خلط بين المفعول به وغيره
    indice: مَاذَا أَكَلَ الوَلَدُ؟
    explication: المَفْعُولُ بِهِ «التُّفَّاحَةَ»، وَهُوَ مَنْصُوبٌ بِالفَتْحَةِ.
  - id: mafoul-5
    difficulte: 1
    enonce: 'حَدِّدِ المَفْعُولَ بِهِ: كَتَبَتْ سَلْمَى الرِّسَالَةَ. (سَلْمَى / كَتَبَتْ / الرِّسَالَةَ)'
    reponses:
    - الرِّسَالَةَ
    erreurs:
      سَلْمَى: خلط بين المفعول به وغيره
      كَتَبَتْ: خلط بين المفعول به وغيره
    indice: مَاذَا كَتَبَتْ سَلْمَى؟
    explication: المَفْعُولُ بِهِ «الرِّسَالَةَ».
  - id: mafoul-6
    difficulte: 1
    enonce: 'حَدِّدِ المَفْعُولَ بِهِ: يَسْقِي الفَلَّاحُ الأَشْجَارَ. (الأَشْجَارَ / الفَلَّاحُ / يَسْقِي)'
    reponses:
    - الأَشْجَارَ
    erreurs:
      الفَلَّاحُ: خلط بين المفعول به وغيره
      يَسْقِي: خلط بين المفعول به وغيره
    indice: مَاذَا يَسْقِي الفَلَّاحُ؟
    explication: المَفْعُولُ بِهِ «الأَشْجَارَ».
  - id: mafoul-7
    difficulte: 2
    enonce: 'حَدِّدِ المَفْعُولَ بِهِ: رَكِبَ أَبِي الحَافِلَةَ صَبَاحًا. (صَبَاحًا / الحَافِلَةَ / أَبِي)'
    reponses:
    - الحَافِلَةَ
    erreurs:
      صَبَاحًا: خلط بين المفعول به والظرف
      أَبِي: خلط بين المفعول به والظرف
    indice: مَاذَا رَكِبَ أَبِي؟
    explication: المَفْعُولُ بِهِ «الحَافِلَةَ»؛ أَمَّا «صَبَاحًا» فَتَدُلُّ عَلَى الزَّمَانِ.
  - id: mafoul-8
    difficulte: 2
    enonce: 'حَدِّدِ المَفْعُولَ بِهِ: يُحِبُّ الطِّفْلُ أُمَّهُ. (الطِّفْلُ / يُحِبُّ / أُمَّهُ)'
    reponses:
    - أُمَّهُ
    erreurs:
      الطِّفْلُ: خلط بين المفعول به والفاعل
      يُحِبُّ: خلط بين المفعول به والفاعل
    indice: مَنِ الَّتِي يُحِبُّهَا الطِّفْلُ؟
    explication: المَفْعُولُ بِهِ «أُمَّ» فِي «أُمَّهُ»، وَهُوَ مَنْصُوبٌ بِالفَتْحَةِ.
  - id: mafoul-9
    difficulte: 2
    enonce: 'مَا عَلَامَةُ نَصْبِ المَفْعُولِ بِهِ فِي: زَرَعَ الفَلَّاحُ القَمْحَ؟ (الضَّمَّةُ / الكَسْرَةُ / الفَتْحَةُ)'
    reponses:
    - الفَتْحَةُ
    erreurs:
      الضَّمَّةُ: خطأ في علامة الإعراب
      الكَسْرَةُ: خطأ في علامة الإعراب
    indice: المَفْعُولُ بِهِ هُوَ مَا وَقَعَ عَلَيْهِ الفِعْلُ، وَهُوَ مَنْصُوبٌ.
    explication: «القَمْحَ» مَفْعُولٌ بِهِ مَنْصُوبٌ، وَعَلَامَةُ نَصْبِهِ الفَتْحَةُ.
  - id: mafoul-10
    difficulte: 2
    enonce: 'اِخْتَرِ الكَلِمَةَ الصَّحِيحَةَ: نَظَّفَ العَامِلُ ... (الشَّارِعُ / الشَّارِعَ / الشَّارِعِ)'
    reponses:
    - الشَّارِعَ
    erreurs:
      الشَّارِعُ: خطأ في علامة الإعراب
      الشَّارِعِ: خطأ في علامة الإعراب
    indice: المَفْعُولُ بِهِ هُوَ مَا وَقَعَ عَلَيْهِ الفِعْلُ، وَهُوَ مَنْصُوبٌ.
    explication: 'نَقُولُ: نَظَّفَ العَامِلُ الشَّارِعَ؛ المَفْعُولُ بِهِ مَنْصُوبٌ بِالفَتْحَةِ.'
  - id: mafoul-11
    difficulte: 3
    enonce: 'مَا المَفْعُولُ بِهِ فِي: سَاعَدَنِي صَدِيقِي؟ (صَدِيقِي / اليَاءُ / سَاعَدَ)'
    reponses:
    - اليَاءُ
    erreurs:
      صَدِيقِي: خلط بين المفعول به والفاعل
      سَاعَدَ: خلط بين المفعول به والفاعل
    indice: مَنِ الَّذِي وَقَعَتْ عَلَيْهِ المُسَاعَدَةُ؟
    explication: المَفْعُولُ بِهِ يَاءُ المُتَكَلِّمِ فِي «سَاعَدَنِي»، وَالفَاعِلُ «صَدِيقِي».
  - id: mafoul-12
    difficulte: 3
    enonce: 'مَا المَفْعُولُ بِهِ فِي: الدَّرْسَ فَهِمَهُ التِّلْمِيذُ؟ (التِّلْمِيذُ / الهَاءُ / فَهِمَ)'
    reponses:
    - الهَاءُ
    erreurs:
      التِّلْمِيذُ: خلط بين المفعول به والفاعل
      فَهِمَ: خلط بين المفعول به والفاعل
    indice: فِي «فَهِمَهُ» ضَمِيرٌ يَعُودُ عَلَى الدَّرْسِ.
    explication: المَفْعُولُ بِهِ هَاءُ الغَائِبِ فِي «فَهِمَهُ».
  - id: mafoul-13
