    indice: بِأَيِّ أَدَاةٍ نَكْنُسُ؟
    explication: اِسْمُ الآلَةِ مِنْ «كَنَسَ» هُوَ «مِكْنَسَةٌ» عَلَى وَزْنِ «مِفْعَلَةٍ».
  - id: ala-3
