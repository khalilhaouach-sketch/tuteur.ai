# Banque d'exercices des paliers du primaire (2AP à 6AP) — à relire par le professeur.
# Ajoutée palier par palier. Même format que exercices_1ac.yaml.

niveau: P2
notions:
- notion: الفاعل
  exercices:
  - id: fail-1
    difficulte: 1
    enonce: 'حَدِّدِ الفَاعِلَ: كَتَبَ التِّلْمِيذُ الدَّرْسَ. (كَتَبَ / التِّلْمِيذُ / الدَّرْسَ)'
    reponses:
    - التِّلْمِيذُ
    erreurs:
      كَتَبَ: خلط بين الفعل والفاعل
      الدَّرْسَ: خلط بين الفاعل والمفعول به
    indice: 'الفَاعِلُ هُوَ مَنْ قَامَ بِالفِعْلِ: مَنِ الَّذِي كَتَبَ؟'
    explication: 'الفَاعِلُ هُوَ «التِّلْمِيذُ»: هُوَ الَّذِي كَتَبَ، وَهُوَ مَرْفُوعٌ بِالضَّمَّةِ.'
  - id: fail-2
    difficulte: 2
    enonce: 'حَدِّدِ الفَاعِلَ: يَزْرَعُ الفَلَّاحُ القَمْحَ فِي الحَقْلِ. (القَمْحَ / الفَلَّاحُ / الحَقْلِ)'
    reponses:
    - الفَلَّاحُ
    erreurs:
      القَمْحَ: خلط بين الفاعل والمفعول به
      الحَقْلِ: خلط بين الفاعل والاسم المجرور
    indice: 'اِسْأَلْ: مَنِ الَّذِي يَزْرَعُ؟'
    explication: 'الفَاعِلُ هُوَ «الفَلَّاحُ»: هُوَ الَّذِي يَزْرَعُ.'
  - id: fail-3
    difficulte: 3
    enonce: 'مَا الفَاعِلُ فِي: لَعِبْنَا فِي السَّاحَةِ؟ (السَّاحَةِ / نَا / لَعِبَ)'
    reponses:
    - نَا
    erreurs:
      السَّاحَةِ: خلط بين الفاعل والاسم المجرور
      لَعِبَ: خلط بين الفعل والفاعل
    indice: الفَاعِلُ هُنَا ضَمِيرٌ مُتَّصِلٌ بِالفِعْلِ.
    explication: 'الفَاعِلُ هُوَ الضَّمِيرُ «نَا»: نَحْنُ الَّذِينَ لَعِبْنَا.'
- notion: المفعول به
  exercices:
  - id: mafoul-1
    difficulte: 1
    enonce: 'حَدِّدِ المَفْعُولَ بِهِ: قَرَأَ أَحْمَدُ القِصَّةَ. (أَحْمَدُ / القِصَّةَ / قَرَأَ)'
    reponses:
    - القِصَّةَ
    erreurs:
      أَحْمَدُ: خلط بين المفعول به والفاعل
      قَرَأَ: خلط بين الفعل والمفعول به
    indice: 'المَفْعُولُ بِهِ هُوَ مَا وَقَعَ عَلَيْهِ الفِعْلُ: مَاذَا قَرَأَ أَحْمَدُ؟'
    explication: المَفْعُولُ بِهِ هُوَ «القِصَّةَ»، وَهُوَ مَنْصُوبٌ بِالفَتْحَةِ.
  - id: mafoul-2
    difficulte: 2
    enonce: 'حَدِّدِ المَفْعُولَ بِهِ: شَرِبَ الطِّفْلُ الحَلِيبَ صَبَاحًا. (الحَلِيبَ / الطِّفْلُ / صَبَاحًا)'
    reponses:
    - الحَلِيبَ
    erreurs:
      الطِّفْلُ: خلط بين المفعول به والفاعل
      صَبَاحًا: خلط بين المفعول به والظرف
    indice: 'اِسْأَلْ: مَاذَا شَرِبَ الطِّفْلُ؟'
    explication: المَفْعُولُ بِهِ هُوَ «الحَلِيبَ». أَمَّا «صَبَاحًا» فَيَدُلُّ عَلَى الزَّمَانِ.
  - id: mafoul-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'اِخْتَرِ الكَلِمَةَ الصَّحِيحَةَ: رَسَمَتْ مَرْيَمُ ... (وَرْدَةٌ / وَرْدَةً / وَرْدَةٍ)'
    reponses:
    - وَرْدَةً
    erreurs:
      وَرْدَةٌ: نسيان نصب المفعول به
      وَرْدَةٍ: نسيان نصب المفعول به
    indice: الكَلِمَةُ النَّاقِصَةُ مَفْعُولٌ بِهِ، وَالمَفْعُولُ بِهِ مَنْصُوبٌ.
    explication: 'نَقُولُ «رَسَمَتْ مَرْيَمُ وَرْدَةً»: المَفْعُولُ بِهِ مَنْصُوبٌ بِالفَتْحَةِ.'
- notion: المبتدأ والخبر
  exercices:
  - id: mubtada-1
    difficulte: 1
    enonce: 'مَا المُبْتَدَأُ فِي: الجَوُّ جَمِيلٌ؟ (جَمِيلٌ / الجَوُّ)'
    reponses:
    - الجَوُّ
    erreurs:
      جَمِيلٌ: خلط بين المبتدأ والخبر
    indice: المُبْتَدَأُ اسْمٌ نَبْدَأُ بِهِ الجُمْلَةَ الاِسْمِيَّةَ.
    explication: المُبْتَدَأُ هُوَ «الجَوُّ»، وَالخَبَرُ «جَمِيلٌ».
  - id: mubtada-2
    difficulte: 2
    enonce: 'مَا الخَبَرُ فِي: الحَدِيقَةُ وَاسِعَةٌ؟ (الحَدِيقَةُ / وَاسِعَةٌ)'
    reponses:
    - وَاسِعَةٌ
    erreurs:
      الحَدِيقَةُ: خلط بين المبتدأ والخبر
    indice: 'الخَبَرُ يُتَمِّمُ مَعْنَى الجُمْلَةِ: مَاذَا نَقُولُ عَنِ الحَدِيقَةِ؟'
    explication: 'الخَبَرُ هُوَ «وَاسِعَةٌ»: يُخْبِرُنَا عَنِ الحَدِيقَةِ.'
  - id: mubtada-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'أَكْمِلْ بِخَبَرٍ مُنَاسِبٍ: الشَّمْسُ ... (سَاطِعٌ / سَاطِعَةٌ / سَاطِعَةً)'
    reponses:
    - سَاطِعَةٌ
    erreurs:
      سَاطِعٌ: عدم المطابقة في التأنيث
      سَاطِعَةً: عدم رفع الخبر
    indice: «الشَّمْسُ» مُؤَنَّثٌ، وَالخَبَرُ مَرْفُوعٌ.
    explication: 'نَقُولُ «الشَّمْسُ سَاطِعَةٌ»: الخَبَرُ مُؤَنَّثٌ مِثْلَ المُبْتَدَإِ، وَمَرْفُوعٌ بِالضَّمَّةِ.'
- notion: حروف الجر والاسم المجرور
  exercices:
  - id: jarr-1
    difficulte: 1
    enonce: 'مَا حَرْفُ الجَرِّ فِي: ذَهَبْتُ إِلَى المَدْرَسَةِ؟ (ذَهَبْتُ / إِلَى / المَدْرَسَةِ)'
    reponses:
    - إِلَى
    erreurs:
      ذَهَبْتُ: خلط بين الفعل وحرف الجر
      المَدْرَسَةِ: خلط بين حرف الجر والاسم المجرور
    indice: 'حُرُوفُ الجَرِّ: مِنْ، إِلَى، عَنْ، عَلَى، فِي...'
    explication: حَرْفُ الجَرِّ هُوَ «إِلَى»، وَ«المَدْرَسَةِ» اسْمٌ مَجْرُورٌ.
  - id: jarr-2
    difficulte: 2
    enonce: 'مَا الاِسْمُ المَجْرُورُ فِي: الكِتَابُ عَلَى المَكْتَبِ؟ (الكِتَابُ / عَلَى / المَكْتَبِ)'
    reponses:
    - المَكْتَبِ
    erreurs:
      الكِتَابُ: خلط بين المبتدأ والاسم المجرور
      عَلَى: خلط بين حرف الجر والاسم المجرور
    indice: الاِسْمُ المَجْرُورُ يَأْتِي بَعْدَ حَرْفِ الجَرِّ.
    explication: الاِسْمُ المَجْرُورُ هُوَ «المَكْتَبِ»، جَاءَ بَعْدَ «عَلَى» وَعَلَامَةُ جَرِّهِ الكَسْرَةُ.
  - id: jarr-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'اِخْتَرِ الكَلِمَةَ الصَّحِيحَةَ: سَافَرْتُ بِـ... (القِطَارُ / القِطَارِ / القِطَارَ)'
    reponses:
    - القِطَارِ
    erreurs:
      القِطَارُ: عدم جر الاسم بعد حرف الجر
      القِطَارَ: عدم جر الاسم بعد حرف الجر
    indice: بَعْدَ حَرْفِ الجَرِّ يَكُونُ الاِسْمُ مَجْرُورًا.
    explication: 'نَقُولُ «سَافَرْتُ بِالقِطَارِ»: الاِسْمُ بَعْدَ البَاءِ مَجْرُورٌ بِالكَسْرَةِ.'
- notion: تصريف المضارع مع الضمائر
  exercices:
  - id: tasrif-1
    difficulte: 1
    enonce: 'أَكْمِلْ: نَحْنُ ... الدَّرْسَ. (أَكْتُبُ / نَكْتُبُ / يَكْتُبُ)'
    reponses:
    - نَكْتُبُ
    erreurs:
      أَكْتُبُ: عدم مطابقة الفعل للضمير
      يَكْتُبُ: عدم مطابقة الفعل للضمير
    indice: مَعَ «نَحْنُ» يَبْدَأُ المُضَارِعُ بِالنُّونِ.
    explication: نَقُولُ «نَحْنُ نَكْتُبُ الدَّرْسَ».
  - id: tasrif-2
    difficulte: 2
    enonce: 'أَكْمِلْ: أَنْتِ ... الدَّرْسَ. (تَكْتُبُ / تَكْتُبِينَ / يَكْتُبُونَ)'
    reponses:
    - تَكْتُبِينَ
    erreurs:
      تَكْتُبُ: عدم مطابقة الفعل للضمير
      يَكْتُبُونَ: عدم مطابقة الفعل للضمير
    indice: '«أَنْتِ» لِلْمُخَاطَبَةِ: نُضِيفُ يَاءً وَنُونًا فِي آخِرِ الفِعْلِ.'
    explication: نَقُولُ «أَنْتِ تَكْتُبِينَ الدَّرْسَ».
  - id: tasrif-3
    difficulte: 3
    enonce: 'أَكْمِلْ: التِّلْمِيذَانِ ... الدَّرْسَ. (يَكْتُبُونَ / يَكْتُبُ / يَكْتُبَانِ)'
    reponses:
    - يَكْتُبَانِ
    erreurs:
      يَكْتُبُونَ: عدم مطابقة الفعل للمثنى
      يَكْتُبُ: عدم مطابقة الفعل للمثنى
    indice: '«التِّلْمِيذَانِ» مُثَنًّى: نُضِيفُ أَلِفًا وَنُونًا فِي آخِرِ الفِعْلِ.'
    explication: نَقُولُ «التِّلْمِيذَانِ يَكْتُبَانِ الدَّرْسَ».
- notion: كان وأخواتها
  exercices:
  - id: kana-1
    difficulte: 1
    enonce: 'مَا اسْمُ «كَانَ» فِي: كَانَ الجَوُّ جَمِيلًا؟ (جَمِيلًا / الجَوُّ / كَانَ)'
    reponses:
    - الجَوُّ
    erreurs:
      جَمِيلًا: خلط بين اسم كان وخبرها
      كَانَ: خلط بين كان واسمها
    indice: اِسْمُ «كَانَ» هُوَ المُبْتَدَأُ قَبْلَ دُخُولِهَا، وَيَبْقَى مَرْفُوعًا.
    explication: اِسْمُ «كَانَ» هُوَ «الجَوُّ» (مَرْفُوعٌ)، وَخَبَرُهَا «جَمِيلًا» (مَنْصُوبٌ).
  - id: kana-2
    difficulte: 2
    enonce: 'مَا خَبَرُ «أَصْبَحَ» فِي: أَصْبَحَ الطَّقْسُ بَارِدًا؟ (الطَّقْسُ / بَارِدًا / أَصْبَحَ)'
    reponses:
    - بَارِدًا
    erreurs:
      الطَّقْسُ: خلط بين اسم كان وخبرها
      أَصْبَحَ: خلط بين الناسخ وخبره
    indice: 'خَبَرُ «أَصْبَحَ» يَكُونُ مَنْصُوبًا: أَيُّ كَلِمَةٍ مَنْصُوبَةٌ؟'
    explication: خَبَرُ «أَصْبَحَ» هُوَ «بَارِدًا»، مَنْصُوبٌ بِالفَتْحَةِ.
  - id: kana-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'أَدْخِلْ «كَانَ» عَلَى الجُمْلَةِ: الطَّالِبُ مُجْتَهِدٌ. (كَانَ الطَّالِبُ مُجْتَهِدٌ / كَانَ الطَّالِبَ مُجْتَهِدًا / كَانَ الطَّالِبُ مُجْتَهِدًا)'
    reponses:
    - كَانَ الطَّالِبُ مُجْتَهِدًا
    erreurs:
      كَانَ الطَّالِبُ مُجْتَهِدٌ: نسيان نصب خبر كان
      كَانَ الطَّالِبَ مُجْتَهِدًا: نصب اسم كان
    indice: «كَانَ» تَرْفَعُ الاِسْمَ وَتَنْصِبُ الخَبَرَ.
    explication: 'نَقُولُ «كَانَ الطَّالِبُ مُجْتَهِدًا»: «الطَّالِبُ» اسْمُهَا مَرْفُوعٌ، وَ«مُجْتَهِدًا» خَبَرُهَا مَنْصُوبٌ.'
- notion: إن وأخواتها
  exercices:
  - id: inna-1
    difficulte: 1
    enonce: 'مَا اسْمُ «إِنَّ» فِي: إِنَّ العِلْمَ نَافِعٌ؟ (نَافِعٌ / إِنَّ / العِلْمَ)'
    reponses:
    - العِلْمَ
    erreurs:
      نَافِعٌ: خلط بين اسم إن وخبرها
      إِنَّ: خلط بين إن واسمها
    indice: اِسْمُ «إِنَّ» يَأْتِي بَعْدَهَا مُبَاشَرَةً، وَيَكُونُ مَنْصُوبًا.
    explication: اِسْمُ «إِنَّ» هُوَ «العِلْمَ» (مَنْصُوبٌ)، وَخَبَرُهَا «نَافِعٌ» (مَرْفُوعٌ).
  - id: inna-2
    difficulte: 2
    enonce: 'مَا خَبَرُ «لَعَلَّ» فِي: لَعَلَّ المَطَرَ قَرِيبٌ؟ (المَطَرَ / قَرِيبٌ)'
    reponses:
    - قَرِيبٌ
    erreurs:
      المَطَرَ: خلط بين اسم إن وخبرها
    indice: خَبَرُ «لَعَلَّ» يَكُونُ مَرْفُوعًا.
    explication: خَبَرُ «لَعَلَّ» هُوَ «قَرِيبٌ»، مَرْفُوعٌ بِالضَّمَّةِ.
  - id: inna-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'أَدْخِلْ «إِنَّ» عَلَى الجُمْلَةِ: الصِّدْقُ جَمِيلٌ. (إِنَّ الصِّدْقُ جَمِيلٌ / إِنَّ الصِّدْقَ جَمِيلٌ / إِنَّ الصِّدْقَ جَمِيلًا)'
    reponses:
    - إِنَّ الصِّدْقَ جَمِيلٌ
    erreurs:
      إِنَّ الصِّدْقُ جَمِيلٌ: نسيان نصب اسم إن
      إِنَّ الصِّدْقَ جَمِيلًا: نصب خبر إن
    indice: «إِنَّ» تَنْصِبُ الاِسْمَ وَتَرْفَعُ الخَبَرَ، عَكْسَ «كَانَ».
    explication: 'نَقُولُ «إِنَّ الصِّدْقَ جَمِيلٌ»: «الصِّدْقَ» اسْمُهَا مَنْصُوبٌ، وَ«جَمِيلٌ» خَبَرُهَا مَرْفُوعٌ.'
- notion: النعت
  exercices:
  - id: naat-1
    difficulte: 1
    enonce: 'مَا النَّعْتُ فِي: قَرَأْتُ قِصَّةً جَمِيلَةً؟ (قِصَّةً / جَمِيلَةً / قَرَأْتُ)'
    reponses:
    - جَمِيلَةً
    erreurs:
      قِصَّةً: خلط بين النعت والمنعوت
      قَرَأْتُ: خلط بين الفعل والنعت
    indice: 'النَّعْتُ يَصِفُ الاِسْمَ الَّذِي قَبْلَهُ: كَيْفَ هِيَ القِصَّةُ؟'
    explication: 'النَّعْتُ هُوَ «جَمِيلَةً»: يَصِفُ «قِصَّةً» وَيَتْبَعُهَا فِي النَّصْبِ.'
  - id: naat-2
    difficulte: 2
    enonce: 'مَا المَنْعُوتُ فِي: رَأَيْتُ طَائِرًا صَغِيرًا؟ (صَغِيرًا / طَائِرًا)'
    reponses:
    - طَائِرًا
    erreurs:
      صَغِيرًا: خلط بين النعت والمنعوت
    indice: المَنْعُوتُ هُوَ الاِسْمُ المَوْصُوفُ، وَيَأْتِي قَبْلَ النَّعْتِ.
    explication: المَنْعُوتُ هُوَ «طَائِرًا»، وَالنَّعْتُ «صَغِيرًا».
  - id: naat-3
    difficulte: 3
    enonce: 'اِخْتَرِ النَّعْتَ المُنَاسِبَ: زُرْتُ المَدِينَةَ ... (قَدِيمَةً / القَدِيمَ / القَدِيمَةَ)'
    reponses:
    - القَدِيمَةَ
    erreurs:
      قَدِيمَةً: عدم المطابقة في التعريف
      القَدِيمَ: عدم المطابقة في التأنيث
    indice: 'النَّعْتُ يَتْبَعُ المَنْعُوتَ: «المَدِينَةَ» مَعْرِفَةٌ وَمُؤَنَّثٌ وَمَنْصُوبٌ.'
    explication: 'نَقُولُ «زُرْتُ المَدِينَةَ القَدِيمَةَ»: النَّعْتُ مَعْرِفَةٌ مُؤَنَّثٌ مَنْصُوبٌ مِثْلَ المَنْعُوتِ.'
- notion: الحال
  exercices:
  - id: hal-1
    difficulte: 1
    enonce: 'مَا الحَالُ فِي: جَاءَ التِّلْمِيذُ مُبْتَسِمًا؟ (التِّلْمِيذُ / جَاءَ / مُبْتَسِمًا)'
    reponses:
    - مُبْتَسِمًا
    erreurs:
      التِّلْمِيذُ: خلط بين الحال وصاحبه
      جَاءَ: خلط بين الفعل والحال
    indice: 'الحَالُ يُبَيِّنُ الهَيْئَةَ: كَيْفَ جَاءَ التِّلْمِيذُ؟'
    explication: 'الحَالُ هُوَ «مُبْتَسِمًا»: يُبَيِّنُ هَيْئَةَ التِّلْمِيذِ، وَهُوَ مَنْصُوبٌ.'
  - id: hal-2
    difficulte: 2
    enonce: بِأَيِّ سُؤَالٍ نَجِدُ الحَالَ؟ (مَتَى؟ / كَيْفَ؟ / أَيْنَ؟)
    reponses:
    - كَيْفَ؟
    erreurs:
      مَتَى؟: خلط بين الحال والظرف
      أَيْنَ؟: خلط بين الحال والظرف
    indice: الحَالُ يَصِفُ هَيْئَةَ صَاحِبِهِ.
    explication: 'نَجِدُ الحَالَ بِالسُّؤَالِ «كَيْفَ؟»: جَاءَ التِّلْمِيذُ مُبْتَسِمًا ← كَيْفَ جَاءَ؟ مُبْتَسِمًا.'
  - id: hal-3
    difficulte: 3
    enonce: 'اِخْتَرِ الحَالَ المُنَاسِبَ: رَجَعَ الجُنُودُ ... (مُنْتَصِرُونَ / المُنْتَصِرُونَ / مُنْتَصِرِينَ)'
    reponses:
    - مُنْتَصِرِينَ
    erreurs:
      مُنْتَصِرُونَ: نسيان نصب الحال
      المُنْتَصِرُونَ: الحال لا يكون معرفة
    indice: الحَالُ نَكِرَةٌ مَنْصُوبَةٌ، وَجَمْعُ المُذَكَّرِ السَّالِمُ يُنْصَبُ بِاليَاءِ.
    explication: 'نَقُولُ «رَجَعَ الجُنُودُ مُنْتَصِرِينَ»: حَالٌ مَنْصُوبٌ بِاليَاءِ لِأَنَّهُ جَمْعُ مُذَكَّرٍ سَالِمٌ.'
- notion: الفعل اللازم والفعل المتعدي
  exercices:
  - id: lazim-1
    difficulte: 1
    enonce: هَلِ الفِعْلُ فِي «نَامَ الطِّفْلُ» لَازِمٌ أَمْ مُتَعَدٍّ؟ (لَازِمٌ / مُتَعَدٍّ)
    reponses:
    - لَازِمٌ
    erreurs:
      مُتَعَدٍّ: خلط بين اللازم والمتعدي
    indice: هَلْ يَحْتَاجُ الفِعْلُ «نَامَ» إِلَى مَفْعُولٍ بِهِ؟
    explication: '«نَامَ» فِعْلٌ لَازِمٌ: يَكْتَفِي بِفَاعِلِهِ وَلَا يَحْتَاجُ إِلَى مَفْعُولٍ بِهِ.'
  - id: lazim-2
    difficulte: 2
    enonce: هَلِ الفِعْلُ فِي «فَتَحَ أَحْمَدُ النَّافِذَةَ» لَازِمٌ أَمْ مُتَعَدٍّ؟ (لَازِمٌ / مُتَعَدٍّ)
    reponses:
    - مُتَعَدٍّ
    erreurs:
      لَازِمٌ: خلط بين اللازم والمتعدي
    indice: هَلْ فِي الجُمْلَةِ مَفْعُولٌ بِهِ؟
    explication: '«فَتَحَ» فِعْلٌ مُتَعَدٍّ: نَصَبَ مَفْعُولًا بِهِ هُوَ «النَّافِذَةَ».'
  - id: lazim-3
    difficulte: 3
    enonce: 'اِخْتَرِ الفِعْلَ اللَّازِمَ: (أَكَلَ / جَلَسَ / شَرِبَ)'
    reponses:
    - جَلَسَ
    erreurs:
      أَكَلَ: خلط بين اللازم والمتعدي
      شَرِبَ: خلط بين اللازم والمتعدي
    indice: 'نَقُولُ «أَكَلَ الخُبْزَ» وَ«شَرِبَ المَاءَ»: وَأَيُّ فِعْلٍ لَا يَحْتَاجُ إِلَى مَفْعُولٍ بِهِ؟'
    explication: '«جَلَسَ» فِعْلٌ لَازِمٌ: نَقُولُ «جَلَسَ الوَلَدُ» دُونَ مَفْعُولٍ بِهِ.'
- notion: نائب الفاعل
  exercices:
  - id: naib-1
    difficulte: 1
    enonce: 'مَا نَائِبُ الفَاعِلِ فِي: كُسِرَ الزُّجَاجُ؟ (كُسِرَ / الزُّجَاجُ)'
    reponses:
    - الزُّجَاجُ
    erreurs:
      كُسِرَ: خلط بين الفعل ونائب الفاعل
    indice: نَائِبُ الفَاعِلِ اسْمٌ مَرْفُوعٌ يَأْتِي بَعْدَ الفِعْلِ المَبْنِيِّ لِلْمَجْهُولِ.
    explication: نَائِبُ الفَاعِلِ هُوَ «الزُّجَاجُ»، مَرْفُوعٌ بِالضَّمَّةِ.
  - id: naib-2
    difficulte: 2
    enonce: 'مَا نَائِبُ الفَاعِلِ فِي: كُتِبَ الدَّرْسُ عَلَى السَّبُّورَةِ؟ (السَّبُّورَةِ / كُتِبَ / الدَّرْسُ)'
    reponses:
    - الدَّرْسُ
    erreurs:
      السَّبُّورَةِ: خلط بين نائب الفاعل والاسم المجرور
      كُتِبَ: خلط بين الفعل ونائب الفاعل
    indice: مَا الَّذِي كُتِبَ؟
    explication: نَائِبُ الفَاعِلِ هُوَ «الدَّرْسُ». أَمَّا «السَّبُّورَةِ» فَاسْمٌ مَجْرُورٌ بِـ«عَلَى».
  - id: naib-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'حَوِّلْ إِلَى المَبْنِيِّ لِلْمَجْهُولِ: فَتَحَ الحَارِسُ البَابَ. (فُتِحَ البَابَ / فَتَحَ البَابُ / فُتِحَ البَابُ)'
    reponses:
    - فُتِحَ البَابُ
    erreurs:
      فُتِحَ البَابَ: نسيان رفع نائب الفاعل
      فَتَحَ البَابُ: عدم بناء الفعل للمجهول
    indice: نَضُمُّ أَوَّلَ الفِعْلِ وَنَكْسِرُ مَا قَبْلَ آخِرِهِ، وَيُرْفَعُ المَفْعُولُ بِهِ.
    explication: 'نَقُولُ «فُتِحَ البَابُ»: الفِعْلُ مَبْنِيٌّ لِلْمَجْهُولِ، وَ«البَابُ» نَائِبُ فَاعِلٍ مَرْفُوعٌ.'
- notion: المفعول المطلق
  exercices:
  - id: mutlaq-1
    difficulte: 1
    enonce: 'مَا المَفْعُولُ المُطْلَقُ فِي: فَرِحَ الطِّفْلُ فَرَحًا كَبِيرًا؟ (الطِّفْلُ / فَرَحًا / كَبِيرًا)'
    reponses:
    - فَرَحًا
    erreurs:
      الطِّفْلُ: خلط بين الفاعل والمفعول المطلق
      كَبِيرًا: خلط بين المفعول المطلق ونعته
    indice: 'المَفْعُولُ المُطْلَقُ مَصْدَرٌ مِنْ لَفْظِ الفِعْلِ: فَرِحَ... ؟'
    explication: 'المَفْعُولُ المُطْلَقُ هُوَ «فَرَحًا»: مَصْدَرُ الفِعْلِ «فَرِحَ»، مَنْصُوبٌ.'
  - id: mutlaq-2
    difficulte: 2
    enonce: 'اِخْتَرِ المَفْعُولَ المُطْلَقَ المُنَاسِبَ: ضَحِكَ الوَلَدُ ... (فَرَحًا / ضَحِكًا / سَرِيعًا)'
    reponses:
    - ضَحِكًا
    erreurs:
      فَرَحًا: المفعول المطلق من لفظ الفعل
      سَرِيعًا: المفعول المطلق مصدر الفعل
    indice: المَفْعُولُ المُطْلَقُ مَصْدَرٌ مِنْ لَفْظِ الفِعْلِ «ضَحِكَ».
    explication: 'نَقُولُ «ضَحِكَ الوَلَدُ ضَحِكًا»: «ضَحِكًا» مَصْدَرُ «ضَحِكَ».'
  - id: mutlaq-3
    difficulte: 3
    enonce: 'مَاذَا يُبَيِّنُ المَفْعُولُ المُطْلَقُ «قَفْزَتَيْنِ» فِي: قَفَزَ اللَّاعِبُ قَفْزَتَيْنِ؟ (النَّوْعَ / التَّوْكِيدَ / العَدَدَ)'
    reponses:
    - العَدَدَ
    erreurs:
      النَّوْعَ: خلط بين بيان العدد وبيان النوع
      التَّوْكِيدَ: خلط بين بيان العدد والتوكيد
    indice: كَمْ مَرَّةً قَفَزَ اللَّاعِبُ؟
    explication: '«قَفْزَتَيْنِ» مَفْعُولٌ مُطْلَقٌ يُبَيِّنُ العَدَدَ: قَفَزَ مَرَّتَيْنِ.'
- notion: المفعول لأجله
  exercices:
  - id: liajlih-1
    difficulte: 1
    enonce: 'مَا المَفْعُولُ لِأَجْلِهِ فِي: وَقَفَ التَّلَامِيذُ احْتِرَامًا لِلْمُعَلِّمِ؟ (التَّلَامِيذُ / لِلْمُعَلِّمِ / احْتِرَامًا)'
    reponses:
    - احْتِرَامًا
    erreurs:
      التَّلَامِيذُ: خلط بين الفاعل والمفعول لأجله
      لِلْمُعَلِّمِ: خلط بين الاسم المجرور والمفعول لأجله
    indice: 'اِسْأَلْ: لِمَاذَا وَقَفَ التَّلَامِيذُ؟'
    explication: 'المَفْعُولُ لِأَجْلِهِ هُوَ «احْتِرَامًا»: يُبَيِّنُ سَبَبَ الوُقُوفِ، وَهُوَ مَصْدَرٌ مَنْصُوبٌ.'
  - id: liajlih-2
    difficulte: 2
    enonce: بِأَيِّ سُؤَالٍ نَجِدُ المَفْعُولَ لِأَجْلِهِ؟ (كَيْفَ؟ / لِمَاذَا؟ / مَتَى؟)
    reponses:
    - لِمَاذَا؟
    erreurs:
      كَيْفَ؟: خلط بين المفعول لأجله والحال
      مَتَى؟: خلط بين المفعول لأجله والمفعول فيه
    indice: المَفْعُولُ لِأَجْلِهِ يُبَيِّنُ سَبَبَ الفِعْلِ.
    explication: نَجِدُ المَفْعُولَ لِأَجْلِهِ بِالسُّؤَالِ «لِمَاذَا؟».
  - id: liajlih-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'اِخْتَرِ المَفْعُولَ لِأَجْلِهِ المُنَاسِبَ: يَجْتَهِدُ التِّلْمِيذُ ... فِي النَّجَاحِ. (رَغْبَةٌ / رَاغِبٌ / رَغْبَةً)'
    reponses:
    - رَغْبَةً
    erreurs:
      رَغْبَةٌ: نسيان نصب المفعول لأجله
      رَاغِبٌ: المفعول لأجله مصدر
    indice: المَفْعُولُ لِأَجْلِهِ مَصْدَرٌ مَنْصُوبٌ.
    explication: 'نَقُولُ «يَجْتَهِدُ التِّلْمِيذُ رَغْبَةً فِي النَّجَاحِ»: «رَغْبَةً» مَصْدَرٌ مَنْصُوبٌ يُبَيِّنُ السَّبَبَ.'
- notion: المفعول فيه
  exercices:
  - id: fihi-1
    difficulte: 1
    enonce: 'مَا المَفْعُولُ فِيهِ فِي: سَافَرَ أَبِي لَيْلًا؟ (أَبِي / لَيْلًا / سَافَرَ)'
    reponses:
    - لَيْلًا
    erreurs:
      أَبِي: خلط بين الفاعل والمفعول فيه
      سَافَرَ: خلط بين الفعل والمفعول فيه
    indice: 'اِسْأَلْ: مَتَى سَافَرَ أَبِي؟'
    explication: 'المَفْعُولُ فِيهِ هُوَ «لَيْلًا»: ظَرْفُ زَمَانٍ مَنْصُوبٌ.'
  - id: fihi-2
    difficulte: 2
    enonce: '«أَمَامَ» فِي «جَلَسْتُ أَمَامَ البَيْتِ»: ظَرْفُ زَمَانٍ أَمْ ظَرْفُ مَكَانٍ؟ (ظَرْفُ زَمَانٍ / ظَرْفُ مَكَانٍ)'
    reponses:
    - ظَرْفُ مَكَانٍ
    erreurs:
      ظَرْفُ زَمَانٍ: خلط بين ظرف الزمان وظرف المكان
    indice: 'اِسْأَلْ: أَيْنَ جَلَسْتُ؟'
    explication: '«أَمَامَ» ظَرْفُ مَكَانٍ: يُجِيبُ عَنِ السُّؤَالِ «أَيْنَ؟».'
  - id: fihi-3
    difficulte: 3
    enonce: 'اِخْتَرْ ظَرْفَ الزَّمَانِ: (فَوْقَ / صَبَاحًا / تَحْتَ)'
    reponses:
    - صَبَاحًا
    erreurs:
      فَوْقَ: خلط بين ظرف الزمان وظرف المكان
      تَحْتَ: خلط بين ظرف الزمان وظرف المكان
    indice: ظَرْفُ الزَّمَانِ يُجِيبُ عَنِ السُّؤَالِ «مَتَى؟».
    explication: «صَبَاحًا» ظَرْفُ زَمَانٍ. أَمَّا «فَوْقَ» وَ«تَحْتَ» فَظَرْفَا مَكَانٍ.
- notion: المنادى
  exercices:
  - id: munada-1
    difficulte: 1
    enonce: 'مَا حَرْفُ النِّدَاءِ فِي: يَا سَعِيدُ، تَعَالَ؟ (سَعِيدُ / يَا / تَعَالَ)'
    reponses:
    - يَا
    erreurs:
      سَعِيدُ: خلط بين حرف النداء والمنادى
      تَعَالَ: خلط بين الفعل وحرف النداء
    indice: نُنَادِي شَخْصًا بِحَرْفٍ قَبْلَ اسْمِهِ.
    explication: حَرْفُ النِّدَاءِ هُوَ «يَا»، وَ«سَعِيدُ» مُنَادًى.
  - id: munada-2
    difficulte: 2
    enonce: 'مَا المُنَادَى فِي: يَا مَرْيَمُ، اقْرَئِي؟ (يَا / اقْرَئِي / مَرْيَمُ)'
    reponses:
    - مَرْيَمُ
    erreurs:
      يَا: خلط بين حرف النداء والمنادى
      اقْرَئِي: خلط بين الفعل والمنادى
    indice: المُنَادَى هُوَ الاِسْمُ الَّذِي يَأْتِي بَعْدَ حَرْفِ النِّدَاءِ.
    explication: 'المُنَادَى هُوَ «مَرْيَمُ»: عَلَمٌ مُفْرَدٌ مَبْنِيٌّ عَلَى الضَّمِّ.'
  - id: munada-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'اِخْتَرِ الصَّحِيحَ: يَا ... العِلْمِ، اجْتَهِدْ. (طَالِبُ / طَالِبَ / طَالِبِ)'
    reponses:
    - طَالِبَ
    erreurs:
      طَالِبُ: المنادى المضاف منصوب
      طَالِبِ: المنادى المضاف منصوب
    indice: المُنَادَى هُنَا مُضَافٌ إِلَى «العِلْمِ»، وَالمُنَادَى المُضَافُ مَنْصُوبٌ.
    explication: 'نَقُولُ «يَا طَالِبَ العِلْمِ»: مُنَادًى مُضَافٌ مَنْصُوبٌ بِالفَتْحَةِ.'
- notion: العطف
  exercices:
  - id: atf-1
    difficulte: 1
    enonce: 'مَا حَرْفُ العَطْفِ فِي: جَاءَ أَحْمَدُ وَخَالِدٌ؟ (جَاءَ / وَ / خَالِدٌ)'
    reponses:
    - وَ
    erreurs:
      جَاءَ: خلط بين الفعل وحرف العطف
      خَالِدٌ: خلط بين المعطوف وحرف العطف
    indice: 'حُرُوفُ العَطْفِ: الوَاوُ، الفَاءُ، ثُمَّ، أَوْ...'
    explication: حَرْفُ العَطْفِ هُوَ الوَاوُ، وَ«خَالِدٌ» مَعْطُوفٌ عَلَى «أَحْمَدُ».
  - id: atf-2
    difficulte: 2
    enonce: 'مَا المَعْطُوفُ فِي: أَكَلْتُ تُفَّاحَةً ثُمَّ مَوْزَةً؟ (تُفَّاحَةً / ثُمَّ / مَوْزَةً)'
    reponses:
    - مَوْزَةً
    erreurs:
      تُفَّاحَةً: خلط بين المعطوف والمعطوف عليه
      ثُمَّ: خلط بين حرف العطف والمعطوف
    indice: المَعْطُوفُ يَأْتِي بَعْدَ حَرْفِ العَطْفِ.
    explication: المَعْطُوفُ هُوَ «مَوْزَةً»، مَعْطُوفٌ عَلَى «تُفَّاحَةً» بِـ«ثُمَّ»، مَنْصُوبٌ مِثْلَهُ.
  - id: atf-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'اِخْتَرِ الصَّحِيحَ: رَأَيْتُ الأَسَدَ وَ... (النَّمِرُ / النَّمِرِ / النَّمِرَ)'
    reponses:
    - النَّمِرَ
    erreurs:
      النَّمِرُ: عدم إتباع المعطوف للمعطوف عليه
      النَّمِرِ: عدم إتباع المعطوف للمعطوف عليه
    indice: 'المَعْطُوفُ يَتْبَعُ المَعْطُوفَ عَلَيْهِ فِي الإِعْرَابِ: «الأَسَدَ» مَنْصُوبٌ.'
    explication: 'نَقُولُ «رَأَيْتُ الأَسَدَ وَالنَّمِرَ»: المَعْطُوفُ مَنْصُوبٌ مِثْلَ «الأَسَدَ».'
- notion: التوكيد
  exercices:
  - id: tawkid-1
    difficulte: 1
    enonce: 'مَا لَفْظُ التَّوْكِيدِ فِي: جَاءَ المُدِيرُ نَفْسُهُ؟ (المُدِيرُ / جَاءَ / نَفْسُهُ)'
    reponses:
    - نَفْسُهُ
    erreurs:
      المُدِيرُ: خلط بين التوكيد والمؤكد
      جَاءَ: خلط بين الفعل والتوكيد
    indice: 'مِنْ أَلْفَاظِ التَّوْكِيدِ: نَفْسٌ، عَيْنٌ، كُلٌّ، جَمِيعٌ.'
    explication: 'لَفْظُ التَّوْكِيدِ هُوَ «نَفْسُهُ»: يُؤَكِّدُ أَنَّ المُدِيرَ هُوَ الَّذِي جَاءَ.'
  - id: tawkid-2
    difficulte: 2
    enonce: 'التَّوْكِيدُ فِي «نَجَحَ نَجَحَ التِّلْمِيذُ»: لَفْظِيٌّ أَمْ مَعْنَوِيٌّ؟ (مَعْنَوِيٌّ / لَفْظِيٌّ)'
    reponses:
    - لَفْظِيٌّ
    erreurs:
      مَعْنَوِيٌّ: خلط بين التوكيد اللفظي والمعنوي
    indice: هُنَا كُرِّرَتِ الكَلِمَةُ نَفْسُهَا.
    explication: 'التَّوْكِيدُ لَفْظِيٌّ: نُكَرِّرُ اللَّفْظَ نَفْسَهُ (نَجَحَ نَجَحَ).'
  - id: tawkid-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'اِخْتَرِ الصَّحِيحَ: حَضَرَ التَّلَامِيذُ ... (كُلَّهُمْ / كُلِّهِمْ / كُلُّهُمْ)'
    reponses:
    - كُلُّهُمْ
    erreurs:
      كُلَّهُمْ: عدم إتباع التوكيد للمؤكد
      كُلِّهِمْ: عدم إتباع التوكيد للمؤكد
    indice: 'التَّوْكِيدُ يَتْبَعُ المُؤَكَّدَ فِي الإِعْرَابِ: «التَّلَامِيذُ» مَرْفُوعٌ.'
    explication: 'نَقُولُ «حَضَرَ التَّلَامِيذُ كُلُّهُمْ»: تَوْكِيدٌ مَعْنَوِيٌّ مَرْفُوعٌ مِثْلَ «التَّلَامِيذُ».'
- notion: البدل
  exercices:
  - id: badal-1
    difficulte: 1
    enonce: 'مَا البَدَلُ فِي: جَاءَ الخَلِيفَةُ عُمَرُ؟ (جَاءَ / عُمَرُ / الخَلِيفَةُ)'
    reponses:
    - عُمَرُ
    erreurs:
      جَاءَ: خلط بين الفعل والبدل
      الخَلِيفَةُ: خلط بين البدل والمبدل منه
    indice: البَدَلُ يَأْتِي بَعْدَ اسْمٍ آخَرَ، وَيَدُلُّ عَلَى الشَّخْصِ نَفْسِهِ.
    explication: 'البَدَلُ هُوَ «عُمَرُ»، وَالمُبْدَلُ مِنْهُ «الخَلِيفَةُ»: يَتْبَعُهُ فِي الرَّفْعِ.'
  - id: badal-2
    difficulte: 2
    enonce: 'مَا المُبْدَلُ مِنْهُ فِي: زُرْتُ صَدِيقِي أَحْمَدَ؟ (أَحْمَدَ / صَدِيقِي)'
    reponses:
    - صَدِيقِي
    erreurs:
      أَحْمَدَ: خلط بين البدل والمبدل منه
    indice: المُبْدَلُ مِنْهُ يَأْتِي قَبْلَ البَدَلِ.
    explication: المُبْدَلُ مِنْهُ هُوَ «صَدِيقِي»، وَالبَدَلُ «أَحْمَدَ».
  - id: badal-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'اِخْتَرِ الصَّحِيحَ: قَرَأْتُ الكِتَابَ ... (نِصْفُهُ / نِصْفِهِ / نِصْفَهُ)'
    reponses:
    - نِصْفَهُ
    erreurs:
      نِصْفُهُ: عدم إتباع البدل للمبدل منه
      نِصْفِهِ: عدم إتباع البدل للمبدل منه
    indice: 'البَدَلُ يَتْبَعُ المُبْدَلَ مِنْهُ فِي الإِعْرَابِ: «الكِتَابَ» مَنْصُوبٌ.'
    explication: 'نَقُولُ «قَرَأْتُ الكِتَابَ نِصْفَهُ»: بَدَلٌ مَنْصُوبٌ مِثْلَ «الكِتَابَ».'
- notion: المقصور والمنقوص والممدود
  exercices:
  - id: maqsur-1
    difficulte: 1
    enonce: هَلْ «العَصَا» اسْمٌ مَقْصُورٌ أَمْ مَنْقُوصٌ أَمْ مَمْدُودٌ؟ (مَنْقُوصٌ / مَقْصُورٌ / مَمْدُودٌ)
    reponses:
    - مَقْصُورٌ
    erreurs:
      مَنْقُوصٌ: خلط بين المقصور والمنقوص والممدود
      مَمْدُودٌ: خلط بين المقصور والمنقوص والممدود
    indice: 'اُنْظُرْ إِلَى آخِرِ الكَلِمَةِ: أَلِفٌ؟ يَاءٌ؟ هَمْزَةٌ بَعْدَ أَلِفٍ؟'
    explication: '«العَصَا» اسْمٌ مَقْصُورٌ: آخِرُهُ أَلِفٌ لَازِمَةٌ.'
  - id: maqsur-2
    difficulte: 2
    enonce: هَلْ «القَاضِي» اسْمٌ مَقْصُورٌ أَمْ مَنْقُوصٌ أَمْ مَمْدُودٌ؟ (مَقْصُورٌ / مَمْدُودٌ / مَنْقُوصٌ)
    reponses:
    - مَنْقُوصٌ
    erreurs:
      مَقْصُورٌ: خلط بين المقصور والمنقوص والممدود
      مَمْدُودٌ: خلط بين المقصور والمنقوص والممدود
    indice: آخِرُ الكَلِمَةِ يَاءٌ، وَقَبْلَهَا كَسْرَةٌ.
    explication: '«القَاضِي» اسْمٌ مَنْقُوصٌ: آخِرُهُ يَاءٌ لَازِمَةٌ مَكْسُورٌ مَا قَبْلَهَا.'
  - id: maqsur-3
    difficulte: 3
    enonce: 'اِخْتَرِ الاِسْمَ المَمْدُودَ: (الفَتَى / الصَّحْرَاءُ / النَّادِي)'
    reponses:
    - الصَّحْرَاءُ
    erreurs:
      الفَتَى: خلط بين الممدود والمقصور
      النَّادِي: خلط بين الممدود والمنقوص
    indice: الاِسْمُ المَمْدُودُ آخِرُهُ هَمْزَةٌ قَبْلَهَا أَلِفٌ زَائِدَةٌ.
    explication: '«الصَّحْرَاءُ» اسْمٌ مَمْدُودٌ: آخِرُهُ هَمْزَةٌ قَبْلَهَا أَلِفٌ زَائِدَةٌ.'
- notion: أنواع الجمع
  exercices:
  - id: jam-1
    difficulte: 1
    enonce: مَا نَوْعُ الجَمْعِ فِي «مُهَنْدِسُونَ»؟ (جَمْعُ تَكْسِيرٍ / جَمْعُ مُذَكَّرٍ سَالِمٌ / جَمْعُ مُؤَنَّثٍ سَالِمٌ)
    reponses:
    - جَمْعُ مُذَكَّرٍ سَالِمٌ
    erreurs:
      جَمْعُ تَكْسِيرٍ: خلط بين أنواع الجمع
      جَمْعُ مُؤَنَّثٍ سَالِمٌ: خلط بين أنواع الجمع
    indice: هَلْ زِدْنَا عَلَى المُفْرَدِ «مُهَنْدِسٌ» وَاوًا وَنُونًا؟
    explication: '«مُهَنْدِسُونَ» جَمْعُ مُذَكَّرٍ سَالِمٌ: سَلِمَ المُفْرَدُ، وَزِدْنَا وَاوًا وَنُونًا.'
  - id: jam-2
    difficulte: 2
    enonce: مَا نَوْعُ الجَمْعِ فِي «أَشْجَارٌ»؟ (جَمْعُ مُذَكَّرٍ سَالِمٌ / جَمْعُ مُؤَنَّثٍ سَالِمٌ / جَمْعُ تَكْسِيرٍ)
    reponses:
    - جَمْعُ تَكْسِيرٍ
    erreurs:
      جَمْعُ مُذَكَّرٍ سَالِمٌ: خلط بين أنواع الجمع
      جَمْعُ مُؤَنَّثٍ سَالِمٌ: خلط بين أنواع الجمع
    indice: 'قَارِنْ بِالمُفْرَدِ «شَجَرٌ»: هَلْ بَقِيَ كَمَا هُوَ؟'
    explication: '«أَشْجَارٌ» جَمْعُ تَكْسِيرٍ: تَغَيَّرَ بِنَاءُ المُفْرَدِ.'
  - id: jam-3
    difficulte: 3
    enonce: مَا جَمْعُ «مُعَلِّمَةٌ»؟ (مُعَلِّمُونَ / مُعَلِّمَاتٌ / مَعَالِمُ)
    reponses:
    - مُعَلِّمَاتٌ
    erreurs:
      مُعَلِّمُونَ: خلط بين جمع المذكر وجمع المؤنث
      مَعَالِمُ: ليس جمع الكلمة
    indice: 'جَمْعُ المُؤَنَّثِ السَّالِمُ: نَحْذِفُ التَّاءَ المَرْبُوطَةَ وَنَزِيدُ أَلِفًا وَتَاءً.'
    explication: 'جَمْعُ «مُعَلِّمَةٌ» هُوَ «مُعَلِّمَاتٌ»: جَمْعُ مُؤَنَّثٍ سَالِمٌ.'
- notion: اسم الفاعل واسم المفعول
  exercices:
  - id: fail-maf-1
    difficulte: 1
    enonce: مَا اسْمُ الفَاعِلِ مِنْ «كَتَبَ»؟ (مَكْتُوبٌ / كِتَابٌ / كَاتِبٌ)
    reponses:
    - كَاتِبٌ
    erreurs:
      مَكْتُوبٌ: خلط بين اسم الفاعل واسم المفعول
      كِتَابٌ: خلط بين اسم الفاعل والمصدر
    indice: اِسْمُ الفَاعِلِ مِنَ الثُّلَاثِيِّ عَلَى وَزْنِ «فَاعِلٍ».
    explication: 'اِسْمُ الفَاعِلِ مِنْ «كَتَبَ» هُوَ «كَاتِبٌ»: مَنْ يَكْتُبُ.'
  - id: fail-maf-2
    difficulte: 2
    enonce: مَا اسْمُ المَفْعُولِ مِنْ «شَرِبَ»؟ (شَارِبٌ / مَشْرُوبٌ / شَرَابٌ)
    reponses:
    - مَشْرُوبٌ
    erreurs:
      شَارِبٌ: خلط بين اسم الفاعل واسم المفعول
      شَرَابٌ: خلط بين اسم المفعول والاسم
    indice: اِسْمُ المَفْعُولِ مِنَ الثُّلَاثِيِّ عَلَى وَزْنِ «مَفْعُولٍ».
    explication: 'اِسْمُ المَفْعُولِ مِنْ «شَرِبَ» هُوَ «مَشْرُوبٌ»: مَا يُشْرَبُ.'
  - id: fail-maf-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: مَا اسْمُ الفَاعِلِ مِنَ «اجْتَهَدَ»؟ (مُجْتَهَدٌ / مُجْتَهِدٌ / مَجْهُودٌ)
    reponses:
    - مُجْتَهِدٌ
    erreurs:
      مُجْتَهَدٌ: خلط بين اسم الفاعل واسم المفعول
      مَجْهُودٌ: خطأ في صوغ اسم الفاعل من غير الثلاثي
    indice: 'مِنْ غَيْرِ الثُّلَاثِيِّ: مِيمٌ مَضْمُومَةٌ، وَكَسْرُ مَا قَبْلَ الآخِرِ.'
    explication: 'اِسْمُ الفَاعِلِ هُوَ «مُجْتَهِدٌ»: مِيمٌ مَضْمُومَةٌ وَكَسْرُ مَا قَبْلَ الآخِرِ (يَجْتَهِدُ ← مُجْتَهِدٌ).'
- notion: اسما الزمان والمكان
  exercices:
  - id: makan-1
    difficulte: 1
    enonce: مَا اسْمُ المَكَانِ مِنْ «لَعِبَ»؟ (لَاعِبٌ / مَلْعُوبٌ / مَلْعَبٌ)
    reponses:
    - مَلْعَبٌ
    erreurs:
      لَاعِبٌ: خلط بين اسم المكان واسم الفاعل
      مَلْعُوبٌ: خلط بين اسم المكان واسم المفعول
    indice: اِسْمُ المَكَانِ يَدُلُّ عَلَى المَكَانِ الَّذِي نَلْعَبُ فِيهِ.
    explication: 'اِسْمُ المَكَانِ مِنْ «لَعِبَ» هُوَ «مَلْعَبٌ»: مَكَانُ اللَّعِبِ.'
  - id: makan-2
    difficulte: 2
    voyelles_obligatoires: true
    enonce: مَا اسْمُ المَكَانِ مِنْ «جَلَسَ» (يَجْلِسُ)؟ (مَجْلَسٌ / جَالِسٌ / مَجْلِسٌ)
    reponses:
    - مَجْلِسٌ
    erreurs:
      مَجْلَسٌ: خطأ في وزن اسم المكان
      جَالِسٌ: خلط بين اسم المكان واسم الفاعل
    indice: 'مُضَارِعُهُ «يَجْلِسُ» مَكْسُورُ العَيْنِ: يَأْتِي اسْمُ المَكَانِ عَلَى «مَفْعِلٍ».'
    explication: اِسْمُ المَكَانِ هُوَ «مَجْلِسٌ» بِكَسْرِ اللَّامِ، لِأَنَّ المُضَارِعَ «يَجْلِسُ» مَكْسُورُ العَيْنِ.
  - id: makan-3
    difficulte: 3
    enonce: '«مَوْعِدُ الاِمْتِحَانِ غَدًا»: هَلْ «مَوْعِدُ» اسْمُ زَمَانٍ أَمِ اسْمُ مَكَانٍ؟ (اسْمُ مَكَانٍ / اسْمُ زَمَانٍ)'
    reponses:
    - اسْمُ زَمَانٍ
    erreurs:
      اسْمُ مَكَانٍ: خلط بين اسم الزمان واسم المكان
    indice: هَلْ تَدُلُّ الكَلِمَةُ عَلَى وَقْتٍ أَمْ عَلَى مَكَانٍ؟
    explication: '«مَوْعِدُ» هُنَا اسْمُ زَمَانٍ: يَدُلُّ عَلَى وَقْتِ الاِمْتِحَانِ.'
- notion: اسم الآلة
  exercices:
  - id: ala-1
    difficulte: 1
    enonce: 'اِخْتَرِ اسْمَ الآلَةِ: (مَفْتُوحٌ / فَاتِحٌ / مِفْتَاحٌ)'
    reponses:
    - مِفْتَاحٌ
    erreurs:
      مَفْتُوحٌ: خلط بين اسم الآلة واسم المفعول
      فَاتِحٌ: خلط بين اسم الآلة واسم الفاعل
    indice: اِسْمُ الآلَةِ يَدُلُّ عَلَى الأَدَاةِ الَّتِي نَسْتَعْمِلُهَا.
    explication: '«مِفْتَاحٌ» اسْمُ آلَةٍ: الأَدَاةُ الَّتِي نَفْتَحُ بِهَا.'
  - id: ala-2
    difficulte: 2
    enonce: مَا اسْمُ الآلَةِ مِنْ «كَنَسَ»؟ (كَانِسٌ / مِكْنَسَةٌ / مَكْنُوسٌ)
    reponses:
    - مِكْنَسَةٌ
    erreurs:
      كَانِسٌ: خلط بين اسم الآلة واسم الفاعل
      مَكْنُوسٌ: خلط بين اسم الآلة واسم المفعول
    indice: بِأَيِّ أَدَاةٍ نَكْنُسُ؟
    explication: اِسْمُ الآلَةِ مِنْ «كَنَسَ» هُوَ «مِكْنَسَةٌ» عَلَى وَزْنِ «مِفْعَلَةٍ».
  - id: ala-3
    difficulte: 3
    enonce: عَلَى أَيِّ وَزْنٍ جَاءَ «مِبْرَدٌ»؟ (مِفْعَالٌ / مِفْعَلَةٌ / مِفْعَلٌ)
    reponses:
    - مِفْعَلٌ
    erreurs:
      مِفْعَالٌ: خطأ في وزن اسم الآلة
      مِفْعَلَةٌ: خطأ في وزن اسم الآلة
    indice: 'عُدَّ حُرُوفَ الكَلِمَةِ: مِ + بْ + رَ + دٌ.'
    explication: «مِبْرَدٌ» عَلَى وَزْنِ «مِفْعَلٍ»، مِثْلَ «مِشْرَطٌ».
- notion: اسم التفضيل
  exercices:
  - id: tafdil-1
    difficulte: 1
    enonce: 'اِخْتَرِ الكَلِمَةَ المُنَاسِبَةَ: الفِيلُ ... مِنَ الحِصَانِ. (كَبِيرٌ / أَكْبَرُ / كَبُرَ)'
    reponses:
    - أَكْبَرُ
    erreurs:
      كَبِيرٌ: عدم استعمال اسم التفضيل
      كَبُرَ: خلط بين الفعل واسم التفضيل
    indice: 'نُقَارِنُ بَيْنَ شَيْئَيْنِ: نَسْتَعْمِلُ وَزْنَ «أَفْعَلَ».'
    explication: 'نَقُولُ «الفِيلُ أَكْبَرُ مِنَ الحِصَانِ»: «أَكْبَرُ» اسْمُ تَفْضِيلٍ.'
  - id: tafdil-2
    difficulte: 2
    enonce: مَا اسْمُ التَّفْضِيلِ مِنْ «صَغِيرٌ»؟ (صَغِيرَةٌ / أَصْغَرُ / مُصَغَّرٌ)
    reponses:
    - أَصْغَرُ
    erreurs:
      صَغِيرَةٌ: خلط بين التأنيث والتفضيل
      مُصَغَّرٌ: خطأ في وزن اسم التفضيل
    indice: اِسْمُ التَّفْضِيلِ عَلَى وَزْنِ «أَفْعَلَ».
    explication: 'اِسْمُ التَّفْضِيلِ هُوَ «أَصْغَرُ»: عَلَى وَزْنِ «أَفْعَلَ».'
  - id: tafdil-3
    difficulte: 3
    enonce: مَا مُؤَنَّثُ اسْمِ التَّفْضِيلِ «أَكْبَرُ»؟ (كَبِيرَةٌ / أَكْبَرَةٌ / كُبْرَى)
    reponses:
    - كُبْرَى
    erreurs:
      كَبِيرَةٌ: خلط بين الصفة واسم التفضيل
      أَكْبَرَةٌ: خطأ في تأنيث اسم التفضيل
    indice: مُؤَنَّثُ «أَفْعَلَ» عَلَى وَزْنِ «فُعْلَى».
    explication: 'مُؤَنَّثُ «أَكْبَرُ» هُوَ «كُبْرَى» عَلَى وَزْنِ «فُعْلَى»: الجَائِزَةُ الكُبْرَى.'
