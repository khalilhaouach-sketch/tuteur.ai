- notion: اسما الزمان والمكان
  exercices:
  - id: makan-1
    difficulte: 1
    enonce: مَا اسْمُ المَكَانِ مِنْ «لَعِبَ»؟ (لَاعِبٌ / مَلْعُوبٌ / مَلْعَبٌ)
    reponses:
    - مَلْعَبٌ
    erreurs:
      لَاعِبٌ: خلط بين اسم المكان واسم الفاعل
      مَلْعُوبٌ: خلط بين اسم المكان واسم المفعول
    indice: اِسْمُ المَكَانِ يَدُلُّ عَلَى المَكَانِ الَّذِي نَلْعَبُ فِيهِ.
    explication: 'اِسْمُ المَكَانِ مِنْ «لَعِبَ» هُوَ «مَلْعَبٌ»: مَكَانُ اللَّعِبِ.'
  - id: makan-2
    difficulte: 2
    voyelles_obligatoires: true
    enonce: مَا اسْمُ المَكَانِ مِنْ «جَلَسَ» (يَجْلِسُ)؟ (مَجْلَسٌ / جَالِسٌ / مَجْلِسٌ)
    reponses:
    - مَجْلِسٌ
    erreurs:
      مَجْلَسٌ: خطأ في وزن اسم المكان
      جَالِسٌ: خلط بين اسم المكان واسم الفاعل
    indice: 'مُضَارِعُهُ «يَجْلِسُ» مَكْسُورُ العَيْنِ: يَأْتِي اسْمُ المَكَانِ عَلَى «مَفْعِلٍ».'
    explication: اِسْمُ المَكَانِ هُوَ «مَجْلِسٌ» بِكَسْرِ اللَّامِ، لِأَنَّ المُضَارِعَ «يَجْلِسُ» مَكْسُورُ العَيْنِ.
  - id: makan-3
    difficulte: 3
    enonce: '«مَوْعِدُ الاِمْتِحَانِ غَدًا»: هَلْ «مَوْعِدُ» اسْمُ زَمَانٍ أَمِ اسْمُ مَكَانٍ؟ (اسْمُ مَكَانٍ / اسْمُ زَمَانٍ)'
    reponses:
    - اسْمُ زَمَانٍ
    erreurs:
      اسْمُ مَكَانٍ: خلط بين اسم الزمان واسم المكان
    indice: هَلْ تَدُلُّ الكَلِمَةُ عَلَى وَقْتٍ أَمْ عَلَى مَكَانٍ؟
    explication: '«مَوْعِدُ» هُنَا اسْمُ زَمَانٍ: يَدُلُّ عَلَى وَقْتِ الاِمْتِحَانِ.'
  - id: makan-4
    difficulte: 1
    enonce: مَا اسْمُ المَكَانِ مِنْ «كَتَبَ»؟ (كَاتِبٌ / مَكْتَبٌ / مَكْتُوبٌ)
    reponses:
    - مَكْتَبٌ
    erreurs:
