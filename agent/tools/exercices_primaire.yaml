    indice: 'خَبَرُ «أَصْبَحَ» يَكُونُ مَنْصُوبًا: أَيُّ كَلِمَةٍ مَنْصُوبَةٌ؟'
    explication: خَبَرُ «أَصْبَحَ» هُوَ «بَارِدًا»، مَنْصُوبٌ بِالفَتْحَةِ.
