- notion: همزتا الوصل والقطع
  exercices:
  - id: wasl-1
    difficulte: 1
    enonce: هَلِ الهَمْزَةُ فِي «أَحْمَدُ» هَمْزَةُ قَطْعٍ أَمْ هَمْزَةُ وَصْلٍ؟ (هَمْزَةُ وَصْلٍ / هَمْزَةُ قَطْعٍ)
    reponses:
    - هَمْزَةُ قَطْعٍ
    erreurs:
      هَمْزَةُ وَصْلٍ: خلط بين همزة الوصل وهمزة القطع
    indice: 'قُلْ: «وَأَحْمَدُ»: هَلْ نَنْطِقُ الهَمْزَةَ؟'
    explication: 'الهَمْزَةُ فِي «أَحْمَدُ» هَمْزَةُ قَطْعٍ: تُنْطَقُ دَائِمًا وَتُكْتَبُ.'
    tolerer_hamza: false
  - id: wasl-2
    difficulte: 2
    enonce: هَلِ الهَمْزَةُ فِي «اسْتَخْرَجَ» هَمْزَةُ قَطْعٍ أَمْ هَمْزَةُ وَصْلٍ؟ (هَمْزَةُ قَطْعٍ / هَمْزَةُ وَصْلٍ)
    reponses:
    - هَمْزَةُ وَصْلٍ
    erreurs:
      هَمْزَةُ قَطْعٍ: خلط بين همزة الوصل وهمزة القطع
    indice: 'قُلْ: «ثُمَّ اسْتَخْرَجَ»: هَلْ نَنْطِقُ الهَمْزَةَ؟'
    explication: 'الهَمْزَةُ فِي «اسْتَخْرَجَ» هَمْزَةُ وَصْلٍ: تَسْقُطُ فِي دَرْجِ الكَلَامِ وَلَا تُكْتَبُ.'
    tolerer_hamza: false
  - id: wasl-3
    difficulte: 3
    enonce: 'اِخْتَرِ الكِتَابَةَ الصَّحِيحَةَ: (إِنْطِلَاقٌ / انْطِلَاقٌ)'
    reponses:
    - انْطِلَاقٌ
    erreurs:
      إِنْطِلَاقٌ: كتابة همزة الوصل همزة قطع
    indice: مَصْدَرُ الفِعْلِ الخُمَاسِيِّ «انْطَلَقَ» يَبْدَأُ بِهَمْزَةِ وَصْلٍ.
    explication: 'نَكْتُبُ «انْطِلَاقٌ» بِلَا هَمْزَةٍ: هَمْزَتُهُ هَمْزَةُ وَصْلٍ، لِأَنَّهُ مَصْدَرُ فِعْلٍ خُمَاسِيٍّ.'
    tolerer_hamza: false
  - id: wasl-4
    difficulte: 1
    tolerer_hamza: false
    enonce: مَا نَوْعُ الهَمْزَةِ فِي «أَكَلَ»؟ (هَمْزَةُ قَطْعٍ / هَمْزَةُ وَصْلٍ)
    reponses:
    - هَمْزَةُ قَطْعٍ
    erreurs:
      هَمْزَةُ وَصْلٍ: خلط بين همزة القطع والوصل
    indice: هَمْزَةُ القَطْعِ تُنْطَقُ دَائِمًا وَتُكْتَبُ (أ، إ)، وَهَمْزَةُ الوَصْلِ لَا تُنْطَقُ فِي وَسَطِ الكَلَامِ وَلَا تُكْتَبُ (ا).
    explication: 'الهَمْزَةُ فِي «أَكَلَ» هَمْزَةُ قَطْعٍ: تُنْطَقُ دَائِمًا (وَأَكَلَ).'
