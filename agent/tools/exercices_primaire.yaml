    explication: يُنْصَبُ جَمْعُ المُؤَنَّثِ السَّالِمِ بِالكَسْرَةِ نِيَابَةً عَنِ الفَتْحَةِ.
  - id: muthanna-10
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: زَارَتِ المُدِيرَةُ ... (المُعَلِّمَاتَ / المُعَلِّمَاتِ / المُعَلِّمَاتُ)'
    reponses:
    - المُعَلِّمَاتِ
    erreurs:
      المُعَلِّمَاتَ: خطأ في إعراب الجمع المؤنث السالم
      المُعَلِّمَاتُ: خطأ في إعراب الجمع المؤنث السالم
    indice: 'المَفْعُولُ بِهِ جَمْعُ مُؤَنَّثٍ سَالِمٌ: يُنْصَبُ بِالكَسْرَةِ.'
    explication: 'نَقُولُ: زَارَتِ المُدِيرَةُ المُعَلِّمَاتِ.'
  - id: muthanna-11
