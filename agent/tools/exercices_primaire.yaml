    indice: الكَلِمَةُ مَفْعُولٌ بِهِ، وَجَمْعُ المُذَكَّرِ السَّالِمُ يُنْصَبُ بِاليَاءِ.
    explication: 'نَقُولُ «شَكَرْتُ المُعَلِّمِينَ»: مَفْعُولٌ بِهِ مَنْصُوبٌ بِاليَاءِ لِأَنَّهُ جَمْعُ مُذَكَّرٍ سَالِمٌ.'
  - id: muthanna-3
    difficulte: 3
    enonce: 'مَا عَلَامَةُ نَصْبِ «المُعَلِّمَاتِ» فِي: شَكَرْتُ المُعَلِّمَاتِ؟ (الفَتْحَةُ / الكَسْرَةُ / اليَاءُ)'
    reponses:
