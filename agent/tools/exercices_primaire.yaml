      فِي الإِعْرَابِ فَقَطْ: خطأ في مطابقة النعت للمنعوت
      لَا يَتْبَعُهُ: خطأ في مطابقة النعت للمنعوت
    indice: 'قَارِنْ: وَلَدٌ صَغِيرٌ، البِنْتُ الصَّغِيرَةُ.'
    explication: النَّعْتُ يَتْبَعُ مَنْعُوتَهُ فِي الإِعْرَابِ وَالتَّعْرِيفِ وَالتَّأْنِيثِ وَالعَدَدِ.
  - id: naat-11
    difficulte: 3
    enonce: 'اِخْتَرِ النَّعْتَ المُنَاسِبَ: كَافَأَ المُدِيرُ التِّلْمِيذَيْنِ ... (المُتَفَوِّقَانِ / المُتَفَوِّقَيْنِ / المُتَفَوِّقِينَ)'
    reponses:
    - المُتَفَوِّقَيْنِ
    erreurs:
      المُتَفَوِّقَانِ: خطأ في مطابقة النعت للمنعوت
      المُتَفَوِّقِينَ: خطأ في مطابقة النعت للمنعوت
    indice: المَنْعُوتُ مُثَنًّى مَنْصُوبٌ بِاليَاءِ.
    explication: 'نَقُولُ: كَافَأَ المُدِيرُ التِّلْمِيذَيْنِ المُتَفَوِّقَيْنِ.'
  - id: naat-12
    difficulte: 3
    enonce: 'اِخْتَرِ النَّعْتَ المُنَاسِبَ: هَؤُلَاءِ مُعَلِّمُونَ ... (مُخْلِصِينَ / مُخْلِصٌ / مُخْلِصُونَ)'
    reponses:
    - مُخْلِصُونَ
    erreurs:
      مُخْلِصِينَ: خطأ في مطابقة النعت للمنعوت
      مُخْلِصٌ: خطأ في مطابقة النعت للمنعوت
    indice: المَنْعُوتُ جَمْعُ مُذَكَّرٍ سَالِمٌ مَرْفُوعٌ.
    explication: 'نَقُولُ: هَؤُلَاءِ مُعَلِّمُونَ مُخْلِصُونَ.'
  - id: naat-13
    difficulte: 3
    enonce: 'مَا النَّعْتُ فِي: قَرَأْتُ الكِتَابَ الجَدِيدَ فِي المَكْتَبَةِ؟ (الكِتَابَ / المَكْتَبَةِ / الجَدِيدَ)'
    reponses:
    - الجَدِيدَ
    erreurs:
      الكِتَابَ: خلط بين النعت والمنعوت
      المَكْتَبَةِ: خلط بين النعت والمنعوت
    indice: أَيُّ كَلِمَةٍ تَصِفُ الكِتَابَ؟
    explication: النَّعْتُ «الجَدِيدَ»، وَهُوَ مَنْصُوبٌ مِثْلُ «الكِتَابَ».
- notion: الحال
  exercices:
  - id: hal-1
    difficulte: 1
    enonce: 'مَا الحَالُ فِي: جَاءَ التِّلْمِيذُ مُبْتَسِمًا؟ (التِّلْمِيذُ / جَاءَ / مُبْتَسِمًا)'
    reponses:
    - مُبْتَسِمًا
    erreurs:
      التِّلْمِيذُ: خلط بين الحال وصاحبه
      جَاءَ: خلط بين الفعل والحال
    indice: 'الحَالُ يُبَيِّنُ الهَيْئَةَ: كَيْفَ جَاءَ التِّلْمِيذُ؟'
    explication: 'الحَالُ هُوَ «مُبْتَسِمًا»: يُبَيِّنُ هَيْئَةَ التِّلْمِيذِ، وَهُوَ مَنْصُوبٌ.'
  - id: hal-2
    difficulte: 2
    enonce: بِأَيِّ سُؤَالٍ نَجِدُ الحَالَ؟ (مَتَى؟ / كَيْفَ؟ / أَيْنَ؟)
    reponses:
    - كَيْفَ؟
    erreurs:
      مَتَى؟: خلط بين الحال والظرف
      أَيْنَ؟: خلط بين الحال والظرف
    indice: الحَالُ يَصِفُ هَيْئَةَ صَاحِبِهِ.
    explication: 'نَجِدُ الحَالَ بِالسُّؤَالِ «كَيْفَ؟»: جَاءَ التِّلْمِيذُ مُبْتَسِمًا ← كَيْفَ جَاءَ؟ مُبْتَسِمًا.'
  - id: hal-3
    difficulte: 3
    enonce: 'اِخْتَرِ الحَالَ المُنَاسِبَ: رَجَعَ الجُنُودُ ... (مُنْتَصِرُونَ / المُنْتَصِرُونَ / مُنْتَصِرِينَ)'
    reponses:
    - مُنْتَصِرِينَ
    erreurs:
      مُنْتَصِرُونَ: نسيان نصب الحال
      المُنْتَصِرُونَ: الحال لا يكون معرفة
    indice: الحَالُ نَكِرَةٌ مَنْصُوبَةٌ، وَجَمْعُ المُذَكَّرِ السَّالِمُ يُنْصَبُ بِاليَاءِ.
    explication: 'نَقُولُ «رَجَعَ الجُنُودُ مُنْتَصِرِينَ»: حَالٌ مَنْصُوبٌ بِاليَاءِ لِأَنَّهُ جَمْعُ مُذَكَّرٍ سَالِمٌ.'
  - id: hal-4
    difficulte: 1
    enonce: 'مَا الحَالُ فِي: رَجَعَ الطِّفْلُ فَرِحًا؟ (رَجَعَ / فَرِحًا / الطِّفْلُ)'
    reponses:
    - فَرِحًا
    erreurs:
      رَجَعَ: خلط بين الحال وغيره
      الطِّفْلُ: خلط بين الحال وغيره
    indice: 'الحَالُ يُجِيبُ عَنْ سُؤَالِ: كَيْفَ؟'
    explication: 'الحَالُ «فَرِحًا»: كَيْفَ رَجَعَ الطِّفْلُ؟ فَرِحًا.'
  - id: hal-5
    difficulte: 1
    enonce: 'مَا الحَالُ فِي: دَخَلَ التِّلْمِيذُ القِسْمَ مُسْرِعًا؟ (القِسْمَ / مُسْرِعًا / التِّلْمِيذُ)'
    reponses:
    - مُسْرِعًا
    erreurs:
      القِسْمَ: خلط بين الحال والمفعول به
      التِّلْمِيذُ: خلط بين الحال والمفعول به
    indice: كَيْفَ دَخَلَ التِّلْمِيذُ؟
    explication: الحَالُ «مُسْرِعًا»؛ أَمَّا «القِسْمَ» فَمَفْعُولٌ بِهِ.
  - id: hal-6
    difficulte: 1
    enonce: مَا حُكْمُ الحَالِ؟ (مَرْفُوعٌ / مَنْصُوبٌ / مَجْرُورٌ)
    reponses:
    - مَنْصُوبٌ
    erreurs:
      مَرْفُوعٌ: خطأ في حكم الحال
      مَجْرُورٌ: خطأ في حكم الحال
    indice: 'قَارِنْ: جَاءَ الوَلَدُ ضَاحِكًا.'
    explication: الحَالُ مَنْصُوبٌ دَائِمًا.
  - id: hal-7
    difficulte: 2
    enonce: 'اِخْتَرِ الحَالَ المُنَاسِبَ: نَامَ الطِّفْلُ ... (هَادِئٌ / هَادِئًا / هَادِئٍ)'
    reponses:
    - هَادِئًا
    erreurs:
      هَادِئٌ: خطأ في إعراب الحال
      هَادِئٍ: خطأ في إعراب الحال
    indice: الحَالُ مَنْصُوبٌ.
    explication: 'نَقُولُ: نَامَ الطِّفْلُ هَادِئًا.'
  - id: hal-8
    difficulte: 2
    enonce: 'اِخْتَرِ الحَالَ المُنَاسِبَ: عَادَتِ البِنْتُ مِنَ المَدْرَسَةِ ... (مُتْعَبٌ / مُتْعَبَةً / مُتْعَبًا)'
    reponses:
    - مُتْعَبَةً
    erreurs:
      مُتْعَبٌ: خطأ في مطابقة الحال
      مُتْعَبًا: خطأ في مطابقة الحال
    indice: صَاحِبُ الحَالِ مُؤَنَّثٌ.
    explication: 'نَقُولُ: عَادَتِ البِنْتُ مُتْعَبَةً.'
  - id: hal-9
    difficulte: 2
    enonce: 'مَا صَاحِبُ الحَالِ فِي: أَقْبَلَ الفَارِسُ مُبْتَسِمًا؟ (الفَارِسُ / مُبْتَسِمًا / أَقْبَلَ)'
    reponses:
    - الفَارِسُ
    erreurs:
      مُبْتَسِمًا: خلط بين الحال وصاحبه
      أَقْبَلَ: خلط بين الحال وصاحبه
    indice: صَاحِبُ الحَالِ هُوَ الاِسْمُ الَّذِي يُبَيِّنُ الحَالُ هَيْئَتَهُ.
    explication: صَاحِبُ الحَالِ «الفَارِسُ»، وَالحَالُ «مُبْتَسِمًا».
  - id: hal-10
    difficulte: 2
    enonce: أَيُّ جُمْلَةٍ فِيهَا حَالٌ؟ (جَاءَ الوَلَدُ ضَاحِكًا / جَاءَ الوَلَدُ الضَّاحِكُ / جَاءَ الوَلَدُ صَبَاحًا)
    reponses:
    - جَاءَ الوَلَدُ ضَاحِكًا
    erreurs:
      جَاءَ الوَلَدُ الضَّاحِكُ: خلط بين الحال والنعت والظرف
      جَاءَ الوَلَدُ صَبَاحًا: خلط بين الحال والنعت والظرف
    indice: الحَالُ نَكِرَةٌ مَنْصُوبَةٌ تُجِيبُ عَنْ «كَيْفَ؟».
    explication: «ضَاحِكًا» حَالٌ؛ «الضَّاحِكُ» نَعْتٌ، وَ«صَبَاحًا» ظَرْفُ زَمَانٍ.
  - id: hal-11
    difficulte: 3
    enonce: 'اِخْتَرِ الحَالَ المُنَاسِبَ: خَرَجَ اللَّاعِبُونَ مِنَ المَلْعَبِ ... (فَائِزُونَ / فَائِزِينَ / فَائِزَانِ)'
    reponses:
    - فَائِزِينَ
    erreurs:
      فَائِزُونَ: خطأ في إعراب الحال
      فَائِزَانِ: خطأ في إعراب الحال
    indice: الحَالُ مَنْصُوبٌ، وَجَمْعُ المُذَكَّرِ السَّالِمِ يُنْصَبُ بِاليَاءِ.
    explication: 'نَقُولُ: خَرَجَ اللَّاعِبُونَ فَائِزِينَ.'
  - id: hal-12
    difficulte: 3
    enonce: 'اِخْتَرِ الحَالَ المُنَاسِبَ: وَصَلَ الضَّيْفَانِ ... (مُتَأَخِّرَانِ / مُتَأَخِّرِينَ / مُتَأَخِّرَيْنِ)'
    reponses:
    - مُتَأَخِّرَيْنِ
    erreurs:
      مُتَأَخِّرَانِ: خطأ في إعراب الحال
      مُتَأَخِّرِينَ: خطأ في إعراب الحال
    indice: الحَالُ مَنْصُوبٌ، وَالمُثَنَّى يُنْصَبُ بِاليَاءِ.
    explication: 'نَقُولُ: وَصَلَ الضَّيْفَانِ مُتَأَخِّرَيْنِ.'
  - id: hal-13
    difficulte: 3
    enonce: هَلِ الحَالُ نَكِرَةٌ أَمْ مَعْرِفَةٌ فِي الغَالِبِ؟ (نَكِرَةٌ / مَعْرِفَةٌ)
    reponses:
    - نَكِرَةٌ
    erreurs:
      مَعْرِفَةٌ: خلط بين الحال والنعت
    indice: 'قَارِنْ: جَاءَ الوَلَدُ ضَاحِكًا.'
    explication: الحَالُ نَكِرَةٌ فِي الغَالِبِ، وَصَاحِبُهُ مَعْرِفَةٌ.
- notion: الفعل اللازم والفعل المتعدي
  exercices:
  - id: lazim-1
    difficulte: 1
    enonce: هَلِ الفِعْلُ فِي «نَامَ الطِّفْلُ» لَازِمٌ أَمْ مُتَعَدٍّ؟ (لَازِمٌ / مُتَعَدٍّ)
    reponses:
    - لَازِمٌ
    erreurs:
      مُتَعَدٍّ: خلط بين اللازم والمتعدي
    indice: هَلْ يَحْتَاجُ الفِعْلُ «نَامَ» إِلَى مَفْعُولٍ بِهِ؟
    explication: '«نَامَ» فِعْلٌ لَازِمٌ: يَكْتَفِي بِفَاعِلِهِ وَلَا يَحْتَاجُ إِلَى مَفْعُولٍ بِهِ.'
  - id: lazim-2
    difficulte: 2
    enonce: هَلِ الفِعْلُ فِي «فَتَحَ أَحْمَدُ النَّافِذَةَ» لَازِمٌ أَمْ مُتَعَدٍّ؟ (لَازِمٌ / مُتَعَدٍّ)
    reponses:
    - مُتَعَدٍّ
    erreurs:
      لَازِمٌ: خلط بين اللازم والمتعدي
    indice: هَلْ فِي الجُمْلَةِ مَفْعُولٌ بِهِ؟
    explication: '«فَتَحَ» فِعْلٌ مُتَعَدٍّ: نَصَبَ مَفْعُولًا بِهِ هُوَ «النَّافِذَةَ».'
  - id: lazim-3
    difficulte: 3
    enonce: 'اِخْتَرِ الفِعْلَ اللَّازِمَ: (أَكَلَ / جَلَسَ / شَرِبَ)'
    reponses:
    - جَلَسَ
    erreurs:
      أَكَلَ: خلط بين اللازم والمتعدي
      شَرِبَ: خلط بين اللازم والمتعدي
    indice: 'نَقُولُ «أَكَلَ الخُبْزَ» وَ«شَرِبَ المَاءَ»: وَأَيُّ فِعْلٍ لَا يَحْتَاجُ إِلَى مَفْعُولٍ بِهِ؟'
    explication: '«جَلَسَ» فِعْلٌ لَازِمٌ: نَقُولُ «جَلَسَ الوَلَدُ» دُونَ مَفْعُولٍ بِهِ.'
  - id: lazim-4
    difficulte: 1
    enonce: هَلِ الفِعْلُ فِي «جَلَسَ الضَّيْفُ» لَازِمٌ أَمْ مُتَعَدٍّ؟ (لَازِمٌ / مُتَعَدٍّ)
    reponses:
    - لَازِمٌ
    erreurs:
      مُتَعَدٍّ: خلط بين اللازم والمتعدي
    indice: هَلْ يَحْتَاجُ الفِعْلُ إِلَى مَفْعُولٍ بِهِ؟
    explication: '«جَلَسَ» فِعْلٌ لَازِمٌ: يَكْتَفِي بِفَاعِلِهِ.'
  - id: lazim-5
    difficulte: 1
    enonce: هَلِ الفِعْلُ فِي «كَتَبَ التِّلْمِيذُ الدَّرْسَ» لَازِمٌ أَمْ مُتَعَدٍّ؟ (لَازِمٌ / مُتَعَدٍّ)
    reponses:
    - مُتَعَدٍّ
    erreurs:
      لَازِمٌ: خلط بين اللازم والمتعدي
    indice: هَلْ فِي الجُمْلَةِ مَفْعُولٌ بِهِ؟
    explication: '«كَتَبَ» فِعْلٌ مُتَعَدٍّ: نَصَبَ مَفْعُولًا بِهِ «الدَّرْسَ».'
  - id: lazim-6
    difficulte: 1
    enonce: 'اِخْتَرِ الفِعْلَ المُتَعَدِّيَ: (نَامَ / ضَحِكَ / رَكِبَ)'
    reponses:
    - رَكِبَ
    erreurs:
      نَامَ: خلط بين اللازم والمتعدي
      ضَحِكَ: خلط بين اللازم والمتعدي
    indice: أَيُّ فِعْلٍ يَحْتَاجُ إِلَى شَيْءٍ يَقَعُ عَلَيْهِ؟
    explication: '«رَكِبَ» مُتَعَدٍّ: رَكِبَ الوَلَدُ الدَّرَّاجَةَ.'
  - id: lazim-7
    difficulte: 2
    enonce: هَلِ الفِعْلُ فِي «ذَهَبَ أَبِي إِلَى العَمَلِ» لَازِمٌ أَمْ مُتَعَدٍّ؟ (لَازِمٌ / مُتَعَدٍّ)
    reponses:
    - لَازِمٌ
    erreurs:
      مُتَعَدٍّ: خلط بين اللازم والمتعدي
    indice: «العَمَلِ» اسْمٌ مَجْرُورٌ، لَيْسَ مَفْعُولًا بِهِ.
    explication: «ذَهَبَ» فِعْلٌ لَازِمٌ؛ «إِلَى العَمَلِ» جَارٌّ وَمَجْرُورٌ.
  - id: lazim-8
    difficulte: 2
    enonce: 'اِخْتَرِ الفِعْلَ اللَّازِمَ: (فَهِمَ / حَمَلَ / فَرِحَ)'
    reponses:
    - فَرِحَ
    erreurs:
      فَهِمَ: خلط بين اللازم والمتعدي
      حَمَلَ: خلط بين اللازم والمتعدي
    indice: أَيُّ فِعْلٍ يَكْتَفِي بِفَاعِلِهِ؟
    explication: '«فَرِحَ» لَازِمٌ: فَرِحَ الطِّفْلُ.'
  - id: lazim-9
    difficulte: 2
    enonce: 'أَكْمِلْ بِمَفْعُولٍ بِهِ: شَرِبَ العَطْشَانُ ... (المَاءَ / فِي الكَأْسِ / مُسْرِعًا)'
    reponses:
    - المَاءَ
    erreurs:
      فِي الكَأْسِ: خلط بين المفعول به وغيره
      مُسْرِعًا: خلط بين المفعول به وغيره
    indice: الفِعْلُ المُتَعَدِّي يَنْصِبُ مَفْعُولًا بِهِ.
    explication: 'نَقُولُ: شَرِبَ العَطْشَانُ المَاءَ.'
  - id: lazim-10
    difficulte: 2
    enonce: 'كَمْ مَفْعُولًا بِهِ فِي: أَعْطَى الأَبُ ابْنَهُ هَدِيَّةً؟ (وَاحِدٌ / اثْنَانِ / لَا شَيْءَ)'
    reponses:
    - اثْنَانِ
    erreurs:
      وَاحِدٌ: خطأ في عدد المفاعيل
      لَا شَيْءَ: خطأ في عدد المفاعيل
    indice: مَنْ أَعْطَى؟ مَاذَا أَعْطَى؟
    explication: '«أَعْطَى» يَنْصِبُ مَفْعُولَيْنِ: «ابْنَ» وَ«هَدِيَّةً».'
  - id: lazim-11
    difficulte: 3
    enonce: كَيْفَ نَجْعَلُ «خَرَجَ» مُتَعَدِّيًا؟ (أَخْرَجَ / خَارِجٌ / خُرُوجٌ)
    reponses:
    - أَخْرَجَ
    erreurs:
      خَارِجٌ: خلط بين اللازم والمتعدي
      خُرُوجٌ: خلط بين اللازم والمتعدي
    indice: نُضِيفُ هَمْزَةً فِي أَوَّلِ الفِعْلِ.
    explication: '«أَخْرَجَ» مُتَعَدٍّ: أَخْرَجَ الوَلَدُ الكُرَةَ.'
  - id: lazim-12
    difficulte: 3
    enonce: هَلِ الفِعْلُ «اسْتَيْقَظَ» لَازِمٌ أَمْ مُتَعَدٍّ؟ (لَازِمٌ / مُتَعَدٍّ)
    reponses:
    - لَازِمٌ
    erreurs:
      مُتَعَدٍّ: خلط بين اللازم والمتعدي
    indice: 'نَقُولُ: اسْتَيْقَظَ الطِّفْلُ.'
    explication: «اسْتَيْقَظَ» فِعْلٌ لَازِمٌ.
  - id: lazim-13
    difficulte: 3
    enonce: هَلِ الفِعْلُ «سَاعَدَ» لَازِمٌ أَمْ مُتَعَدٍّ؟ (لَازِمٌ / مُتَعَدٍّ)
    reponses:
    - مُتَعَدٍّ
    erreurs:
      لَازِمٌ: خلط بين اللازم والمتعدي
    indice: 'نَقُولُ: سَاعَدَ الوَلَدُ جَدَّهُ.'
    explication: '«سَاعَدَ» فِعْلٌ مُتَعَدٍّ: يَنْصِبُ مَفْعُولًا بِهِ.'
- notion: نائب الفاعل
  exercices:
  - id: naib-1
    difficulte: 1
    enonce: 'مَا نَائِبُ الفَاعِلِ فِي: كُسِرَ الزُّجَاجُ؟ (كُسِرَ / الزُّجَاجُ)'
    reponses:
    - الزُّجَاجُ
    erreurs:
      كُسِرَ: خلط بين الفعل ونائب الفاعل
    indice: نَائِبُ الفَاعِلِ اسْمٌ مَرْفُوعٌ يَأْتِي بَعْدَ الفِعْلِ المَبْنِيِّ لِلْمَجْهُولِ.
    explication: نَائِبُ الفَاعِلِ هُوَ «الزُّجَاجُ»، مَرْفُوعٌ بِالضَّمَّةِ.
  - id: naib-2
    difficulte: 2
    enonce: 'مَا نَائِبُ الفَاعِلِ فِي: كُتِبَ الدَّرْسُ عَلَى السَّبُّورَةِ؟ (السَّبُّورَةِ / كُتِبَ / الدَّرْسُ)'
    reponses:
    - الدَّرْسُ
    erreurs:
      السَّبُّورَةِ: خلط بين نائب الفاعل والاسم المجرور
      كُتِبَ: خلط بين الفعل ونائب الفاعل
    indice: مَا الَّذِي كُتِبَ؟
    explication: نَائِبُ الفَاعِلِ هُوَ «الدَّرْسُ». أَمَّا «السَّبُّورَةِ» فَاسْمٌ مَجْرُورٌ بِـ«عَلَى».
  - id: naib-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'حَوِّلْ إِلَى المَبْنِيِّ لِلْمَجْهُولِ: فَتَحَ الحَارِسُ البَابَ. (فُتِحَ البَابَ / فَتَحَ البَابُ / فُتِحَ البَابُ)'
    reponses:
    - فُتِحَ البَابُ
    erreurs:
      فُتِحَ البَابَ: نسيان رفع نائب الفاعل
      فَتَحَ البَابُ: عدم بناء الفعل للمجهول
    indice: نَضُمُّ أَوَّلَ الفِعْلِ وَنَكْسِرُ مَا قَبْلَ آخِرِهِ، وَيُرْفَعُ المَفْعُولُ بِهِ.
    explication: 'نَقُولُ «فُتِحَ البَابُ»: الفِعْلُ مَبْنِيٌّ لِلْمَجْهُولِ، وَ«البَابُ» نَائِبُ فَاعِلٍ مَرْفُوعٌ.'
  - id: naib-4
    difficulte: 1
    enonce: 'مَا نَائِبُ الفَاعِلِ فِي: فُتِحَ البَابُ؟ (فُتِحَ / البَابُ)'
    reponses:
    - البَابُ
    erreurs:
      فُتِحَ: خلط بين الفعل ونائب الفاعل
    indice: 'الفِعْلُ مَبْنِيٌّ لِلْمَجْهُولِ: مَا الَّذِي فُتِحَ؟'
    explication: نَائِبُ الفَاعِلِ «البَابُ»، وَهُوَ مَرْفُوعٌ.
  - id: naib-5
    difficulte: 1
    enonce: 'مَا نَائِبُ الفَاعِلِ فِي: سُرِقَتِ الحَقِيبَةُ؟ (الحَقِيبَةُ / سُرِقَتِ)'
    reponses:
    - الحَقِيبَةُ
    erreurs:
      سُرِقَتِ: خلط بين الفعل ونائب الفاعل
    indice: مَا الَّذِي سُرِقَ؟
    explication: نَائِبُ الفَاعِلِ «الحَقِيبَةُ».
  - id: naib-6
    difficulte: 1
    enonce: مَا حُكْمُ نَائِبِ الفَاعِلِ؟ (مَنْصُوبٌ / مَرْفُوعٌ / مَجْرُورٌ)
    reponses:
    - مَرْفُوعٌ
    erreurs:
      مَنْصُوبٌ: خطأ في حكم نائب الفاعل
      مَجْرُورٌ: خطأ في حكم نائب الفاعل
    indice: نَائِبُ الفَاعِلِ يَأْخُذُ حُكْمَ الفَاعِلِ.
    explication: نَائِبُ الفَاعِلِ مَرْفُوعٌ مِثْلُ الفَاعِلِ.
  - id: naib-7
    difficulte: 2
    enonce: 'اِبْنِ لِلْمَجْهُولِ: شَرِبَ الوَلَدُ الحَلِيبَ. (شُرِبَ الحَلِيبُ / شَرِبَ الحَلِيبُ / شُرِبَ الحَلِيبَ)'
    reponses:
    - شُرِبَ الحَلِيبُ
    erreurs:
      شَرِبَ الحَلِيبُ: خطأ في البناء للمجهول
      شُرِبَ الحَلِيبَ: خطأ في البناء للمجهول
    indice: نَضُمُّ أَوَّلَ الفِعْلِ وَنَكْسِرُ مَا قَبْلَ آخِرِهِ، وَيُرْفَعُ المَفْعُولُ.
    explication: 'نَقُولُ: شُرِبَ الحَلِيبُ.'
  - id: naib-8
    difficulte: 2
    enonce: 'اِبْنِ لِلْمَجْهُولِ: يَكْتُبُ التِّلْمِيذُ الدَّرْسَ. (يَكْتُبُ الدَّرْسُ / يُكْتَبُ الدَّرْسُ / كُتِبَ الدَّرْسُ)'
    reponses:
    - يُكْتَبُ الدَّرْسُ
    erreurs:
      يَكْتُبُ الدَّرْسُ: خطأ في البناء للمجهول
      كُتِبَ الدَّرْسُ: خطأ في البناء للمجهول
    indice: 'المُضَارِعُ: نَضُمُّ أَوَّلَهُ وَنَفْتَحُ مَا قَبْلَ آخِرِهِ.'
    explication: 'نَقُولُ: يُكْتَبُ الدَّرْسُ.'
  - id: naib-9
    difficulte: 2
    enonce: أَيُّ فِعْلٍ مَبْنِيٌّ لِلْمَجْهُولِ؟ (كَسَرَ / كُسِرَ / يَكْسِرُ)
    reponses:
    - كُسِرَ
    erreurs:
      كَسَرَ: خلط بين المبني للمعلوم والمجهول
      يَكْسِرُ: خلط بين المبني للمعلوم والمجهول
    indice: الفِعْلُ المَبْنِيُّ لِلْمَجْهُولِ مَضْمُومُ الأَوَّلِ.
    explication: «كُسِرَ» مَبْنِيٌّ لِلْمَجْهُولِ.
  - id: naib-10
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: زُرِعَتِ ... (الأَشْجَارَ / الأَشْجَارُ / الأَشْجَارِ)'
    reponses:
    - الأَشْجَارُ
    erreurs:
      الأَشْجَارَ: خطأ في إعراب نائب الفاعل
      الأَشْجَارِ: خطأ في إعراب نائب الفاعل
    indice: نَائِبُ الفَاعِلِ مَرْفُوعٌ.
    explication: 'نَقُولُ: زُرِعَتِ الأَشْجَارُ.'
  - id: naib-11
    difficulte: 3
    enonce: 'مَا نَائِبُ الفَاعِلِ فِي: كُوفِئَ المُتَفَوِّقُونَ؟ (المُتَفَوِّقُونَ / كُوفِئَ)'
    reponses:
    - المُتَفَوِّقُونَ
    erreurs:
      كُوفِئَ: خلط بين الفعل ونائب الفاعل
    indice: مَنِ الَّذِي كُوفِئَ؟
    explication: نَائِبُ الفَاعِلِ «المُتَفَوِّقُونَ»، مَرْفُوعٌ بِالوَاوِ.
  - id: naib-12
    difficulte: 3
    enonce: 'اِبْنِ لِلْمَجْهُولِ: بَاعَ التَّاجِرُ البَضَائِعَ. (بِيعَتِ البَضَائِعُ / بَاعَتِ البَضَائِعُ / بُيِعَتِ البَضَائِعُ)'
    reponses:
    - بِيعَتِ البَضَائِعُ
    erreurs:
      بَاعَتِ البَضَائِعُ: خطأ في البناء للمجهول
      بُيِعَتِ البَضَائِعُ: خطأ في البناء للمجهول
    indice: 'الأَجْوَفُ: بَاعَ ← بِيعَ.'
    explication: 'نَقُولُ: بِيعَتِ البَضَائِعُ.'
  - id: naib-13
    difficulte: 3
    enonce: لِمَاذَا نَبْنِي الفِعْلَ لِلْمَجْهُولِ؟ (لِأَنَّ الفَاعِلَ مَجْهُولٌ أَوْ لَا نُرِيدُ ذِكْرَهُ / لِأَنَّ المَفْعُولَ مَجْهُولٌ / لِأَنَّ الفِعْلَ لَازِمٌ)
    reponses:
    - لِأَنَّ الفَاعِلَ مَجْهُولٌ أَوْ لَا نُرِيدُ ذِكْرَهُ
    erreurs:
      لِأَنَّ المَفْعُولَ مَجْهُولٌ: خطأ في معنى البناء للمجهول
      لِأَنَّ الفِعْلَ لَازِمٌ: خطأ في معنى البناء للمجهول
    indice: 'مِثَالٌ: سُرِقَتِ الحَقِيبَةُ (لَا نَعْرِفُ السَّارِقَ).'
    explication: نَبْنِي الفِعْلَ لِلْمَجْهُولِ حِينَ يَكُونُ الفَاعِلُ مَجْهُولًا أَوْ لَا نُرِيدُ ذِكْرَهُ.
- notion: المفعول المطلق
  exercices:
  - id: mutlaq-1
    difficulte: 1
    enonce: 'مَا المَفْعُولُ المُطْلَقُ فِي: فَرِحَ الطِّفْلُ فَرَحًا كَبِيرًا؟ (الطِّفْلُ / فَرَحًا / كَبِيرًا)'
    reponses:
    - فَرَحًا
    erreurs:
      الطِّفْلُ: خلط بين الفاعل والمفعول المطلق
      كَبِيرًا: خلط بين المفعول المطلق ونعته
    indice: 'المَفْعُولُ المُطْلَقُ مَصْدَرٌ مِنْ لَفْظِ الفِعْلِ: فَرِحَ... ؟'
    explication: 'المَفْعُولُ المُطْلَقُ هُوَ «فَرَحًا»: مَصْدَرُ الفِعْلِ «فَرِحَ»، مَنْصُوبٌ.'
  - id: mutlaq-2
    difficulte: 2
    enonce: 'اِخْتَرِ المَفْعُولَ المُطْلَقَ المُنَاسِبَ: ضَحِكَ الوَلَدُ ... (فَرَحًا / ضَحِكًا / سَرِيعًا)'
    reponses:
    - ضَحِكًا
    erreurs:
      فَرَحًا: المفعول المطلق من لفظ الفعل
      سَرِيعًا: المفعول المطلق مصدر الفعل
    indice: المَفْعُولُ المُطْلَقُ مَصْدَرٌ مِنْ لَفْظِ الفِعْلِ «ضَحِكَ».
    explication: 'نَقُولُ «ضَحِكَ الوَلَدُ ضَحِكًا»: «ضَحِكًا» مَصْدَرُ «ضَحِكَ».'
  - id: mutlaq-3
    difficulte: 3
    enonce: 'مَاذَا يُبَيِّنُ المَفْعُولُ المُطْلَقُ «قَفْزَتَيْنِ» فِي: قَفَزَ اللَّاعِبُ قَفْزَتَيْنِ؟ (النَّوْعَ / التَّوْكِيدَ / العَدَدَ)'
    reponses:
    - العَدَدَ
    erreurs:
      النَّوْعَ: خلط بين بيان العدد وبيان النوع
      التَّوْكِيدَ: خلط بين بيان العدد والتوكيد
    indice: كَمْ مَرَّةً قَفَزَ اللَّاعِبُ؟
    explication: '«قَفْزَتَيْنِ» مَفْعُولٌ مُطْلَقٌ يُبَيِّنُ العَدَدَ: قَفَزَ مَرَّتَيْنِ.'
  - id: mutlaq-4
    difficulte: 1
    enonce: 'مَا المَفْعُولُ المُطْلَقُ فِي: نَامَ الطِّفْلُ نَوْمًا عَمِيقًا؟ (الطِّفْلُ / نَوْمًا / عَمِيقًا)'
    reponses:
    - نَوْمًا
    erreurs:
      الطِّفْلُ: خلط بين المفعول المطلق وغيره
      عَمِيقًا: خلط بين المفعول المطلق وغيره
    indice: المَفْعُولُ المُطْلَقُ مَصْدَرٌ مِنْ لَفْظِ الفِعْلِ.
    explication: 'المَفْعُولُ المُطْلَقُ «نَوْمًا»: مَصْدَرُ «نَامَ».'
  - id: mutlaq-5
    difficulte: 1
    enonce: 'مَا المَفْعُولُ المُطْلَقُ فِي: جَرَى العَدَّاءُ جَرْيًا سَرِيعًا؟ (جَرْيًا / العَدَّاءُ / سَرِيعًا)'
    reponses:
    - جَرْيًا
    erreurs:
      العَدَّاءُ: خلط بين المفعول المطلق وغيره
      سَرِيعًا: خلط بين المفعول المطلق وغيره
    indice: اِبْحَثْ عَنْ مَصْدَرِ الفِعْلِ «جَرَى».
    explication: المَفْعُولُ المُطْلَقُ «جَرْيًا».
  - id: mutlaq-6
    difficulte: 1
    enonce: مَا حُكْمُ المَفْعُولِ المُطْلَقِ؟ (مَنْصُوبٌ / مَرْفُوعٌ / مَجْرُورٌ)
    reponses:
    - مَنْصُوبٌ
    erreurs:
      مَرْفُوعٌ: خطأ في حكم المفعول المطلق
      مَجْرُورٌ: خطأ في حكم المفعول المطلق
    indice: 'قَارِنْ: فَرِحْتُ فَرَحًا.'
    explication: المَفْعُولُ المُطْلَقُ مَنْصُوبٌ.
  - id: mutlaq-7
    difficulte: 2
    enonce: 'اِخْتَرِ المَفْعُولَ المُطْلَقَ المُنَاسِبَ: قَرَأْتُ الكِتَابَ ... (قِرَاءَةً / قَارِئًا / مَقْرُوءًا)'
    reponses:
    - قِرَاءَةً
    erreurs:
      قَارِئًا: خلط بين المصدر والمشتقات
      مَقْرُوءًا: خلط بين المصدر والمشتقات
    indice: المَفْعُولُ المُطْلَقُ مَصْدَرُ الفِعْلِ.
    explication: 'نَقُولُ: قَرَأْتُ الكِتَابَ قِرَاءَةً؛ «قِرَاءَةً» مَصْدَرُ «قَرَأَ».'
  - id: mutlaq-8
    difficulte: 2
    enonce: 'اِخْتَرِ المَفْعُولَ المُطْلَقَ المُنَاسِبَ: احْتَرَمْتُ مُعَلِّمِي ... (احْتِرَامٌ / احْتِرَامًا / مُحْتَرَمًا)'
    reponses:
    - احْتِرَامًا
    erreurs:
      احْتِرَامٌ: خطأ في إعراب المفعول المطلق
      مُحْتَرَمًا: خطأ في إعراب المفعول المطلق
    indice: المَفْعُولُ المُطْلَقُ مَصْدَرٌ مَنْصُوبٌ.
    explication: 'نَقُولُ: احْتَرَمْتُ مُعَلِّمِي احْتِرَامًا كَبِيرًا.'
  - id: mutlaq-9
    difficulte: 2
    enonce: 'مَاذَا يُبَيِّنُ «صَبْرًا» فِي: صَبَرْتُ صَبْرًا؟ (يُؤَكِّدُ الفِعْلَ / يُبَيِّنُ النَّوْعَ / يُبَيِّنُ العَدَدَ)'
    reponses:
    - يُؤَكِّدُ الفِعْلَ
    erreurs:
      يُبَيِّنُ النَّوْعَ: خطأ في أنواع المفعول المطلق
      يُبَيِّنُ العَدَدَ: خطأ في أنواع المفعول المطلق
    indice: لَمْ يَأْتِ بَعْدَ المَصْدَرِ وَصْفٌ وَلَا عَدَدٌ.
    explication: «صَبْرًا» مَفْعُولٌ مُطْلَقٌ مُؤَكِّدٌ لِلْفِعْلِ.
  - id: mutlaq-10
    difficulte: 2
    enonce: 'مَاذَا يُبَيِّنُ «جُلُوسَ» فِي: جَلَسْتُ جُلُوسَ المُؤَدَّبِ؟ (يُؤَكِّدُ الفِعْلَ / يُبَيِّنُ النَّوْعَ / يُبَيِّنُ العَدَدَ)'
    reponses:
    - يُبَيِّنُ النَّوْعَ
    erreurs:
      يُؤَكِّدُ الفِعْلَ: خطأ في أنواع المفعول المطلق
      يُبَيِّنُ العَدَدَ: خطأ في أنواع المفعول المطلق
    indice: كَيْفَ كَانَ الجُلُوسُ؟
    explication: «جُلُوسَ المُؤَدَّبِ» يُبَيِّنُ نَوْعَ الجُلُوسِ.
  - id: mutlaq-11
    difficulte: 3
    enonce: 'مَاذَا يُبَيِّنُ «ضَرْبَتَيْنِ» فِي: ضَرَبَ الحَارِسُ الجَرَسَ ضَرْبَتَيْنِ؟ (يُؤَكِّدُ الفِعْلَ / يُبَيِّنُ النَّوْعَ / يُبَيِّنُ العَدَدَ)'
    reponses:
    - يُبَيِّنُ العَدَدَ
    erreurs:
      يُؤَكِّدُ الفِعْلَ: خطأ في أنواع المفعول المطلق
      يُبَيِّنُ النَّوْعَ: خطأ في أنواع المفعول المطلق
    indice: كَمْ مَرَّةً ضَرَبَ؟
    explication: «ضَرْبَتَيْنِ» يُبَيِّنُ عَدَدَ مَرَّاتِ الفِعْلِ.
  - id: mutlaq-12
    difficulte: 3
    enonce: 'مَا المَفْعُولُ المُطْلَقُ فِي: اجْتَهَدَ التِّلْمِيذُ اجْتِهَادًا كَبِيرًا فِي دُرُوسِهِ؟ (دُرُوسِهِ / اجْتِهَادًا / كَبِيرًا)'
    reponses:
    - اجْتِهَادًا
    erreurs:
      دُرُوسِهِ: خلط بين المفعول المطلق وغيره
      كَبِيرًا: خلط بين المفعول المطلق وغيره
    indice: مَا مَصْدَرُ «اجْتَهَدَ»؟
    explication: المَفْعُولُ المُطْلَقُ «اجْتِهَادًا»، وَ«كَبِيرًا» نَعْتٌ لَهُ.
  - id: mutlaq-13
    difficulte: 3
    enonce: أَيُّ جُمْلَةٍ فِيهَا مَفْعُولٌ مُطْلَقٌ؟ (كَتَبْتُ كِتَابَةً جَمِيلَةً / كَتَبْتُ كِتَابًا جَمِيلًا / كَتَبْتُ فِي الكِتَابِ)
    reponses:
    - كَتَبْتُ كِتَابَةً جَمِيلَةً
    erreurs:
      كَتَبْتُ كِتَابًا جَمِيلًا: خلط بين المفعول المطلق والمفعول به
      كَتَبْتُ فِي الكِتَابِ: خلط بين المفعول المطلق والمفعول به
    indice: «كِتَابَةً» مَصْدَرٌ، وَ«كِتَابًا» شَيْءٌ.
    explication: «كِتَابَةً» مَفْعُولٌ مُطْلَقٌ؛ أَمَّا «كِتَابًا» فَمَفْعُولٌ بِهِ.
- notion: المفعول لأجله
  exercices:
  - id: liajlih-1
    difficulte: 1
    enonce: 'مَا المَفْعُولُ لِأَجْلِهِ فِي: وَقَفَ التَّلَامِيذُ احْتِرَامًا لِلْمُعَلِّمِ؟ (التَّلَامِيذُ / لِلْمُعَلِّمِ / احْتِرَامًا)'
    reponses:
    - احْتِرَامًا
    erreurs:
      التَّلَامِيذُ: خلط بين الفاعل والمفعول لأجله
      لِلْمُعَلِّمِ: خلط بين الاسم المجرور والمفعول لأجله
    indice: 'اِسْأَلْ: لِمَاذَا وَقَفَ التَّلَامِيذُ؟'
    explication: 'المَفْعُولُ لِأَجْلِهِ هُوَ «احْتِرَامًا»: يُبَيِّنُ سَبَبَ الوُقُوفِ، وَهُوَ مَصْدَرٌ مَنْصُوبٌ.'
  - id: liajlih-2
    difficulte: 2
    enonce: بِأَيِّ سُؤَالٍ نَجِدُ المَفْعُولَ لِأَجْلِهِ؟ (كَيْفَ؟ / لِمَاذَا؟ / مَتَى؟)
    reponses:
    - لِمَاذَا؟
    erreurs:
      كَيْفَ؟: خلط بين المفعول لأجله والحال
      مَتَى؟: خلط بين المفعول لأجله والمفعول فيه
    indice: المَفْعُولُ لِأَجْلِهِ يُبَيِّنُ سَبَبَ الفِعْلِ.
    explication: نَجِدُ المَفْعُولَ لِأَجْلِهِ بِالسُّؤَالِ «لِمَاذَا؟».
  - id: liajlih-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'اِخْتَرِ المَفْعُولَ لِأَجْلِهِ المُنَاسِبَ: يَجْتَهِدُ التِّلْمِيذُ ... فِي النَّجَاحِ. (رَغْبَةٌ / رَاغِبٌ / رَغْبَةً)'
    reponses:
    - رَغْبَةً
    erreurs:
      رَغْبَةٌ: نسيان نصب المفعول لأجله
      رَاغِبٌ: المفعول لأجله مصدر
    indice: المَفْعُولُ لِأَجْلِهِ مَصْدَرٌ مَنْصُوبٌ.
    explication: 'نَقُولُ «يَجْتَهِدُ التِّلْمِيذُ رَغْبَةً فِي النَّجَاحِ»: «رَغْبَةً» مَصْدَرٌ مَنْصُوبٌ يُبَيِّنُ السَّبَبَ.'
  - id: liajlih-4
    difficulte: 1
    enonce: 'مَا المَفْعُولُ لِأَجْلِهِ فِي: دَرَسْتُ رَغْبَةً فِي النَّجَاحِ؟ (النَّجَاحِ / رَغْبَةً / دَرَسْتُ)'
    reponses:
    - رَغْبَةً
    erreurs:
      النَّجَاحِ: خلط بين المفعول لأجله وغيره
      دَرَسْتُ: خلط بين المفعول لأجله وغيره
    indice: لِمَاذَا دَرَسْتُ؟
    explication: 'المَفْعُولُ لِأَجْلِهِ «رَغْبَةً»: يُبَيِّنُ سَبَبَ الدِّرَاسَةِ.'
  - id: liajlih-5
    difficulte: 1
    enonce: 'مَا المَفْعُولُ لِأَجْلِهِ فِي: صَمَتَ التِّلْمِيذُ أَدَبًا؟ (التِّلْمِيذُ / صَمَتَ / أَدَبًا)'
    reponses:
    - أَدَبًا
    erreurs:
      التِّلْمِيذُ: خلط بين المفعول لأجله وغيره
      صَمَتَ: خلط بين المفعول لأجله وغيره
    indice: لِمَاذَا صَمَتَ التِّلْمِيذُ؟
    explication: المَفْعُولُ لِأَجْلِهِ «أَدَبًا».
  - id: liajlih-6
    difficulte: 1
    enonce: مَا حُكْمُ المَفْعُولِ لِأَجْلِهِ؟ (مَرْفُوعٌ / مَجْرُورٌ / مَنْصُوبٌ)
    reponses:
    - مَنْصُوبٌ
    erreurs:
      مَرْفُوعٌ: خطأ في حكم المفعول لأجله
      مَجْرُورٌ: خطأ في حكم المفعول لأجله
    indice: 'قَارِنْ: قُمْتُ احْتِرَامًا.'
    explication: المَفْعُولُ لِأَجْلِهِ مَنْصُوبٌ.
  - id: liajlih-7
    difficulte: 2
    enonce: 'اِخْتَرِ المَفْعُولَ لِأَجْلِهِ المُنَاسِبَ: تَصَدَّقَ الرَّجُلُ ... لِلْفُقَرَاءِ. (رَحْمَةً / رَحِيمٌ / رَحْمَةٌ)'
    reponses:
    - رَحْمَةً
    erreurs:
      رَحِيمٌ: خطأ في إعراب المفعول لأجله
      رَحْمَةٌ: خطأ في إعراب المفعول لأجله
    indice: المَفْعُولُ لِأَجْلِهِ مَصْدَرٌ مَنْصُوبٌ يُبَيِّنُ السَّبَبَ.
    explication: 'نَقُولُ: تَصَدَّقَ الرَّجُلُ رَحْمَةً لِلْفُقَرَاءِ.'
  - id: liajlih-8
    difficulte: 2
    enonce: 'اِخْتَرِ المَفْعُولَ لِأَجْلِهِ المُنَاسِبَ: أَسْرَعَ الوَلَدُ ... مِنَ المَطَرِ. (هَارِبًا / خَوْفًا / خَائِفٌ)'
    reponses:
    - خَوْفًا
    erreurs:
      هَارِبًا: خلط بين المفعول لأجله والحال
      خَائِفٌ: خلط بين المفعول لأجله والحال
    indice: المَفْعُولُ لِأَجْلِهِ مَصْدَرٌ، أَمَّا الحَالُ فَوَصْفٌ.
    explication: '«خَوْفًا» مَفْعُولٌ لِأَجْلِهِ: لِمَاذَا أَسْرَعَ؟ خَوْفًا.'
  - id: liajlih-9
    difficulte: 2
    enonce: 'المَفْعُولُ لِأَجْلِهِ يَكُونُ: (مَصْدَرًا / فِعْلًا / ضَمِيرًا)'
    reponses:
    - مَصْدَرًا
    erreurs:
      فِعْلًا: خطأ في تعريف المفعول لأجله
      ضَمِيرًا: خطأ في تعريف المفعول لأجله
    indice: 'مِثَالٌ: قُمْتُ احْتِرَامًا؛ «احْتِرَامًا» مَصْدَرُ «احْتَرَمَ».'
    explication: المَفْعُولُ لِأَجْلِهِ مَصْدَرٌ يُبَيِّنُ سَبَبَ الفِعْلِ.
  - id: liajlih-10
    difficulte: 2
    enonce: أَيُّ جُمْلَةٍ فِيهَا مَفْعُولٌ لِأَجْلِهِ؟ (عَادَ الوَلَدُ مَسْرُورًا / سَافَرْتُ طَلَبًا لِلْعِلْمِ / شَرِبْتُ المَاءَ)
    reponses:
    - سَافَرْتُ طَلَبًا لِلْعِلْمِ
    erreurs:
      عَادَ الوَلَدُ مَسْرُورًا: خلط بين المفعول لأجله وغيره
      شَرِبْتُ المَاءَ: خلط بين المفعول لأجله وغيره
    indice: اِبْحَثْ عَنْ مَصْدَرٍ يُجِيبُ عَنْ «لِمَاذَا؟».
    explication: '«طَلَبًا» مَفْعُولٌ لِأَجْلِهِ: لِمَاذَا سَافَرْتُ؟ طَلَبًا لِلْعِلْمِ.'
  - id: liajlih-11
    difficulte: 3
    enonce: 'مَا المَفْعُولُ لِأَجْلِهِ فِي: يُحَافِظُ المُوَاطِنُ عَلَى البِيئَةِ حُبًّا لِوَطَنِهِ؟ (البِيئَةِ / حُبًّا / وَطَنِهِ)'
    reponses:
    - حُبًّا
    erreurs:
      البِيئَةِ: خلط بين المفعول لأجله وغيره
      وَطَنِهِ: خلط بين المفعول لأجله وغيره
    indice: لِمَاذَا يُحَافِظُ المُوَاطِنُ عَلَى البِيئَةِ؟
    explication: المَفْعُولُ لِأَجْلِهِ «حُبًّا».
  - id: liajlih-12
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: وَقَفْنَا ... لِلْعَلَمِ. (تَحِيَّةٌ / تَحِيَّةً / تَحِيَّةٍ)'
    reponses:
    - تَحِيَّةً
    erreurs:
      تَحِيَّةٌ: خطأ في إعراب المفعول لأجله
      تَحِيَّةٍ: خطأ في إعراب المفعول لأجله
    indice: المَفْعُولُ لِأَجْلِهِ مَنْصُوبٌ.
    explication: 'نَقُولُ: وَقَفْنَا تَحِيَّةً لِلْعَلَمِ.'
  - id: liajlih-13
    difficulte: 3
    enonce: 'حَوِّلِ السَّبَبَ إِلَى مَفْعُولٍ لِأَجْلِهِ: ذَاكَرْتُ لِأَنِّي أَرْغَبُ فِي النَّجَاحِ. (ذَاكَرْتُ رَغْبَةً فِي النَّجَاحِ / ذَاكَرْتُ رَاغِبٌ فِي النَّجَاحِ / ذَاكَرْتُ مَعَ النَّجَاحِ)'
    reponses:
    - ذَاكَرْتُ رَغْبَةً فِي النَّجَاحِ
    erreurs:
      ذَاكَرْتُ رَاغِبٌ فِي النَّجَاحِ: خطأ في صياغة المفعول لأجله
      ذَاكَرْتُ مَعَ النَّجَاحِ: خطأ في صياغة المفعول لأجله
    indice: نَأْخُذُ مَصْدَرَ «أَرْغَبُ» مَنْصُوبًا.
    explication: 'نَقُولُ: ذَاكَرْتُ رَغْبَةً فِي النَّجَاحِ.'
- notion: المفعول فيه
  exercices:
  - id: fihi-1
    difficulte: 1
    enonce: 'مَا المَفْعُولُ فِيهِ فِي: سَافَرَ أَبِي لَيْلًا؟ (أَبِي / لَيْلًا / سَافَرَ)'
    reponses:
    - لَيْلًا
    erreurs:
      أَبِي: خلط بين الفاعل والمفعول فيه
      سَافَرَ: خلط بين الفعل والمفعول فيه
    indice: 'اِسْأَلْ: مَتَى سَافَرَ أَبِي؟'
    explication: 'المَفْعُولُ فِيهِ هُوَ «لَيْلًا»: ظَرْفُ زَمَانٍ مَنْصُوبٌ.'
  - id: fihi-2
    difficulte: 2
    enonce: '«أَمَامَ» فِي «جَلَسْتُ أَمَامَ البَيْتِ»: ظَرْفُ زَمَانٍ أَمْ ظَرْفُ مَكَانٍ؟ (ظَرْفُ زَمَانٍ / ظَرْفُ مَكَانٍ)'
    reponses:
    - ظَرْفُ مَكَانٍ
    erreurs:
      ظَرْفُ زَمَانٍ: خلط بين ظرف الزمان وظرف المكان
    indice: 'اِسْأَلْ: أَيْنَ جَلَسْتُ؟'
    explication: '«أَمَامَ» ظَرْفُ مَكَانٍ: يُجِيبُ عَنِ السُّؤَالِ «أَيْنَ؟».'
  - id: fihi-3
    difficulte: 3
    enonce: 'اِخْتَرْ ظَرْفَ الزَّمَانِ: (فَوْقَ / صَبَاحًا / تَحْتَ)'
    reponses:
    - صَبَاحًا
    erreurs:
      فَوْقَ: خلط بين ظرف الزمان وظرف المكان
      تَحْتَ: خلط بين ظرف الزمان وظرف المكان
    indice: ظَرْفُ الزَّمَانِ يُجِيبُ عَنِ السُّؤَالِ «مَتَى؟».
    explication: «صَبَاحًا» ظَرْفُ زَمَانٍ. أَمَّا «فَوْقَ» وَ«تَحْتَ» فَظَرْفَا مَكَانٍ.
  - id: fihi-4
    difficulte: 1
    enonce: 'مَا المَفْعُولُ فِيهِ فِي: نَامَ الطِّفْلُ مَسَاءً؟ (نَامَ / الطِّفْلُ / مَسَاءً)'
    reponses:
    - مَسَاءً
    erreurs:
      نَامَ: خلط بين المفعول فيه وغيره
      الطِّفْلُ: خلط بين المفعول فيه وغيره
    indice: مَتَى نَامَ الطِّفْلُ؟
    explication: 'المَفْعُولُ فِيهِ «مَسَاءً»: ظَرْفُ زَمَانٍ.'
  - id: fihi-5
    difficulte: 1
    enonce: 'مَا المَفْعُولُ فِيهِ فِي: جَلَسَ القِطُّ تَحْتَ الطَّاوِلَةِ؟ (القِطُّ / تَحْتَ / الطَّاوِلَةِ)'
    reponses:
    - تَحْتَ
    erreurs:
      القِطُّ: خلط بين الظرف والمضاف إليه
      الطَّاوِلَةِ: خلط بين الظرف والمضاف إليه
    indice: أَيْنَ جَلَسَ القِطُّ؟
    explication: 'المَفْعُولُ فِيهِ «تَحْتَ»: ظَرْفُ مَكَانٍ، وَ«الطَّاوِلَةِ» مُضَافٌ إِلَيْهِ.'
  - id: fihi-6
    difficulte: 1
    enonce: 'اِخْتَرْ ظَرْفَ المَكَانِ: (لَيْلًا / أَمَامَ / يَوْمًا)'
    reponses:
    - أَمَامَ
    erreurs:
      لَيْلًا: خلط بين ظرف الزمان والمكان
      يَوْمًا: خلط بين ظرف الزمان والمكان
    indice: ظَرْفُ المَكَانِ يُجِيبُ عَنْ «أَيْنَ؟».
    explication: «أَمَامَ» ظَرْفُ مَكَانٍ.
  - id: fihi-7
    difficulte: 2
    enonce: '«بَعْدَ» فِي «خَرَجْتُ بَعْدَ العَصْرِ»: ظَرْفُ زَمَانٍ أَمْ مَكَانٍ؟ (ظَرْفُ زَمَانٍ / ظَرْفُ مَكَانٍ)'
    reponses:
    - ظَرْفُ زَمَانٍ
    erreurs:
      ظَرْفُ مَكَانٍ: خلط بين ظرف الزمان والمكان
    indice: «العَصْرِ» وَقْتٌ.
    explication: «بَعْدَ» هُنَا ظَرْفُ زَمَانٍ.
  - id: fihi-8
    difficulte: 2
    enonce: '«فَوْقَ» فِي «طَارَتِ الطَّائِرَةُ فَوْقَ السَّحَابِ»: ظَرْفُ زَمَانٍ أَمْ مَكَانٍ؟ (ظَرْفُ زَمَانٍ / ظَرْفُ مَكَانٍ)'
    reponses:
    - ظَرْفُ مَكَانٍ
    erreurs:
      ظَرْفُ زَمَانٍ: خلط بين ظرف الزمان والمكان
    indice: أَيْنَ طَارَتِ الطَّائِرَةُ؟
    explication: «فَوْقَ» ظَرْفُ مَكَانٍ.
  - id: fihi-9
    difficulte: 2
    enonce: بِأَيِّ سُؤَالٍ نَجِدُ ظَرْفَ الزَّمَانِ؟ (مَتَى؟ / أَيْنَ؟ / كَيْفَ؟)
    reponses:
    - مَتَى؟
    erreurs:
      أَيْنَ؟: خلط بين ظرف الزمان والمكان
      كَيْفَ؟: خلط بين ظرف الزمان والمكان
    indice: ظَرْفُ الزَّمَانِ يَدُلُّ عَلَى الوَقْتِ.
    explication: 'نَجِدُ ظَرْفَ الزَّمَانِ بِالسُّؤَالِ: مَتَى؟'
  - id: fihi-10
    difficulte: 2
    enonce: 'اِخْتَرِ الظَّرْفَ المُنَاسِبَ: أَسْتَيْقِظُ ... بَاكِرًا. (صَبَاحًا / وَرَاءَ / عِنْدَ)'
    reponses:
    - صَبَاحًا
    erreurs:
      وَرَاءَ: خطأ في اختيار الظرف
      عِنْدَ: خطأ في اختيار الظرف
    indice: مَتَى أَسْتَيْقِظُ؟
    explication: 'نَقُولُ: أَسْتَيْقِظُ صَبَاحًا بَاكِرًا.'
  - id: fihi-11
    difficulte: 3
    enonce: مَا حُكْمُ المَفْعُولِ فِيهِ؟ (مَرْفُوعٌ / مَنْصُوبٌ / مَجْزُومٌ)
    reponses:
    - مَنْصُوبٌ
    erreurs:
      مَرْفُوعٌ: خطأ في حكم المفعول فيه
      مَجْزُومٌ: خطأ في حكم المفعول فيه
    indice: 'قَارِنْ: سَافَرْتُ لَيْلًا.'
    explication: 'المَفْعُولُ فِيهِ مَنْصُوبٌ: سَافَرْتُ لَيْلًا.'
  - id: fihi-12
    difficulte: 3
    enonce: 'مَا المَفْعُولُ فِيهِ فِي: وَقَفَ التَّلَامِيذُ أَمَامَ القِسْمِ صَبَاحًا؟ (أَمَامَ وَصَبَاحًا / التَّلَامِيذُ / القِسْمِ)'
    reponses:
    - أَمَامَ وَصَبَاحًا
    erreurs:
      التَّلَامِيذُ: خلط بين الظرف وغيره
      القِسْمِ: خلط بين الظرف وغيره
    indice: 'فِي الجُمْلَةِ ظَرْفَانِ: لِلْمَكَانِ وَلِلزَّمَانِ.'
    explication: «أَمَامَ» ظَرْفُ مَكَانٍ، وَ«صَبَاحًا» ظَرْفُ زَمَانٍ.
  - id: fihi-13
    difficulte: 3
    enonce: 'اِخْتَرِ الظَّرْفَ المُنَاسِبَ: وَضَعْتُ الكِتَابَ ... الحَقِيبَةِ. (دَاخِلَ / غَدًا / لَيْلًا)'
    reponses:
    - دَاخِلَ
    erreurs:
      غَدًا: خطأ في اختيار الظرف
      لَيْلًا: خطأ في اختيار الظرف
    indice: أَيْنَ وَضَعْتُ الكِتَابَ؟
    explication: 'نَقُولُ: وَضَعْتُ الكِتَابَ دَاخِلَ الحَقِيبَةِ.'
- notion: المنادى
  exercices:
  - id: munada-1
    difficulte: 1
    enonce: 'مَا حَرْفُ النِّدَاءِ فِي: يَا سَعِيدُ، تَعَالَ؟ (سَعِيدُ / يَا / تَعَالَ)'
    reponses:
    - يَا
    erreurs:
      سَعِيدُ: خلط بين حرف النداء والمنادى
      تَعَالَ: خلط بين الفعل وحرف النداء
    indice: نُنَادِي شَخْصًا بِحَرْفٍ قَبْلَ اسْمِهِ.
    explication: حَرْفُ النِّدَاءِ هُوَ «يَا»، وَ«سَعِيدُ» مُنَادًى.
  - id: munada-2
    difficulte: 2
    enonce: 'مَا المُنَادَى فِي: يَا مَرْيَمُ، اقْرَئِي؟ (يَا / اقْرَئِي / مَرْيَمُ)'
    reponses:
    - مَرْيَمُ
    erreurs:
      يَا: خلط بين حرف النداء والمنادى
      اقْرَئِي: خلط بين الفعل والمنادى
    indice: المُنَادَى هُوَ الاِسْمُ الَّذِي يَأْتِي بَعْدَ حَرْفِ النِّدَاءِ.
    explication: 'المُنَادَى هُوَ «مَرْيَمُ»: عَلَمٌ مُفْرَدٌ مَبْنِيٌّ عَلَى الضَّمِّ.'
  - id: munada-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'اِخْتَرِ الصَّحِيحَ: يَا ... العِلْمِ، اجْتَهِدْ. (طَالِبُ / طَالِبَ / طَالِبِ)'
    reponses:
    - طَالِبَ
    erreurs:
      طَالِبُ: المنادى المضاف منصوب
      طَالِبِ: المنادى المضاف منصوب
    indice: المُنَادَى هُنَا مُضَافٌ إِلَى «العِلْمِ»، وَالمُنَادَى المُضَافُ مَنْصُوبٌ.
    explication: 'نَقُولُ «يَا طَالِبَ العِلْمِ»: مُنَادًى مُضَافٌ مَنْصُوبٌ بِالفَتْحَةِ.'
  - id: munada-4
    difficulte: 1
    enonce: 'مَا المُنَادَى فِي: يَا أَحْمَدُ، أَسْرِعْ؟ (يَا / أَحْمَدُ / أَسْرِعْ)'
    reponses:
    - أَحْمَدُ
    erreurs:
      يَا: خلط بين أداة النداء والمنادى
      أَسْرِعْ: خلط بين أداة النداء والمنادى
    indice: المُنَادَى هُوَ مَنْ نُنَادِيهِ.
    explication: المُنَادَى «أَحْمَدُ»، وَ«يَا» حَرْفُ نِدَاءٍ.
  - id: munada-5
    difficulte: 1
    enonce: 'مَا حَرْفُ النِّدَاءِ فِي: يَا صَدِيقِي، تَعَالَ؟ (صَدِيقِي / تَعَالَ / يَا)'
    reponses:
    - يَا
    erreurs:
      صَدِيقِي: خلط بين أداة النداء والمنادى
      تَعَالَ: خلط بين أداة النداء والمنادى
    indice: بِأَيِّ حَرْفٍ نُنَادِي؟
    explication: حَرْفُ النِّدَاءِ «يَا».
  - id: munada-6
    difficulte: 1
    enonce: 'اِخْتَرِ الصَّحِيحَ: يَا ...، اُدْخُلِي. (فَاطِمَةُ / فَاطِمَةَ / فَاطِمَةٍ)'
    reponses:
    - فَاطِمَةُ
    erreurs:
      فَاطِمَةَ: خطأ في إعراب المنادى
      فَاطِمَةٍ: خطأ في إعراب المنادى
    indice: العَلَمُ المُنَادَى مَبْنِيٌّ عَلَى الضَّمِّ.
    explication: 'نَقُولُ: يَا فَاطِمَةُ؛ العَلَمُ المُفْرَدُ يُبْنَى عَلَى الضَّمِّ.'
  - id: munada-7
    difficulte: 2
    enonce: 'مَا نَوْعُ المُنَادَى فِي: يَا تِلْمِيذُ؟ (عَلَمٌ مُفْرَدٌ / نَكِرَةٌ مَقْصُودَةٌ / مُضَافٌ)'
    reponses:
    - نَكِرَةٌ مَقْصُودَةٌ
    erreurs:
      عَلَمٌ مُفْرَدٌ: خطأ في أنواع المنادى
      مُضَافٌ: خطأ في أنواع المنادى
    indice: نُنَادِي تِلْمِيذًا مُعَيَّنًا أَمَامَنَا.
    explication: «تِلْمِيذُ» نَكِرَةٌ مَقْصُودَةٌ مَبْنِيَّةٌ عَلَى الضَّمِّ.
  - id: munada-8
    difficulte: 2
    enonce: 'مَا نَوْعُ المُنَادَى فِي: يَا عَبْدَ اللَّهِ؟ (عَلَمٌ مُفْرَدٌ / نَكِرَةٌ مَقْصُودَةٌ / مُضَافٌ)'
    reponses:
    - مُضَافٌ
    erreurs:
      عَلَمٌ مُفْرَدٌ: خطأ في أنواع المنادى
      نَكِرَةٌ مَقْصُودَةٌ: خطأ في أنواع المنادى
    indice: 'المُنَادَى كَلِمَتَانِ: عَبْدَ + اللَّهِ.'
    explication: «عَبْدَ اللَّهِ» مُنَادًى مُضَافٌ مَنْصُوبٌ.
  - id: munada-9
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: يَا ... الوَطَنِ، حَافِظُوا عَلَيْهِ. (أَبْنَاءُ / أَبْنَاءَ / أَبْنَاءِ)'
    reponses:
    - أَبْنَاءَ
    erreurs:
      أَبْنَاءُ: خطأ في إعراب المنادى
      أَبْنَاءِ: خطأ في إعراب المنادى
    indice: المُنَادَى المُضَافُ مَنْصُوبٌ.
    explication: 'نَقُولُ: يَا أَبْنَاءَ الوَطَنِ.'
  - id: munada-10
    difficulte: 2
    enonce: مَا الحَرْفُ الَّذِي نُنَادِي بِهِ القَرِيبَ؟ (أَ / أَيَا / هَيَا)
    reponses:
    - أَ
    erreurs:
      أَيَا: خطأ في أدوات النداء
      هَيَا: خطأ في أدوات النداء
    indice: «أَيَا» وَ«هَيَا» لِلْبَعِيدِ.
    explication: 'نُنَادِي القَرِيبَ بِالهَمْزَةِ: أَمُحَمَّدُ، اسْمَعْ.'
  - id: munada-11
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: يَا ... أَعِنِّي. (رَجُلًا / رَجُلُ / رَجُلٍ)'
    reponses:
    - رَجُلًا
    erreurs:
      رَجُلُ: خطأ في إعراب المنادى
      رَجُلٍ: خطأ في إعراب المنادى
    indice: إِذَا نَادَيْنَا رَجُلًا غَيْرَ مُعَيَّنٍ (نَكِرَةً غَيْرَ مَقْصُودَةٍ) نَصَبْنَاهُ.
    explication: 'يَقُولُ الأَعْمَى: «يَا رَجُلًا خُذْ بِيَدِي»: نَكِرَةٌ غَيْرُ مَقْصُودَةٍ مَنْصُوبَةٌ.'
  - id: munada-12
    difficulte: 3
    enonce: 'مَا إِعْرَابُ «سَعِيدُ» فِي: يَا سَعِيدُ؟ (مُنَادًى مَبْنِيٌّ عَلَى الضَّمِّ / فَاعِلٌ مَرْفُوعٌ / مُبْتَدَأٌ مَرْفُوعٌ)'
    reponses:
    - مُنَادًى مَبْنِيٌّ عَلَى الضَّمِّ
    erreurs:
      فَاعِلٌ مَرْفُوعٌ: خطأ في إعراب المنادى
      مُبْتَدَأٌ مَرْفُوعٌ: خطأ في إعراب المنادى
    indice: العَلَمُ المُفْرَدُ بَعْدَ «يَا» مَبْنِيٌّ.
    explication: «سَعِيدُ» مُنَادًى عَلَمٌ مُفْرَدٌ مَبْنِيٌّ عَلَى الضَّمِّ فِي مَحَلِّ نَصْبٍ.
  - id: munada-13
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: يَا ...، اِجْتَهِدُوا. (تَلَامِيذُ / تَلَامِيذَ / تَلَامِيذِ)'
    reponses:
    - تَلَامِيذُ
    erreurs:
      تَلَامِيذَ: خطأ في إعراب المنادى
      تَلَامِيذِ: خطأ في إعراب المنادى
    indice: 'نُنَادِي تَلَامِيذَ مُعَيَّنِينَ: نَكِرَةٌ مَقْصُودَةٌ.'
    explication: 'نَقُولُ: يَا تَلَامِيذُ؛ النَّكِرَةُ المَقْصُودَةُ تُبْنَى عَلَى الضَّمِّ.'
- notion: العطف
  exercices:
  - id: atf-1
    difficulte: 1
    enonce: 'مَا حَرْفُ العَطْفِ فِي: جَاءَ أَحْمَدُ وَخَالِدٌ؟ (جَاءَ / وَ / خَالِدٌ)'
    reponses:
    - وَ
    erreurs:
      جَاءَ: خلط بين الفعل وحرف العطف
      خَالِدٌ: خلط بين المعطوف وحرف العطف
    indice: 'حُرُوفُ العَطْفِ: الوَاوُ، الفَاءُ، ثُمَّ، أَوْ...'
    explication: حَرْفُ العَطْفِ هُوَ الوَاوُ، وَ«خَالِدٌ» مَعْطُوفٌ عَلَى «أَحْمَدُ».
  - id: atf-2
    difficulte: 2
    enonce: 'مَا المَعْطُوفُ فِي: أَكَلْتُ تُفَّاحَةً ثُمَّ مَوْزَةً؟ (تُفَّاحَةً / ثُمَّ / مَوْزَةً)'
    reponses:
    - مَوْزَةً
    erreurs:
      تُفَّاحَةً: خلط بين المعطوف والمعطوف عليه
      ثُمَّ: خلط بين حرف العطف والمعطوف
    indice: المَعْطُوفُ يَأْتِي بَعْدَ حَرْفِ العَطْفِ.
    explication: المَعْطُوفُ هُوَ «مَوْزَةً»، مَعْطُوفٌ عَلَى «تُفَّاحَةً» بِـ«ثُمَّ»، مَنْصُوبٌ مِثْلَهُ.
  - id: atf-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'اِخْتَرِ الصَّحِيحَ: رَأَيْتُ الأَسَدَ وَ... (النَّمِرُ / النَّمِرِ / النَّمِرَ)'
    reponses:
    - النَّمِرَ
    erreurs:
      النَّمِرُ: عدم إتباع المعطوف للمعطوف عليه
      النَّمِرِ: عدم إتباع المعطوف للمعطوف عليه
    indice: 'المَعْطُوفُ يَتْبَعُ المَعْطُوفَ عَلَيْهِ فِي الإِعْرَابِ: «الأَسَدَ» مَنْصُوبٌ.'
    explication: 'نَقُولُ «رَأَيْتُ الأَسَدَ وَالنَّمِرَ»: المَعْطُوفُ مَنْصُوبٌ مِثْلَ «الأَسَدَ».'
  - id: atf-4
    difficulte: 1
    enonce: 'مَا حَرْفُ العَطْفِ فِي: أَكَلْتُ خُبْزًا وَجُبْنًا؟ (خُبْزًا / وَ / جُبْنًا)'
    reponses:
    - وَ
    erreurs:
      خُبْزًا: خلط بين حرف العطف والمعطوف
      جُبْنًا: خلط بين حرف العطف والمعطوف
    indice: 'حُرُوفُ العَطْفِ: الوَاوُ، الفَاءُ، ثُمَّ، أَوْ...'
    explication: حَرْفُ العَطْفِ «الوَاوُ».
  - id: atf-5
    difficulte: 1
    enonce: 'مَا المَعْطُوفُ فِي: جَاءَ أَبِي وَأُمِّي؟ (أَبِي / أُمِّي / جَاءَ)'
    reponses:
    - أُمِّي
    erreurs:
      أَبِي: خلط بين المعطوف والمعطوف عليه
      جَاءَ: خلط بين المعطوف والمعطوف عليه
    indice: المَعْطُوفُ يَأْتِي بَعْدَ حَرْفِ العَطْفِ.
    explication: المَعْطُوفُ «أُمِّي»، وَالمَعْطُوفُ عَلَيْهِ «أَبِي».
  - id: atf-6
    difficulte: 1
    enonce: 'مَا المَعْطُوفُ عَلَيْهِ فِي: زُرْتُ مَرَّاكُشَ ثُمَّ فَاسَ؟ (فَاسَ / ثُمَّ / مَرَّاكُشَ)'
    reponses:
    - مَرَّاكُشَ
    erreurs:
      فَاسَ: خلط بين المعطوف والمعطوف عليه
      ثُمَّ: خلط بين المعطوف والمعطوف عليه
    indice: المَعْطُوفُ عَلَيْهِ يَأْتِي قَبْلَ حَرْفِ العَطْفِ.
    explication: المَعْطُوفُ عَلَيْهِ «مَرَّاكُشَ»، وَالمَعْطُوفُ «فَاسَ».
  - id: atf-7
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: اشْتَرَيْتُ قَلَمًا وَ... (دَفْتَرٌ / دَفْتَرًا / دَفْتَرٍ)'
    reponses:
    - دَفْتَرًا
    erreurs:
      دَفْتَرٌ: خطأ في إعراب المعطوف
      دَفْتَرٍ: خطأ في إعراب المعطوف
    indice: المَعْطُوفُ يَتْبَعُ المَعْطُوفَ عَلَيْهِ فِي الإِعْرَابِ.
    explication: 'نَقُولُ: اشْتَرَيْتُ قَلَمًا وَدَفْتَرًا؛ كِلَاهُمَا مَنْصُوبٌ.'
  - id: atf-8
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: سَلَّمْتُ عَلَى المُعَلِّمِ وَ... (المُدِيرِ / المُدِيرُ / المُدِيرَ)'
    reponses:
    - المُدِيرِ
    erreurs:
      المُدِيرُ: خطأ في إعراب المعطوف
      المُدِيرَ: خطأ في إعراب المعطوف
    indice: المَعْطُوفُ عَلَيْهِ مَجْرُورٌ.
    explication: 'نَقُولُ: سَلَّمْتُ عَلَى المُعَلِّمِ وَالمُدِيرِ.'
  - id: atf-9
    difficulte: 2
    enonce: أَيُّ حَرْفِ عَطْفٍ يُفِيدُ التَّرْتِيبَ مَعَ المُهْلَةِ (التَّرَاخِي)؟ (الوَاوُ / ثُمَّ / أَوْ)
    reponses:
    - ثُمَّ
    erreurs:
      الوَاوُ: خطأ في معاني حروف العطف
      أَوْ: خطأ في معاني حروف العطف
    indice: 'مِثَالٌ: زَرَعَ الفَلَّاحُ ثُمَّ حَصَدَ.'
    explication: «ثُمَّ» تُفِيدُ التَّرْتِيبَ مَعَ التَّرَاخِي.
  - id: atf-10
    difficulte: 2
    enonce: أَيُّ حَرْفِ عَطْفٍ يُفِيدُ التَّخْيِيرَ؟ (الفَاءُ / ثُمَّ / أَوْ)
    reponses:
    - أَوْ
    erreurs:
      الفَاءُ: خطأ في معاني حروف العطف
      ثُمَّ: خطأ في معاني حروف العطف
    indice: 'مِثَالٌ: خُذْ تُفَّاحَةً أَوْ مَوْزَةً.'
    explication: «أَوْ» تُفِيدُ التَّخْيِيرَ.
  - id: atf-11
    difficulte: 3
    enonce: أَيُّ حَرْفِ عَطْفٍ يُفِيدُ التَّرْتِيبَ مَعَ التَّعْقِيبِ (بِلَا مُهْلَةٍ)؟ (الفَاءُ / ثُمَّ / الوَاوُ)
    reponses:
    - الفَاءُ
    erreurs:
      ثُمَّ: خطأ في معاني حروف العطف
      الوَاوُ: خطأ في معاني حروف العطف
    indice: 'مِثَالٌ: دَخَلَ المُعَلِّمُ فَوَقَفَ التَّلَامِيذُ.'
    explication: «الفَاءُ» تُفِيدُ التَّرْتِيبَ وَالتَّعْقِيبَ.
  - id: atf-12
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: نَجَحَ التِّلْمِيذَانِ وَ... (التِّلْمِيذَتَيْنِ / التِّلْمِيذَتَانِ / التِّلْمِيذَةَ)'
    reponses:
    - التِّلْمِيذَتَانِ
    erreurs:
      التِّلْمِيذَتَيْنِ: خطأ في إعراب المعطوف
      التِّلْمِيذَةَ: خطأ في إعراب المعطوف
    indice: المَعْطُوفُ عَلَيْهِ مَرْفُوعٌ بِالأَلِفِ.
    explication: 'نَقُولُ: نَجَحَ التِّلْمِيذَانِ وَالتِّلْمِيذَتَانِ.'
  - id: atf-13
    difficulte: 3
    enonce: 'مَا المَعْطُوفُ فِي: قَرَأْتُ الدَّرْسَ فَفَهِمْتُهُ؟ (الدَّرْسَ / فَهِمْتُهُ / قَرَأْتُ)'
    reponses:
    - فَهِمْتُهُ
    erreurs:
      الدَّرْسَ: خلط بين المعطوف والمعطوف عليه
      قَرَأْتُ: خلط بين المعطوف والمعطوف عليه
    indice: قَدْ يُعْطَفُ فِعْلٌ عَلَى فِعْلٍ.
    explication: عُطِفَ الفِعْلُ «فَهِمْتُ» عَلَى الفِعْلِ «قَرَأْتُ» بِالفَاءِ.
- notion: التوكيد
  exercices:
  - id: tawkid-1
    difficulte: 1
    enonce: 'مَا لَفْظُ التَّوْكِيدِ فِي: جَاءَ المُدِيرُ نَفْسُهُ؟ (المُدِيرُ / جَاءَ / نَفْسُهُ)'
    reponses:
    - نَفْسُهُ
    erreurs:
      المُدِيرُ: خلط بين التوكيد والمؤكد
      جَاءَ: خلط بين الفعل والتوكيد
    indice: 'مِنْ أَلْفَاظِ التَّوْكِيدِ: نَفْسٌ، عَيْنٌ، كُلٌّ، جَمِيعٌ.'
    explication: 'لَفْظُ التَّوْكِيدِ هُوَ «نَفْسُهُ»: يُؤَكِّدُ أَنَّ المُدِيرَ هُوَ الَّذِي جَاءَ.'
  - id: tawkid-2
    difficulte: 2
    enonce: 'التَّوْكِيدُ فِي «نَجَحَ نَجَحَ التِّلْمِيذُ»: لَفْظِيٌّ أَمْ مَعْنَوِيٌّ؟ (مَعْنَوِيٌّ / لَفْظِيٌّ)'
    reponses:
    - لَفْظِيٌّ
    erreurs:
      مَعْنَوِيٌّ: خلط بين التوكيد اللفظي والمعنوي
    indice: هُنَا كُرِّرَتِ الكَلِمَةُ نَفْسُهَا.
    explication: 'التَّوْكِيدُ لَفْظِيٌّ: نُكَرِّرُ اللَّفْظَ نَفْسَهُ (نَجَحَ نَجَحَ).'
  - id: tawkid-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'اِخْتَرِ الصَّحِيحَ: حَضَرَ التَّلَامِيذُ ... (كُلَّهُمْ / كُلِّهِمْ / كُلُّهُمْ)'
    reponses:
    - كُلُّهُمْ
    erreurs:
      كُلَّهُمْ: عدم إتباع التوكيد للمؤكد
      كُلِّهِمْ: عدم إتباع التوكيد للمؤكد
    indice: 'التَّوْكِيدُ يَتْبَعُ المُؤَكَّدَ فِي الإِعْرَابِ: «التَّلَامِيذُ» مَرْفُوعٌ.'
    explication: 'نَقُولُ «حَضَرَ التَّلَامِيذُ كُلُّهُمْ»: تَوْكِيدٌ مَعْنَوِيٌّ مَرْفُوعٌ مِثْلَ «التَّلَامِيذُ».'
  - id: tawkid-4
    difficulte: 1
    enonce: 'مَا لَفْظُ التَّوْكِيدِ فِي: حَضَرَ التَّلَامِيذُ كُلُّهُمْ؟ (التَّلَامِيذُ / كُلُّهُمْ / حَضَرَ)'
    reponses:
    - كُلُّهُمْ
    erreurs:
      التَّلَامِيذُ: خلط بين التوكيد والمؤكد
      حَضَرَ: خلط بين التوكيد والمؤكد
    indice: التَّوْكِيدُ يُقَوِّي المَعْنَى.
    explication: لَفْظُ التَّوْكِيدِ «كُلُّ» فِي «كُلُّهُمْ».
  - id: tawkid-5
    difficulte: 1
    enonce: 'مَا المُؤَكَّدُ فِي: رَأَيْتُ القَائِدَ نَفْسَهُ؟ (نَفْسَهُ / القَائِدَ / رَأَيْتُ)'
    reponses:
    - القَائِدَ
    erreurs:
      نَفْسَهُ: خلط بين التوكيد والمؤكد
      رَأَيْتُ: خلط بين التوكيد والمؤكد
    indice: المُؤَكَّدُ هُوَ الاِسْمُ الَّذِي نُقَوِّيهِ.
    explication: المُؤَكَّدُ «القَائِدَ»، وَالتَّوْكِيدُ «نَفْسَ».
  - id: tawkid-6
    difficulte: 1
    enonce: 'التَّوْكِيدُ فِي «جَاءَ جَاءَ الضَّيْفُ»: لَفْظِيٌّ أَمْ مَعْنَوِيٌّ؟ (لَفْظِيٌّ / مَعْنَوِيٌّ)'
    reponses:
    - لَفْظِيٌّ
    erreurs:
      مَعْنَوِيٌّ: خلط بين التوكيد اللفظي والمعنوي
    indice: هَلْ تَكَرَّرَتِ الكَلِمَةُ نَفْسُهَا؟
    explication: 'التَّوْكِيدُ لَفْظِيٌّ: تَكْرَارُ الكَلِمَةِ «جَاءَ».'
  - id: tawkid-7
    difficulte: 2
    enonce: 'التَّوْكِيدُ فِي «قَرَأْتُ الكِتَابَ كُلَّهُ»: لَفْظِيٌّ أَمْ مَعْنَوِيٌّ؟ (لَفْظِيٌّ / مَعْنَوِيٌّ)'
    reponses:
    - مَعْنَوِيٌّ
    erreurs:
      لَفْظِيٌّ: خلط بين التوكيد اللفظي والمعنوي
    indice: 'أَلْفَاظُ التَّوْكِيدِ المَعْنَوِيِّ: نَفْسٌ، عَيْنٌ، كُلٌّ، جَمِيعٌ، كِلَا، كِلْتَا.'
    explication: التَّوْكِيدُ مَعْنَوِيٌّ بِلَفْظِ «كُلّ».
  - id: tawkid-8
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: زَارَنَا الوَزِيرُ ... (نَفْسَهُ / نَفْسِهِ / نَفْسُهُ)'
    reponses:
    - نَفْسُهُ
    erreurs:
      نَفْسَهُ: خطأ في إعراب التوكيد
      نَفْسِهِ: خطأ في إعراب التوكيد
    indice: التَّوْكِيدُ يَتْبَعُ المُؤَكَّدَ فِي الإِعْرَابِ؛ «الوَزِيرُ» مَرْفُوعٌ.
    explication: 'نَقُولُ: زَارَنَا الوَزِيرُ نَفْسُهُ.'
  - id: tawkid-9
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: سَلَّمْتُ عَلَى الضُّيُوفِ ... (جَمِيعِهِمْ / جَمِيعُهُمْ / جَمِيعَهُمْ)'
    reponses:
    - جَمِيعِهِمْ
    erreurs:
      جَمِيعُهُمْ: خطأ في إعراب التوكيد
      جَمِيعَهُمْ: خطأ في إعراب التوكيد
    indice: المُؤَكَّدُ مَجْرُورٌ.
    explication: 'نَقُولُ: سَلَّمْتُ عَلَى الضُّيُوفِ جَمِيعِهِمْ.'
  - id: tawkid-10
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: نَجَحَتِ البِنْتَانِ ... (كِلَاهُمَا / كِلْتَاهُمَا / كُلُّهُمْ)'
    reponses:
    - كِلْتَاهُمَا
    erreurs:
      كِلَاهُمَا: خطأ في ألفاظ التوكيد
      كُلُّهُمْ: خطأ في ألفاظ التوكيد
    indice: «كِلْتَا» لِلْمُثَنَّى المُؤَنَّثِ، وَ«كِلَا» لِلْمُثَنَّى المُذَكَّرِ.
    explication: 'نَقُولُ: نَجَحَتِ البِنْتَانِ كِلْتَاهُمَا.'
  - id: tawkid-11
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: فَازَ الفَرِيقَانِ ... (كِلْتَاهُمَا / كِلَاهُمَا / جَمِيعُهُمْ)'
    reponses:
    - كِلَاهُمَا
    erreurs:
      كِلْتَاهُمَا: خطأ في ألفاظ التوكيد
      جَمِيعُهُمْ: خطأ في ألفاظ التوكيد
    indice: المُؤَكَّدُ مُثَنًّى مُذَكَّرٌ.
    explication: 'نَقُولُ: فَازَ الفَرِيقَانِ كِلَاهُمَا.'
  - id: tawkid-12
    difficulte: 3
    enonce: مَا شَرْطُ لَفْظِ التَّوْكِيدِ المَعْنَوِيِّ؟ (أَنْ يَتَّصِلَ بِضَمِيرٍ يَعُودُ عَلَى المُؤَكَّدِ / أَنْ يَكُونَ مَنْصُوبًا دَائِمًا / أَنْ يَسْبِقَ المُؤَكَّدَ)
    reponses:
    - أَنْ يَتَّصِلَ بِضَمِيرٍ يَعُودُ عَلَى المُؤَكَّدِ
    erreurs:
      أَنْ يَكُونَ مَنْصُوبًا دَائِمًا: خطأ في شروط التوكيد
      أَنْ يَسْبِقَ المُؤَكَّدَ: خطأ في شروط التوكيد
    indice: 'قَارِنْ: الوَزِيرُ نَفْسُهُ، التَّلَامِيذُ كُلُّهُمْ.'
    explication: 'لَفْظُ التَّوْكِيدِ المَعْنَوِيِّ يَتَّصِلُ بِضَمِيرٍ يُطَابِقُ المُؤَكَّدَ: نَفْسُهُ، كُلُّهُمْ.'
  - id: tawkid-13
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: قَرَأْتُ القِصَصَ ... (كُلَّهَا / كُلَّهُ / كُلُّهَا)'
    reponses:
    - كُلَّهَا
    erreurs:
      كُلَّهُ: خطأ في إعراب التوكيد
      كُلُّهَا: خطأ في إعراب التوكيد
    indice: «القِصَصَ» مَنْصُوبٌ، وَجَمْعُ غَيْرِ العَاقِلِ يَعُودُ عَلَيْهِ ضَمِيرُ المُؤَنَّثِ.
    explication: 'نَقُولُ: قَرَأْتُ القِصَصَ كُلَّهَا.'
- notion: البدل
  exercices:
  - id: badal-1
    difficulte: 1
    enonce: 'مَا البَدَلُ فِي: جَاءَ الخَلِيفَةُ عُمَرُ؟ (جَاءَ / عُمَرُ / الخَلِيفَةُ)'
    reponses:
    - عُمَرُ
    erreurs:
      جَاءَ: خلط بين الفعل والبدل
      الخَلِيفَةُ: خلط بين البدل والمبدل منه
    indice: البَدَلُ يَأْتِي بَعْدَ اسْمٍ آخَرَ، وَيَدُلُّ عَلَى الشَّخْصِ نَفْسِهِ.
    explication: 'البَدَلُ هُوَ «عُمَرُ»، وَالمُبْدَلُ مِنْهُ «الخَلِيفَةُ»: يَتْبَعُهُ فِي الرَّفْعِ.'
  - id: badal-2
    difficulte: 2
    enonce: 'مَا المُبْدَلُ مِنْهُ فِي: زُرْتُ صَدِيقِي أَحْمَدَ؟ (أَحْمَدَ / صَدِيقِي)'
    reponses:
    - صَدِيقِي
    erreurs:
      أَحْمَدَ: خلط بين البدل والمبدل منه
