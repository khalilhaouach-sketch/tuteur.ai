    indice: اسْمُ المَكَانِ مِنَ الثُّلَاثِيِّ عَلَى وَزْنِ «مَفْعَلٌ» أَوْ «مَفْعِلٌ».
    explication: '«مَكْتَبٌ» اسْمُ مَكَانٍ: مَكَانُ الكِتَابَةِ.'
  - id: makan-5
    difficulte: 1
    enonce: مَا اسْمُ المَكَانِ مِنْ «طَبَخَ»؟ (طَبَّاخٌ / مَطْبَخٌ / مَطْبُوخٌ)
    reponses:
