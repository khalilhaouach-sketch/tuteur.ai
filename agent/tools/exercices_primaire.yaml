    indice: اِسْمُ الآلَةِ يَدُلُّ عَلَى الأَدَاةِ الَّتِي نَسْتَعْمِلُهَا.
    explication: '«مِفْتَاحٌ» اسْمُ آلَةٍ: الأَدَاةُ الَّتِي نَفْتَحُ بِهَا.'
  - id: ala-2
