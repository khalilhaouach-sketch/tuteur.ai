    indice: «كَانَ» تَرْفَعُ الاِسْمَ وَتَنْصِبُ الخَبَرَ.
    explication: 'نَقُولُ «كَانَ الطَّالِبُ مُجْتَهِدًا»: «الطَّالِبُ» اسْمُهَا مَرْفُوعٌ، وَ«مُجْتَهِدًا» خَبَرُهَا مَنْصُوبٌ.'
