- notion: العدد والمعدود
  exercices:
  - id: adad3-1
    difficulte: 1
    enonce: 'اِخْتَرِ الصَّحِيحَ: فِي القِسْمِ ... تَلَامِيذَ. (خَمْسُ / خَمْسَةُ)'
    reponses:
    - خَمْسَةُ
    erreurs:
      خَمْسُ: عدم مخالفة العدد للمعدود
    indice: 'مِنْ ثَلَاثَةٍ إِلَى عَشَرَةٍ، يُخَالِفُ العَدَدُ المَعْدُودَ: «تَلَامِيذُ» مُذَكَّرٌ.'
    explication: 'نَقُولُ «خَمْسَةُ تَلَامِيذَ»: المَعْدُودُ مُذَكَّرٌ، فَالعَدَدُ مُؤَنَّثٌ.'
  - id: adad3-2
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: قَرَأْتُ ... قِصَصٍ. (ثَلَاثَةَ / ثَلَاثَ)'
    reponses:
    - ثَلَاثَ
    erreurs:
      ثَلَاثَةَ: عدم مخالفة العدد للمعدود
    indice: مُفْرَدُ «قِصَصٍ» هُوَ «قِصَّةٌ»، وَهُوَ مُؤَنَّثٌ.
    explication: 'نَقُولُ «قَرَأْتُ ثَلَاثَ قِصَصٍ»: المَعْدُودُ مُؤَنَّثٌ، فَالعَدَدُ مُذَكَّرٌ.'
  - id: adad3-3
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: اشْتَرَيْتُ أَرْبَعَةَ ... (أَقْلَامًا / قَلَمٍ / أَقْلَامٍ)'
    reponses:
    - أَقْلَامٍ
    erreurs:
      أَقْلَامًا: المعدود من 3 إلى 10 مجرور
      قَلَمٍ: المعدود من 3 إلى 10 جمع
    indice: المَعْدُودُ مِنْ ثَلَاثَةٍ إِلَى عَشَرَةٍ جَمْعٌ مَجْرُورٌ.
    explication: 'نَقُولُ «أَرْبَعَةَ أَقْلَامٍ»: المَعْدُودُ جَمْعٌ مَجْرُورٌ.'
  - id: adad3-4
    difficulte: 1
    enonce: 'اِخْتَرِ الصَّحِيحَ: فِي الحَدِيقَةِ ... أَشْجَارٍ. (ثَلَاثُ / ثَلَاثَةُ)'
    reponses:
    - ثَلَاثُ
    erreurs:
      ثَلَاثَةُ: خطأ في مطابقة العدد والمعدود
    indice: العَدَدُ مِنْ 3 إِلَى 10 يُخَالِفُ المَعْدُودَ؛ مُفْرَدُ «أَشْجَارٍ» شَجَرَةٌ (مُؤَنَّثٌ).
    explication: 'نَقُولُ: ثَلَاثُ أَشْجَارٍ؛ المَعْدُودُ مُؤَنَّثٌ فَالعَدَدُ مُذَكَّرٌ.'
  - id: adad3-5
    difficulte: 1
    enonce: 'اِخْتَرِ الصَّحِيحَ: اشْتَرَيْتُ ... كُتُبٍ. (خَمْسَ / خَمْسَةَ)'
    reponses:
    - خَمْسَةَ
    erreurs:
      خَمْسَ: خطأ في مطابقة العدد والمعدود
    indice: مُفْرَدُ «كُتُبٍ» كِتَابٌ (مُذَكَّرٌ)، وَالعَدَدُ يُخَالِفُهُ.
    explication: 'نَقُولُ: اشْتَرَيْتُ خَمْسَةَ كُتُبٍ.'
  - id: adad3-6
    difficulte: 1
    enonce: مَا الصَّحِيحُ لِلْعَدَدِ 1 مَعَ «قَلَمٌ»؟ (قَلَمٌ وَاحِدٌ / وَاحِدٌ قَلَمٌ / وَاحِدَةٌ قَلَمٌ)
    reponses:
    - قَلَمٌ وَاحِدٌ
    erreurs:
      وَاحِدٌ قَلَمٌ: خطأ في العدد واحد واثنان
      وَاحِدَةٌ قَلَمٌ: خطأ في العدد واحد واثنان
    indice: الوَاحِدُ وَالاِثْنَانِ يَأْتِيَانِ بَعْدَ المَعْدُودِ وَيُطَابِقَانِهِ.
    explication: 'نَقُولُ: قَلَمٌ وَاحِدٌ؛ العَدَدُ 1 نَعْتٌ يُطَابِقُ المَعْدُودَ.'
  - id: adad3-7
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: فِي القِسْمِ ... بَنَاتٍ. (سَبْعَةُ / سَبْعُ)'
    reponses:
    - سَبْعُ
    erreurs:
      سَبْعَةُ: خطأ في مطابقة العدد والمعدود
    indice: المَعْدُودُ مُؤَنَّثٌ (بِنْتٌ).
    explication: 'نَقُولُ: سَبْعُ بَنَاتٍ.'
  - id: adad3-8
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: غَابَ ... تَلَامِيذَ. (أَرْبَعَةُ / أَرْبَعُ)'
    reponses:
    - أَرْبَعَةُ
    erreurs:
      أَرْبَعُ: خطأ في مطابقة العدد والمعدود
    indice: المَعْدُودُ مُذَكَّرٌ (تِلْمِيذٌ).
    explication: 'نَقُولُ: غَابَ أَرْبَعَةُ تَلَامِيذَ.'
  - id: adad3-9
    difficulte: 2
    enonce: كَيْفَ يَكُونُ مَعْدُودُ الأَعْدَادِ مِنْ 3 إِلَى 10؟ (جَمْعًا مَجْرُورًا / مُفْرَدًا مَنْصُوبًا / مُثَنًّى مَرْفُوعًا)
    reponses:
    - جَمْعًا مَجْرُورًا
    erreurs:
      مُفْرَدًا مَنْصُوبًا: خطأ في قاعدة المعدود
      مُثَنًّى مَرْفُوعًا: خطأ في قاعدة المعدود
    indice: 'مِثَالٌ: ثَلَاثَةُ أَقْلَامٍ.'
    explication: 'مَعْدُودُ 3 إِلَى 10 جَمْعٌ مَجْرُورٌ: ثَلَاثَةُ أَقْلَامٍ.'
  - id: adad3-10
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: عِنْدِي ثَمَانِيَةُ ... (أَقْلَامٍ / قَلَمًا / قَلَمٍ)'
    reponses:
    - أَقْلَامٍ
    erreurs:
      قَلَمًا: خطأ في قاعدة المعدود
      قَلَمٍ: خطأ في قاعدة المعدود
    indice: بَعْدَ 3 إِلَى 10 يَأْتِي المَعْدُودُ جَمْعًا مَجْرُورًا.
    explication: 'نَقُولُ: ثَمَانِيَةُ أَقْلَامٍ.'
  - id: adad3-11
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: فِي الفَرِيقِ ... لَاعِبًا. (أَحَدَ عَشَرَ / إِحْدَى عَشْرَةَ)'
    reponses:
    - أَحَدَ عَشَرَ
    erreurs:
