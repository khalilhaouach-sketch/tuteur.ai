    erreurs:
      العَامِلُونَ: خطأ في إعراب الجمع المذكر السالم
      العَامِلَانِ: خطأ في إعراب الجمع المذكر السالم
    indice: المَفْعُولُ بِهِ مَنْصُوبٌ بِاليَاءِ.
    explication: 'نَقُولُ: شَكَرَ المُدِيرُ العَامِلِينَ.'
  - id: muthanna-9
    difficulte: 2
    enonce: مَا عَلَامَةُ نَصْبِ جَمْعِ المُؤَنَّثِ السَّالِمِ؟ (الفَتْحَةُ / الكَسْرَةُ / اليَاءُ)
    reponses:
