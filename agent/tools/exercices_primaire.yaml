# Banque d'exercices des paliers du primaire (2AP à 6AP) — à relire par le professeur.
# Ajoutée palier par palier. Même format que exercices_1ac.yaml.

niveau: P2
notions:
- notion: الفاعل
  exercices:
  - id: fail-1
    difficulte: 1
    enonce: 'حَدِّدِ الفَاعِلَ: كَتَبَ التِّلْمِيذُ الدَّرْسَ. (كَتَبَ / التِّلْمِيذُ / الدَّرْسَ)'
    reponses:
    - التِّلْمِيذُ
    erreurs:
      كَتَبَ: خلط بين الفعل والفاعل
      الدَّرْسَ: خلط بين الفاعل والمفعول به
    indice: 'الفَاعِلُ هُوَ مَنْ قَامَ بِالفِعْلِ: مَنِ الَّذِي كَتَبَ؟'
    explication: 'الفَاعِلُ هُوَ «التِّلْمِيذُ»: هُوَ الَّذِي كَتَبَ، وَهُوَ مَرْفُوعٌ بِالضَّمَّةِ.'
  - id: fail-2
    difficulte: 2
    enonce: 'حَدِّدِ الفَاعِلَ: يَزْرَعُ الفَلَّاحُ القَمْحَ فِي الحَقْلِ. (القَمْحَ / الفَلَّاحُ / الحَقْلِ)'
    reponses:
    - الفَلَّاحُ
    erreurs:
      القَمْحَ: خلط بين الفاعل والمفعول به
      الحَقْلِ: خلط بين الفاعل والاسم المجرور
    indice: 'اِسْأَلْ: مَنِ الَّذِي يَزْرَعُ؟'
    explication: 'الفَاعِلُ هُوَ «الفَلَّاحُ»: هُوَ الَّذِي يَزْرَعُ.'
  - id: fail-3
    difficulte: 3
    enonce: 'مَا الفَاعِلُ فِي: لَعِبْنَا فِي السَّاحَةِ؟ (السَّاحَةِ / نَا / لَعِبَ)'
    reponses:
    - نَا
    erreurs:
      السَّاحَةِ: خلط بين الفاعل والاسم المجرور
      لَعِبَ: خلط بين الفعل والفاعل
    indice: الفَاعِلُ هُنَا ضَمِيرٌ مُتَّصِلٌ بِالفِعْلِ.
    explication: 'الفَاعِلُ هُوَ الضَّمِيرُ «نَا»: نَحْنُ الَّذِينَ لَعِبْنَا.'
- notion: المفعول به
  exercices:
  - id: mafoul-1
    difficulte: 1
    enonce: 'حَدِّدِ المَفْعُولَ بِهِ: قَرَأَ أَحْمَدُ القِصَّةَ. (أَحْمَدُ / القِصَّةَ / قَرَأَ)'
    reponses:
    - القِصَّةَ
    erreurs:
      أَحْمَدُ: خلط بين المفعول به والفاعل
      قَرَأَ: خلط بين الفعل والمفعول به
    indice: 'المَفْعُولُ بِهِ هُوَ مَا وَقَعَ عَلَيْهِ الفِعْلُ: مَاذَا قَرَأَ أَحْمَدُ؟'
    explication: المَفْعُولُ بِهِ هُوَ «القِصَّةَ»، وَهُوَ مَنْصُوبٌ بِالفَتْحَةِ.
  - id: mafoul-2
    difficulte: 2
    enonce: 'حَدِّدِ المَفْعُولَ بِهِ: شَرِبَ الطِّفْلُ الحَلِيبَ صَبَاحًا. (الحَلِيبَ / الطِّفْلُ / صَبَاحًا)'
    reponses:
    - الحَلِيبَ
    erreurs:
      الطِّفْلُ: خلط بين المفعول به والفاعل
      صَبَاحًا: خلط بين المفعول به والظرف
    indice: 'اِسْأَلْ: مَاذَا شَرِبَ الطِّفْلُ؟'
    explication: المَفْعُولُ بِهِ هُوَ «الحَلِيبَ». أَمَّا «صَبَاحًا» فَيَدُلُّ عَلَى الزَّمَانِ.
  - id: mafoul-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'اِخْتَرِ الكَلِمَةَ الصَّحِيحَةَ: رَسَمَتْ مَرْيَمُ ... (وَرْدَةٌ / وَرْدَةً / وَرْدَةٍ)'
    reponses:
    - وَرْدَةً
    erreurs:
      وَرْدَةٌ: نسيان نصب المفعول به
      وَرْدَةٍ: نسيان نصب المفعول به
    indice: الكَلِمَةُ النَّاقِصَةُ مَفْعُولٌ بِهِ، وَالمَفْعُولُ بِهِ مَنْصُوبٌ.
    explication: 'نَقُولُ «رَسَمَتْ مَرْيَمُ وَرْدَةً»: المَفْعُولُ بِهِ مَنْصُوبٌ بِالفَتْحَةِ.'
- notion: المبتدأ والخبر
  exercices:
  - id: mubtada-1
    difficulte: 1
    enonce: 'مَا المُبْتَدَأُ فِي: الجَوُّ جَمِيلٌ؟ (جَمِيلٌ / الجَوُّ)'
    reponses:
    - الجَوُّ
    erreurs:
      جَمِيلٌ: خلط بين المبتدأ والخبر
    indice: المُبْتَدَأُ اسْمٌ نَبْدَأُ بِهِ الجُمْلَةَ الاِسْمِيَّةَ.
    explication: المُبْتَدَأُ هُوَ «الجَوُّ»، وَالخَبَرُ «جَمِيلٌ».
  - id: mubtada-2
    difficulte: 2
    enonce: 'مَا الخَبَرُ فِي: الحَدِيقَةُ وَاسِعَةٌ؟ (الحَدِيقَةُ / وَاسِعَةٌ)'
    reponses:
    - وَاسِعَةٌ
    erreurs:
      الحَدِيقَةُ: خلط بين المبتدأ والخبر
    indice: 'الخَبَرُ يُتَمِّمُ مَعْنَى الجُمْلَةِ: مَاذَا نَقُولُ عَنِ الحَدِيقَةِ؟'
    explication: 'الخَبَرُ هُوَ «وَاسِعَةٌ»: يُخْبِرُنَا عَنِ الحَدِيقَةِ.'
  - id: mubtada-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'أَكْمِلْ بِخَبَرٍ مُنَاسِبٍ: الشَّمْسُ ... (سَاطِعٌ / سَاطِعَةٌ / سَاطِعَةً)'
    reponses:
    - سَاطِعَةٌ
    erreurs:
      سَاطِعٌ: عدم المطابقة في التأنيث
      سَاطِعَةً: عدم رفع الخبر
    indice: «الشَّمْسُ» مُؤَنَّثٌ، وَالخَبَرُ مَرْفُوعٌ.
    explication: 'نَقُولُ «الشَّمْسُ سَاطِعَةٌ»: الخَبَرُ مُؤَنَّثٌ مِثْلَ المُبْتَدَإِ، وَمَرْفُوعٌ بِالضَّمَّةِ.'
- notion: حروف الجر والاسم المجرور
  exercices:
  - id: jarr-1
    difficulte: 1
    enonce: 'مَا حَرْفُ الجَرِّ فِي: ذَهَبْتُ إِلَى المَدْرَسَةِ؟ (ذَهَبْتُ / إِلَى / المَدْرَسَةِ)'
    reponses:
    - إِلَى
    erreurs:
      ذَهَبْتُ: خلط بين الفعل وحرف الجر
      المَدْرَسَةِ: خلط بين حرف الجر والاسم المجرور
    indice: 'حُرُوفُ الجَرِّ: مِنْ، إِلَى، عَنْ، عَلَى، فِي...'
    explication: حَرْفُ الجَرِّ هُوَ «إِلَى»، وَ«المَدْرَسَةِ» اسْمٌ مَجْرُورٌ.
  - id: jarr-2
    difficulte: 2
    enonce: 'مَا الاِسْمُ المَجْرُورُ فِي: الكِتَابُ عَلَى المَكْتَبِ؟ (الكِتَابُ / عَلَى / المَكْتَبِ)'
    reponses:
    - المَكْتَبِ
    erreurs:
      الكِتَابُ: خلط بين المبتدأ والاسم المجرور
      عَلَى: خلط بين حرف الجر والاسم المجرور
    indice: الاِسْمُ المَجْرُورُ يَأْتِي بَعْدَ حَرْفِ الجَرِّ.
    explication: الاِسْمُ المَجْرُورُ هُوَ «المَكْتَبِ»، جَاءَ بَعْدَ «عَلَى» وَعَلَامَةُ جَرِّهِ الكَسْرَةُ.
  - id: jarr-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'اِخْتَرِ الكَلِمَةَ الصَّحِيحَةَ: سَافَرْتُ بِـ... (القِطَارُ / القِطَارِ / القِطَارَ)'
    reponses:
    - القِطَارِ
    erreurs:
      القِطَارُ: عدم جر الاسم بعد حرف الجر
      القِطَارَ: عدم جر الاسم بعد حرف الجر
    indice: بَعْدَ حَرْفِ الجَرِّ يَكُونُ الاِسْمُ مَجْرُورًا.
    explication: 'نَقُولُ «سَافَرْتُ بِالقِطَارِ»: الاِسْمُ بَعْدَ البَاءِ مَجْرُورٌ بِالكَسْرَةِ.'
- notion: تصريف المضارع مع الضمائر
  exercices:
  - id: tasrif-1
    difficulte: 1
    enonce: 'أَكْمِلْ: نَحْنُ ... الدَّرْسَ. (أَكْتُبُ / نَكْتُبُ / يَكْتُبُ)'
    reponses:
    - نَكْتُبُ
    erreurs:
      أَكْتُبُ: عدم مطابقة الفعل للضمير
      يَكْتُبُ: عدم مطابقة الفعل للضمير
    indice: مَعَ «نَحْنُ» يَبْدَأُ المُضَارِعُ بِالنُّونِ.
    explication: نَقُولُ «نَحْنُ نَكْتُبُ الدَّرْسَ».
  - id: tasrif-2
    difficulte: 2
    enonce: 'أَكْمِلْ: أَنْتِ ... الدَّرْسَ. (تَكْتُبُ / تَكْتُبِينَ / يَكْتُبُونَ)'
    reponses:
    - تَكْتُبِينَ
    erreurs:
      تَكْتُبُ: عدم مطابقة الفعل للضمير
      يَكْتُبُونَ: عدم مطابقة الفعل للضمير
    indice: '«أَنْتِ» لِلْمُخَاطَبَةِ: نُضِيفُ يَاءً وَنُونًا فِي آخِرِ الفِعْلِ.'
    explication: نَقُولُ «أَنْتِ تَكْتُبِينَ الدَّرْسَ».
  - id: tasrif-3
    difficulte: 3
    enonce: 'أَكْمِلْ: التِّلْمِيذَانِ ... الدَّرْسَ. (يَكْتُبُونَ / يَكْتُبُ / يَكْتُبَانِ)'
    reponses:
    - يَكْتُبَانِ
    erreurs:
      يَكْتُبُونَ: عدم مطابقة الفعل للمثنى
      يَكْتُبُ: عدم مطابقة الفعل للمثنى
    indice: '«التِّلْمِيذَانِ» مُثَنًّى: نُضِيفُ أَلِفًا وَنُونًا فِي آخِرِ الفِعْلِ.'
    explication: نَقُولُ «التِّلْمِيذَانِ يَكْتُبَانِ الدَّرْسَ».
- notion: كان وأخواتها
  exercices:
  - id: kana-1
    difficulte: 1
    enonce: 'مَا اسْمُ «كَانَ» فِي: كَانَ الجَوُّ جَمِيلًا؟ (جَمِيلًا / الجَوُّ / كَانَ)'
    reponses:
    - الجَوُّ
    erreurs:
      جَمِيلًا: خلط بين اسم كان وخبرها
      كَانَ: خلط بين كان واسمها
    indice: اِسْمُ «كَانَ» هُوَ المُبْتَدَأُ قَبْلَ دُخُولِهَا، وَيَبْقَى مَرْفُوعًا.
    explication: اِسْمُ «كَانَ» هُوَ «الجَوُّ» (مَرْفُوعٌ)، وَخَبَرُهَا «جَمِيلًا» (مَنْصُوبٌ).
  - id: kana-2
    difficulte: 2
    enonce: 'مَا خَبَرُ «أَصْبَحَ» فِي: أَصْبَحَ الطَّقْسُ بَارِدًا؟ (الطَّقْسُ / بَارِدًا / أَصْبَحَ)'
    reponses:
    - بَارِدًا
    erreurs:
      الطَّقْسُ: خلط بين اسم كان وخبرها
      أَصْبَحَ: خلط بين الناسخ وخبره
    indice: 'خَبَرُ «أَصْبَحَ» يَكُونُ مَنْصُوبًا: أَيُّ كَلِمَةٍ مَنْصُوبَةٌ؟'
    explication: خَبَرُ «أَصْبَحَ» هُوَ «بَارِدًا»، مَنْصُوبٌ بِالفَتْحَةِ.
  - id: kana-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'أَدْخِلْ «كَانَ» عَلَى الجُمْلَةِ: الطَّالِبُ مُجْتَهِدٌ. (كَانَ الطَّالِبُ مُجْتَهِدٌ / كَانَ الطَّالِبَ مُجْتَهِدًا / كَانَ الطَّالِبُ مُجْتَهِدًا)'
    reponses:
    - كَانَ الطَّالِبُ مُجْتَهِدًا
    erreurs:
      كَانَ الطَّالِبُ مُجْتَهِدٌ: نسيان نصب خبر كان
      كَانَ الطَّالِبَ مُجْتَهِدًا: نصب اسم كان
    indice: «كَانَ» تَرْفَعُ الاِسْمَ وَتَنْصِبُ الخَبَرَ.
    explication: 'نَقُولُ «كَانَ الطَّالِبُ مُجْتَهِدًا»: «الطَّالِبُ» اسْمُهَا مَرْفُوعٌ، وَ«مُجْتَهِدًا» خَبَرُهَا مَنْصُوبٌ.'
- notion: إن وأخواتها
  exercices:
  - id: inna-1
    difficulte: 1
    enonce: 'مَا اسْمُ «إِنَّ» فِي: إِنَّ العِلْمَ نَافِعٌ؟ (نَافِعٌ / إِنَّ / العِلْمَ)'
    reponses:
    - العِلْمَ
    erreurs:
      نَافِعٌ: خلط بين اسم إن وخبرها
      إِنَّ: خلط بين إن واسمها
    indice: اِسْمُ «إِنَّ» يَأْتِي بَعْدَهَا مُبَاشَرَةً، وَيَكُونُ مَنْصُوبًا.
    explication: اِسْمُ «إِنَّ» هُوَ «العِلْمَ» (مَنْصُوبٌ)، وَخَبَرُهَا «نَافِعٌ» (مَرْفُوعٌ).
  - id: inna-2
    difficulte: 2
    enonce: 'مَا خَبَرُ «لَعَلَّ» فِي: لَعَلَّ المَطَرَ قَرِيبٌ؟ (المَطَرَ / قَرِيبٌ)'
    reponses:
    - قَرِيبٌ
    erreurs:
      المَطَرَ: خلط بين اسم إن وخبرها
    indice: خَبَرُ «لَعَلَّ» يَكُونُ مَرْفُوعًا.
    explication: خَبَرُ «لَعَلَّ» هُوَ «قَرِيبٌ»، مَرْفُوعٌ بِالضَّمَّةِ.
  - id: inna-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'أَدْخِلْ «إِنَّ» عَلَى الجُمْلَةِ: الصِّدْقُ جَمِيلٌ. (إِنَّ الصِّدْقُ جَمِيلٌ / إِنَّ الصِّدْقَ جَمِيلٌ / إِنَّ الصِّدْقَ جَمِيلًا)'
    reponses:
    - إِنَّ الصِّدْقَ جَمِيلٌ
    erreurs:
      إِنَّ الصِّدْقُ جَمِيلٌ: نسيان نصب اسم إن
      إِنَّ الصِّدْقَ جَمِيلًا: نصب خبر إن
    indice: «إِنَّ» تَنْصِبُ الاِسْمَ وَتَرْفَعُ الخَبَرَ، عَكْسَ «كَانَ».
    explication: 'نَقُولُ «إِنَّ الصِّدْقَ جَمِيلٌ»: «الصِّدْقَ» اسْمُهَا مَنْصُوبٌ، وَ«جَمِيلٌ» خَبَرُهَا مَرْفُوعٌ.'
- notion: النعت
  exercices:
  - id: naat-1
    difficulte: 1
    enonce: 'مَا النَّعْتُ فِي: قَرَأْتُ قِصَّةً جَمِيلَةً؟ (قِصَّةً / جَمِيلَةً / قَرَأْتُ)'
    reponses:
    - جَمِيلَةً
    erreurs:
      قِصَّةً: خلط بين النعت والمنعوت
      قَرَأْتُ: خلط بين الفعل والنعت
    indice: 'النَّعْتُ يَصِفُ الاِسْمَ الَّذِي قَبْلَهُ: كَيْفَ هِيَ القِصَّةُ؟'
    explication: 'النَّعْتُ هُوَ «جَمِيلَةً»: يَصِفُ «قِصَّةً» وَيَتْبَعُهَا فِي النَّصْبِ.'
  - id: naat-2
    difficulte: 2
    enonce: 'مَا المَنْعُوتُ فِي: رَأَيْتُ طَائِرًا صَغِيرًا؟ (صَغِيرًا / طَائِرًا)'
    reponses:
    - طَائِرًا
    erreurs:
      صَغِيرًا: خلط بين النعت والمنعوت
    indice: المَنْعُوتُ هُوَ الاِسْمُ المَوْصُوفُ، وَيَأْتِي قَبْلَ النَّعْتِ.
    explication: المَنْعُوتُ هُوَ «طَائِرًا»، وَالنَّعْتُ «صَغِيرًا».
  - id: naat-3
    difficulte: 3
    enonce: 'اِخْتَرِ النَّعْتَ المُنَاسِبَ: زُرْتُ المَدِينَةَ ... (قَدِيمَةً / القَدِيمَ / القَدِيمَةَ)'
    reponses:
    - القَدِيمَةَ
    erreurs:
      قَدِيمَةً: عدم المطابقة في التعريف
      القَدِيمَ: عدم المطابقة في التأنيث
    indice: 'النَّعْتُ يَتْبَعُ المَنْعُوتَ: «المَدِينَةَ» مَعْرِفَةٌ وَمُؤَنَّثٌ وَمَنْصُوبٌ.'
    explication: 'نَقُولُ «زُرْتُ المَدِينَةَ القَدِيمَةَ»: النَّعْتُ مَعْرِفَةٌ مُؤَنَّثٌ مَنْصُوبٌ مِثْلَ المَنْعُوتِ.'
- notion: الحال
  exercices:
  - id: hal-1
    difficulte: 1
    enonce: 'مَا الحَالُ فِي: جَاءَ التِّلْمِيذُ مُبْتَسِمًا؟ (التِّلْمِيذُ / جَاءَ / مُبْتَسِمًا)'
    reponses:
    - مُبْتَسِمًا
    erreurs:
      التِّلْمِيذُ: خلط بين الحال وصاحبه
      جَاءَ: خلط بين الفعل والحال
    indice: 'الحَالُ يُبَيِّنُ الهَيْئَةَ: كَيْفَ جَاءَ التِّلْمِيذُ؟'
    explication: 'الحَالُ هُوَ «مُبْتَسِمًا»: يُبَيِّنُ هَيْئَةَ التِّلْمِيذِ، وَهُوَ مَنْصُوبٌ.'
  - id: hal-2
    difficulte: 2
    enonce: بِأَيِّ سُؤَالٍ نَجِدُ الحَالَ؟ (مَتَى؟ / كَيْفَ؟ / أَيْنَ؟)
    reponses:
    - كَيْفَ؟
    erreurs:
      مَتَى؟: خلط بين الحال والظرف
      أَيْنَ؟: خلط بين الحال والظرف
    indice: الحَالُ يَصِفُ هَيْئَةَ صَاحِبِهِ.
    explication: 'نَجِدُ الحَالَ بِالسُّؤَالِ «كَيْفَ؟»: جَاءَ التِّلْمِيذُ مُبْتَسِمًا ← كَيْفَ جَاءَ؟ مُبْتَسِمًا.'
  - id: hal-3
    difficulte: 3
    enonce: 'اِخْتَرِ الحَالَ المُنَاسِبَ: رَجَعَ الجُنُودُ ... (مُنْتَصِرُونَ / المُنْتَصِرُونَ / مُنْتَصِرِينَ)'
    reponses:
    - مُنْتَصِرِينَ
    erreurs:
      مُنْتَصِرُونَ: نسيان نصب الحال
      المُنْتَصِرُونَ: الحال لا يكون معرفة
    indice: الحَالُ نَكِرَةٌ مَنْصُوبَةٌ، وَجَمْعُ المُذَكَّرِ السَّالِمُ يُنْصَبُ بِاليَاءِ.
    explication: 'نَقُولُ «رَجَعَ الجُنُودُ مُنْتَصِرِينَ»: حَالٌ مَنْصُوبٌ بِاليَاءِ لِأَنَّهُ جَمْعُ مُذَكَّرٍ سَالِمٌ.'
- notion: الفعل اللازم والفعل المتعدي
  exercices:
  - id: lazim-1
    difficulte: 1
    enonce: هَلِ الفِعْلُ فِي «نَامَ الطِّفْلُ» لَازِمٌ أَمْ مُتَعَدٍّ؟ (لَازِمٌ / مُتَعَدٍّ)
    reponses:
    - لَازِمٌ
    erreurs:
      مُتَعَدٍّ: خلط بين اللازم والمتعدي
    indice: هَلْ يَحْتَاجُ الفِعْلُ «نَامَ» إِلَى مَفْعُولٍ بِهِ؟
    explication: '«نَامَ» فِعْلٌ لَازِمٌ: يَكْتَفِي بِفَاعِلِهِ وَلَا يَحْتَاجُ إِلَى مَفْعُولٍ بِهِ.'
  - id: lazim-2
    difficulte: 2
    enonce: هَلِ الفِعْلُ فِي «فَتَحَ أَحْمَدُ النَّافِذَةَ» لَازِمٌ أَمْ مُتَعَدٍّ؟ (لَازِمٌ / مُتَعَدٍّ)
    reponses:
    - مُتَعَدٍّ
    erreurs:
      لَازِمٌ: خلط بين اللازم والمتعدي
    indice: هَلْ فِي الجُمْلَةِ مَفْعُولٌ بِهِ؟
    explication: '«فَتَحَ» فِعْلٌ مُتَعَدٍّ: نَصَبَ مَفْعُولًا بِهِ هُوَ «النَّافِذَةَ».'
  - id: lazim-3
    difficulte: 3
    enonce: 'اِخْتَرِ الفِعْلَ اللَّازِمَ: (أَكَلَ / جَلَسَ / شَرِبَ)'
    reponses:
    - جَلَسَ
    erreurs:
      أَكَلَ: خلط بين اللازم والمتعدي
      شَرِبَ: خلط بين اللازم والمتعدي
    indice: 'نَقُولُ «أَكَلَ الخُبْزَ» وَ«شَرِبَ المَاءَ»: وَأَيُّ فِعْلٍ لَا يَحْتَاجُ إِلَى مَفْعُولٍ بِهِ؟'
    explication: '«جَلَسَ» فِعْلٌ لَازِمٌ: نَقُولُ «جَلَسَ الوَلَدُ» دُونَ مَفْعُولٍ بِهِ.'
- notion: نائب الفاعل
  exercices:
  - id: naib-1
    difficulte: 1
    enonce: 'مَا نَائِبُ الفَاعِلِ فِي: كُسِرَ الزُّجَاجُ؟ (كُسِرَ / الزُّجَاجُ)'
    reponses:
    - الزُّجَاجُ
    erreurs:
      كُسِرَ: خلط بين الفعل ونائب الفاعل
    indice: نَائِبُ الفَاعِلِ اسْمٌ مَرْفُوعٌ يَأْتِي بَعْدَ الفِعْلِ المَبْنِيِّ لِلْمَجْهُولِ.
    explication: نَائِبُ الفَاعِلِ هُوَ «الزُّجَاجُ»، مَرْفُوعٌ بِالضَّمَّةِ.
  - id: naib-2
    difficulte: 2
    enonce: 'مَا نَائِبُ الفَاعِلِ فِي: كُتِبَ الدَّرْسُ عَلَى السَّبُّورَةِ؟ (السَّبُّورَةِ / كُتِبَ / الدَّرْسُ)'
    reponses:
    - الدَّرْسُ
    erreurs:
      السَّبُّورَةِ: خلط بين نائب الفاعل والاسم المجرور
      كُتِبَ: خلط بين الفعل ونائب الفاعل
    indice: مَا الَّذِي كُتِبَ؟
    explication: نَائِبُ الفَاعِلِ هُوَ «الدَّرْسُ». أَمَّا «السَّبُّورَةِ» فَاسْمٌ مَجْرُورٌ بِـ«عَلَى».
  - id: naib-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'حَوِّلْ إِلَى المَبْنِيِّ لِلْمَجْهُولِ: فَتَحَ الحَارِسُ البَابَ. (فُتِحَ البَابَ / فَتَحَ البَابُ / فُتِحَ البَابُ)'
    reponses:
    - فُتِحَ البَابُ
    erreurs:
      فُتِحَ البَابَ: نسيان رفع نائب الفاعل
      فَتَحَ البَابُ: عدم بناء الفعل للمجهول
    indice: نَضُمُّ أَوَّلَ الفِعْلِ وَنَكْسِرُ مَا قَبْلَ آخِرِهِ، وَيُرْفَعُ المَفْعُولُ بِهِ.
    explication: 'نَقُولُ «فُتِحَ البَابُ»: الفِعْلُ مَبْنِيٌّ لِلْمَجْهُولِ، وَ«البَابُ» نَائِبُ فَاعِلٍ مَرْفُوعٌ.'
