      الهَمْزَةُ: خطأ في وزن اسم المكان
    indice: مَلْعَبٌ، مَكْتَبٌ، مَنْزِلٌ.
    explication: 'اسْمُ المَكَانِ يَبْدَأُ بِمِيمٍ مَفْتُوحَةٍ: مَفْعَلٌ أَوْ مَفْعِلٌ.'
- notion: اسم الآلة
