    enonce: مَا حُكْمُ المُسْتَثْنَى بِـ«إِلَّا» فِي الكَلَامِ التَّامِّ المُثْبَتِ؟ (وَاجِبُ النَّصْبِ / وَاجِبُ الرَّفْعِ / وَاجِبُ الجَرِّ)
    reponses:
    - وَاجِبُ النَّصْبِ
    erreurs:
      وَاجِبُ الرَّفْعِ: خطأ في حكم المستثنى
      وَاجِبُ الجَرِّ: خطأ في حكم المستثنى
    indice: 'الكَلَامُ التَّامُّ: ذُكِرَ فِيهِ المُسْتَثْنَى مِنْهُ؛ المُثْبَتُ: لَا نَفْيَ فِيهِ.'
    explication: المُسْتَثْنَى بِـ«إِلَّا» فِي الكَلَامِ التَّامِّ المُثْبَتِ وَاجِبُ النَّصْبِ.
  - id: istithna-10
    difficulte: 2
    enonce: أَيُّ جُمْلَةٍ فِيهَا اسْتِثْنَاءٌ؟ (خَرَجَ الطُّلَّابُ إِلَّا طَالِبًا / خَرَجَ الطُّلَّابُ مَسْرُورِينَ / خَرَجَ الطُّلَّابُ وَالمُعَلِّمُ)
    reponses:
    - خَرَجَ الطُّلَّابُ إِلَّا طَالِبًا
    erreurs:
      خَرَجَ الطُّلَّابُ مَسْرُورِينَ: خلط بين الاستثناء وغيره
      خَرَجَ الطُّلَّابُ وَالمُعَلِّمُ: خلط بين الاستثناء وغيره
    indice: اِبْحَثْ عَنْ «إِلَّا».
    explication: '«إِلَّا طَالِبًا» اسْتِثْنَاءٌ: أَخْرَجْنَا طَالِبًا مِنْ حُكْمِ الخُرُوجِ.'
  - id: istithna-11
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: نَجَحَ المُتَبَارُونَ إِلَّا ... (اثْنَيْنِ / اثْنَانِ / اثْنَيْ)'
    reponses:
    - اثْنَيْنِ
    erreurs:
      اثْنَانِ: خطأ في إعراب المستثنى
      اثْنَيْ: خطأ في إعراب المستثنى
    indice: المُسْتَثْنَى مَنْصُوبٌ، وَ«اثْنَانِ» يُنْصَبُ بِاليَاءِ.
    explication: 'نَقُولُ: نَجَحَ المُتَبَارُونَ إِلَّا اثْنَيْنِ.'
  - id: istithna-12
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: عَادَ اللَّاعِبُونَ إِلَّا ... (المُصَابُونَ / المُصَابِينَ / المُصَابَانِ)'
    reponses:
    - المُصَابِينَ
    erreurs:
      المُصَابُونَ: خطأ في إعراب المستثنى
      المُصَابَانِ: خطأ في إعراب المستثنى
    indice: المُسْتَثْنَى مَنْصُوبٌ، وَجَمْعُ المُذَكَّرِ السَّالِمِ يُنْصَبُ بِاليَاءِ.
    explication: 'نَقُولُ: عَادَ اللَّاعِبُونَ إِلَّا المُصَابِينَ.'
  - id: istithna-13
    difficulte: 3
    enonce: مَا الَّذِي يُفِيدُهُ الاِسْتِثْنَاءُ؟ (إِخْرَاجُ مَا بَعْدَ «إِلَّا» مِنْ حُكْمِ مَا قَبْلَهَا / تَوْكِيدُ الكَلَامِ / التَّشْبِيهُ)
    reponses:
    - إِخْرَاجُ مَا بَعْدَ «إِلَّا» مِنْ حُكْمِ مَا قَبْلَهَا
    erreurs:
      تَوْكِيدُ الكَلَامِ: خطأ في معنى الاستثناء
      التَّشْبِيهُ: خطأ في معنى الاستثناء
    indice: 'حَضَرَ التَّلَامِيذُ إِلَّا سَعِيدًا: هَلْ حَضَرَ سَعِيدٌ؟'
    explication: الاِسْتِثْنَاءُ يُخْرِجُ مَا بَعْدَ «إِلَّا» مِنْ حُكْمِ مَا قَبْلَهَا.
