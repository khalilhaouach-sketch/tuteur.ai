      شَارِبٌ: خلط بين اسم الآلة وغيره
    indice: اسْمُ الآلَةِ يَبْدَأُ غَالِبًا بِمِيمٍ مَكْسُورَةٍ.
    explication: «مِشْرَطٌ» اسْمُ آلَةٍ عَلَى وَزْنِ «مِفْعَلٌ».
  - id: ala-6
    difficulte: 1
    enonce: مَا اسْمُ الآلَةِ مِنْ «قَصَّ»؟ (قَاصٌّ / مِقَصٌّ / مَقْصُوصٌ)
    reponses:
    - مِقَصٌّ
    erreurs:
      قَاصٌّ: خلط بين اسم الآلة وغيره
      مَقْصُوصٌ: خلط بين اسم الآلة وغيره
    indice: الأَدَاةُ الَّتِي نَقُصُّ بِهَا.
    explication: 'اسْمُ الآلَةِ مِنْ «قَصَّ»: مِقَصٌّ.'
  - id: ala-7
    difficulte: 2
    enonce: مَا اسْمُ الآلَةِ مِنْ «غَسَلَ»؟ (غَاسِلٌ / مَغْسُولٌ / غَسَّالَةٌ)
    reponses:
    - غَسَّالَةٌ
    erreurs:
      غَاسِلٌ: خلط بين اسم الآلة وغيره
      مَغْسُولٌ: خلط بين اسم الآلة وغيره
    indice: 'مِنْ أَوْزَانِهِ الحَدِيثَةِ: «فَعَّالَةٌ».'
    explication: «غَسَّالَةٌ» اسْمُ آلَةٍ عَلَى وَزْنِ «فَعَّالَةٌ».
  - id: ala-8
    difficulte: 2
    enonce: مَا اسْمُ الآلَةِ مِنْ «بَرَدَ»؟ (بَارِدٌ / مِبْرَدٌ / مَبْرُودٌ)
    reponses:
    - مِبْرَدٌ
    erreurs:
      بَارِدٌ: خلط بين اسم الآلة وغيره
      مَبْرُودٌ: خلط بين اسم الآلة وغيره
    indice: عَلَى وَزْنِ «مِفْعَلٌ».
    explication: «مِبْرَدٌ» اسْمُ آلَةٍ.
  - id: ala-9
    difficulte: 2
    enonce: عَلَى أَيِّ وَزْنٍ جَاءَ «مِنْشَارٌ»؟ (مِفْعَالٌ / مِفْعَلٌ / مِفْعَلَةٌ)
    reponses:
    - مِفْعَالٌ
    erreurs:
      مِفْعَلٌ: خطأ في أوزان اسم الآلة
      مِفْعَلَةٌ: خطأ في أوزان اسم الآلة
    indice: 'قَابِلِ الحُرُوفَ: مِـ نْـ شَا رٌ.'
    explication: «مِنْشَارٌ» عَلَى وَزْنِ «مِفْعَالٌ».
  - id: ala-10
    difficulte: 2
    enonce: عَلَى أَيِّ وَزْنٍ جَاءَ «مِلْعَقَةٌ»؟ (مِفْعَالٌ / مِفْعَلٌ / مِفْعَلَةٌ)
    reponses:
    - مِفْعَلَةٌ
    erreurs:
      مِفْعَالٌ: خطأ في أوزان اسم الآلة
      مِفْعَلٌ: خطأ في أوزان اسم الآلة
    indice: فِي آخِرِهَا تَاءٌ مَرْبُوطَةٌ.
    explication: «مِلْعَقَةٌ» عَلَى وَزْنِ «مِفْعَلَةٌ».
  - id: ala-11
    difficulte: 3
    enonce: مَا اسْمُ الآلَةِ مِنْ «ثَقَبَ»؟ (ثَاقِبٌ / مِثْقَبٌ / مَثْقُوبٌ)
    reponses:
    - مِثْقَبٌ
    erreurs:
      ثَاقِبٌ: خلط بين اسم الآلة وغيره
      مَثْقُوبٌ: خلط بين اسم الآلة وغيره
    indice: الأَدَاةُ الَّتِي نَثْقُبُ بِهَا.
    explication: «مِثْقَبٌ» اسْمُ آلَةٍ عَلَى وَزْنِ «مِفْعَلٌ».
  - id: ala-12
    difficulte: 3
    enonce: أَيُّ كَلِمَةٍ اسْمُ آلَةٍ جَامِدٌ (لَيْسَ لَهُ فِعْلٌ)؟ (سِكِّينٌ / مِبْرَدٌ / مِفْتَاحٌ)
    reponses:
    - سِكِّينٌ
    erreurs:
      مِبْرَدٌ: خلط بين اسم الآلة المشتق والجامد
      مِفْتَاحٌ: خلط بين اسم الآلة المشتق والجامد
    indice: «مِبْرَدٌ» مِنْ «بَرَدَ»، وَ«مِفْتَاحٌ» مِنْ «فَتَحَ».
    explication: '«سِكِّينٌ» اسْمُ آلَةٍ جَامِدٌ: لَا يُشْتَقُّ مِنْ فِعْلٍ.'
  - id: ala-13
    difficulte: 3
    enonce: مَا اسْمُ الآلَةِ مِنْ «ثَلَجَ»؟ (ثَلْجٌ / ثَلَّاجَةٌ / مَثْلُوجٌ)
    reponses:
    - ثَلَّاجَةٌ
    erreurs:
      ثَلْجٌ: خلط بين اسم الآلة وغيره
      مَثْلُوجٌ: خلط بين اسم الآلة وغيره
    indice: عَلَى وَزْنِ «فَعَّالَةٌ».
    explication: «ثَلَّاجَةٌ» اسْمُ آلَةٍ.
- notion: اسم التفضيل
  exercices:
  - id: tafdil-1
    difficulte: 1
    enonce: 'اِخْتَرِ الكَلِمَةَ المُنَاسِبَةَ: الفِيلُ ... مِنَ الحِصَانِ. (كَبِيرٌ / أَكْبَرُ / كَبُرَ)'
    reponses:
    - أَكْبَرُ
    erreurs:
      كَبِيرٌ: عدم استعمال اسم التفضيل
      كَبُرَ: خلط بين الفعل واسم التفضيل
    indice: 'نُقَارِنُ بَيْنَ شَيْئَيْنِ: نَسْتَعْمِلُ وَزْنَ «أَفْعَلَ».'
    explication: 'نَقُولُ «الفِيلُ أَكْبَرُ مِنَ الحِصَانِ»: «أَكْبَرُ» اسْمُ تَفْضِيلٍ.'
  - id: tafdil-2
    difficulte: 2
    enonce: مَا اسْمُ التَّفْضِيلِ مِنْ «صَغِيرٌ»؟ (صَغِيرَةٌ / أَصْغَرُ / مُصَغَّرٌ)
    reponses:
    - أَصْغَرُ
    erreurs:
      صَغِيرَةٌ: خلط بين التأنيث والتفضيل
      مُصَغَّرٌ: خطأ في وزن اسم التفضيل
    indice: اِسْمُ التَّفْضِيلِ عَلَى وَزْنِ «أَفْعَلَ».
    explication: 'اِسْمُ التَّفْضِيلِ هُوَ «أَصْغَرُ»: عَلَى وَزْنِ «أَفْعَلَ».'
  - id: tafdil-3
    difficulte: 3
    enonce: مَا مُؤَنَّثُ اسْمِ التَّفْضِيلِ «أَكْبَرُ»؟ (كَبِيرَةٌ / أَكْبَرَةٌ / كُبْرَى)
    reponses:
    - كُبْرَى
    erreurs:
      كَبِيرَةٌ: خلط بين الصفة واسم التفضيل
      أَكْبَرَةٌ: خطأ في تأنيث اسم التفضيل
    indice: مُؤَنَّثُ «أَفْعَلَ» عَلَى وَزْنِ «فُعْلَى».
    explication: 'مُؤَنَّثُ «أَكْبَرُ» هُوَ «كُبْرَى» عَلَى وَزْنِ «فُعْلَى»: الجَائِزَةُ الكُبْرَى.'
  - id: tafdil-4
    difficulte: 1
    enonce: مَا اسْمُ التَّفْضِيلِ مِنْ «كَبِيرٌ»؟ (كُبْرَى / أَكْبَرُ / كِبَارٌ)
    reponses:
    - أَكْبَرُ
    erreurs:
      كُبْرَى: خطأ في صياغة اسم التفضيل
      كِبَارٌ: خطأ في صياغة اسم التفضيل
    indice: اسْمُ التَّفْضِيلِ عَلَى وَزْنِ «أَفْعَلُ».
    explication: 'اسْمُ التَّفْضِيلِ مِنْ «كَبِيرٌ»: أَكْبَرُ.'
  - id: tafdil-5
    difficulte: 1
    enonce: 'اِخْتَرِ الكَلِمَةَ المُنَاسِبَةَ: الصَّيْفُ ... مِنَ الشِّتَاءِ. (حَارٌّ / أَحَرُّ / حَرَارَةٌ)'
    reponses:
    - أَحَرُّ
    erreurs:
      حَارٌّ: خطأ في استعمال اسم التفضيل
      حَرَارَةٌ: خطأ في استعمال اسم التفضيل
    indice: نُقَارِنُ بَيْنَ شَيْئَيْنِ.
    explication: 'نَقُولُ: الصَّيْفُ أَحَرُّ مِنَ الشِّتَاءِ.'
  - id: tafdil-6
    difficulte: 1
    enonce: 'مَا اسْمُ التَّفْضِيلِ فِي: أَحْمَدُ أَطْوَلُ مِنْ أَخِيهِ؟ (أَحْمَدُ / أَطْوَلُ / أَخِيهِ)'
    reponses:
    - أَطْوَلُ
    erreurs:
      أَحْمَدُ: خطأ في تحديد اسم التفضيل
      أَخِيهِ: خطأ في تحديد اسم التفضيل
    indice: اِبْحَثْ عَنْ كَلِمَةٍ عَلَى وَزْنِ «أَفْعَلُ».
    explication: اسْمُ التَّفْضِيلِ «أَطْوَلُ».
  - id: tafdil-7
    difficulte: 2
    enonce: مَا اسْمُ التَّفْضِيلِ مِنْ «جَمِيلٌ»؟ (أَجْمَلُ / جَمِيلَةٌ / جَمَالٌ)
    reponses:
    - أَجْمَلُ
    erreurs:
      جَمِيلَةٌ: خطأ في صياغة اسم التفضيل
      جَمَالٌ: خطأ في صياغة اسم التفضيل
    indice: عَلَى وَزْنِ «أَفْعَلُ».
    explication: 'اسْمُ التَّفْضِيلِ مِنْ «جَمِيلٌ»: أَجْمَلُ.'
  - id: tafdil-8
    difficulte: 2
    enonce: مَا مُؤَنَّثُ «أَصْغَرُ»؟ (صَغِيرَةٌ / صُغْرَى / أَصْغَرَةٌ)
    reponses:
    - صُغْرَى
    erreurs:
      صَغِيرَةٌ: خطأ في مؤنث اسم التفضيل
      أَصْغَرَةٌ: خطأ في مؤنث اسم التفضيل
    indice: مُؤَنَّثُ «أَفْعَلُ» عَلَى وَزْنِ «فُعْلَى».
    explication: 'مُؤَنَّثُ «أَصْغَرُ»: صُغْرَى.'
  - id: tafdil-9
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: الفِيلُ ... الحَيَوَانَاتِ البَرِّيَّةِ. (أَضْخَمُ / ضَخْمٌ / ضَخَامَةٌ)'
    reponses:
    - أَضْخَمُ
    erreurs:
      ضَخْمٌ: خطأ في استعمال اسم التفضيل
      ضَخَامَةٌ: خطأ في استعمال اسم التفضيل
    indice: نُفَضِّلُ الفِيلَ عَلَى غَيْرِهِ.
    explication: 'نَقُولُ: الفِيلُ أَضْخَمُ الحَيَوَانَاتِ البَرِّيَّةِ.'
  - id: tafdil-10
    difficulte: 2
    enonce: مَا الحَرْفُ الَّذِي يَأْتِي غَالِبًا بَعْدَ اسْمِ التَّفْضِيلِ النَّكِرَةِ؟ (مِنْ / فِي / عَلَى)
    reponses:
    - مِنْ
    erreurs:
      فِي: خطأ في استعمال اسم التفضيل
      عَلَى: خطأ في استعمال اسم التفضيل
    indice: 'مِثَالٌ: العِلْمُ أَنْفَعُ ... المَالِ.'
    explication: 'نَقُولُ: العِلْمُ أَنْفَعُ مِنَ المَالِ.'
  - id: tafdil-11
    difficulte: 3
    enonce: مَا اسْمُ التَّفْضِيلِ مِنْ «شَدِيدٌ»؟ (أَشَدُّ / أَشْدَدُ / شُدَّى)
    reponses:
    - أَشَدُّ
    erreurs:
      أَشْدَدُ: خطأ في صياغة اسم التفضيل
      شُدَّى: خطأ في صياغة اسم التفضيل
    indice: إِذَا تَكَرَّرَ الحَرْفَانِ الأَخِيرَانِ أُدْغِمَا.
    explication: 'اسْمُ التَّفْضِيلِ مِنْ «شَدِيدٌ»: أَشَدُّ.'
  - id: tafdil-12
    difficulte: 3
    enonce: مَا مُؤَنَّثُ «الأَفْضَلُ»؟ (الفُضْلَى / الفَاضِلَةُ / الأَفْضَلَةُ)
    reponses:
    - الفُضْلَى
    erreurs:
      الفَاضِلَةُ: خطأ في مؤنث اسم التفضيل
      الأَفْضَلَةُ: خطأ في مؤنث اسم التفضيل
    indice: عَلَى وَزْنِ «فُعْلَى».
    explication: 'مُؤَنَّثُ «الأَفْضَلُ»: الفُضْلَى.'
  - id: tafdil-13
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: فَاطِمَةُ ... بِنْتٍ فِي القِسْمِ. (أَنْشَطُ / نُشْطَى / نَشِيطَةٌ)'
    reponses:
    - أَنْشَطُ
    erreurs:
      نُشْطَى: خطأ في استعمال اسم التفضيل
      نَشِيطَةٌ: خطأ في استعمال اسم التفضيل
    indice: إِذَا أُضِيفَ اسْمُ التَّفْضِيلِ إِلَى نَكِرَةٍ بَقِيَ مُفْرَدًا مُذَكَّرًا.
    explication: 'نَقُولُ: فَاطِمَةُ أَنْشَطُ بِنْتٍ فِي القِسْمِ.'
- notion: الألف اللينة
  exercices:
  - id: alif-1
    difficulte: 1
    enonce: 'اِخْتَرِ الكِتَابَةَ الصَّحِيحَةَ لِلْفِعْلِ الَّذِي مُضَارِعُهُ «يَرْمِي»: (رَمَا / رَمَى)'
    reponses:
    - رَمَى
    erreurs:
      رَمَا: خطأ في رسم الألف اللينة
    indice: 'أَصْلُ الأَلِفِ يَاءٌ (يَرْمِي): تُكْتَبُ مَقْصُورَةً.'
    explication: 'نَكْتُبُ «رَمَى» بِأَلِفٍ مَقْصُورَةٍ، لِأَنَّ أَصْلَهَا يَاءٌ: يَرْمِي.'
    tolerer_hamza: false
  - id: alif-2
    difficulte: 2
    enonce: 'اِخْتَرِ الكِتَابَةَ الصَّحِيحَةَ لِلْفِعْلِ الَّذِي مُضَارِعُهُ «يَدْعُو»: (دَعَى / دَعَا)'
    reponses:
    - دَعَا
    erreurs:
      دَعَى: خطأ في رسم الألف اللينة
    indice: 'أَصْلُ الأَلِفِ وَاوٌ (يَدْعُو): تُكْتَبُ قَائِمَةً.'
    explication: 'نَكْتُبُ «دَعَا» بِأَلِفٍ قَائِمَةٍ، لِأَنَّ أَصْلَهَا وَاوٌ: يَدْعُو.'
    tolerer_hamza: false
  - id: alif-3
    difficulte: 3
    enonce: 'اِخْتَرِ الكِتَابَةَ الصَّحِيحَةَ: (مُسْتَشْفَا / مُسْتَشْفَى)'
    reponses:
    - مُسْتَشْفَى
    erreurs:
      مُسْتَشْفَا: خطأ في رسم الألف اللينة
    indice: فِي الاِسْمِ الَّذِي يَزِيدُ عَلَى ثَلَاثَةِ أَحْرُفٍ، تُكْتَبُ الأَلِفُ مَقْصُورَةً إِلَّا إِذَا سَبَقَتْهَا يَاءٌ.
    explication: 'نَكْتُبُ «مُسْتَشْفَى» بِأَلِفٍ مَقْصُورَةٍ: الاِسْمُ فَوْقَ الثُّلَاثِيِّ، وَلَمْ تَسْبِقِ الأَلِفَ يَاءٌ.'
    tolerer_hamza: false
  - id: alif-4
    difficulte: 1
    enonce: 'اِخْتَرِ الكِتَابَةَ الصَّحِيحَةَ: (دَعَى / دَعَا)'
    reponses:
    - دَعَا
    erreurs:
      دَعَى: خطأ في كتابة الألف اللينة
    indice: 'مُضَارِعُهُ «يَدْعُو»: الأَلِفُ أَصْلُهَا وَاوٌ.'
    explication: نَكْتُبُ «دَعَا» بِأَلِفٍ قَائِمَةٍ لِأَنَّ أَصْلَهَا وَاوٌ (يَدْعُو).
  - id: alif-5
    difficulte: 1
    enonce: 'اِخْتَرِ الكِتَابَةَ الصَّحِيحَةَ: (بَكَى / بَكَا)'
    reponses:
    - بَكَى
    erreurs:
      بَكَا: خطأ في كتابة الألف اللينة
    indice: 'مُضَارِعُهُ «يَبْكِي»: الأَلِفُ أَصْلُهَا يَاءٌ.'
    explication: نَكْتُبُ «بَكَى» بِأَلِفٍ مَقْصُورَةٍ لِأَنَّ أَصْلَهَا يَاءٌ (يَبْكِي).
  - id: alif-6
    difficulte: 1
    enonce: 'اِخْتَرِ الكِتَابَةَ الصَّحِيحَةَ: (سَمَا / سَمَى)'
    reponses:
    - سَمَا
