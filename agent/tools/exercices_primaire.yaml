      اللَّاعِبُونَ: خطأ في إعراب المثنى
    indice: الفَاعِلُ مَرْفُوعٌ، وَالمُثَنَّى يُرْفَعُ بِالأَلِفِ.
    explication: 'نَقُولُ: فَازَ اللَّاعِبَانِ.'
  - id: muthanna-6
    difficulte: 1
    enonce: 'اِخْتَرِ الصَّحِيحَ: رَأَيْتُ ... (العُصْفُورَانِ / العُصْفُورَيْنِ / العَصَافِيرُ)'
    reponses:
