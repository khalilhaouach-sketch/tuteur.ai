    indice: 'النَّعْتُ يَتْبَعُ المَنْعُوتَ: «المَدِينَةَ» مَعْرِفَةٌ وَمُؤَنَّثٌ وَمَنْصُوبٌ.'
    explication: 'نَقُولُ «زُرْتُ المَدِينَةَ القَدِيمَةَ»: النَّعْتُ مَعْرِفَةٌ مُؤَنَّثٌ مَنْصُوبٌ مِثْلَ المَنْعُوتِ.'
