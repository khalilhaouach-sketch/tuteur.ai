      لِأَنَّهُ أَكَلَ: خطأ في فهم الجملة
    indice: اِقْرَأْ مَا بَعْدَ كَلِمَةِ «لِأَنَّهُ».
    explication: فَرِحَ الوَلَدُ لِأَنَّهُ نَجَحَ فِي الاِمْتِحَانِ.
  - id: fahm-12
    difficulte: 3
    enonce: 'اِقْرَأْ: «حَمَلَ الفَلَّاحُ السَّلَّةَ وَذَهَبَ إِلَى الحَقْلِ». مَاذَا حَمَلَ الفَلَّاحُ؟ (الحَقْلَ / المِحْرَاثَ / السَّلَّةَ)'
    reponses:
