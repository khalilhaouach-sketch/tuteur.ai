    indice: كَمْ مُعَلِّمًا تَدُلُّ عَلَيْهِ الكَلِمَةُ؟
    explication: '«مُعَلِّمُونَ» جَمْعٌ: تَدُلُّ عَلَى أَكْثَرَ مِنِ اثْنَيْنِ.'
  - id: adad-3
    difficulte: 3
    enonce: مَا جَمْعُ «وَلَدٌ»؟ (أَوْلَادٌ / وَلَدَانِ / وَلِيدٌ)
