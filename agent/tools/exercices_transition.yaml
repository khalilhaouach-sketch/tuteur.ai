    indice: اِقْرَأْ آخِرَ كَلِمَةٍ فِي الجُمْلَةِ.
    explication: يَقْرَأُ الأَبُ الجَرِيدَةَ.
  - id: fahm-8
    difficulte: 2
    enonce: 'اِقْرَأْ: «طَارَ العُصْفُورُ إِلَى الشَّجَرَةِ». إِلَى أَيْنَ طَارَ العُصْفُورُ؟ (إِلَى البَيْتِ / إِلَى البَحْرِ / إِلَى الشَّجَرَةِ)'
    reponses:
    - إِلَى الشَّجَرَةِ
    erreurs:
      إِلَى البَيْتِ: خطأ في فهم الجملة
      إِلَى البَحْرِ: خطأ في فهم الجملة
    indice: اِبْحَثْ عَنِ الكَلِمَةِ الَّتِي بَعْدَ «إِلَى».
    explication: طَارَ العُصْفُورُ إِلَى الشَّجَرَةِ.
  - id: fahm-9
    difficulte: 2
    enonce: 'اِقْرَأْ: «فِي المَسَاءِ، نَامَ الطِّفْلُ مُبَكِّرًا». مَتَى نَامَ الطِّفْلُ؟ (فِي الصَّبَاحِ / فِي المَسَاءِ / فِي الظُّهْرِ)'
    reponses:
    - فِي المَسَاءِ
    erreurs:
      فِي الصَّبَاحِ: خطأ في فهم الجملة
      فِي الظُّهْرِ: خطأ في فهم الجملة
    indice: الجَوَابُ فِي أَوَّلِ الجُمْلَةِ.
    explication: نَامَ الطِّفْلُ فِي المَسَاءِ.
  - id: fahm-10
    difficulte: 2
    enonce: 'اِقْرَأْ: «لِسَلْمَى قِطَّتَانِ». كَمْ قِطَّةً لِسَلْمَى؟ (قِطَّةٌ وَاحِدَةٌ / قِطَّتَانِ / ثَلَاثُ قِطَطٍ)'
    reponses:
