    indice: مَنْ قَامَ بِالشُّرْبِ؟ اِقْرَأِ الكَلِمَةَ بَعْدَ «شَرِبَتْ».
    explication: شَرِبَتْ فَاطِمَةُ الحَلِيبَ.
  - id: fahm-6
    difficulte: 1
    enonce: 'اِقْرَأْ: «القِطُّ تَحْتَ الطَّاوِلَةِ». أَيْنَ القِطُّ؟ (تَحْتَ الطَّاوِلَةِ / فَوْقَ الطَّاوِلَةِ / فِي الحَدِيقَةِ)'
    reponses:
