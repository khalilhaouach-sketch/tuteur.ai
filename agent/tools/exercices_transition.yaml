    erreurs:
      الحَقْلَ: خطأ في فهم الجملة
      المِحْرَاثَ: خطأ في فهم الجملة
    indice: اِقْرَأِ الكَلِمَةَ الَّتِي بَعْدَ «الفَلَّاحُ».
    explication: حَمَلَ الفَلَّاحُ السَّلَّةَ، وَذَهَبَ إِلَى الحَقْلِ.
