    enonce: 'اِخْتَرِ الكَلِمَةَ الَّتِي فِيهَا كَسْرَةٌ عَلَى الحَرْفِ الأَوَّلِ: (جَمَلٌ / جِسْرٌ / جُبْنٌ)'
