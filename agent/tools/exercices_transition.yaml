    explication: 'عَلَى الكَافِ فِي «كُتُبٌ» ضَمَّةٌ: كُ.'
  - id: haraka-6
    difficulte: 1
    enonce: مَا الحَرَكَةُ عَلَى السِّينِ فِي «سِكِّينٌ»؟ (فَتْحَةٌ / ضَمَّةٌ / كَسْرَةٌ)
