# Banque d'exercices des paliers de transition (entre les lettres du CP et la 1AC) — à relire.
# Exercices à choix (boutons). Même format que exercices_1ac.yaml.

niveau: P1
notions:
- notion: الحركات القصيرة
  exercices:
  - id: haraka-1
    difficulte: 1
    enonce: مَا الحَرَكَةُ عَلَى البَاءِ فِي «كَتَبَ»؟ (فَتْحَةٌ / ضَمَّةٌ / كَسْرَةٌ)
    reponses:
    - فَتْحَةٌ
    erreurs:
      ضَمَّةٌ: خلط بين الحركات
      كَسْرَةٌ: خلط بين الحركات
    indice: الفَتْحَةُ خَطٌّ صَغِيرٌ فَوْقَ الحَرْفِ.
    explication: 'عَلَى البَاءِ فِي «كَتَبَ» فَتْحَةٌ: بَ.'
  - id: haraka-2
    difficulte: 2
    voyelles_obligatoires: true
    enonce: 'اِخْتَرِ الكَلِمَةَ الَّتِي فِيهَا ضَمَّةٌ عَلَى الحَرْفِ الأَوَّلِ: (كَتَبَ / كُتُبٌ / كِتَابٌ)'
    reponses:
    - كُتُبٌ
    erreurs:
      كَتَبَ: خلط بين الحركات
      كِتَابٌ: خلط بين الحركات
    indice: الضَّمَّةُ تُشْبِهُ وَاوًا صَغِيرَةً فَوْقَ الحَرْفِ.
    explication: 'فِي «كُتُبٌ» ضَمَّةٌ عَلَى الكَافِ: كُ.'
  - id: haraka-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'أَكْمِلِ الكَلِمَةَ «...تَابٌ» بِالمَقْطَعِ الصَّحِيحِ: (كِ / كَ / كُ)'
    reponses:
    - كِ
    erreurs:
      كَ: خلط بين الحركات
      كُ: خلط بين الحركات
    indice: 'اِقْرَأِ الكَلِمَةَ بِصَوْتٍ عَالٍ: كِتَابٌ.'
    explication: 'نَقُولُ «كِتَابٌ» بِكَسْرَةٍ تَحْتَ الكَافِ: كِ.'
- notion: المدود
  exercices:
  - id: madd-1
    difficulte: 1
    enonce: 'اِخْتَرِ الكَلِمَةَ الَّتِي فِيهَا مَدٌّ بِالأَلِفِ: (بَابٌ / فِيلٌ / حُوتٌ)'
    reponses:
    - بَابٌ
    erreurs:
      فِيلٌ: خلط بين حروف المد
      حُوتٌ: خلط بين حروف المد
    indice: 'المَدُّ بِالأَلِفِ يَأْتِي بَعْدَ الفَتْحَةِ: بَا.'
    explication: 'فِي «بَابٌ» مَدٌّ بِالأَلِفِ: بَا.'
  - id: madd-2
    difficulte: 2
    enonce: 'اِخْتَرِ الكَلِمَةَ الَّتِي فِيهَا مَدٌّ بِاليَاءِ: (نُورٌ / فِيلٌ / نَارٌ)'
    reponses:
    - فِيلٌ
    erreurs:
      نُورٌ: خلط بين حروف المد
      نَارٌ: خلط بين حروف المد
    indice: 'المَدُّ بِاليَاءِ يَأْتِي بَعْدَ الكَسْرَةِ: فِي.'
    explication: 'فِي «فِيلٌ» مَدٌّ بِاليَاءِ: فِي.'
  - id: madd-3
    difficulte: 3
    enonce: 'اِخْتَرِ الكَلِمَةَ الَّتِي فِيهَا مَدٌّ بِالوَاوِ: (سُورٌ / سِيرٌ / سَارَ)'
    reponses:
    - سُورٌ
    erreurs:
      سِيرٌ: خلط بين حروف المد
      سَارَ: خلط بين حروف المد
    indice: 'المَدُّ بِالوَاوِ يَأْتِي بَعْدَ الضَّمَّةِ: سُو.'
    explication: 'فِي «سُورٌ» مَدٌّ بِالوَاوِ: سُو.'
- notion: التنوين
  exercices:
  - id: tanwin-1
    difficulte: 1
    voyelles_obligatoires: true
    enonce: 'اِخْتَرِ الكَلِمَةَ الَّتِي فِيهَا تَنْوِينُ ضَمٍّ: (قَلَمٌ / قَلَمًا / قَلَمٍ)'
    reponses:
    - قَلَمٌ
    erreurs:
      قَلَمًا: خلط بين أنواع التنوين
      قَلَمٍ: خلط بين أنواع التنوين
    indice: تَنْوِينُ الضَّمِّ ضَمَّتَانِ فَوْقَ آخِرِ الكَلِمَةِ.
    explication: فِي «قَلَمٌ» تَنْوِينُ ضَمٍّ.
  - id: tanwin-2
    difficulte: 2
    voyelles_obligatoires: true
    enonce: 'اِخْتَرِ الكَلِمَةَ الَّتِي فِيهَا تَنْوِينُ فَتْحٍ: (بَابًا / بَابٌ / بَابٍ)'
    reponses:
    - بَابًا
    erreurs:
      بَابٌ: خلط بين أنواع التنوين
      بَابٍ: خلط بين أنواع التنوين
    indice: تَنْوِينُ الفَتْحِ فَتْحَتَانِ، وَبَعْدَهُمَا أَلِفٌ غَالِبًا.
    explication: فِي «بَابًا» تَنْوِينُ فَتْحٍ.
  - id: tanwin-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'اِخْتَرِ الكَلِمَةَ الَّتِي فِيهَا تَنْوِينُ كَسْرٍ: (وَلَدٌ / وَلَدًا / وَلَدٍ)'
    reponses:
    - وَلَدٍ
    erreurs:
      وَلَدٌ: خلط بين أنواع التنوين
      وَلَدًا: خلط بين أنواع التنوين
    indice: تَنْوِينُ الكَسْرِ كَسْرَتَانِ تَحْتَ آخِرِ الكَلِمَةِ.
    explication: فِي «وَلَدٍ» تَنْوِينُ كَسْرٍ.
- notion: الشدة والسكون
  exercices:
  - id: shadda-1
    difficulte: 1
    voyelles_obligatoires: true
    enonce: 'اِخْتَرِ الكَلِمَةَ الَّتِي فِيهَا شَدَّةٌ: (سُكَّرٌ / سَمَكٌ / قَلَمٌ)'
    reponses:
    - سُكَّرٌ
    erreurs:
      سَمَكٌ: عدم تمييز الشدة
      قَلَمٌ: عدم تمييز الشدة
    indice: الشَّدَّةُ عَلَامَةٌ تُشْبِهُ حَرْفَ «سـ» صَغِيرًا فَوْقَ الحَرْفِ.
    explication: 'فِي «سُكَّرٌ» شَدَّةٌ عَلَى الكَافِ: نَنْطِقُ الكَافَ مَرَّتَيْنِ.'
  - id: shadda-2
    difficulte: 2
    voyelles_obligatoires: true
    enonce: 'اِخْتَرِ الكَلِمَةَ الَّتِي فِيهَا سُكُونٌ: (بَحْرٌ / جَمَلٌ / وَرَقٌ)'
    reponses:
    - بَحْرٌ
    erreurs:
      جَمَلٌ: عدم تمييز السكون
      وَرَقٌ: عدم تمييز السكون
    indice: السُّكُونُ دَائِرَةٌ صَغِيرَةٌ فَوْقَ الحَرْفِ.
    explication: فِي «بَحْرٌ» سُكُونٌ عَلَى الحَاءِ.
  - id: shadda-3
    difficulte: 3
    enonce: مَا العَلَامَةُ عَلَى الحَاءِ فِي «بَحْرٌ»؟ (سُكُونٌ / فَتْحَةٌ / شَدَّةٌ)
    reponses:
    - سُكُونٌ
    erreurs:
      فَتْحَةٌ: خلط بين السكون والحركات
      شَدَّةٌ: خلط بين السكون والحركات
    indice: 'اِقْرَأْ: بَحْ... هَلْ نَسْمَعُ حَرَكَةً بَعْدَ الحَاءِ؟'
    explication: عَلَى الحَاءِ فِي «بَحْرٌ» سُكُونٌ.
- notion: اللام الشمسية واللام القمرية
  exercices:
  - id: lam-1
    difficulte: 1
    enonce: هَلِ اللَّامُ فِي «الشَّمْسُ» شَمْسِيَّةٌ أَمْ قَمَرِيَّةٌ؟ (شَمْسِيَّةٌ / قَمَرِيَّةٌ)
    reponses:
    - شَمْسِيَّةٌ
    erreurs:
      قَمَرِيَّةٌ: خلط بين اللام الشمسية والقمرية
    indice: هَلْ نَنْطِقُ اللَّامَ فِي «الشَّمْسُ»؟
    explication: 'اللَّامُ فِي «الشَّمْسُ» شَمْسِيَّةٌ: تُكْتَبُ وَلَا تُنْطَقُ، وَعَلَى الشِّينِ شَدَّةٌ.'
  - id: lam-2
    difficulte: 2
    enonce: هَلِ اللَّامُ فِي «القَمَرُ» شَمْسِيَّةٌ أَمْ قَمَرِيَّةٌ؟ (شَمْسِيَّةٌ / قَمَرِيَّةٌ)
    reponses:
    - قَمَرِيَّةٌ
    erreurs:
      شَمْسِيَّةٌ: خلط بين اللام الشمسية والقمرية
    indice: هَلْ نَنْطِقُ اللَّامَ فِي «القَمَرُ»؟
    explication: 'اللَّامُ فِي «القَمَرُ» قَمَرِيَّةٌ: تُكْتَبُ وَتُنْطَقُ.'
  - id: lam-3
    difficulte: 3
    enonce: 'اِخْتَرِ الكَلِمَةَ الَّتِي فِيهَا لَامٌ شَمْسِيَّةٌ: (السَّمَكُ / البَابُ / الكِتَابُ)'
    reponses:
    - السَّمَكُ
    erreurs:
      البَابُ: خلط بين اللام الشمسية والقمرية
      الكِتَابُ: خلط بين اللام الشمسية والقمرية
    indice: اللَّامُ الشَّمْسِيَّةُ لَا تُنْطَقُ، وَيَأْتِي بَعْدَهَا حَرْفٌ عَلَيْهِ شَدَّةٌ.
    explication: 'فِي «السَّمَكُ» لَامٌ شَمْسِيَّةٌ: لَا تُنْطَقُ، وَعَلَى السِّينِ شَدَّةٌ.'
- notion: التاء المربوطة والتاء المفتوحة
  exercices:
  - id: taa-1
    difficulte: 1
    enonce: 'اِخْتَرِ الكِتَابَةَ الصَّحِيحَةَ: (شَجَرَةٌ / شَجَرَتٌ)'
    reponses:
    - شَجَرَةٌ
    erreurs:
      شَجَرَتٌ: خلط بين التاء المربوطة والمفتوحة
    indice: 'إِذَا وَقَفْنَا عَلَى الكَلِمَةِ نَقُولُ «شَجَرَهْ»: نَسْمَعُ هَاءً.'
    explication: نَكْتُبُ «شَجَرَةٌ» بِتَاءٍ مَرْبُوطَةٍ، لِأَنَّنَا نَقِفُ عَلَيْهَا بِالهَاءِ.
  - id: taa-2
    difficulte: 2
    enonce: 'اِخْتَرِ الكِتَابَةَ الصَّحِيحَةَ: (بَيْتٌ / بَيْةٌ)'
    reponses:
    - بَيْتٌ
    erreurs:
      بَيْةٌ: خلط بين التاء المربوطة والمفتوحة
    indice: 'إِذَا وَقَفْنَا عَلَى الكَلِمَةِ نَقُولُ «بَيْتْ»: نَسْمَعُ تَاءً.'
    explication: نَكْتُبُ «بَيْتٌ» بِتَاءٍ مَفْتُوحَةٍ، لِأَنَّنَا نَقِفُ عَلَيْهَا بِالتَّاءِ.
  - id: taa-3
    difficulte: 3
    enonce: 'اِخْتَرِ الكِتَابَةَ الصَّحِيحَةَ لِلْفِعْلِ: (كَتَبَتْ / كَتَبَةْ)'
    reponses:
    - كَتَبَتْ
    erreurs:
      كَتَبَةْ: خلط بين التاء المربوطة والمفتوحة
    indice: تَاءُ التَّأْنِيثِ فِي آخِرِ الفِعْلِ تَكُونُ دَائِمًا مَفْتُوحَةً.
    explication: 'نَكْتُبُ «كَتَبَتْ» بِتَاءٍ مَفْتُوحَةٍ: الأَفْعَالُ لَا تَنْتَهِي بِتَاءٍ مَرْبُوطَةٍ.'
- notion: فهم الجملة
  exercices:
  - id: fahm-1
    difficulte: 1
    enonce: 'اِقْرَأْ: «ذَهَبَ أَحْمَدُ إِلَى المَدْرَسَةِ». إِلَى أَيْنَ ذَهَبَ أَحْمَدُ؟ (إِلَى المَدْرَسَةِ / إِلَى السُّوقِ / إِلَى البَحْرِ)'
    reponses:
    - إِلَى المَدْرَسَةِ
    erreurs:
      إِلَى السُّوقِ: خطأ في فهم الجملة
      إِلَى البَحْرِ: خطأ في فهم الجملة
    indice: اِقْرَأِ الجُمْلَةَ مَرَّةً أُخْرَى، وَابْحَثْ عَنِ المَكَانِ.
    explication: ذَهَبَ أَحْمَدُ إِلَى المَدْرَسَةِ، كَمَا تَقُولُ الجُمْلَةُ.
  - id: fahm-2
    difficulte: 2
    enonce: 'اِقْرَأْ: «أَكَلَتْ مَرْيَمُ تُفَّاحَةً حَمْرَاءَ». مَاذَا أَكَلَتْ مَرْيَمُ؟ (تُفَّاحَةً / مَوْزَةً / خُبْزًا)'
    reponses:
    - تُفَّاحَةً
    erreurs:
      مَوْزَةً: خطأ في فهم الجملة
      خُبْزًا: خطأ في فهم الجملة
    indice: اِقْرَأِ الكَلِمَةَ الَّتِي بَعْدَ «مَرْيَمُ».
    explication: أَكَلَتْ مَرْيَمُ تُفَّاحَةً حَمْرَاءَ.
  - id: fahm-3
    difficulte: 3
    enonce: 'اِقْرَأْ: «فِي الصَّبَاحِ، سَقَى الفَلَّاحُ الأَشْجَارَ». مَتَى سَقَى الفَلَّاحُ الأَشْجَارَ؟ (فِي الصَّبَاحِ / فِي المَسَاءِ / فِي اللَّيْلِ)'
    reponses:
    - فِي الصَّبَاحِ
    erreurs:
      فِي المَسَاءِ: خطأ في فهم الجملة
      فِي اللَّيْلِ: خطأ في فهم الجملة
    indice: الجَوَابُ فِي أَوَّلِ الجُمْلَةِ.
    explication: سَقَى الفَلَّاحُ الأَشْجَارَ فِي الصَّبَاحِ.
- notion: الاسم والفعل والحرف
  exercices:
  - id: kalima-1
    difficulte: 1
    enonce: مَا نَوْعُ كَلِمَةِ «كَتَبَ»؟ (اِسْمٌ / فِعْلٌ / حَرْفٌ)
    reponses:
    - فِعْلٌ
    erreurs:
      اِسْمٌ: خلط بين أنواع الكلمة
      حَرْفٌ: خلط بين أنواع الكلمة
    indice: هَلْ تَدُلُّ الكَلِمَةُ عَلَى عَمَلٍ؟
    explication: «كَتَبَ» فِعْلٌ لِأَنَّهُ يَدُلُّ عَلَى عَمَلٍ.
  - id: kalima-2
    difficulte: 2
    enonce: مَا نَوْعُ كَلِمَةِ «قَلَمٌ»؟ (اِسْمٌ / فِعْلٌ / حَرْفٌ)
    reponses:
    - اِسْمٌ
    erreurs:
      فِعْلٌ: خلط بين أنواع الكلمة
      حَرْفٌ: خلط بين أنواع الكلمة
    indice: هَلْ تَدُلُّ الكَلِمَةُ عَلَى شَيْءٍ؟
    explication: «قَلَمٌ» اِسْمٌ لِأَنَّهُ يَدُلُّ عَلَى شَيْءٍ.
  - id: kalima-3
    difficulte: 3
    enonce: مَا نَوْعُ كَلِمَةِ «فِي»؟ (اِسْمٌ / فِعْلٌ / حَرْفٌ)
    reponses:
    - حَرْفٌ
    erreurs:
      اِسْمٌ: خلط بين أنواع الكلمة
      فِعْلٌ: خلط بين أنواع الكلمة
    indice: هَلْ لِلْكَلِمَةِ مَعْنًى وَحْدَهَا؟
    explication: '«فِي» حَرْفٌ: لَا يَظْهَرُ مَعْنَاهُ إِلَّا مَعَ غَيْرِهِ.'
- notion: الجملة الاسمية والجملة الفعلية
  exercices:
  - id: jumla-1
    difficulte: 1
    enonce: '«الجَوُّ جَمِيلٌ»: جُمْلَةٌ اِسْمِيَّةٌ أَمْ فِعْلِيَّةٌ؟ (اِسْمِيَّةٌ / فِعْلِيَّةٌ)'
    reponses:
    - اِسْمِيَّةٌ
    erreurs:
      فِعْلِيَّةٌ: خلط بين الجملة الاسمية والفعلية
    indice: بِأَيِّ نَوْعٍ مِنَ الكَلِمَاتِ تَبْدَأُ الجُمْلَةُ؟
    explication: 'الجُمْلَةُ اِسْمِيَّةٌ لِأَنَّهَا تَبْدَأُ بِاسْمٍ: «الجَوُّ».'
  - id: jumla-2
    difficulte: 2
    enonce: '«لَعِبَ الأَطْفَالُ»: جُمْلَةٌ اِسْمِيَّةٌ أَمْ فِعْلِيَّةٌ؟ (اِسْمِيَّةٌ / فِعْلِيَّةٌ)'
    reponses:
    - فِعْلِيَّةٌ
    erreurs:
      اِسْمِيَّةٌ: خلط بين الجملة الاسمية والفعلية
    indice: بِأَيِّ نَوْعٍ مِنَ الكَلِمَاتِ تَبْدَأُ الجُمْلَةُ؟
    explication: 'الجُمْلَةُ فِعْلِيَّةٌ لِأَنَّهَا تَبْدَأُ بِفِعْلٍ: «لَعِبَ».'
  - id: jumla-3
    difficulte: 3
    enonce: '«الطِّفْلُ يَلْعَبُ»: جُمْلَةٌ اِسْمِيَّةٌ أَمْ فِعْلِيَّةٌ؟ (اِسْمِيَّةٌ / فِعْلِيَّةٌ)'
    reponses:
    - اِسْمِيَّةٌ
    erreurs:
      فِعْلِيَّةٌ: خلط بين الجملة الاسمية والفعلية
    indice: اُنْظُرْ إِلَى الكَلِمَةِ الأُولَى فَقَطْ.
    explication: 'الجُمْلَةُ اِسْمِيَّةٌ لِأَنَّهَا تَبْدَأُ بِاسْمٍ: «الطِّفْلُ»، حَتَّى لَوْ جَاءَ بَعْدَهُ فِعْلٌ.'
- notion: المذكر والمؤنث
  exercices:
  - id: jins-1
    difficulte: 1
    enonce: هَلْ كَلِمَةُ «مُعَلِّمَةٌ» مُذَكَّرٌ أَمْ مُؤَنَّثٌ؟ (مُذَكَّرٌ / مُؤَنَّثٌ)
    reponses:
    - مُؤَنَّثٌ
    erreurs:
      مُذَكَّرٌ: خلط بين المذكر والمؤنث
    indice: اُنْظُرْ إِلَى آخِرِ الكَلِمَةِ.
    explication: «مُعَلِّمَةٌ» مُؤَنَّثٌ، وَعَلَامَتُهُ التَّاءُ المَرْبُوطَةُ.
  - id: jins-2
    difficulte: 2
    enonce: مَا مُؤَنَّثُ «تِلْمِيذٌ»؟ (تِلْمِيذَةٌ / تَلَامِيذُ / تِلْمِيذَانِ)
    reponses:
    - تِلْمِيذَةٌ
    erreurs:
      تَلَامِيذُ: خلط بين التأنيث والجمع والتثنية
      تِلْمِيذَانِ: خلط بين التأنيث والجمع والتثنية
    indice: نُضِيفُ تَاءً مَرْبُوطَةً فِي آخِرِ الكَلِمَةِ.
    explication: مُؤَنَّثُ «تِلْمِيذٌ» هُوَ «تِلْمِيذَةٌ».
  - id: jins-3
    difficulte: 3
    enonce: هَلْ كَلِمَةُ «شَمْسٌ» مُذَكَّرٌ أَمْ مُؤَنَّثٌ؟ (مُذَكَّرٌ / مُؤَنَّثٌ)
    reponses:
    - مُؤَنَّثٌ
    erreurs:
      مُذَكَّرٌ: خلط بين المذكر والمؤنث
    indice: 'نَقُولُ: الشَّمْسُ سَاطِعَةٌ (وَلَا نَقُولُ: سَاطِعٌ).'
    explication: '«شَمْسٌ» مُؤَنَّثٌ وَلَوْ لَمْ تَكُنْ فِيهَا تَاءٌ مَرْبُوطَةٌ: نَقُولُ «الشَّمْسُ سَاطِعَةٌ».'
- notion: المفرد والمثنى والجمع
