    indice: اِبْحَثْ فِي الجُمْلَةِ عَنْ كَلِمَةِ المَكَانِ.
    explication: القِطُّ تَحْتَ الطَّاوِلَةِ.
  - id: fahm-7
    difficulte: 1
    enonce: 'اِقْرَأْ: «يَقْرَأُ الأَبُ الجَرِيدَةَ». مَاذَا يَقْرَأُ الأَبُ؟ (الكِتَابَ / الجَرِيدَةَ / الرِّسَالَةَ)'
    reponses:
