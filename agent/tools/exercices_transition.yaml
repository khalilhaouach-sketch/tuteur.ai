      ثَلَاثُ قِطَطٍ: خطأ في فهم الجملة
    indice: «قِطَّتَانِ» تَدُلُّ عَلَى اثْنَتَيْنِ.
    explication: 'لِسَلْمَى قِطَّتَانِ: اِثْنَتَانِ.'
  - id: fahm-11
    difficulte: 3
    enonce: 'اِقْرَأْ: «فَرِحَ الوَلَدُ لِأَنَّهُ نَجَحَ فِي الاِمْتِحَانِ». لِمَاذَا فَرِحَ الوَلَدُ؟ (لِأَنَّهُ نَامَ / لِأَنَّهُ نَجَحَ / لِأَنَّهُ أَكَلَ)'
    reponses:
