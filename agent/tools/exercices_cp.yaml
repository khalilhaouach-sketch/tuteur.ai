    enonce: أَيُّ كَلِمَةٍ تَبْدَأُ بِحَرْفِ الظَّاءِ؟ (ظِلٌّ / ضَوْءٌ / طَبْلٌ)
    reponses:
    - ظِلٌّ
    erreurs:
      طَبْلٌ: خلط بين «ظ» و«ط»
      ضَوْءٌ: خلط بين «ظ» و«ض»
    indice: اِسْمَعِ الصَّوْتَ الأَوَّلَ فِي كُلِّ كَلِمَةٍ.
    explication: «ظِلٌّ» تَبْدَأُ بِحَرْفِ الظَّاءِ.
