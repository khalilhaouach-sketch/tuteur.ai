    voyelles_obligatoires: true
    enonce: 'اِخْتَرِ المَقْطَعَ الَّذِي فِيهِ مَدٌّ بِالوَاوِ: (ظَا / ظُو / ظِي)'
    reponses:
    - ظُو
    erreurs:
      ظَا: خلط بين حروف المد
      ظِي: خلط بين حروف المد
    indice: المَدُّ بِالأَلِفِ بَعْدَ الفَتْحَةِ، وَبِالوَاوِ بَعْدَ الضَّمَّةِ، وَبِاليَاءِ بَعْدَ الكَسْرَةِ.
    explication: المَقْطَعُ الَّذِي فِيهِ مَدٌّ بِالوَاوِ هُوَ «ظُو».
