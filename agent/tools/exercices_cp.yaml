# Banque d'exercices d'arabe du CP (profil P1) — à relire par le professeur.
# Une notion par lettre, dans l'ordre du programme (docs/programmes/cp_arabe.md), exercices à choix.
# Les 3 premiers de chaque lettre sont écrits à la main : 1) la lettre au début du mot-clé, 2) la voyelle
# courte, 3) la syllabe longue (المد). Les suivants sont produits par scripts/generer_exercices_lettres.py
# (tableau de mots vocalisés à relire dans ce script ; le relancer réécrit les exercices générés).
# Les choix entre parenthèses deviendront des boutons dans le mode CP (phase 5).
# Même format que exercices_1ac.yaml.

niveau: P1
notions:
- notion: حرف الميم
  exercices:
  - id: cp-01-1
    difficulte: 1
    enonce: مَا الحَرْفُ الأَوَّلُ فِي كَلِمَةِ «مَوْزٌ»؟ (مَ / نَ / بَ)
    reponses:
    - مَ
    erreurs:
      ن: خلط بين «م» و«ن»
      ب: خلط بين «م» و«ب»
    indice: اِسْمَعِ الصَّوْتَ الأَوَّلَ فِي «مَوْزٌ».
    explication: 'الحَرْفُ الأَوَّلُ فِي «مَوْزٌ» هُوَ «مَ»: حَرْفُ المِيمِ.'
  - id: cp-01-2
    difficulte: 2
    enonce: مَا الحَرَكَةُ عَلَى «مَ»؟ (فَتْحَةٌ / ضَمَّةٌ / كَسْرَةٌ)
    reponses:
    - فَتْحَةٌ
    erreurs:
      ضمة: خلط بين الحركات
      كسرة: خلط بين الحركات
    indice: الفَتْحَةُ وَالضَّمَّةُ فَوْقَ الحَرْفِ، وَالكَسْرَةُ تَحْتَهُ.
    explication: عَلَى «مَ» فَتْحَةٌ فَوْقَ الحَرْفِ.
