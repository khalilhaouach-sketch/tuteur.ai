  - id: cp-28-16
    difficulte: 2
    enonce: أَيْنَ حَرْفُ الظَّاءِ فِي كَلِمَةِ «ظَرْفٌ»؟ (فِي البِدَايَةِ / فِي النِّهَايَةِ)
    reponses:
    - فِي البِدَايَةِ
    erreurs:
      فِي النِّهَايَةِ: خطأ في موضع الحرف
    indice: 'اِسْمَعِ الكَلِمَةَ: هَلْ تَسْمَعُ الحَرْفَ أَوَّلًا أَمْ آخِرًا؟'
    explication: حَرْفُ الظَّاءِ فِي البِدَايَةِ كَلِمَةِ «ظَرْفٌ».
