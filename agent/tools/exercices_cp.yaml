# Banque d'exercices d'arabe du CP (profil P1) — à relire par le professeur.
# Une notion par lettre, dans l'ordre du programme (docs/programmes/cp_arabe.md), 3 exercices à choix :
# 1) la lettre au début du mot-clé, 2) la voyelle courte, 3) la syllabe longue (المد).
# Les choix entre parenthèses deviendront des boutons dans le mode CP (phase 5).
# Même format que exercices_1ac.yaml.

niveau: P1
notions:
- notion: حرف الميم
  exercices:
  - id: cp-01-1
    difficulte: 1
    enonce: مَا الحَرْفُ الأَوَّلُ فِي كَلِمَةِ «مَوْزٌ»؟ (مَ / نَ / بَ)
    reponses:
    - مَ
    erreurs:
      ن: خلط بين «م» و«ن»
      ب: خلط بين «م» و«ب»
    indice: اِسْمَعِ الصَّوْتَ الأَوَّلَ فِي «مَوْزٌ».
    explication: 'الحَرْفُ الأَوَّلُ فِي «مَوْزٌ» هُوَ «مَ»: حَرْفُ المِيمِ.'
  - id: cp-01-2
    difficulte: 2
    enonce: مَا الحَرَكَةُ عَلَى «مَ»؟ (فَتْحَةٌ / ضَمَّةٌ / كَسْرَةٌ)
    reponses:
    - فَتْحَةٌ
    erreurs:
      ضمة: خلط بين الحركات
      كسرة: خلط بين الحركات
    indice: الفَتْحَةُ وَالضَّمَّةُ فَوْقَ الحَرْفِ، وَالكَسْرَةُ تَحْتَهُ.
    explication: عَلَى «مَ» فَتْحَةٌ فَوْقَ الحَرْفِ.
  - id: cp-01-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'اِخْتَرِ المَقْطَعَ الَّذِي فِيهِ مَدٌّ بِالأَلِفِ: (مَا / مُو / مِي)'
    reponses:
    - مَا
    erreurs:
      مُو: خلط بين حروف المد
      مِي: خلط بين حروف المد
    indice: المَدُّ بِالأَلِفِ بَعْدَ الفَتْحَةِ، وَبِالوَاوِ بَعْدَ الضَّمَّةِ، وَبِاليَاءِ بَعْدَ الكَسْرَةِ.
    explication: المَقْطَعُ الَّذِي فِيهِ مَدٌّ بِالأَلِفِ هُوَ «مَا».
