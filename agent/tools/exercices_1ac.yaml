      عَلَمٌ: خطأ في أنواع المعرفة
    indice: يَحْتَاجُ إِلَى جُمْلَةٍ بَعْدَهُ.
    explication: '«الَّذِي» مَعْرِفَةٌ: اسْمٌ مَوْصُولٌ.'
  - id: nakira-9
    difficulte: 2
    enonce: مَا نَوْعُ المَعْرِفَةِ فِي «كِتَابُ أَحْمَدَ»؟ (مُعَرَّفٌ بِـ«ال» / مُضَافٌ إِلَى مَعْرِفَةٍ / ضَمِيرٌ)
    reponses:
    - مُضَافٌ إِلَى مَعْرِفَةٍ
    erreurs:
      مُعَرَّفٌ بِـ«ال»: خطأ في أنواع المعرفة
      ضَمِيرٌ: خطأ في أنواع المعرفة
    indice: «كِتَابُ» أُضِيفَ إِلَى عَلَمٍ.
    explication: «كِتَابُ أَحْمَدَ» مَعْرِفَةٌ بِالإِضَافَةِ إِلَى مَعْرِفَةٍ.
  - id: nakira-10
    difficulte: 2
    enonce: 'اِجْعَلِ النَّكِرَةَ «قَلَمٌ» مَعْرِفَةً بِـ«ال»: (القَلَمٌ / القَلَمُ / أَلْقَلَمُ)'
    reponses:
