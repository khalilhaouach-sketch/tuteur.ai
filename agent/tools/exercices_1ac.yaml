# Banque d'exercices d'arabe de 1AC (profil P2) — à relire par le professeur.
# Une notion par leçon du programme (docs/programmes/1ac_arabe.md), 3 exercices de difficulté 1 à 3.
# reponses : réponses acceptées, entièrement vocalisées (une voyelle écrite par l'élève est vérifiée).
# voyelles_obligatoires : la réponse doit être entièrement vocalisée.
# erreurs : réponse fausse fréquente -> type d'erreur (avec voyelles : comparée voyelles comprises).
# indice : donné après la 1re erreur ; explication : donnée après la 2e.

niveau: P2
notions:
- notion: الميزان الصرفي
  exercices:
  - id: mizan-1
    difficulte: 1
    voyelles_obligatoires: true
    enonce: ما وزن الفعل «جَلَسَ»؟
    reponses:
    - فَعَلَ
    erreurs:
      فاعل: زيادة حرف غير موجود في الكلمة
      جلس: عدم استعمال الميزان (ف ع ل)
    indice: يقابل الحرف الأول الفاءَ، والثاني العينَ، والثالث اللامَ.
    explication: 'وزن «جَلَسَ» هو «فَعَلَ»: الجيم تقابل الفاء، واللام تقابل العين، والسين تقابل اللام.'
  - id: mizan-2
    difficulte: 2
    voyelles_obligatoires: true
    enonce: ما وزن الفعل «أَكْرَمَ»؟
    reponses:
    - أَفْعَلَ
    erreurs:
      فعل: إغفال الحرف الزائد في الميزان
      افتعل: خطأ في موضع الحرف الزائد
    indice: '«أَكْرَمَ» فعل مزيد: أصله «كَرُمَ»، والهمزة في أوله زائدة. والزائد يُكتب في الميزان كما هو.'
    explication: 'وزن «أَكْرَمَ» هو «أَفْعَلَ»: الهمزة زائدة نكتبها في الميزان بلفظها، و«ك ر م» تقابل «ف ع ل».'
  - id: mizan-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: ما وزن الفعل «اِسْتَخْرَجَ»؟
    reponses:
    - اِسْتَفْعَلَ
    erreurs:
      فعل: إغفال الحروف الزائدة في الميزان
      افتعل: خطأ في عدد الحروف الزائدة
    indice: 'حروفه الأصلية «خ ر ج»، وقد زيدت في أوله ثلاثة أحرف: ا س ت.'
    explication: 'وزن «اِسْتَخْرَجَ» هو «اِسْتَفْعَلَ»: زيدت الألف والسين والتاء، و«خ ر ج» تقابل «ف ع ل».'
- notion: مزيد الثلاثي والرباعي
  exercices:
  - id: ziyada-1
    difficulte: 1
    voyelles_obligatoires: true
    enonce: ما وزن الفعل «عَلَّمَ»؟
    reponses:
    - فَعَّلَ
    erreurs:
      فَعَلَ: إغفال التضعيف في الميزان
    indice: عين الفعل مضعَّفة (عَلَّمَ)، والتضعيف يظهر في الميزان أيضًا.
    explication: 'وزن «عَلَّمَ» هو «فَعَّلَ»: اللام المضعَّفة تقابل العين المضعَّفة.'
  - id: ziyada-2
    difficulte: 2
    voyelles_obligatoires: true
    enonce: ما وزن الفعل «تَعَاوَنَ»؟
    reponses:
    - تَفَاعَلَ
    erreurs:
      فاعل: إغفال التاء الزائدة في الميزان
      تفعل: خطأ في موضع الألف الزائدة
    indice: أصل الفعل «عَوَنَ»، وزيدت التاء في أوله والألف بعد الفاء.
    explication: 'وزن «تَعَاوَنَ» هو «تَفَاعَلَ»: زيدت التاء والألف، و«ع و ن» تقابل «ف ع ل».'
  - id: ziyada-3
    difficulte: 3
    enonce: ما معنى الزيادة في الفعل «اِسْتَغْفَرَ»؟
    reponses:
    - الطَّلَبُ
    - طَلَبُ المَغْفِرَةِ
    erreurs:
      المشاركة: خلط بين معنى الطلب ومعنى المشاركة
      التعدية: خلط بين معنى الطلب ومعنى التعدية
    indice: 'صيغة «اِسْتَفْعَلَ» تدل غالبًا على أن الفاعل يسأل شيئًا: ماذا يسأل من يستغفر؟'
    explication: معنى الزيادة في «اِسْتَغْفَرَ» هو الطلب، أي طلب المغفرة.
- notion: الفعل الصحيح
  exercices:
  - id: sahih-1
    difficulte: 1
    enonce: هل الفعل «قَرَأَ» سالم أم مهموز أم مضعف؟
    reponses:
    - مَهْمُوزٌ
    - مَهْمُوزُ اللَّامِ
    erreurs:
      سالم: عدم الانتباه إلى الهمزة
      مضعف: خلط بين المهموز والمضعف
    indice: انظر إلى الحرف الأخير من الفعل.
    explication: «قَرَأَ» مهموز اللام لأن لامه همزة.
  - id: sahih-2
    difficulte: 2
    voyelles_obligatoires: true
    enonce: ما فعل الأمر من «أَخَذَ» للمفرد المذكر؟
    reponses:
    - خُذْ
    erreurs:
      أخذ: إبقاء الهمزة في الأمر
      اخذ: إبقاء الهمزة في الأمر
    indice: 'مثل «أَكَلَ ← كُلْ»: تُحذف الهمزة في الأمر.'
    explication: 'الأمر من «أَخَذَ» هو «خُذْ» بحذف الهمزة، كما نقول من «أَكَلَ»: «كُلْ».'
  - id: sahih-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: أسند الفعل «مَدَّ» إلى تاء الفاعل (أنا).
    reponses:
    - مَدَدْتُ
    erreurs:
      مدت: عدم فك الإدغام مع ضمير الرفع المتحرك
    indice: 'مع تاء الفاعل يُفَكُّ الإدغام: تظهر الدالان.'
    explication: نقول «مَدَدْتُ» بفك الإدغام، لأن الفعل المضعف اتصل بضمير رفع متحرك.
- notion: المثال والأجوف
  exercices:
  - id: mithal-1
    difficulte: 1
    enonce: 'ما نوع الفعل المعتل «وَعَدَ»: مثال أم أجوف؟'
    reponses:
    - مِثَالٌ
    erreurs:
      أجوف: خلط بين المثال والأجوف
    indice: 'أين يوجد حرف العلة في الفعل: في أوله أم في وسطه؟'
    explication: «وَعَدَ» مثال لأن فاءه (أول حروفه) حرف علة.
  - id: mithal-2
    difficulte: 2
    voyelles_obligatoires: true
    enonce: ما فعل الأمر من «وَصَلَ» للمفرد المذكر؟
    reponses:
    - صِلْ
    erreurs:
      اوصل: عدم حذف الواو في الأمر
      وصل: عدم حذف الواو في الأمر
    indice: 'مثل «وَعَدَ ← يَعِدُ ← عِدْ»: ما مضارع «وَصَلَ»؟'
    explication: مضارع «وَصَلَ» «يَصِلُ» والأمر «صِلْ»، بحذف الواو.
  - id: mithal-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: أسند الفعل «قَالَ» إلى تاء الفاعل (أنا).
    reponses:
    - قُلْتُ
    erreurs:
      قالت: عدم حذف عين الأجوف مع ضمير الرفع المتحرك
    indice: الفعل الأجوف تُحذف عينه إذا اتصل بضمير رفع متحرك.
    explication: نقول «قُلْتُ» بحذف الألف، لأن الأجوف اتصل بضمير رفع متحرك.
- notion: الفعل الناقص
  exercices:
  - id: naqis-1
    difficulte: 1
    enonce: 'ما نوع الفعل المعتل «رَمَى»: مثال أم أجوف أم ناقص؟'
    reponses:
    - نَاقِصٌ
    erreurs:
      أجوف: خلط بين الأجوف والناقص
      مثال: خلط بين المثال والناقص
    indice: حرف العلة في آخر الفعل.
    explication: «رَمَى» ناقص لأن لامه (آخر حروفه) حرف علة.
  - id: naqis-2
    difficulte: 2
    voyelles_obligatoires: true
    enonce: أسند الفعل «دَعَا» إلى واو الجماعة (هم).
    reponses:
    - دَعَوْا
    erreurs:
      دعاوا: عدم حذف لام الناقص مع واو الجماعة
    indice: مع واو الجماعة تُحذف لام الفعل الناقص.
    explication: نقول «دَعَوْا» بحذف الألف (لام الفعل) عند إسناده إلى واو الجماعة.
  - id: naqis-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: أدخل «لَمْ» على الفعل «يَرْمِي».
    reponses:
    - لَمْ يَرْمِ
    erreurs:
      لم يرمي: عدم حذف حرف العلة في الجزم
    indice: المضارع المعتل الآخر يُجزم بحذف حرف العلة.
    explication: نقول «لَمْ يَرْمِ» بحذف الياء، لأن الفعل معتل الآخر.
- notion: اللفيف
  exercices:
  - id: lafif-1
    difficulte: 1
    enonce: 'ما نوع الفعل «طَوَى»: لفيف مفروق أم لفيف مقرون؟'
    reponses:
    - لَفِيفٌ مَقْرُونٌ
    - مَقْرُونٌ
    erreurs:
      لفيف مفروق: خلط بين اللفيف المفروق والمقرون
      مفروق: خلط بين اللفيف المفروق والمقرون
    indice: هل حرفا العلة متجاوران أم بينهما حرف صحيح؟
    explication: «طَوَى» لفيف مقرون لأن حرفي العلة (الواو والألف) متجاوران في عينه ولامه.
  - id: lafif-2
    difficulte: 2
    enonce: 'ما نوع الفعل «وَفَى»: لفيف مفروق أم لفيف مقرون؟'
    reponses:
    - لَفِيفٌ مَفْرُوقٌ
    - مَفْرُوقٌ
    erreurs:
      لفيف مقرون: خلط بين اللفيف المفروق والمقرون
      مقرون: خلط بين اللفيف المفروق والمقرون
    indice: حرفا العلة في أول الفعل وآخره، يفصل بينهما حرف صحيح.
    explication: «وَفَى» لفيف مفروق لأن فاءه ولامه حرفا علة يفصل بينهما حرف صحيح.
  - id: lafif-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: ما فعل الأمر من «وَقَى» للمفرد المذكر؟
    reponses:
    - قِ
    - قِهْ
    erreurs:
      اوق: عدم حذف الواو في الأمر
      قي: عدم حذف حرف العلة في الأمر
    indice: 'يُحذف أوله كالمثال، ويُحذف آخره كالناقص: يبقى حرف واحد.'
    explication: 'الأمر من «وَقَى» هو «قِ» (وعند الوقف «قِهْ»): حُذفت الفاء والعين معًا.'
- notion: الإعراب والبناء
  exercices:
  - id: irab-1
    difficulte: 1
    enonce: ما اسم تغيُّر حركة آخر الكلمة بتغيُّر موقعها في الجملة؟
    reponses:
    - الإِعْرَابُ
    erreurs:
      البناء: خلط بين الإعراب والبناء
    indice: عكسه أن يلزم آخر الكلمة حالة واحدة، وهو البناء.
    explication: 'هذا هو الإعراب، مثل: جَاءَ الطَّالِبُ، رَأَيْتُ الطَّالِبَ.'
  - id: irab-2
    difficulte: 2
    enonce: ما حالة الإعراب الخاصة بالأفعال؟
    reponses:
    - الجَزْمُ
    erreurs:
      الجر: خلط بين الجر (للأسماء) والجزم (للأفعال)
    indice: 'من حالات الإعراب الأربع: حالة لا تدخل على الأسماء.'
    explication: 'الجزم خاص بالأفعال، مثل: لَمْ يَكْتُبْ.'
  - id: irab-3
    difficulte: 3
    enonce: ما حالة الإعراب الخاصة بالأسماء؟
    reponses:
    - الجَرُّ
    erreurs:
      الجزم: خلط بين الجزم (للأفعال) والجر (للأسماء)
    indice: تأتي بعد حروف مثل «مِنْ» و«فِي».
    explication: 'الجر خاص بالأسماء، مثل: مَرَرْتُ بِالطَّالِبِ.'
- notion: الأسماء المعربة والمبنية
  exercices:
  - id: mabni-1
    difficulte: 1
    enonce: هل الضمير «نَحْنُ» معرب أم مبني؟
    reponses:
    - مَبْنِيٌّ
    erreurs:
      معرب: إغفال أن الضمائر مبنية
    indice: الضمائر لا يتغير آخرها مهما تغير موقعها.
    explication: «نَحْنُ» مبني، لأن الضمائر كلها مبنية.
  - id: mabni-2
    difficulte: 2
    enonce: هل اسم الإشارة «هَذَانِ» معرب أم مبني؟
    reponses:
    - مُعْرَبٌ
    erreurs:
      مبني: إغفال أن مثنى اسم الإشارة معرب
    indice: 'قارن: «هَذَانِ» في الرفع و«هَذَيْنِ» في النصب والجر.'
    explication: '«هَذَانِ» معرب لأنه مثنى: يُرفع بالألف ويُنصب ويُجر بالياء (هَذَيْنِ).'
  - id: mabni-3
    difficulte: 3
    enonce: هل اسم الاستفهام «أَيُّ» معرب أم مبني؟
    reponses:
    - مُعْرَبٌ
    erreurs:
      مبني: إغفال استثناء «أيّ» من أسماء الاستفهام المبنية
    indice: أسماء الاستفهام مبنية إلا واحدًا منها.
    explication: «أَيُّ» معرب، وهو الاسم الوحيد المعرب بين أسماء الاستفهام.
- notion: علامات البناء في الأفعال
  exercices:
  - id: binaa-1
    difficulte: 1
    enonce: 'ما علامة بناء الفعل الماضي في الجملة: كَتَبَ التِّلْمِيذُ؟'
    reponses:
    - الفَتْحُ
    erreurs:
      السكون: خطأ في علامة بناء الماضي
      الضم: خطأ في علامة بناء الماضي
    indice: انظر إلى حركة الباء في «كَتَبَ».
    explication: «كَتَبَ» فعل ماض مبني على الفتح.
  - id: binaa-2
    difficulte: 2
    enonce: 'ما علامة بناء الفعل الماضي في الجملة: كَتَبْتُ الدَّرْسَ؟'
    reponses:
    - السُّكُونُ
    erreurs:
      الفتح: إغفال اتصال الفعل بضمير رفع متحرك
    indice: 'اتصلت بالفعل تاء الفاعل: ما حركة الباء؟'
    explication: «كَتَبْتُ» فعل ماض مبني على السكون لاتصاله بتاء الفاعل.
  - id: binaa-3
    difficulte: 3
    enonce: ما علامة بناء فعل الأمر «اُدْعُ»؟
    reponses:
    - حَذْفُ حَرْفِ العِلَّةِ
    erreurs:
      السكون: إغفال أن الفعل معتل الآخر
      الضم: خلط بين الحركة وعلامة البناء
    indice: 'مضارعه «يَدْعُو»: ماذا حدث للواو في الأمر؟'
    explication: «اُدْعُ» فعل أمر مبني على حذف حرف العلة (الواو).
- notion: إعراب الفعل المضارع
  exercices:
  - id: mudari3-1
    difficulte: 1
    enonce: 'ما الحرف الذي نصب الفعل المضارع في الجملة: لَنْ يَتَأَخَّرَ التِّلْمِيذُ؟'
    reponses:
    - لَنْ
    erreurs:
      التلميذ: خلط بين الناصب والفاعل
      يتأخر: خلط بين الناصب والفعل
    indice: حرف النصب يأتي قبل الفعل المضارع مباشرة.
    explication: الحرف الناصب هو «لَنْ»، ولذلك جاء الفعل «يَتَأَخَّرَ» منصوبًا وعلامة نصبه الفتحة.
  - id: mudari3-2
    difficulte: 2
    enonce: 'ما علامة رفع الفعل المضارع في الجملة: يَدْرُسُ التِّلْمِيذُ؟'
    reponses:
    - الضَّمَّةُ
    - الضَّمَّةُ الظَّاهِرَةُ
    erreurs:
      الفتحة: خلط بين علامة الرفع وعلامة النصب
      السكون: خلط بين علامة الرفع وعلامة الجزم
    indice: 'الفعل لم يسبقه ناصب ولا جازم، فهو مرفوع: انظر إلى حركة آخره.'
    explication: «يَدْرُسُ» مرفوع لأنه لم يسبقه ناصب ولا جازم، وعلامة رفعه الضمة الظاهرة على آخره.
  - id: mudari3-3
    difficulte: 3
    enonce: 'ما علامة نصب الفعل المضارع في الجملة: التَّلَامِيذُ لَنْ يَتَأَخَّرُوا؟'
    reponses:
    - حَذْفُ النُّونِ
    - حَذْفُ النُّونِ لِأَنَّهُ مِنَ الأَفْعَالِ الخَمْسَةِ
    erreurs:
      الفتحة: إغفال حكم الأفعال الخمسة
      ثبوت النون: خلط بين علامة الرفع وعلامة النصب في الأفعال الخمسة
    indice: '«يَتَأَخَّرُوا» من الأفعال الخمسة: كيف تُنصب هذه الأفعال؟'
    explication: «يَتَأَخَّرُوا» فعل مضارع منصوب بـ«لَنْ»، وعلامة نصبه حذف النون لأنه من الأفعال الخمسة.
- notion: جزم الفعل المضارع
  exercices:
  - id: jazm-1
    difficulte: 1
    enonce: 'ما الحرف الذي جزم الفعل في الجملة: لَمْ يَتَأَخَّرِ التِّلْمِيذُ؟'
    reponses:
    - لَمْ
    erreurs:
      التلميذ: خلط بين الجازم والفاعل
      يتأخر: خلط بين الجازم والفعل
    indice: الجازم يأتي قبل الفعل المضارع مباشرة.
    explication: الحرف الجازم هو «لَمْ»، ولذلك جاء الفعل «يَتَأَخَّرْ» مجزومًا (وكُسر آخره لالتقاء الساكنين).
  - id: jazm-2
    difficulte: 2
    enonce: 'ما علامة جزم الفعل في الجملة: لَمْ يَنْسَ أَحْمَدُ وَعْدَهُ؟'
    reponses:
    - حَذْفُ حَرْفِ العِلَّةِ
    erreurs:
      السكون: إغفال أن الفعل معتل الآخر
    indice: 'أصل الفعل «يَنْسَى»: ماذا حدث لآخره؟'
    explication: «يَنْسَ» مجزوم بـ«لَمْ» وعلامة جزمه حذف حرف العلة (الألف).
  - id: jazm-3
    difficulte: 3
    enonce: 'ما علامة جزم الفعل في الجملة: لا تَتَأَخَّرُوا عَنِ المَوْعِدِ؟'
    reponses:
    - حَذْفُ النُّونِ
    erreurs:
      السكون: إغفال حكم الأفعال الخمسة
    indice: '«تَتَأَخَّرُوا» من الأفعال الخمسة: كيف تُجزم هذه الأفعال؟'
    explication: «تَتَأَخَّرُوا» مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون لأنه من الأفعال الخمسة.
- notion: النكرة والمعرفة
  exercices:
  - id: nakira-1
    difficulte: 1
    enonce: هل كلمة «مَدِينَةٌ» نكرة أم معرفة؟
    reponses:
    - نَكِرَةٌ
    erreurs:
      معرفة: خلط بين النكرة والمعرفة
    indice: هل تدل الكلمة على مدينة معيَّنة نعرفها، أم على أيِّ مدينة؟
    explication: «مَدِينَةٌ» نكرة لأنها لا تدل على مدينة معيَّنة، ويدل على ذلك التنوين وغياب «ال».
  - id: nakira-2
    difficulte: 2
    voyelles_obligatoires: true
    enonce: 'اِجْعَلِ النكرة معرفة بإدخال «ال» عليها: كِتَابٌ'
    reponses:
    - الكِتَابُ
    erreurs:
      كتاب: عدم إدخال «ال» التعريف
      الكِتَابٌ: إبقاء التنوين مع «ال» التعريف
    indice: 'أضف «ال» في أول الكلمة، وانتبه: المعرَّف بـ«ال» لا يُنوَّن.'
    explication: 'تصير «كِتَابٌ» معرفة بإدخال «ال»: «الكِتَابُ»، ويُحذف التنوين.'
  - id: nakira-3
    difficulte: 3
    enonce: ما نوع المعرفة في كلمة «هَذَا»؟
    reponses:
    - اِسْمُ إِشَارَةٍ
    - اِسْمُ الإِشَارَةِ
    erreurs:
      ضمير: خلط بين اسم الإشارة والضمير
      اسم موصول: خلط بين اسم الإشارة والاسم الموصول
    indice: نستعمل هذه الكلمة لنشير بها إلى شيء قريب.
    explication: «هَذَا» اسم إشارة للمفرد المذكر القريب، وهو من أنواع المعرفة.
- notion: العلم
  exercices:
  - id: alam-1
    difficulte: 1
    enonce: 'ما نوع العلم «أَبُو بَكْرٍ»: اسم أم كنية أم لقب؟'
    reponses:
    - كُنْيَةٌ
    erreurs:
      لقب: خلط بين الكنية واللقب
      اسم: خلط بين الاسم والكنية
    indice: العلم الذي يبدأ بـ«أب» أو «أم» له اسم خاص.
    explication: «أَبُو بَكْرٍ» كنية لأنه صُدِّر بـ«أب».
  - id: alam-2
    difficulte: 2
    enonce: 'ما نوع العلم «الفَارُوقُ»: اسم أم كنية أم لقب؟'
    reponses:
    - لَقَبٌ
    erreurs:
      كنية: خلط بين الكنية واللقب
      اسم: خلط بين الاسم واللقب
    indice: هذا العلم يدل على صفة مدح.
    explication: «الفَارُوقُ» لقب لأنه يدل على مدح.
  - id: alam-3
    difficulte: 3
    enonce: ما نوع العلم «عَبْدُ اللَّهِ» من حيث التركيب؟
    reponses:
    - مُرَكَّبٌ إِضَافِيٌّ
    erreurs:
      مركب مزجي: خلط بين المركب الإضافي والمزجي
      مفرد: إغفال أن العلم مكوَّن من كلمتين
    indice: العلم مكوَّن من كلمتين، الثانية مضاف إليه.
    explication: '«عَبْدُ اللَّهِ» مركب إضافي: «عَبْدُ» مضاف و«اللَّهِ» مضاف إليه.'
- notion: الضمير البارز والمستتر
  exercices:
  - id: mustatir-1
    difficulte: 1
    enonce: ما الضمير المستتر في الفعل «أَكْتُبُ»؟
    reponses:
    - أَنَا
    erreurs:
      هو: خطأ في تقدير الضمير
      أنت: خطأ في تقدير الضمير
    indice: 'الفعل يبدأ بالهمزة: من المتكلم؟'
    explication: الضمير المستتر في «أَكْتُبُ» تقديره «أَنَا».
  - id: mustatir-2
    difficulte: 2
    enonce: ما الضمير المستتر في الفعل «نَكْتُبُ»؟
    reponses:
    - نَحْنُ
    erreurs:
      أنا: خطأ في تقدير الضمير
      هم: خطأ في تقدير الضمير
    indice: 'الفعل يبدأ بالنون: من المتكلمون؟'
    explication: الضمير المستتر في «نَكْتُبُ» تقديره «نَحْنُ».
  - id: mustatir-3
    difficulte: 3
    enonce: هل الضمير المستتر في «الطَّالِبُ كَتَبَ» مستتر وجوبًا أم جوازًا؟
    reponses:
    - جَوَازًا
    - مُسْتَتِرٌ جَوَازًا
    erreurs:
      وجوبا: خلط بين الاستتار الواجب والجائز
      مستتر وجوبا: خلط بين الاستتار الواجب والجائز
    indice: 'الضمير هنا للغائب (هو): هل يمكن أن يحل محله اسم ظاهر؟'
    explication: 'الضمير مستتر جوازًا لأنه للغائب، ويمكن أن نقول: كَتَبَ الطَّالِبُ.'
- notion: الضمير المتصل
  exercices:
  - id: muttasil-1
    difficulte: 1
    enonce: ما الضمير المتصل في الفعل «كَتَبْنَا»؟
    reponses:
    - نَا
    erreurs:
      كتب: خلط بين الفعل والضمير
    indice: انظر إلى ما أُضيف إلى آخر الفعل «كَتَبَ».
    explication: الضمير المتصل هو «نَا» (نا الفاعلين).
  - id: muttasil-2
    difficulte: 2
    enonce: ما الضمير المتصل في كلمة «كِتَابُهُ»؟
    reponses:
    - الهَاءُ
    - هَاءُ الغَائِبِ
    erreurs:
      الكاف: خلط بين كاف الخطاب وهاء الغائب
    indice: ما الحرف الذي يدل على الغائب في آخر الكلمة؟
    explication: الضمير المتصل هو الهاء (هاء الغائب).
  - id: muttasil-3
    difficulte: 3
    enonce: ما الضمير المتصل في الفعل «اُكْتُبِي»؟
    reponses:
    - يَاءُ المُخَاطَبَةِ
    erreurs:
      ياء المتكلم: خلط بين ياء المخاطبة وياء المتكلم
    indice: الفعل موجَّه إلى أنثى نخاطبها.
    explication: الضمير المتصل هو ياء المخاطبة.
- notion: الضمير المنفصل
  exercices:
  - id: munfasil-1
    difficulte: 1
    enonce: 'ما الضمير المنفصل في الجملة: نَحْنُ نَحْتَرِمُ القَانُونَ؟'
    reponses:
    - نَحْنُ
    erreurs:
      القانون: خلط بين الضمير والاسم الظاهر
    indice: الضمير المنفصل كلمة مستقلة نبدأ بها الكلام.
    explication: الضمير المنفصل هو «نَحْنُ».
  - id: munfasil-2
    difficulte: 2
    voyelles_obligatoires: true
    enonce: ما ضمير الرفع المنفصل للمخاطَبة المفردة؟
    reponses:
    - أَنْتِ
    erreurs:
      أَنْتَ: خلط بين ضمير المخاطب وضمير المخاطبة
    indice: 'انتبه إلى حركة التاء: تختلف بين المذكر والمؤنث.'
    explication: ضمير المخاطبة هو «أَنْتِ» بكسر التاء، أما «أَنْتَ» فللمخاطب.
  - id: munfasil-3
    difficulte: 3
    enonce: هل «إِيَّاكَ» ضمير رفع أم ضمير نصب؟
    reponses:
    - ضَمِيرُ نَصْبٍ
    - نَصْبٌ
    erreurs:
      ضمير رفع: خلط بين ضمائر الرفع وضمائر النصب
      رفع: خلط بين ضمائر الرفع وضمائر النصب
    indice: في «إِيَّاكَ نَعْبُدُ» يقع الضمير مفعولًا به.
    explication: «إِيَّاكَ» ضمير نصب منفصل.
- notion: أسماء الإشارة
  exercices:
  - id: ishara-1
    difficulte: 1
    enonce: ما اسم الإشارة للمفردة المؤنثة القريبة؟
    reponses:
    - هَذِهِ
    erreurs:
      هذا: خلط بين المذكر والمؤنث
      تلك: خلط بين القريب والبعيد
    indice: للمذكر القريب نقول «هَذَا»، فماذا نقول للمؤنث؟
    explication: اسم الإشارة للمفردة المؤنثة القريبة هو «هَذِهِ».
  - id: ishara-2
    difficulte: 2
    enonce: ما اسم الإشارة للجمع البعيد؟
    reponses:
    - أُولَئِكَ
    erreurs:
      هؤلاء: خلط بين القريب والبعيد
    indice: للجمع القريب نقول «هَؤُلَاءِ»، فماذا نقول للبعيد؟
    explication: اسم الإشارة للجمع البعيد هو «أُولَئِكَ».
  - id: ishara-3
    difficulte: 3
    enonce: 'اختر اسم الإشارة المناسب: رَأَيْتُ (هَذَانِ / هَذَيْنِ) الطَّالِبَيْنِ.'
    reponses:
    - هَذَيْنِ
    erreurs:
      هذان: إغفال نصب المثنى بالياء
    indice: اسم الإشارة هنا مفعول به، والمثنى يُنصب بالياء.
    explication: نقول «رَأَيْتُ هَذَيْنِ الطَّالِبَيْنِ» لأن اسم الإشارة مفعول به منصوب بالياء.
- notion: الاسم الموصول
  exercices:
  - id: mawsul-1
    difficulte: 1
    enonce: 'ما الاسم الموصول في الجملة: فَازَ التِّلْمِيذُ الَّذِي اجْتَهَدَ؟'
    reponses:
    - الَّذِي
    erreurs:
      اجتهد: خلط بين الموصول وصلته
      التلميذ: خلط بين الموصول والاسم الذي قبله
    indice: الاسم الموصول تأتي بعده جملة تبيّن معناه.
    explication: الاسم الموصول هو «الَّذِي»، وصلته «اجْتَهَدَ».
  - id: mawsul-2
    difficulte: 2
    enonce: 'اختر الاسم الموصول المناسب: نَجَحَتِ التِّلْمِيذَاتُ (الَّذِينَ / اللَّوَاتِي) اجْتَهَدْنَ.'
    reponses:
    - اللَّوَاتِي
    erreurs:
      الذين: خلط بين موصول جمع المذكر وموصول جمع المؤنث
    indice: «التِّلْمِيذَاتُ» جمع مؤنث.
    explication: نقول «اللَّوَاتِي» لأن «التِّلْمِيذَاتُ» جمع مؤنث، و«الَّذِينَ» لجمع المذكر.
  - id: mawsul-3
    difficulte: 3
    enonce: 'ما صلة الموصول في الجملة: أَحْتَرِمُ مَنْ يَقُولُ الحَقَّ؟'
    reponses:
    - يَقُولُ الحَقَّ
    erreurs:
      من: خلط بين الموصول وصلته
      الحق: عدم تحديد الصلة كاملة
    indice: الصلة هي الجملة التي تأتي بعد الاسم الموصول «مَنْ».
    explication: صلة الموصول هي «يَقُولُ الحَقَّ».
- notion: أحوال المبتدأ والخبر
  exercices:
  - id: ahwal-1
    difficulte: 1
    enonce: 'ما نوع الخبر في الجملة: الطَّالِبُ يَجْتَهِدُ؟'
    reponses:
    - جُمْلَةٌ فِعْلِيَّةٌ
    erreurs:
      جملة اسمية: خلط بين الجملة الفعلية والاسمية
      مفرد: إغفال أن الخبر جملة
    indice: 'الخبر «يَجْتَهِدُ»: هل يبدأ بفعل أم باسم؟'
    explication: الخبر جملة فعلية لأنه يبدأ بالفعل «يَجْتَهِدُ».
  - id: ahwal-2
    difficulte: 2
    enonce: 'ما نوع الخبر في الجملة: العُصْفُورُ فَوْقَ الشَّجَرَةِ؟'
    reponses:
    - شِبْهُ جُمْلَةٍ
    erreurs:
      مفرد: خلط بين الخبر المفرد وشبه الجملة
      جملة فعلية: خلط بين الجملة الفعلية وشبه الجملة
    indice: الخبر ظرف «فَوْقَ» ومضاف إليه.
    explication: 'الخبر شبه جملة (ظرف ومضاف إليه): «فَوْقَ الشَّجَرَةِ».'
  - id: ahwal-3
    difficulte: 3
    enonce: 'ما المبتدأ في الجملة: فِي الحَدِيقَةِ أَزْهَارٌ؟'
    reponses:
    - أَزْهَارٌ
    erreurs:
      الحديقة: خلط بين المبتدأ والخبر المقدم
      في الحديقة: خلط بين المبتدأ والخبر المقدم
    indice: الخبر هنا شبه جملة تقدَّم على المبتدأ لأن المبتدأ نكرة.
    explication: المبتدأ هو «أَزْهَارٌ» (مؤخَّر)، والخبر «فِي الحَدِيقَةِ» (مقدَّم وجوبًا).
- notion: تطابق المبتدأ والخبر
  exercices:
  - id: tatabuq-1
    difficulte: 1
    enonce: 'أكمل بخبر مطابق للمبتدأ: الطَّالِبَةُ ... (مُجْتَهِد)'
    reponses:
    - مُجْتَهِدَةٌ
    erreurs:
      مجتهد: عدم المطابقة في الجنس
    indice: المبتدأ مؤنث، فيجب أن يكون الخبر مؤنثًا.
    explication: 'نقول «الطَّالِبَةُ مُجْتَهِدَةٌ»: يطابق الخبر المبتدأ في التأنيث.'
  - id: tatabuq-2
    difficulte: 2
    enonce: 'أكمل بخبر مطابق للمبتدأ: الطَّالِبَانِ ... (مُجْتَهِد)'
    reponses:
    - مُجْتَهِدَانِ
    erreurs:
      مجتهدون: عدم المطابقة في العدد
      مجتهد: عدم المطابقة في العدد
    indice: المبتدأ مثنى، فيجب أن يكون الخبر مثنى مرفوعًا بالألف.
    explication: 'نقول «الطَّالِبَانِ مُجْتَهِدَانِ»: يطابق الخبر المبتدأ في التثنية.'
  - id: tatabuq-3
    difficulte: 3
    enonce: 'أكمل بخبر مطابق للمبتدأ: الطَّالِبَاتُ ... (مُجْتَهِد)'
    reponses:
    - مُجْتَهِدَاتٌ
    erreurs:
      مجتهدة: عدم المطابقة في العدد
      مجتهدون: عدم المطابقة في الجنس
    indice: المبتدأ جمع مؤنث سالم.
    explication: 'نقول «الطَّالِبَاتُ مُجْتَهِدَاتٌ»: يطابق الخبر المبتدأ في الجمع والتأنيث.'
- notion: ظن وأخواتها
  exercices:
  - id: zanna-1
    difficulte: 1
    enonce: 'ما المفعول به الأول في الجملة: ظَنَنْتُ الجَوَّ بَارِدًا؟'
    reponses:
    - الجَوَّ
    erreurs:
      باردا: خلط بين المفعول الأول والثاني
    indice: 'المفعول الأول كان في الأصل مبتدأ: الجَوُّ بَارِدٌ.'
    explication: المفعول به الأول هو «الجَوَّ»، والثاني «بَارِدًا».
  - id: zanna-2
    difficulte: 2
    enonce: 'ما المفعول به الثاني في الجملة: جَعَلَ الصَّانِعُ الطِّينَ خَزَفًا؟'
    reponses:
    - خَزَفًا
    erreurs:
      الطين: خلط بين المفعول الأول والثاني
      الصانع: خلط بين الفاعل والمفعول به
    indice: 'المفعول الثاني كان في الأصل خبرًا: الطِّينُ خَزَفٌ.'
    explication: المفعول به الثاني هو «خَزَفًا»، والأول «الطِّينَ».
  - id: zanna-3
    difficulte: 3
    enonce: أدخل «ظَنَّ» على الجملة «الامْتِحَانُ سَهْلٌ» مع الفاعل «التِّلْمِيذُ».
    reponses:
    - ظَنَّ التِّلْمِيذُ الامْتِحَانَ سَهْلًا
    erreurs:
      ظن التلميذ الامتحان سهل: نسيان نصب المفعول الثاني
    indice: '«ظَنَّ» تنصب المبتدأ والخبر مفعولين: كيف يصير «سَهْلٌ»؟'
    explication: 'نقول «ظَنَّ التِّلْمِيذُ الامْتِحَانَ سَهْلًا»: «الامتحانَ» مفعول أول و«سهلًا» مفعول ثانٍ منصوبان.'
- notion: أعطى وأخواتها
  exercices:
  - id: aata-1
    difficulte: 1
    enonce: 'ما المفعول به الأول في الجملة: أَعْطَى الأُسْتَاذُ التِّلْمِيذَ جَائِزَةً؟'
    reponses:
    - التِّلْمِيذَ
    erreurs:
      جائزة: خلط بين المفعول الأول والثاني
      الأستاذ: خلط بين الفاعل والمفعول به
    indice: من الذي أخذ الجائزة؟
    explication: المفعول به الأول هو «التِّلْمِيذَ»، والثاني «جَائِزَةً».
  - id: aata-2
    difficulte: 2
    enonce: 'ما المفعول به الثاني في الجملة: كَسَا البَرْدُ الجِبَالَ ثَلْجًا؟'
    reponses:
    - ثَلْجًا
    erreurs:
      الجبال: خلط بين المفعول الأول والثاني
      البرد: خلط بين الفاعل والمفعول به
    indice: بماذا كسا البرد الجبال؟
    explication: المفعول به الثاني هو «ثَلْجًا»، والأول «الجِبَالَ».
  - id: aata-3
    difficulte: 3
    enonce: هل يصلح المفعولان في «مَنَحَ المُدِيرُ الفَائِزَ جَائِزَةً» أن يكونا مبتدأ وخبرًا؟ أجب بـ«نعم» أو «لا».
    reponses:
    - لَا
    erreurs:
      نعم: خلط بين «أعطى وأخواتها» و«ظن وأخواتها»
    indice: 'جرِّب: هل تصح الجملة «الفَائِزُ جَائِزَةٌ»؟'
    explication: 'لا يصلحان: لا نقول «الفَائِزُ جَائِزَةٌ»، لأن «مَنَحَ» من أخوات «أعطى».'
- notion: المبني للمجهول
  exercices:
  - id: majhul-1
    difficulte: 1
    voyelles_obligatoires: true
    enonce: اِبْنِ الفعل «كَتَبَ» للمجهول.
    reponses:
    - كُتِبَ
    erreurs:
      كَتَبَ: عدم تغيير حركات الفعل
    indice: 'في الماضي: يُضم أوله ويُكسر ما قبل آخره.'
    explication: المبني للمجهول من «كَتَبَ» هو «كُتِبَ».
  - id: majhul-2
    difficulte: 2
    voyelles_obligatoires: true
    enonce: اِبْنِ الفعل «يَكْتُبُ» للمجهول.
    reponses:
    - يُكْتَبُ
    erreurs:
      يُكْتِبُ: خطأ في حركة ما قبل الآخر في المضارع
    indice: 'في المضارع: يُضم أوله ويُفتح ما قبل آخره.'
    explication: المبني للمجهول من «يَكْتُبُ» هو «يُكْتَبُ».
  - id: majhul-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: اِبْنِ الفعل «قَالَ» للمجهول.
    reponses:
    - قِيلَ
    erreurs:
      قول: عدم مراعاة حكم الأجوف
      قال: عدم تغيير الفعل
    indice: 'الفعل أجوف: مثل «بَاعَ ← بِيعَ».'
    explication: المبني للمجهول من «قَالَ» هو «قِيلَ».
