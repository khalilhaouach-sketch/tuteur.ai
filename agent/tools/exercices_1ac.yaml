    erreurs:
      القَلَمٌ: خطأ في التعريف بـ«ال»
      أَلْقَلَمُ: خطأ في التعريف بـ«ال»
    indice: لَا تَنْوِينَ مَعَ «ال».
    explication: 'نَقُولُ: القَلَمُ؛ يُحْذَفُ التَّنْوِينُ.'
  - id: nakira-11
    difficulte: 3
    enonce: مَا أَعْرَفُ المَعَارِفِ؟ (الضَّمِيرُ / المُعَرَّفُ بِـ«ال» / المُضَافُ إِلَى مَعْرِفَةٍ)
    reponses:
