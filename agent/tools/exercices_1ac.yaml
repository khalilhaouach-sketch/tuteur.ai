    indice: 'قَارِنْ: «هَذَانِ» فِي الرَّفْعِ وَ«هَذَيْنِ» فِي النَّصْبِ وَالجَرِّ.'
    explication: '«هَذَانِ» مُعْرَبٌ لِأَنَّهُ مُثَنًّى: يُرْفَعُ بِالأَلِفِ، وَيُنْصَبُ وَيُجَرُّ بِاليَاءِ (هَذَيْنِ).'
