    erreurs:
      المُعَرَّفُ بِـ«ال»: خطأ في أنواع المعرفة
      المُضَافُ إِلَى مَعْرِفَةٍ: خطأ في أنواع المعرفة
    indice: أَيُّهَا لَا يَحْتَمِلُ أَيَّ غُمُوضٍ؟
    explication: أَعْرَفُ المَعَارِفِ الضَّمِيرُ، ثُمَّ العَلَمُ.
  - id: nakira-12
