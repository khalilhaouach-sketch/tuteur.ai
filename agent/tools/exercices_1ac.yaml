- notion: إعراب الفعل المضارع
  exercices:
  - id: mudari3-1
    difficulte: 1
    enonce: 'مَا الحَرْفُ الَّذِي نَصَبَ الفِعْلَ المُضَارِعَ فِي الجُمْلَةِ: لَنْ يَتَأَخَّرَ التِّلْمِيذُ؟'
    reponses:
    - لَنْ
    erreurs:
      التلميذ: خلط بين الناصب والفاعل
      يتأخر: خلط بين الناصب والفعل
    indice: حَرْفُ النَّصْبِ يَأْتِي قَبْلَ الفِعْلِ المُضَارِعِ مُبَاشَرَةً.
    explication: الحَرْفُ النَّاصِبُ هُوَ «لَنْ»، وَلِذَلِكَ جَاءَ الفِعْلُ «يَتَأَخَّرَ» مَنْصُوبًا وَعَلَامَةُ نَصْبِهِ الفَتْحَةُ.
  - id: mudari3-2
    difficulte: 2
    enonce: 'مَا عَلَامَةُ رَفْعِ الفِعْلِ المُضَارِعِ فِي الجُمْلَةِ: يَدْرُسُ التِّلْمِيذُ؟'
    reponses:
    - الضَّمَّةُ
    - الضَّمَّةُ الظَّاهِرَةُ
    erreurs:
      الفتحة: خلط بين علامة الرفع وعلامة النصب
      السكون: خلط بين علامة الرفع وعلامة الجزم
    indice: 'لَمْ يَسْبِقِ الفِعْلَ نَاصِبٌ وَلَا جَازِمٌ، فَهُوَ مَرْفُوعٌ: اُنْظُرْ إِلَى حَرَكَةِ آخِرِهِ.'
    explication: «يَدْرُسُ» مَرْفُوعٌ لِأَنَّهُ لَمْ يَسْبِقْهُ نَاصِبٌ وَلَا جَازِمٌ، وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ الظَّاهِرَةُ عَلَى آخِرِهِ.
  - id: mudari3-3
    difficulte: 3
    enonce: 'مَا عَلَامَةُ نَصْبِ الفِعْلِ المُضَارِعِ فِي الجُمْلَةِ: التَّلَامِيذُ لَنْ يَتَأَخَّرُوا؟'
    reponses:
    - حَذْفُ النُّونِ
    - حَذْفُ النُّونِ لِأَنَّهُ مِنَ الأَفْعَالِ الخَمْسَةِ
    erreurs:
      الفتحة: إغفال حكم الأفعال الخمسة
      ثبوت النون: خلط بين علامة الرفع وعلامة النصب في الأفعال الخمسة
    indice: '«يَتَأَخَّرُوا» مِنَ الأَفْعَالِ الخَمْسَةِ: كَيْفَ تُنْصَبُ هَذِهِ الأَفْعَالُ؟'
    explication: «يَتَأَخَّرُوا» فِعْلٌ مُضَارِعٌ مَنْصُوبٌ بِـ«لَنْ»، وَعَلَامَةُ نَصْبِهِ حَذْفُ النُّونِ لِأَنَّهُ مِنَ الأَفْعَالِ الخَمْسَةِ.
  - id: mudari3-4
    difficulte: 1
    enonce: مَا حُكْمُ المُضَارِعِ إِذَا لَمْ يَسْبِقْهُ نَاصِبٌ وَلَا جَازِمٌ؟ (مَرْفُوعٌ / مَنْصُوبٌ / مَجْزُومٌ)
    reponses:
    - مَرْفُوعٌ
    erreurs:
      مَنْصُوبٌ: خطأ في حكم المضارع
      مَجْزُومٌ: خطأ في حكم المضارع
    indice: 'مِثَالٌ: يَكْتُبُ التِّلْمِيذُ.'
    explication: المُضَارِعُ مَرْفُوعٌ إِذَا لَمْ يَسْبِقْهُ نَاصِبٌ وَلَا جَازِمٌ.
  - id: mudari3-5
    difficulte: 1
    enonce: أَيُّ حَرْفٍ يَنْصِبُ المُضَارِعَ؟ (لَمْ / لَنْ / لَا النَّاهِيَةُ)
    reponses:
    - لَنْ
    erreurs:
      لَمْ: خلط بين النواصب والجوازم
      لَا النَّاهِيَةُ: خلط بين النواصب والجوازم
    indice: 'النَّوَاصِبُ: أَنْ، لَنْ، كَيْ، لِـ، حَتَّى...'
    explication: '«لَنْ» حَرْفُ نَصْبٍ: لَنْ يَتَأَخَّرَ.'
  - id: mudari3-6
    difficulte: 1
    enonce: 'اِخْتَرِ الصَّحِيحَ: أُرِيدُ أَنْ ... كِتَابًا. (أَقْرَأُ / أَقْرَأَ / أَقْرَأْ)'
    reponses:
    - أَقْرَأَ
    erreurs:
      أَقْرَأُ: خطأ في نصب المضارع
      أَقْرَأْ: خطأ في نصب المضارع
    indice: «أَنْ» تَنْصِبُ المُضَارِعَ.
    explication: 'نَقُولُ: أُرِيدُ أَنْ أَقْرَأَ؛ مَنْصُوبٌ بِالفَتْحَةِ.'
  - id: mudari3-7
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: جِئْتُ إِلَى المَدْرَسَةِ كَيْ ... (أَتَعَلَّمُ / أَتَعَلَّمَ / أَتَعَلَّمْ)'
    reponses:
    - أَتَعَلَّمَ
    erreurs:
      أَتَعَلَّمُ: خطأ في نصب المضارع
      أَتَعَلَّمْ: خطأ في نصب المضارع
    indice: «كَيْ» حَرْفُ نَصْبٍ.
    explication: 'نَقُولُ: كَيْ أَتَعَلَّمَ.'
  - id: mudari3-8
    difficulte: 2
    enonce: 'مَا عَلَامَةُ رَفْعِ «يَدْعُو» فِي: يَدْعُو المُؤْمِنُ رَبَّهُ؟ (الضَّمَّةُ الظَّاهِرَةُ / الضَّمَّةُ المُقَدَّرَةُ / ثُبُوتُ النُّونِ)'
    reponses:
    - الضَّمَّةُ المُقَدَّرَةُ
    erreurs:
      الضَّمَّةُ الظَّاهِرَةُ: خطأ في علامة رفع المضارع
      ثُبُوتُ النُّونِ: خطأ في علامة رفع المضارع
    indice: الضَّمَّةُ ثَقِيلَةٌ عَلَى الوَاوِ.
    explication: «يَدْعُو» مَرْفُوعٌ بِضَمَّةٍ مُقَدَّرَةٍ عَلَى الوَاوِ لِلثِّقَلِ.
  - id: mudari3-9
    difficulte: 2
    enonce: 'مَا عَلَامَةُ نَصْبِ «يَدْعُوَ» فِي: لَنْ يَدْعُوَ إِلَّا رَبَّهُ؟ (الفَتْحَةُ الظَّاهِرَةُ / الفَتْحَةُ المُقَدَّرَةُ / حَذْفُ النُّونِ)'
    reponses:
    - الفَتْحَةُ الظَّاهِرَةُ
    erreurs:
      الفَتْحَةُ المُقَدَّرَةُ: خطأ في علامة نصب المضارع
      حَذْفُ النُّونِ: خطأ في علامة نصب المضارع
    indice: الفَتْحَةُ تَظْهَرُ عَلَى الوَاوِ وَاليَاءِ.
    explication: «يَدْعُوَ» مَنْصُوبٌ بِالفَتْحَةِ الظَّاهِرَةِ.
  - id: mudari3-10
    difficulte: 2
    enonce: 'مَا عَلَامَةُ نَصْبِ «يَسْعَى» فِي: لَنْ يَسْعَى إِلَى الشَّرِّ؟ (الفَتْحَةُ الظَّاهِرَةُ / الفَتْحَةُ المُقَدَّرَةُ / حَذْفُ حَرْفِ العِلَّةِ)'
    reponses:
    - الفَتْحَةُ المُقَدَّرَةُ
    erreurs:
      الفَتْحَةُ الظَّاهِرَةُ: خطأ في علامة نصب المضارع
      حَذْفُ حَرْفِ العِلَّةِ: خطأ في علامة نصب المضارع
    indice: لَا تَظْهَرُ الحَرَكَةُ عَلَى الأَلِفِ.
    explication: «يَسْعَى» مَنْصُوبٌ بِفَتْحَةٍ مُقَدَّرَةٍ عَلَى الأَلِفِ لِلتَّعَذُّرِ.
  - id: mudari3-11
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: اجْتَهِدُوا حَتَّى ... (تَنْجَحُونَ / تَنْجَحُوا / تَنْجَحُ)'
    reponses:
    - تَنْجَحُوا
    erreurs:
      تَنْجَحُونَ: خطأ في نصب الأفعال الخمسة
      تَنْجَحُ: خطأ في نصب الأفعال الخمسة
    indice: «حَتَّى» تَنْصِبُ، وَالأَفْعَالُ الخَمْسَةُ تُنْصَبُ بِحَذْفِ النُّونِ.
    explication: 'نَقُولُ: اجْتَهِدُوا حَتَّى تَنْجَحُوا.'
  - id: mudari3-12
    difficulte: 3
    enonce: 'مَا الحَرْفُ النَّاصِبُ فِي: جِئْتُ لِأَتَعَلَّمَ؟ (جِئْتُ / لَامُ التَّعْلِيلِ / أَتَعَلَّمَ)'
    reponses:
    - لَامُ التَّعْلِيلِ
    erreurs:
      جِئْتُ: خلط بين النواصب والجوازم
      أَتَعَلَّمَ: خلط بين النواصب والجوازم
    indice: اللَّامُ هُنَا تُبَيِّنُ السَّبَبَ.
    explication: الفِعْلُ «أَتَعَلَّمَ» مَنْصُوبٌ بِلَامِ التَّعْلِيلِ (أَوْ بِـ«أَنْ» مُضْمَرَةٍ بَعْدَهَا).
  - id: mudari3-13
    difficulte: 3
    enonce: مَا عَلَامَةُ رَفْعِ «يَكْتُبَانِ»؟ (الضَّمَّةُ / ثُبُوتُ النُّونِ / الأَلِفُ)
    reponses:
    - ثُبُوتُ النُّونِ
    erreurs:
      الضَّمَّةُ: خطأ في علامة رفع المضارع
      الأَلِفُ: خطأ في علامة رفع المضارع
    indice: «يَكْتُبَانِ» مِنَ الأَفْعَالِ الخَمْسَةِ.
    explication: «يَكْتُبَانِ» مَرْفُوعٌ بِثُبُوتِ النُّونِ.
- notion: جزم الفعل المضارع
  exercices:
  - id: jazm-1
    difficulte: 1
    enonce: 'مَا الحَرْفُ الَّذِي جَزَمَ الفِعْلَ فِي الجُمْلَةِ: لَمْ يَتَأَخَّرِ التِّلْمِيذُ؟'
    reponses:
    - لَمْ
    erreurs:
      التلميذ: خلط بين الجازم والفاعل
      يتأخر: خلط بين الجازم والفعل
    indice: الجَازِمُ يَأْتِي قَبْلَ الفِعْلِ المُضَارِعِ مُبَاشَرَةً.
    explication: الحَرْفُ الجَازِمُ هُوَ «لَمْ»، وَلِذَلِكَ جَاءَ الفِعْلُ «يَتَأَخَّرْ» مَجْزُومًا (وَكُسِرَ آخِرُهُ لِالْتِقَاءِ السَّاكِنَيْنِ).
  - id: jazm-2
    difficulte: 2
    enonce: 'مَا عَلَامَةُ جَزْمِ الفِعْلِ فِي الجُمْلَةِ: لَمْ يَنْسَ أَحْمَدُ وَعْدَهُ؟'
    reponses:
    - حَذْفُ حَرْفِ العِلَّةِ
    erreurs:
      السكون: إغفال أن الفعل معتل الآخر
    indice: 'أَصْلُ الفِعْلِ «يَنْسَى»: مَاذَا حَدَثَ لِآخِرِهِ؟'
    explication: «يَنْسَ» مَجْزُومٌ بِـ«لَمْ»، وَعَلَامَةُ جَزْمِهِ حَذْفُ حَرْفِ العِلَّةِ (الأَلِفِ).
  - id: jazm-3
    difficulte: 3
    enonce: 'مَا عَلَامَةُ جَزْمِ الفِعْلِ فِي الجُمْلَةِ: لَا تَتَأَخَّرُوا عَنِ المَوْعِدِ؟'
    reponses:
    - حَذْفُ النُّونِ
    erreurs:
      السكون: إغفال حكم الأفعال الخمسة
    indice: '«تَتَأَخَّرُوا» مِنَ الأَفْعَالِ الخَمْسَةِ: كَيْفَ تُجْزَمُ هَذِهِ الأَفْعَالُ؟'
    explication: «تَتَأَخَّرُوا» مَجْزُومٌ بِـ«لَا» النَّاهِيَةِ، وَعَلَامَةُ جَزْمِهِ حَذْفُ النُّونِ لِأَنَّهُ مِنَ الأَفْعَالِ الخَمْسَةِ.
  - id: jazm-4
    difficulte: 1
    enonce: أَيُّ حَرْفٍ يَجْزِمُ المُضَارِعَ؟ (لَنْ / لَمْ / أَنْ)
    reponses:
    - لَمْ
    erreurs:
      لَنْ: خلط بين النواصب والجوازم
      أَنْ: خلط بين النواصب والجوازم
    indice: 'الجَوَازِمُ: لَمْ، لَمَّا، لَامُ الأَمْرِ، لَا النَّاهِيَةُ.'
    explication: '«لَمْ» حَرْفُ جَزْمٍ: لَمْ يَتَأَخَّرْ.'
  - id: jazm-5
    difficulte: 1
    enonce: 'اِخْتَرِ الصَّحِيحَ: لَمْ ... التِّلْمِيذُ. (يَتَأَخَّرُ / يَتَأَخَّرَ / يَتَأَخَّرْ)'
    reponses:
    - يَتَأَخَّرْ
    erreurs:
      يَتَأَخَّرُ: خطأ في جزم المضارع
      يَتَأَخَّرَ: خطأ في جزم المضارع
    indice: المُضَارِعُ الصَّحِيحُ الآخِرِ يُجْزَمُ بِالسُّكُونِ.
    explication: 'نَقُولُ: لَمْ يَتَأَخَّرِ التِّلْمِيذُ (كُسِرَ لِالْتِقَاءِ السَّاكِنَيْنِ).'
  - id: jazm-6
    difficulte: 1
    enonce: 'مَا عَلَامَةُ الجَزْمِ فِي: لَا تَكْذِبْ؟ (السُّكُونُ / حَذْفُ النُّونِ / حَذْفُ حَرْفِ العِلَّةِ)'
    reponses:
    - السُّكُونُ
    erreurs:
      حَذْفُ النُّونِ: خطأ في علامة الجزم
      حَذْفُ حَرْفِ العِلَّةِ: خطأ في علامة الجزم
    indice: الفِعْلُ صَحِيحُ الآخِرِ.
    explication: «تَكْذِبْ» مَجْزُومٌ بِـ«لَا» النَّاهِيَةِ، وَعَلَامَةُ جَزْمِهِ السُّكُونُ.
  - id: jazm-7
    difficulte: 2
    enonce: 'مَا عَلَامَةُ الجَزْمِ فِي: لَمْ يَمْشِ الطِّفْلُ بَعْدُ؟ (السُّكُونُ / حَذْفُ النُّونِ / حَذْفُ حَرْفِ العِلَّةِ)'
    reponses:
    - حَذْفُ حَرْفِ العِلَّةِ
    erreurs:
      السُّكُونُ: خطأ في علامة الجزم
      حَذْفُ النُّونِ: خطأ في علامة الجزم
    indice: أَصْلُ الفِعْلِ «يَمْشِي».
    explication: «يَمْشِ» مَجْزُومٌ بِحَذْفِ حَرْفِ العِلَّةِ (اليَاءِ).
  - id: jazm-8
    difficulte: 2
    enonce: 'مَا عَلَامَةُ الجَزْمِ فِي: لَمْ يَحْضُرُوا؟ (السُّكُونُ / حَذْفُ النُّونِ / حَذْفُ حَرْفِ العِلَّةِ)'
    reponses:
    - حَذْفُ النُّونِ
    erreurs:
      السُّكُونُ: خطأ في علامة الجزم
      حَذْفُ حَرْفِ العِلَّةِ: خطأ في علامة الجزم
    indice: أَصْلُ الفِعْلِ «يَحْضُرُونَ».
    explication: «يَحْضُرُوا» مَجْزُومٌ بِحَذْفِ النُّونِ.
  - id: jazm-9
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: لَمْ ... أَحْمَدُ وَعْدَهُ. (يَنْسَى / يَنْسَ / يَنْسُو)'
    reponses:
    - يَنْسَ
    erreurs:
      يَنْسَى: خطأ في جزم المضارع
      يَنْسُو: خطأ في جزم المضارع
    indice: المُضَارِعُ المُعْتَلُّ الآخِرِ يُجْزَمُ بِحَذْفِ حَرْفِ العِلَّةِ.
    explication: 'نَقُولُ: لَمْ يَنْسَ أَحْمَدُ وَعْدَهُ.'
  - id: jazm-10
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: ... كُلُّ تِلْمِيذٍ وَاجِبَهُ. (لِيُنْجِزْ / لِيُنْجِزُ / لِيُنْجِزَ)'
    reponses:
    - لِيُنْجِزْ
    erreurs:
      لِيُنْجِزُ: خطأ في جزم المضارع
      لِيُنْجِزَ: خطأ في جزم المضارع
    indice: لَامُ الأَمْرِ تَجْزِمُ المُضَارِعَ.
    explication: 'نَقُولُ: لِيُنْجِزْ كُلُّ تِلْمِيذٍ وَاجِبَهُ.'
  - id: jazm-11
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: لَا ... إِلَى الغُرَبَاءِ يَا وَلَدِي. (تَجْرِي / تَجْرِ / تَجْرَى)'
    reponses:
    - تَجْرِ
    erreurs:
      تَجْرِي: خطأ في جزم المضارع
      تَجْرَى: خطأ في جزم المضارع
    indice: «لَا» النَّاهِيَةُ تَجْزِمُ، وَالفِعْلُ مُعْتَلُّ الآخِرِ.
    explication: 'نَقُولُ: لَا تَجْرِ.'
  - id: jazm-12
    difficulte: 3
    enonce: مَا الفَرْقُ بَيْنَ «لَمْ» وَ«لَنْ»؟ («لَمْ» تَجْزِمُ وَتَقْلِبُ زَمَنَهُ إِلَى المَاضِي، وَ«لَنْ» تَنْصِبُ وَتُخَلِّصُهُ لِلْمُسْتَقْبَلِ / كِلَاهُمَا يَنْصِبُ / كِلَاهُمَا يَجْزِمُ)
    reponses:
    - «لَمْ» تَجْزِمُ وَتَقْلِبُ زَمَنَهُ إِلَى المَاضِي، وَ«لَنْ» تَنْصِبُ وَتُخَلِّصُهُ لِلْمُسْتَقْبَلِ
    erreurs:
      كِلَاهُمَا يَنْصِبُ: خلط بين النواصب والجوازم
      كِلَاهُمَا يَجْزِمُ: خلط بين النواصب والجوازم
    indice: 'قَارِنْ: لَمْ أُسَافِرْ أَمْسِ / لَنْ أُسَافِرَ غَدًا.'
    explication: «لَمْ» حَرْفُ جَزْمٍ وَنَفْيٍ وَقَلْبٍ، وَ«لَنْ» حَرْفُ نَصْبٍ وَنَفْيٍ وَاسْتِقْبَالٍ.
  - id: jazm-13
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: يَا بَنَاتُ، لَا ... (تَتَأَخَّرْنَ / تَتَأَخَّرُوا / تَتَأَخَّرِي)'
    reponses:
    - تَتَأَخَّرْنَ
    erreurs:
      تَتَأَخَّرُوا: خطأ في جزم المضارع
      تَتَأَخَّرِي: خطأ في جزم المضارع
    indice: مَعَ نُونِ النِّسْوَةِ يَكُونُ الفِعْلُ مَبْنِيًّا عَلَى السُّكُونِ فِي مَحَلِّ جَزْمٍ.
    explication: 'نَقُولُ: يَا بَنَاتُ، لَا تَتَأَخَّرْنَ.'
- notion: النكرة والمعرفة
  exercices:
  - id: nakira-1
    difficulte: 1
    enonce: هَلْ كَلِمَةُ «مَدِينَةٌ» نَكِرَةٌ أَمْ مَعْرِفَةٌ؟
    reponses:
    - نَكِرَةٌ
    erreurs:
      معرفة: خلط بين النكرة والمعرفة
    indice: هَلْ تَدُلُّ الكَلِمَةُ عَلَى مَدِينَةٍ مُعَيَّنَةٍ نَعْرِفُهَا، أَمْ عَلَى أَيِّ مَدِينَةٍ؟
    explication: «مَدِينَةٌ» نَكِرَةٌ، لِأَنَّهَا لَا تَدُلُّ عَلَى مَدِينَةٍ مُعَيَّنَةٍ؛ وَيَدُلُّ عَلَى ذَلِكَ التَّنْوِينُ وَغِيَابُ «ال».
  - id: nakira-2
    difficulte: 2
    voyelles_obligatoires: true
    enonce: 'اِجْعَلِ النَّكِرَةَ مَعْرِفَةً بِإِدْخَالِ «ال» عَلَيْهَا: كِتَابٌ'
    reponses:
    - الكِتَابُ
    erreurs:
      كتاب: عدم إدخال «ال» التعريف
      الكِتَابٌ: إبقاء التنوين مع «ال» التعريف
    indice: 'أَضِفْ «ال» فِي أَوَّلِ الكَلِمَةِ، وَانْتَبِهْ: المُعَرَّفُ بِـ«ال» لَا يُنَوَّنُ.'
    explication: 'تَصِيرُ «كِتَابٌ» مَعْرِفَةً بِإِدْخَالِ «ال»: «الكِتَابُ»، وَيُحْذَفُ التَّنْوِينُ.'
  - id: nakira-3
    difficulte: 3
    enonce: مَا نَوْعُ المَعْرِفَةِ فِي كَلِمَةِ «هَذَا»؟
    reponses:
    - اِسْمُ إِشَارَةٍ
    - اِسْمُ الإِشَارَةِ
    erreurs:
      ضمير: خلط بين اسم الإشارة والضمير
      اسم موصول: خلط بين اسم الإشارة والاسم الموصول
    indice: نَسْتَعْمِلُ هَذِهِ الكَلِمَةَ لِنُشِيرَ بِهَا إِلَى شَيْءٍ قَرِيبٍ.
    explication: «هَذَا» اسْمُ إِشَارَةٍ لِلْمُفْرَدِ المُذَكَّرِ القَرِيبِ، وَهُوَ مِنْ أَنْوَاعِ المَعْرِفَةِ.
  - id: nakira-4
    difficulte: 1
    enonce: هَلْ «بَيْتٌ» نَكِرَةٌ أَمْ مَعْرِفَةٌ؟ (نَكِرَةٌ / مَعْرِفَةٌ)
    reponses:
    - نَكِرَةٌ
    erreurs:
      مَعْرِفَةٌ: خلط بين النكرة والمعرفة
    indice: هَلْ يَدُلُّ عَلَى بَيْتٍ مُعَيَّنٍ؟
    explication: '«بَيْتٌ» نَكِرَةٌ: لَا يَدُلُّ عَلَى بَيْتٍ مُعَيَّنٍ.'
  - id: nakira-5
    difficulte: 1
    enonce: هَلْ «البَيْتُ» نَكِرَةٌ أَمْ مَعْرِفَةٌ؟ (نَكِرَةٌ / مَعْرِفَةٌ)
    reponses:
    - مَعْرِفَةٌ
    erreurs:
      نَكِرَةٌ: خلط بين النكرة والمعرفة
    indice: دَخَلَتْ عَلَيْهِ «ال».
    explication: «البَيْتُ» مَعْرِفَةٌ بِـ«ال».
  - id: nakira-6
    difficulte: 1
    enonce: هَلْ «مُحَمَّدٌ» نَكِرَةٌ أَمْ مَعْرِفَةٌ؟ (نَكِرَةٌ / مَعْرِفَةٌ)
    reponses:
    - مَعْرِفَةٌ
    erreurs:
      نَكِرَةٌ: خلط بين النكرة والمعرفة
    indice: هُوَ اسْمُ شَخْصٍ مُعَيَّنٍ.
    explication: '«مُحَمَّدٌ» مَعْرِفَةٌ: عَلَمٌ.'
  - id: nakira-7
