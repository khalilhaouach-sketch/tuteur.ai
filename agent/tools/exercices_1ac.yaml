    enonce: 'حَوِّلْ إِلَى المَبْنِيِّ لِلْمَجْهُولِ: يَحْتَرِمُ النَّاسُ الصَّادِقِينَ. (يُحْتَرَمُ الصَّادِقُونَ / يُحْتَرَمُ الصَّادِقِينَ / يَحْتَرِمُ الصَّادِقُونَ)'
    reponses:
