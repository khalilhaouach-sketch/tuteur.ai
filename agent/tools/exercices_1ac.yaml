      مَعَ المُثَنَّى: خلط بين الاستتار وجوبا وجوازا
    indice: 'قَارِنْ: اِجْلِسْ / اِجْلِسُوا / اِجْلِسَا.'
    explication: 'يَسْتَتِرُ الضَّمِيرُ وُجُوبًا فِي أَمْرِ المُفْرَدِ المُذَكَّرِ: اِجْلِسْ (أَنْتَ).'
- notion: الضمير المتصل
  exercices:
  - id: muttasil-1
    difficulte: 1
    enonce: مَا الضَّمِيرُ المُتَّصِلُ فِي الفِعْلِ «كَتَبْنَا»؟
    reponses:
    - نَا
    erreurs:
      كتب: خلط بين الفعل والضمير
    indice: اُنْظُرْ إِلَى مَا أُضِيفَ إِلَى آخِرِ الفِعْلِ «كَتَبَ».
    explication: الضَّمِيرُ المُتَّصِلُ هُوَ «نَا» (نَا الفَاعِلِينَ).
  - id: muttasil-2
    difficulte: 2
    enonce: مَا الضَّمِيرُ المُتَّصِلُ فِي كَلِمَةِ «كِتَابُهُ»؟
    reponses:
    - الهَاءُ
    - هَاءُ الغَائِبِ
    erreurs:
      الكاف: خلط بين كاف الخطاب وهاء الغائب
    indice: مَا الحَرْفُ الَّذِي يَدُلُّ عَلَى الغَائِبِ فِي آخِرِ الكَلِمَةِ؟
    explication: الضَّمِيرُ المُتَّصِلُ هُوَ الهَاءُ (هَاءُ الغَائِبِ).
  - id: muttasil-3
    difficulte: 3
    enonce: مَا الضَّمِيرُ المُتَّصِلُ فِي الفِعْلِ «اُكْتُبِي»؟
    reponses:
    - يَاءُ المُخَاطَبَةِ
    erreurs:
      ياء المتكلم: خلط بين ياء المخاطبة وياء المتكلم
    indice: الفِعْلُ مُوَجَّهٌ إِلَى أُنْثَى نُخَاطِبُهَا.
    explication: الضَّمِيرُ المُتَّصِلُ هُوَ يَاءُ المُخَاطَبَةِ.
  - id: muttasil-4
    difficulte: 1
    enonce: مَا الضَّمِيرُ المُتَّصِلُ فِي «قَلَمِي»؟ (القَافُ / اليَاءُ / المِيمُ)
    reponses:
    - اليَاءُ
    erreurs:
      القَافُ: خطأ في تحديد الضمير المتصل
      المِيمُ: خطأ في تحديد الضمير المتصل
    indice: الضَّمِيرُ فِي آخِرِ الكَلِمَةِ.
    explication: الضَّمِيرُ المُتَّصِلُ يَاءُ المُتَكَلِّمِ.
  - id: muttasil-5
    difficulte: 1
    enonce: مَا الضَّمِيرُ المُتَّصِلُ فِي «كَتَبُوا»؟ (وَاوُ الجَمَاعَةِ / التَّاءُ / الأَلِفُ)
    reponses:
    - وَاوُ الجَمَاعَةِ
    erreurs:
      التَّاءُ: خطأ في تحديد الضمير المتصل
      الأَلِفُ: خطأ في تحديد الضمير المتصل
    indice: الفِعْلُ لِلْجَمَاعَةِ.
    explication: الضَّمِيرُ المُتَّصِلُ وَاوُ الجَمَاعَةِ.
  - id: muttasil-6
    difficulte: 1
    enonce: مَا الضَّمِيرُ المُتَّصِلُ فِي «بَيْتُهَا»؟ (هَا / التَّاءُ / اليَاءُ)
    reponses:
    - هَا
    erreurs:
      التَّاءُ: خطأ في تحديد الضمير المتصل
      اليَاءُ: خطأ في تحديد الضمير المتصل
    indice: الضَّمِيرُ يَدُلُّ عَلَى الغَائِبَةِ.
    explication: الضَّمِيرُ المُتَّصِلُ «هَا».
  - id: muttasil-7
    difficulte: 2
    enonce: هَلِ الضَّمِيرُ فِي «كَتَبْنَا» ضَمِيرُ رَفْعٍ أَمْ نَصْبٍ؟ (رَفْعٍ / نَصْبٍ)
    reponses:
    - رَفْعٍ
    erreurs:
      نَصْبٍ: خلط بين ضمائر الرفع والنصب
    indice: '«نَا» هُنَا فَاعِلٌ: نَحْنُ كَتَبْنَا.'
    explication: «نَا» فِي «كَتَبْنَا» ضَمِيرُ رَفْعٍ (فَاعِلٌ).
  - id: muttasil-8
    difficulte: 2
    enonce: هَلِ الضَّمِيرُ فِي «أَكْرَمَنَا» ضَمِيرُ رَفْعٍ أَمْ نَصْبٍ؟ (رَفْعٍ / نَصْبٍ)
    reponses:
    - نَصْبٍ
    erreurs:
      رَفْعٍ: خلط بين ضمائر الرفع والنصب
    indice: '«نَا» هُنَا مَفْعُولٌ بِهِ: أَكْرَمَنَا المُعَلِّمُ.'
    explication: «نَا» فِي «أَكْرَمَنَا» ضَمِيرُ نَصْبٍ (مَفْعُولٌ بِهِ).
  - id: muttasil-9
    difficulte: 2
    enonce: مَا الضَّمِيرُ المُتَّصِلُ فِي «اُكْتُبَا»؟ (أَلِفُ الاِثْنَيْنِ / وَاوُ الجَمَاعَةِ / يَاءُ المُخَاطَبَةِ)
    reponses:
    - أَلِفُ الاِثْنَيْنِ
    erreurs:
      وَاوُ الجَمَاعَةِ: خطأ في تحديد الضمير المتصل
      يَاءُ المُخَاطَبَةِ: خطأ في تحديد الضمير المتصل
    indice: الفِعْلُ لِلْمُثَنَّى.
    explication: الضَّمِيرُ المُتَّصِلُ أَلِفُ الاِثْنَيْنِ.
  - id: muttasil-10
    difficulte: 2
    enonce: مَا الضَّمِيرُ المُتَّصِلُ فِي «يَكْتُبْنَ»؟ (نُونُ النِّسْوَةِ / وَاوُ الجَمَاعَةِ / التَّاءُ)
    reponses:
    - نُونُ النِّسْوَةِ
    erreurs:
      وَاوُ الجَمَاعَةِ: خطأ في تحديد الضمير المتصل
      التَّاءُ: خطأ في تحديد الضمير المتصل
    indice: الفِعْلُ لِجَمَاعَةِ الإِنَاثِ.
    explication: الضَّمِيرُ المُتَّصِلُ نُونُ النِّسْوَةِ.
  - id: muttasil-11
    difficulte: 3
    enonce: هَلْ يُبْدَأُ بِالضَّمِيرِ المُتَّصِلِ فِي الكَلَامِ؟ (نَعَمْ / لَا)
    reponses:
    - لَا
    erreurs:
      نَعَمْ: خطأ في تعريف الضمير المتصل
    indice: الضَّمِيرُ المُتَّصِلُ يَتَّصِلُ بِمَا قَبْلَهُ.
    explication: لَا يُبْتَدَأُ بِالضَّمِيرِ المُتَّصِلِ، وَلَا يَقَعُ بَعْدَ «إِلَّا».
  - id: muttasil-12
    difficulte: 3
    enonce: مَا مَوْقِعُ الكَافِ فِي «كِتَابُكَ»؟ (مُضَافٌ إِلَيْهِ / مَفْعُولٌ بِهِ / فَاعِلٌ)
    reponses:
    - مُضَافٌ إِلَيْهِ
    erreurs:
      مَفْعُولٌ بِهِ: خطأ في موقع الضمير المتصل
      فَاعِلٌ: خطأ في موقع الضمير المتصل
    indice: الكَافُ اتَّصَلَتْ بِاسْمٍ.
    explication: الكَافُ فِي «كِتَابُكَ» ضَمِيرٌ مُتَّصِلٌ فِي مَحَلِّ جَرٍّ مُضَافٌ إِلَيْهِ.
  - id: muttasil-13
    difficulte: 3
    enonce: مَا مَوْقِعُ اليَاءِ فِي «اُكْتُبِي»؟ (فَاعِلٌ / مَفْعُولٌ بِهِ / مُضَافٌ إِلَيْهِ)
    reponses:
    - فَاعِلٌ
    erreurs:
      مَفْعُولٌ بِهِ: خطأ في موقع الضمير المتصل
      مُضَافٌ إِلَيْهِ: خطأ في موقع الضمير المتصل
    indice: يَاءُ المُخَاطَبَةِ هِيَ الَّتِي تَكْتُبُ.
    explication: يَاءُ المُخَاطَبَةِ فِي «اُكْتُبِي» ضَمِيرٌ مُتَّصِلٌ فِي مَحَلِّ رَفْعٍ فَاعِلٌ.
- notion: الضمير المنفصل
  exercices:
  - id: munfasil-1
    difficulte: 1
    enonce: 'مَا الضَّمِيرُ المُنْفَصِلُ فِي الجُمْلَةِ: نَحْنُ نَحْتَرِمُ القَانُونَ؟'
    reponses:
    - نَحْنُ
    erreurs:
      القانون: خلط بين الضمير والاسم الظاهر
    indice: الضَّمِيرُ المُنْفَصِلُ كَلِمَةٌ مُسْتَقِلَّةٌ نَبْدَأُ بِهَا الكَلَامَ.
    explication: الضَّمِيرُ المُنْفَصِلُ هُوَ «نَحْنُ».
  - id: munfasil-2
    difficulte: 2
    voyelles_obligatoires: true
    enonce: مَا ضَمِيرُ الرَّفْعِ المُنْفَصِلُ لِلْمُخَاطَبَةِ المُفْرَدَةِ؟
    reponses:
    - أَنْتِ
    erreurs:
      أَنْتَ: خلط بين ضمير المخاطب وضمير المخاطبة
    indice: 'اِنْتَبِهْ إِلَى حَرَكَةِ التَّاءِ: تَخْتَلِفُ بَيْنَ المُذَكَّرِ وَالمُؤَنَّثِ.'
    explication: ضَمِيرُ المُخَاطَبَةِ هُوَ «أَنْتِ» بِكَسْرِ التَّاءِ، أَمَّا «أَنْتَ» فَلِلْمُخَاطَبِ.
  - id: munfasil-3
    difficulte: 3
    enonce: هَلْ «إِيَّاكَ» ضَمِيرُ رَفْعٍ أَمْ ضَمِيرُ نَصْبٍ؟
    reponses:
    - ضَمِيرُ نَصْبٍ
    - نَصْبٌ
    erreurs:
      ضمير رفع: خلط بين ضمائر الرفع وضمائر النصب
      رفع: خلط بين ضمائر الرفع وضمائر النصب
    indice: فِي «إِيَّاكَ نَعْبُدُ» يَقَعُ الضَّمِيرُ مَفْعُولًا بِهِ.
    explication: «إِيَّاكَ» ضَمِيرُ نَصْبٍ مُنْفَصِلٌ.
  - id: munfasil-4
    difficulte: 1
    enonce: مَا الضَّمِيرُ المُنْفَصِلُ لِلْمُتَكَلِّمِ المُفْرَدِ؟ (أَنَا / نَحْنُ / أَنْتَ)
    reponses:
    - أَنَا
    erreurs:
      نَحْنُ: خطأ في ضمائر الرفع المنفصلة
      أَنْتَ: خطأ في ضمائر الرفع المنفصلة
    indice: الَّذِي يَتَكَلَّمُ وَحْدَهُ.
    explication: 'ضَمِيرُ المُتَكَلِّمِ المُفْرَدِ: أَنَا.'
  - id: munfasil-5
    difficulte: 1
    enonce: مَا الضَّمِيرُ المُنْفَصِلُ لِلْغَائِبِينَ؟ (هُمْ / هُنَّ / هُمَا)
    reponses:
    - هُمْ
    erreurs:
      هُنَّ: خطأ في ضمائر الرفع المنفصلة
      هُمَا: خطأ في ضمائر الرفع المنفصلة
    indice: جَمَاعَةُ الذُّكُورِ الغَائِبِينَ.
    explication: 'ضَمِيرُ الغَائِبِينَ: هُمْ.'
  - id: munfasil-6
    difficulte: 1
    enonce: مَا الضَّمِيرُ المُنْفَصِلُ لِلْمُخَاطَبَتَيْنِ؟ (أَنْتُمَا / أَنْتُنَّ / أَنْتِ)
    reponses:
    - أَنْتُمَا
    erreurs:
      أَنْتُنَّ: خطأ في ضمائر الرفع المنفصلة
      أَنْتِ: خطأ في ضمائر الرفع المنفصلة
    indice: المُثَنَّى المُخَاطَبُ (مُذَكَّرًا أَوْ مُؤَنَّثًا).
    explication: 'ضَمِيرُ المُثَنَّى المُخَاطَبِ: أَنْتُمَا.'
  - id: munfasil-7
    difficulte: 2
    enonce: مَا الضَّمِيرُ المُنْفَصِلُ لِجَمَاعَةِ الإِنَاثِ المُخَاطَبَاتِ؟ (أَنْتُمْ / أَنْتُنَّ / هُنَّ)
    reponses:
    - أَنْتُنَّ
    erreurs:
      أَنْتُمْ: خطأ في ضمائر الرفع المنفصلة
      هُنَّ: خطأ في ضمائر الرفع المنفصلة
    indice: نُخَاطِبُ بَنَاتٍ.
    explication: 'ضَمِيرُ المُخَاطَبَاتِ: أَنْتُنَّ.'
  - id: munfasil-8
    difficulte: 2
    enonce: هَلْ «إِيَّاهُ» ضَمِيرُ رَفْعٍ أَمْ نَصْبٍ؟ (رَفْعٍ / نَصْبٍ)
    reponses:
    - نَصْبٍ
    erreurs:
      رَفْعٍ: خلط بين ضمائر الرفع والنصب
    indice: ضَمَائِرُ النَّصْبِ المُنْفَصِلَةُ تَبْدَأُ بِـ«إِيَّا».
    explication: «إِيَّاهُ» ضَمِيرُ نَصْبٍ مُنْفَصِلٌ.
  - id: munfasil-9
    difficulte: 2
    enonce: هَلْ «هِيَ» ضَمِيرُ رَفْعٍ أَمْ نَصْبٍ؟ (رَفْعٍ / نَصْبٍ)
    reponses:
    - رَفْعٍ
    erreurs:
      نَصْبٍ: خلط بين ضمائر الرفع والنصب
    indice: «هِيَ» تَقَعُ مُبْتَدَأً غَالِبًا.
    explication: «هِيَ» ضَمِيرُ رَفْعٍ مُنْفَصِلٌ.
  - id: munfasil-10
    difficulte: 2
    enonce: 'اِخْتَرِ الضَّمِيرَ المُنَاسِبَ: ... تِلْمِيذَتَانِ مُجْتَهِدَتَانِ. (هُمْ / هُمَا / هُنَّ)'
    reponses:
    - هُمَا
    erreurs:
      هُمْ: خطأ في اختيار الضمير
      هُنَّ: خطأ في اختيار الضمير
    indice: الخَبَرُ مُثَنًّى.
    explication: 'نَقُولُ: هُمَا تِلْمِيذَتَانِ مُجْتَهِدَتَانِ.'
  - id: munfasil-11
    difficulte: 3
    enonce: 'اِخْتَرِ الضَّمِيرَ المُنَاسِبَ: ... نَعْبُدُ وَ... نَسْتَعِينُ. (إِيَّاكَ / أَنْتَ / إِيَّاهُ)'
    reponses:
    - إِيَّاكَ
    erreurs:
      أَنْتَ: خلط بين ضمائر الرفع والنصب
      إِيَّاهُ: خلط بين ضمائر الرفع والنصب
    indice: الضَّمِيرُ مَفْعُولٌ بِهِ مُقَدَّمٌ يُخَاطِبُ اللَّهَ.
    explication: 'نَقُولُ: إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ؛ «إِيَّاكَ» ضَمِيرُ نَصْبٍ مُنْفَصِلٌ.'
  - id: munfasil-12
    difficulte: 3
    enonce: 'مَا مَوْقِعُ «نَحْنُ» فِي: نَحْنُ تَلَامِيذُ؟ (مُبْتَدَأٌ / خَبَرٌ / مَفْعُولٌ بِهِ)'
    reponses:
    - مُبْتَدَأٌ
    erreurs:
      خَبَرٌ: خطأ في موقع الضمير المنفصل
      مَفْعُولٌ بِهِ: خطأ في موقع الضمير المنفصل
    indice: الجُمْلَةُ اسْمِيَّةٌ تَبْدَأُ بِالضَّمِيرِ.
    explication: «نَحْنُ» ضَمِيرٌ مُنْفَصِلٌ مَبْنِيٌّ فِي مَحَلِّ رَفْعٍ مُبْتَدَأٌ.
  - id: munfasil-13
    difficulte: 3
    enonce: كَمْ ضَمِيرًا مِنْ ضَمَائِرِ الرَّفْعِ المُنْفَصِلَةِ؟ (اثْنَا عَشَرَ / عَشَرَةٌ / سِتَّةٌ)
    reponses:
    - اثْنَا عَشَرَ
    erreurs:
      عَشَرَةٌ: خطأ في عدد الضمائر
      سِتَّةٌ: خطأ في عدد الضمائر
    indice: لِلْمُتَكَلِّمِ 2، وَلِلْمُخَاطَبِ 5، وَلِلْغَائِبِ 5.
    explication: 'ضَمَائِرُ الرَّفْعِ المُنْفَصِلَةُ اثْنَا عَشَرَ: أَنَا، نَحْنُ، أَنْتَ، أَنْتِ، أَنْتُمَا، أَنْتُمْ، أَنْتُنَّ، هُوَ، هِيَ، هُمَا، هُمْ، هُنَّ.'
- notion: أسماء الإشارة
  exercices:
  - id: ishara-1
    difficulte: 1
    enonce: مَا اسْمُ الإِشَارَةِ لِلْمُفْرَدَةِ المُؤَنَّثَةِ القَرِيبَةِ؟
    reponses:
    - هَذِهِ
    erreurs:
      هذا: خلط بين المذكر والمؤنث
      تلك: خلط بين القريب والبعيد
    indice: لِلْمُذَكَّرِ القَرِيبِ نَقُولُ «هَذَا»، فَمَاذَا نَقُولُ لِلْمُؤَنَّثِ؟
    explication: اسْمُ الإِشَارَةِ لِلْمُفْرَدَةِ المُؤَنَّثَةِ القَرِيبَةِ هُوَ «هَذِهِ».
  - id: ishara-2
    difficulte: 2
    enonce: مَا اسْمُ الإِشَارَةِ لِلْجَمْعِ البَعِيدِ؟
    reponses:
    - أُولَئِكَ
    erreurs:
      هؤلاء: خلط بين القريب والبعيد
    indice: لِلْجَمْعِ القَرِيبِ نَقُولُ «هَؤُلَاءِ»، فَمَاذَا نَقُولُ لِلْبَعِيدِ؟
    explication: اسْمُ الإِشَارَةِ لِلْجَمْعِ البَعِيدِ هُوَ «أُولَئِكَ».
  - id: ishara-3
    difficulte: 3
    enonce: 'اِخْتَرِ اسْمَ الإِشَارَةِ المُنَاسِبَ: رَأَيْتُ (هَذَانِ / هَذَيْنِ) الطَّالِبَيْنِ.'
    reponses:
    - هَذَيْنِ
    erreurs:
      هذان: إغفال نصب المثنى بالياء
    indice: اسْمُ الإِشَارَةِ هُنَا مَفْعُولٌ بِهِ، وَالمُثَنَّى يُنْصَبُ بِاليَاءِ.
    explication: نَقُولُ «رَأَيْتُ هَذَيْنِ الطَّالِبَيْنِ»، لِأَنَّ اسْمَ الإِشَارَةِ مَفْعُولٌ بِهِ مَنْصُوبٌ بِاليَاءِ.
  - id: ishara-4
    difficulte: 1
    enonce: مَا اسْمُ الإِشَارَةِ لِلْمُفْرَدِ المُذَكَّرِ القَرِيبِ؟ (هَذَا / هَذِهِ / ذَلِكَ)
    reponses:
    - هَذَا
    erreurs:
      هَذِهِ: خطأ في اختيار اسم الإشارة
      ذَلِكَ: خطأ في اختيار اسم الإشارة
    indice: المُشَارُ إِلَيْهِ مُذَكَّرٌ قَرِيبٌ.
    explication: 'لِلْمُفْرَدِ المُذَكَّرِ القَرِيبِ: هَذَا.'
  - id: ishara-5
    difficulte: 1
    enonce: مَا اسْمُ الإِشَارَةِ لِلْمُفْرَدَةِ المُؤَنَّثَةِ البَعِيدَةِ؟ (هَذِهِ / تِلْكَ / ذَلِكَ)
    reponses:
    - تِلْكَ
    erreurs:
      هَذِهِ: خطأ في اختيار اسم الإشارة
      ذَلِكَ: خطأ في اختيار اسم الإشارة
    indice: المُشَارُ إِلَيْهِ مُؤَنَّثٌ بَعِيدٌ.
    explication: 'لِلْمُفْرَدَةِ المُؤَنَّثَةِ البَعِيدَةِ: تِلْكَ.'
  - id: ishara-6
    difficulte: 1
    enonce: 'اِخْتَرِ اسْمَ الإِشَارَةِ المُنَاسِبَ: ... الكِتَابُ مُفِيدٌ. (هَذِهِ / هَذَا / هَؤُلَاءِ)'
    reponses:
    - هَذَا
    erreurs:
      هَذِهِ: خطأ في اختيار اسم الإشارة
      هَؤُلَاءِ: خطأ في اختيار اسم الإشارة
    indice: «الكِتَابُ» مُفْرَدٌ مُذَكَّرٌ.
    explication: 'نَقُولُ: هَذَا الكِتَابُ مُفِيدٌ.'
  - id: ishara-7
    difficulte: 2
    enonce: 'اِخْتَرِ اسْمَ الإِشَارَةِ المُنَاسِبَ: ... البِنْتَانِ أُخْتَانِ. (هَاتَانِ / هَذَانِ / هَاتَيْنِ)'
    reponses:
    - هَاتَانِ
    erreurs:
      هَذَانِ: خطأ في اختيار اسم الإشارة
      هَاتَيْنِ: خطأ في اختيار اسم الإشارة
    indice: المُثَنَّى المُؤَنَّثُ فِي مَوْضِعِ رَفْعٍ.
    explication: 'نَقُولُ: هَاتَانِ البِنْتَانِ أُخْتَانِ.'
  - id: ishara-8
    difficulte: 2
    enonce: 'اِخْتَرِ اسْمَ الإِشَارَةِ المُنَاسِبَ: ... التَّلَامِيذُ مُجْتَهِدُونَ. (هَذَا / هَؤُلَاءِ / هَذَانِ)'
    reponses:
    - هَؤُلَاءِ
    erreurs:
      هَذَا: خطأ في اختيار اسم الإشارة
      هَذَانِ: خطأ في اختيار اسم الإشارة
    indice: «التَّلَامِيذُ» جَمْعٌ.
    explication: 'نَقُولُ: هَؤُلَاءِ التَّلَامِيذُ مُجْتَهِدُونَ.'
  - id: ishara-9
    difficulte: 2
    enonce: 'اِخْتَرِ اسْمَ الإِشَارَةِ المُنَاسِبَ: شَكَرْتُ ... الرَّجُلَيْنِ. (هَذَانِ / هَذَيْنِ / هَؤُلَاءِ)'
    reponses:
    - هَذَيْنِ
    erreurs:
      هَذَانِ: خطأ في إعراب اسم الإشارة المثنى
      هَؤُلَاءِ: خطأ في إعراب اسم الإشارة المثنى
    indice: اسْمُ الإِشَارَةِ مَفْعُولٌ بِهِ، وَالمُثَنَّى يُنْصَبُ بِاليَاءِ.
    explication: 'نَقُولُ: شَكَرْتُ هَذَيْنِ الرَّجُلَيْنِ.'
  - id: ishara-10
    difficulte: 2
    enonce: مَا اسْمُ الإِشَارَةِ لِلْمَكَانِ البَعِيدِ؟ (هُنَا / هُنَاكَ / هَذَا)
    reponses:
    - هُنَاكَ
    erreurs:
      هُنَا: خطأ في اسم الإشارة للمكان
      هَذَا: خطأ في اسم الإشارة للمكان
    indice: «هُنَا» لِلْقَرِيبِ.
    explication: 'لِلْمَكَانِ البَعِيدِ: هُنَاكَ (وَثَمَّ).'
  - id: ishara-11
    difficulte: 3
    enonce: 'اِخْتَرِ اسْمَ الإِشَارَةِ المُنَاسِبَ: ... الجِبَالُ عَالِيَةٌ (بَعِيدَةٌ). (أُولَئِكَ / تِلْكَ / هَؤُلَاءِ)'
    reponses:
    - تِلْكَ
    erreurs:
      أُولَئِكَ: خطأ في اختيار اسم الإشارة
      هَؤُلَاءِ: خطأ في اختيار اسم الإشارة
    indice: جَمْعُ غَيْرِ العَاقِلِ يُشَارُ إِلَيْهِ غَالِبًا بِالمُفْرَدِ المُؤَنَّثِ.
    explication: 'نَقُولُ: تِلْكَ الجِبَالُ عَالِيَةٌ.'
  - id: ishara-12
    difficulte: 3
    enonce: أَيُّ أَسْمَاءِ الإِشَارَةِ مُعْرَبٌ؟ (هَذَا / هَذَانِ / هَؤُلَاءِ)
    reponses:
    - هَذَانِ
    erreurs:
      هَذَا: خلط بين المعرب والمبني
      هَؤُلَاءِ: خلط بين المعرب والمبني
    indice: 'قَارِنْ: هَذَانِ / هَذَيْنِ.'
    explication: «هَذَانِ» مُعْرَبٌ كَالمُثَنَّى، وَبَاقِي أَسْمَاءِ الإِشَارَةِ مَبْنِيَّةٌ.
  - id: ishara-13
    difficulte: 3
    enonce: مَا اسْمُ الإِشَارَةِ لِلْمُثَنَّى المُذَكَّرِ البَعِيدِ؟ (ذَانِكَ / تَانِكَ / ذَلِكَ)
    reponses:
    - ذَانِكَ
    erreurs:
      تَانِكَ: خطأ في اختيار اسم الإشارة
      ذَلِكَ: خطأ في اختيار اسم الإشارة
    indice: «تَانِكَ» لِلْمُؤَنَّثِ.
    explication: 'لِلْمُثَنَّى المُذَكَّرِ البَعِيدِ: ذَانِكَ.'
- notion: الاسم الموصول
  exercices:
  - id: mawsul-1
    difficulte: 1
    enonce: 'مَا الاِسْمُ المَوْصُولُ فِي الجُمْلَةِ: فَازَ التِّلْمِيذُ الَّذِي اجْتَهَدَ؟'
    reponses:
    - الَّذِي
    erreurs:
      اجتهد: خلط بين الموصول وصلته
      التلميذ: خلط بين الموصول والاسم الذي قبله
    indice: الاِسْمُ المَوْصُولُ تَأْتِي بَعْدَهُ جُمْلَةٌ تُبَيِّنُ مَعْنَاهُ.
    explication: الاِسْمُ المَوْصُولُ هُوَ «الَّذِي»، وَصِلَتُهُ «اجْتَهَدَ».
  - id: mawsul-2
    difficulte: 2
    enonce: 'اِخْتَرِ الاِسْمَ المَوْصُولَ المُنَاسِبَ: نَجَحَتِ التِّلْمِيذَاتُ (الَّذِينَ / اللَّوَاتِي) اجْتَهَدْنَ.'
    reponses:
    - اللَّوَاتِي
    erreurs:
      الذين: خلط بين موصول جمع المذكر وموصول جمع المؤنث
    indice: «التِّلْمِيذَاتُ» جَمْعٌ مُؤَنَّثٌ.
    explication: نَقُولُ «اللَّوَاتِي» لِأَنَّ «التِّلْمِيذَاتُ» جَمْعٌ مُؤَنَّثٌ، وَ«الَّذِينَ» لِجَمْعِ المُذَكَّرِ.
  - id: mawsul-3
    difficulte: 3
    enonce: 'مَا صِلَةُ المَوْصُولِ فِي الجُمْلَةِ: أَحْتَرِمُ مَنْ يَقُولُ الحَقَّ؟'
    reponses:
    - يَقُولُ الحَقَّ
    erreurs:
      من: خلط بين الموصول وصلته
      الحق: عدم تحديد الصلة كاملة
    indice: الصِّلَةُ هِيَ الجُمْلَةُ الَّتِي تَأْتِي بَعْدَ الاِسْمِ المَوْصُولِ «مَنْ».
    explication: صِلَةُ المَوْصُولِ هِيَ «يَقُولُ الحَقَّ».
  - id: mawsul-4
    difficulte: 1
    enonce: 'اِخْتَرِ الاِسْمَ المَوْصُولَ المُنَاسِبَ: نَجَحَتِ البِنْتُ ... اجْتَهَدَتْ. (الَّذِي / الَّتِي / الَّذِينَ)'
    reponses:
    - الَّتِي
    erreurs:
      الَّذِي: خطأ في اختيار الاسم الموصول
      الَّذِينَ: خطأ في اختيار الاسم الموصول
    indice: «البِنْتُ» مُفْرَدَةٌ مُؤَنَّثَةٌ.
    explication: 'نَقُولُ: نَجَحَتِ البِنْتُ الَّتِي اجْتَهَدَتْ.'
  - id: mawsul-5
    difficulte: 1
    enonce: 'اِخْتَرِ الاِسْمَ المَوْصُولَ المُنَاسِبَ: فَازَ اللَّاعِبُونَ ... تَدَرَّبُوا. (الَّذِي / الَّذِينَ / اللَّذَانِ)'
    reponses:
    - الَّذِينَ
    erreurs:
      الَّذِي: خطأ في اختيار الاسم الموصول
      اللَّذَانِ: خطأ في اختيار الاسم الموصول
    indice: «اللَّاعِبُونَ» جَمْعُ مُذَكَّرٍ.
    explication: 'نَقُولُ: فَازَ اللَّاعِبُونَ الَّذِينَ تَدَرَّبُوا.'
  - id: mawsul-6
    difficulte: 1
    enonce: 'مَا الاِسْمُ المَوْصُولُ فِي: قَرَأْتُ الكِتَابَ الَّذِي اشْتَرَيْتُهُ؟ (الكِتَابَ / الَّذِي / اشْتَرَيْتُهُ)'
    reponses:
    - الَّذِي
    erreurs:
      الكِتَابَ: خطأ في تحديد الاسم الموصول
      اشْتَرَيْتُهُ: خطأ في تحديد الاسم الموصول
    indice: الاِسْمُ المَوْصُولُ يَحْتَاجُ إِلَى جُمْلَةٍ بَعْدَهُ.
    explication: الاِسْمُ المَوْصُولُ «الَّذِي».
  - id: mawsul-7
    difficulte: 2
    enonce: 'اِخْتَرِ الاِسْمَ المَوْصُولَ المُنَاسِبَ: كَافَأْتُ التِّلْمِيذَيْنِ ... نَجَحَا. (اللَّذَانِ / اللَّذَيْنِ / الَّذِينَ)'
    reponses:
    - اللَّذَيْنِ
    erreurs:
      اللَّذَانِ: خطأ في إعراب الموصول المثنى
      الَّذِينَ: خطأ في إعراب الموصول المثنى
    indice: المَوْصُولُ نَعْتٌ لِـ«التِّلْمِيذَيْنِ» المَنْصُوبِ.
    explication: 'نَقُولُ: كَافَأْتُ التِّلْمِيذَيْنِ اللَّذَيْنِ نَجَحَا.'
  - id: mawsul-8
    difficulte: 2
    enonce: 'اِخْتَرِ الاِسْمَ المَوْصُولَ المُنَاسِبَ: أُحِبُّ ... يَقُولُ الصِّدْقَ. (مَا / مَنْ / الَّتِي)'
    reponses:
    - مَنْ
    erreurs:
      مَا: خطأ في اختيار الاسم الموصول
      الَّتِي: خطأ في اختيار الاسم الموصول
    indice: «مَنْ» لِلْعَاقِلِ، وَ«مَا» لِغَيْرِ العَاقِلِ.
    explication: 'نَقُولُ: أُحِبُّ مَنْ يَقُولُ الصِّدْقَ.'
  - id: mawsul-9
    difficulte: 2
    enonce: 'اِخْتَرِ الاِسْمَ المَوْصُولَ المُنَاسِبَ: كُلْ ... يَنْفَعُكَ. (مَنْ / مَا / الَّذِينَ)'
    reponses:
    - مَا
    erreurs:
      مَنْ: خطأ في اختيار الاسم الموصول
      الَّذِينَ: خطأ في اختيار الاسم الموصول
    indice: الطَّعَامُ غَيْرُ عَاقِلٍ.
    explication: 'نَقُولُ: كُلْ مَا يَنْفَعُكَ.'
  - id: mawsul-10
    difficulte: 2
    enonce: 'مَا صِلَةُ المَوْصُولِ فِي: رَأَيْتُ الطَّائِرَ الَّذِي يُغَرِّدُ؟ (الطَّائِرَ / يُغَرِّدُ / الَّذِي)'
    reponses:
    - يُغَرِّدُ
    erreurs:
      الطَّائِرَ: خطأ في تحديد صلة الموصول
      الَّذِي: خطأ في تحديد صلة الموصول
    indice: الصِّلَةُ هِيَ الجُمْلَةُ الَّتِي بَعْدَ الاِسْمِ المَوْصُولِ.
    explication: صِلَةُ المَوْصُولِ الجُمْلَةُ الفِعْلِيَّةُ «يُغَرِّدُ».
  - id: mawsul-11
    difficulte: 3
    enonce: 'مَا العَائِدُ فِي: هَذِهِ القِصَّةُ الَّتِي قَرَأْتُهَا؟ (التَّاءُ / الهَاءُ فِي «قَرَأْتُهَا» / الَّتِي)'
    reponses:
    - الهَاءُ فِي «قَرَأْتُهَا»
    erreurs:
      التَّاءُ: خطأ في تحديد العائد
      الَّتِي: خطأ في تحديد العائد
    indice: العَائِدُ ضَمِيرٌ فِي الصِّلَةِ يَعُودُ عَلَى المَوْصُولِ.
    explication: العَائِدُ ضَمِيرُ الغَائِبَةِ «هَا» فِي «قَرَأْتُهَا».
  - id: mawsul-12
    difficulte: 3
    enonce: 'اِخْتَرِ الاِسْمَ المَوْصُولَ المُنَاسِبَ: شَكَرْتُ المُعَلِّمَاتِ ... سَاعَدْنَنِي. (اللَّوَاتِي / الَّذِينَ / اللَّتَانِ)'
    reponses:
    - اللَّوَاتِي
    erreurs:
      الَّذِينَ: خطأ في اختيار الاسم الموصول
      اللَّتَانِ: خطأ في اختيار الاسم الموصول
    indice: المَوْصُولُ لِجَمَاعَةِ الإِنَاثِ.
    explication: 'نَقُولُ: شَكَرْتُ المُعَلِّمَاتِ اللَّوَاتِي (اللَّاتِي) سَاعَدْنَنِي.'
  - id: mawsul-13
    difficulte: 3
    enonce: هَلْ «مَنْ» اسْمٌ مَوْصُولٌ خَاصٌّ أَمْ مُشْتَرَكٌ؟ (خَاصٌّ / مُشْتَرَكٌ)
    reponses:
    - مُشْتَرَكٌ
    erreurs:
      خَاصٌّ: خطأ في أنواع الاسم الموصول
    indice: هَلْ تَتَغَيَّرُ «مَنْ» مَعَ المُذَكَّرِ وَالمُؤَنَّثِ وَالمُثَنَّى وَالجَمْعِ؟
    explication: '«مَنْ» مَوْصُولٌ مُشْتَرَكٌ: يَصْلُحُ لِلْمُفْرَدِ وَالمُثَنَّى وَالجَمْعِ، لِلْمُذَكَّرِ وَالمُؤَنَّثِ.'
- notion: أحوال المبتدأ والخبر
  exercices:
  - id: ahwal-1
    difficulte: 1
    enonce: 'مَا نَوْعُ الخَبَرِ فِي الجُمْلَةِ: الطَّالِبُ يَجْتَهِدُ؟'
    reponses:
    - جُمْلَةٌ فِعْلِيَّةٌ
    erreurs:
      جملة اسمية: خلط بين الجملة الفعلية والاسمية
      مفرد: إغفال أن الخبر جملة
    indice: 'الخَبَرُ «يَجْتَهِدُ»: هَلْ يَبْدَأُ بِفِعْلٍ أَمْ بِاسْمٍ؟'
    explication: الخَبَرُ جُمْلَةٌ فِعْلِيَّةٌ لِأَنَّهُ يَبْدَأُ بِالفِعْلِ «يَجْتَهِدُ».
  - id: ahwal-2
    difficulte: 2
    enonce: 'مَا نَوْعُ الخَبَرِ فِي الجُمْلَةِ: العُصْفُورُ فَوْقَ الشَّجَرَةِ؟'
    reponses:
    - شِبْهُ جُمْلَةٍ
    erreurs:
      مفرد: خلط بين الخبر المفرد وشبه الجملة
      جملة فعلية: خلط بين الجملة الفعلية وشبه الجملة
    indice: الخَبَرُ ظَرْفٌ «فَوْقَ» وَمُضَافٌ إِلَيْهِ.
    explication: 'الخَبَرُ شِبْهُ جُمْلَةٍ (ظَرْفٌ وَمُضَافٌ إِلَيْهِ): «فَوْقَ الشَّجَرَةِ».'
  - id: ahwal-3
    difficulte: 3
    enonce: 'مَا المُبْتَدَأُ فِي الجُمْلَةِ: فِي الحَدِيقَةِ أَزْهَارٌ؟'
    reponses:
    - أَزْهَارٌ
    erreurs:
      الحديقة: خلط بين المبتدأ والخبر المقدم
      في الحديقة: خلط بين المبتدأ والخبر المقدم
    indice: الخَبَرُ هُنَا شِبْهُ جُمْلَةٍ تَقَدَّمَ عَلَى المُبْتَدَإِ لِأَنَّ المُبْتَدَأَ نَكِرَةٌ.
    explication: المُبْتَدَأُ هُوَ «أَزْهَارٌ» (مُؤَخَّرٌ)، وَالخَبَرُ «فِي الحَدِيقَةِ» (مُقَدَّمٌ وُجُوبًا).
  - id: ahwal-4
    difficulte: 1
    enonce: 'مَا نَوْعُ الخَبَرِ فِي: الشَّمْسُ مُشْرِقَةٌ؟ (مُفْرَدٌ / جُمْلَةٌ فِعْلِيَّةٌ / جُمْلَةٌ اسْمِيَّةٌ / شِبْهُ جُمْلَةٍ)'
    reponses:
    - مُفْرَدٌ
    erreurs:
      جُمْلَةٌ فِعْلِيَّةٌ: خطأ في أنواع الخبر
      جُمْلَةٌ اسْمِيَّةٌ: خطأ في أنواع الخبر
      شِبْهُ جُمْلَةٍ: خطأ في أنواع الخبر
    indice: الخَبَرُ يَكُونُ مُفْرَدًا (كَلِمَةً)، أَوْ جُمْلَةً فِعْلِيَّةً، أَوْ جُمْلَةً اسْمِيَّةً، أَوْ شِبْهَ جُمْلَةٍ (جَارًّا وَمَجْرُورًا أَوْ ظَرْفًا).
    explication: الخَبَرُ «مُشْرِقَةٌ» مُفْرَدٌ (كَلِمَةٌ وَاحِدَةٌ).
  - id: ahwal-5
    difficulte: 1
    enonce: 'مَا نَوْعُ الخَبَرِ فِي: الطِّفْلُ يَنَامُ؟ (مُفْرَدٌ / جُمْلَةٌ فِعْلِيَّةٌ / جُمْلَةٌ اسْمِيَّةٌ / شِبْهُ جُمْلَةٍ)'
    reponses:
    - جُمْلَةٌ فِعْلِيَّةٌ
    erreurs:
      مُفْرَدٌ: خطأ في أنواع الخبر
      جُمْلَةٌ اسْمِيَّةٌ: خطأ في أنواع الخبر
      شِبْهُ جُمْلَةٍ: خطأ في أنواع الخبر
    indice: الخَبَرُ يَكُونُ مُفْرَدًا (كَلِمَةً)، أَوْ جُمْلَةً فِعْلِيَّةً، أَوْ جُمْلَةً اسْمِيَّةً، أَوْ شِبْهَ جُمْلَةٍ (جَارًّا وَمَجْرُورًا أَوْ ظَرْفًا).
    explication: الخَبَرُ «يَنَامُ» جُمْلَةٌ فِعْلِيَّةٌ.
  - id: ahwal-6
    difficulte: 1
    enonce: 'مَا نَوْعُ الخَبَرِ فِي: القَلَمُ فِي الحَقِيبَةِ؟ (مُفْرَدٌ / جُمْلَةٌ فِعْلِيَّةٌ / جُمْلَةٌ اسْمِيَّةٌ / شِبْهُ جُمْلَةٍ)'
    reponses:
    - شِبْهُ جُمْلَةٍ
    erreurs:
      مُفْرَدٌ: خطأ في أنواع الخبر
      جُمْلَةٌ فِعْلِيَّةٌ: خطأ في أنواع الخبر
      جُمْلَةٌ اسْمِيَّةٌ: خطأ في أنواع الخبر
    indice: الخَبَرُ يَكُونُ مُفْرَدًا (كَلِمَةً)، أَوْ جُمْلَةً فِعْلِيَّةً، أَوْ جُمْلَةً اسْمِيَّةً، أَوْ شِبْهَ جُمْلَةٍ (جَارًّا وَمَجْرُورًا أَوْ ظَرْفًا).
    explication: الخَبَرُ «فِي الحَقِيبَةِ» شِبْهُ جُمْلَةٍ (جَارٌّ وَمَجْرُورٌ).
  - id: ahwal-7
    difficulte: 2
    enonce: 'مَا نَوْعُ الخَبَرِ فِي: البَيْتُ بَابُهُ وَاسِعٌ؟ (مُفْرَدٌ / جُمْلَةٌ فِعْلِيَّةٌ / جُمْلَةٌ اسْمِيَّةٌ / شِبْهُ جُمْلَةٍ)'
    reponses:
    - جُمْلَةٌ اسْمِيَّةٌ
    erreurs:
      مُفْرَدٌ: خطأ في أنواع الخبر
      جُمْلَةٌ فِعْلِيَّةٌ: خطأ في أنواع الخبر
      شِبْهُ جُمْلَةٍ: خطأ في أنواع الخبر
    indice: الخَبَرُ يَكُونُ مُفْرَدًا (كَلِمَةً)، أَوْ جُمْلَةً فِعْلِيَّةً، أَوْ جُمْلَةً اسْمِيَّةً، أَوْ شِبْهَ جُمْلَةٍ (جَارًّا وَمَجْرُورًا أَوْ ظَرْفًا).
    explication: الخَبَرُ «بَابُهُ وَاسِعٌ» جُمْلَةٌ اسْمِيَّةٌ.
  - id: ahwal-8
    difficulte: 2
    enonce: 'مَا نَوْعُ الخَبَرِ فِي: الكُرَةُ تَحْتَ الطَّاوِلَةِ؟ (مُفْرَدٌ / جُمْلَةٌ فِعْلِيَّةٌ / جُمْلَةٌ اسْمِيَّةٌ / شِبْهُ جُمْلَةٍ)'
    reponses:
    - شِبْهُ جُمْلَةٍ
    erreurs:
      مُفْرَدٌ: خطأ في أنواع الخبر
      جُمْلَةٌ فِعْلِيَّةٌ: خطأ في أنواع الخبر
      جُمْلَةٌ اسْمِيَّةٌ: خطأ في أنواع الخبر
    indice: الخَبَرُ يَكُونُ مُفْرَدًا (كَلِمَةً)، أَوْ جُمْلَةً فِعْلِيَّةً، أَوْ جُمْلَةً اسْمِيَّةً، أَوْ شِبْهَ جُمْلَةٍ (جَارًّا وَمَجْرُورًا أَوْ ظَرْفًا).
    explication: الخَبَرُ «تَحْتَ الطَّاوِلَةِ» شِبْهُ جُمْلَةٍ (ظَرْفٌ).
  - id: ahwal-9
    difficulte: 2
    enonce: 'مَا المُبْتَدَأُ فِي: فِي القِسْمِ تَلَامِيذُ؟ (القِسْمِ / تَلَامِيذُ / فِي)'
    reponses:
    - تَلَامِيذُ
    erreurs:
      القِسْمِ: خطأ في تقديم الخبر
      فِي: خطأ في تقديم الخبر
    indice: 'المُبْتَدَأُ نَكِرَةٌ وَالخَبَرُ شِبْهُ جُمْلَةٍ: يَتَقَدَّمُ الخَبَرُ.'
    explication: المُبْتَدَأُ «تَلَامِيذُ» (مُؤَخَّرٌ)، وَالخَبَرُ «فِي القِسْمِ» (مُقَدَّمٌ).
  - id: ahwal-10
    difficulte: 2
    enonce: 'مَا الخَبَرُ فِي: أَيْنَ المِفْتَاحُ؟ (أَيْنَ / المِفْتَاحُ)'
    reponses:
    - أَيْنَ
    erreurs:
      المِفْتَاحُ: خطأ في تقديم الخبر
    indice: اسْمُ الاِسْتِفْهَامِ لَهُ الصَّدَارَةُ.
    explication: الخَبَرُ «أَيْنَ» (مُقَدَّمٌ وُجُوبًا)، وَالمُبْتَدَأُ «المِفْتَاحُ».
  - id: ahwal-11
    difficulte: 3
    enonce: 'لِمَاذَا تَقَدَّمَ الخَبَرُ فِي: عِنْدِي كِتَابٌ؟ (لِأَنَّ المُبْتَدَأَ نَكِرَةٌ وَالخَبَرَ شِبْهُ جُمْلَةٍ / لِأَنَّ الخَبَرَ مُفْرَدٌ / لَا يَتَقَدَّمُ)'
    reponses:
    - لِأَنَّ المُبْتَدَأَ نَكِرَةٌ وَالخَبَرَ شِبْهُ جُمْلَةٍ
    erreurs:
      لِأَنَّ الخَبَرَ مُفْرَدٌ: خطأ في تقديم الخبر
      لَا يَتَقَدَّمُ: خطأ في تقديم الخبر
    indice: هَلْ «كِتَابٌ» نَكِرَةٌ؟
    explication: يَتَقَدَّمُ الخَبَرُ وُجُوبًا لِأَنَّ المُبْتَدَأَ نَكِرَةٌ وَالخَبَرَ شِبْهُ جُمْلَةٍ (ظَرْفٌ).
  - id: ahwal-12
    difficulte: 3
    enonce: 'مَا نَوْعُ الخَبَرِ فِي: المُعَلِّمُ يَشْرَحُ الدَّرْسَ؟ (مُفْرَدٌ / جُمْلَةٌ فِعْلِيَّةٌ / جُمْلَةٌ اسْمِيَّةٌ / شِبْهُ جُمْلَةٍ)'
    reponses:
    - جُمْلَةٌ فِعْلِيَّةٌ
    erreurs:
      مُفْرَدٌ: خطأ في أنواع الخبر
      جُمْلَةٌ اسْمِيَّةٌ: خطأ في أنواع الخبر
      شِبْهُ جُمْلَةٍ: خطأ في أنواع الخبر
    indice: الخَبَرُ يَكُونُ مُفْرَدًا (كَلِمَةً)، أَوْ جُمْلَةً فِعْلِيَّةً، أَوْ جُمْلَةً اسْمِيَّةً، أَوْ شِبْهَ جُمْلَةٍ (جَارًّا وَمَجْرُورًا أَوْ ظَرْفًا).
    explication: الخَبَرُ «يَشْرَحُ الدَّرْسَ» جُمْلَةٌ فِعْلِيَّةٌ.
  - id: ahwal-13
    difficulte: 3
    enonce: 'مَا الرَّابِطُ بَيْنَ المُبْتَدَإِ وَالخَبَرِ الجُمْلَةِ فِي: الحَدِيقَةُ أَزْهَارُهَا جَمِيلَةٌ؟ (الضَّمِيرُ «هَا» / «ال» / لَا رَابِطَ)'
    reponses:
    - الضَّمِيرُ «هَا»
    erreurs:
      «ال»: خطأ في الرابط
      لَا رَابِطَ: خطأ في الرابط
    indice: الخَبَرُ الجُمْلَةُ يَحْتَاجُ إِلَى ضَمِيرٍ يَعُودُ عَلَى المُبْتَدَإِ.
    explication: الرَّابِطُ الضَّمِيرُ «هَا» فِي «أَزْهَارُهَا»، يَعُودُ عَلَى «الحَدِيقَةُ».
- notion: تطابق المبتدأ والخبر
  exercices:
  - id: tatabuq-1
    difficulte: 1
    enonce: 'أَكْمِلْ بِخَبَرٍ مُطَابِقٍ لِلْمُبْتَدَإِ: الطَّالِبَةُ ... (مُجْتَهِد)'
    reponses:
    - مُجْتَهِدَةٌ
    erreurs:
      مجتهد: عدم المطابقة في الجنس
    indice: المُبْتَدَأُ مُؤَنَّثٌ، فَيَجِبُ أَنْ يَكُونَ الخَبَرُ مُؤَنَّثًا.
    explication: 'نَقُولُ «الطَّالِبَةُ مُجْتَهِدَةٌ»: يُطَابِقُ الخَبَرُ المُبْتَدَأَ فِي التَّأْنِيثِ.'
  - id: tatabuq-2
