    explication: 'نَقُولُ «الطَّالِبَاتُ مُجْتَهِدَاتٌ»: يُطَابِقُ الخَبَرُ المُبْتَدَأَ فِي الجَمْعِ وَالتَّأْنِيثِ.'
  - id: tatabuq-4
