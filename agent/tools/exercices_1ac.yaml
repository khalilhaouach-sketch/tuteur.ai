    indice: المِثَالُ حَرْفُ العِلَّةِ فِي أَوَّلِهِ، وَالأَجْوَفُ فِي وَسَطِهِ، وَالنَّاقِصُ فِي آخِرِهِ.
    explication: '«نَامَ» أَجْوَفُ: حَرْفُ العِلَّةِ فِي وَسَطِهِ.'
  - id: mithal-6
    difficulte: 1
    enonce: مَا نَوْعُ الفِعْلِ «يَبِسَ»؟ (مِثَالٌ / أَجْوَفُ / نَاقِصٌ)
