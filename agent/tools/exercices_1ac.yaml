    indice: اِبْحَثْ عَنْ ضَمِيرٍ مَكْتُوبٍ فِي آخِرِ الفِعْلِ.
    explication: 'فِي «اُكْتُبُوا» ضَمِيرٌ بَارِزٌ: وَاوُ الجَمَاعَةِ.'
  - id: mustatir-13
    difficulte: 3
    enonce: مَتَى يَسْتَتِرُ الضَّمِيرُ وُجُوبًا فِي فِعْلِ الأَمْرِ؟ (مَعَ المُفْرَدِ المُذَكَّرِ المُخَاطَبِ / مَعَ جَمَاعَةِ الذُّكُورِ / مَعَ المُثَنَّى)
    reponses:
    - مَعَ المُفْرَدِ المُذَكَّرِ المُخَاطَبِ
    erreurs:
