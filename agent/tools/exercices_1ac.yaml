    indice: المِثَالُ حَرْفُ العِلَّةِ فِي أَوَّلِهِ، وَالأَجْوَفُ فِي وَسَطِهِ، وَالنَّاقِصُ فِي آخِرِهِ.
    explication: «يَبِسَ» مِثَالٌ يَائِيٌّ.
  - id: mithal-7
    difficulte: 2
    enonce: مَا نَوْعُ الفِعْلِ «صَامَ»؟ (مِثَالٌ / أَجْوَفُ / نَاقِصٌ)
    reponses:
    - أَجْوَفُ
    erreurs:
      مِثَالٌ: خطأ في أنواع المعتل
      نَاقِصٌ: خطأ في أنواع المعتل
    indice: المِثَالُ حَرْفُ العِلَّةِ فِي أَوَّلِهِ، وَالأَجْوَفُ فِي وَسَطِهِ، وَالنَّاقِصُ فِي آخِرِهِ.
    explication: «صَامَ» أَجْوَفُ وَاوِيٌّ (يَصُومُ).
  - id: mithal-8
    difficulte: 2
    enonce: مَا مُضَارِعُ «وَقَفَ»؟ (يُوقِفُ / يَقِفُ / يَوْقُفُ)
    reponses:
    - يَقِفُ
    erreurs:
      يُوقِفُ: خطأ في تصريف المثال
      يَوْقُفُ: خطأ في تصريف المثال
    indice: تُحْذَفُ وَاوُ المِثَالِ فِي المُضَارِعِ غَالِبًا.
    explication: 'مُضَارِعُ «وَقَفَ»: يَقِفُ.'
  - id: mithal-9
    difficulte: 2
    enonce: مَا الأَمْرُ مِنْ «وَضَعَ»؟ (ضَعْ / اوْضَعْ / وَضَعْ)
    reponses:
    - ضَعْ
    erreurs:
      اوْضَعْ: خطأ في أمر المثال
      وَضَعْ: خطأ في أمر المثال
    indice: مُضَارِعُهُ «يَضَعُ» بِحَذْفِ الوَاوِ.
    explication: 'الأَمْرُ مِنْ «وَضَعَ»: ضَعْ.'
  - id: mithal-10
    difficulte: 2
    enonce: 'أَسْنِدْ «نَامَ» إِلَى تَاءِ الفَاعِلِ: (نَامْتُ / نِمْتُ / نُمْتُ)'
    reponses:
    - نِمْتُ
    erreurs:
      نَامْتُ: خطأ في إسناد الأجوف
      نُمْتُ: خطأ في إسناد الأجوف
    indice: مَعَ الضَّمَائِرِ المُتَحَرِّكَةِ تُحْذَفُ أَلِفُ الأَجْوَفِ، وَ«نَامَ يَنَامُ» تُكْسَرُ فَاؤُهُ.
    explication: 'نَقُولُ: نِمْتُ.'
  - id: mithal-11
    difficulte: 3
    enonce: مَا الأَمْرُ مِنْ «قَالَ»؟ (قَالْ / قُلْ / قِلْ)
    reponses:
    - قُلْ
    erreurs:
      قَالْ: خطأ في أمر الأجوف
      قِلْ: خطأ في أمر الأجوف
    indice: مُضَارِعُهُ «يَقُولُ»، وَيُحْذَفُ حَرْفُ العِلَّةِ لِالْتِقَاءِ السَّاكِنَيْنِ.
    explication: 'الأَمْرُ مِنْ «قَالَ»: قُلْ.'
  - id: mithal-12
    difficulte: 3
    enonce: مَا الأَمْرُ مِنْ «بَاعَ»؟ (بِعْ / بُعْ / بَاعْ)
    reponses:
    - بِعْ
    erreurs:
      بُعْ: خطأ في أمر الأجوف
      بَاعْ: خطأ في أمر الأجوف
    indice: مُضَارِعُهُ «يَبِيعُ».
    explication: 'الأَمْرُ مِنْ «بَاعَ»: بِعْ.'
  - id: mithal-13
    difficulte: 3
    enonce: 'أَسْنِدْ «قَامَ» إِلَى «نَا» الفَاعِلِينَ: (قَامْنَا / قُمْنَا / قِمْنَا)'
    reponses:
    - قُمْنَا
    erreurs:
      قَامْنَا: خطأ في إسناد الأجوف
      قِمْنَا: خطأ في إسناد الأجوف
    indice: أَصْلُ الأَلِفِ وَاوٌ (يَقُومُ)، فَتُضَمُّ الفَاءُ.
    explication: 'نَقُولُ: قُمْنَا.'
- notion: الفعل الناقص
  exercices:
  - id: naqis-1
    difficulte: 1
    enonce: 'مَا نَوْعُ الفِعْلِ المُعْتَلِّ «رَمَى»: مِثَالٌ أَمْ أَجْوَفُ أَمْ نَاقِصٌ؟'
    reponses:
    - نَاقِصٌ
    erreurs:
      أجوف: خلط بين الأجوف والناقص
      مثال: خلط بين المثال والناقص
    indice: حَرْفُ العِلَّةِ فِي آخِرِ الفِعْلِ.
    explication: «رَمَى» نَاقِصٌ، لِأَنَّ لَامَهُ (آخِرَ حُرُوفِهِ) حَرْفُ عِلَّةٍ.
  - id: naqis-2
    difficulte: 2
    voyelles_obligatoires: true
    enonce: أَسْنِدِ الفِعْلَ «دَعَا» إِلَى وَاوِ الجَمَاعَةِ (هُمْ).
    reponses:
    - دَعَوْا
    erreurs:
      دعاوا: عدم حذف لام الناقص مع واو الجماعة
    indice: مَعَ وَاوِ الجَمَاعَةِ تُحْذَفُ لَامُ الفِعْلِ النَّاقِصِ.
    explication: نَقُولُ «دَعَوْا» بِحَذْفِ الأَلِفِ (لَامِ الفِعْلِ) عِنْدَ إِسْنَادِهِ إِلَى وَاوِ الجَمَاعَةِ.
  - id: naqis-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: أَدْخِلْ «لَمْ» عَلَى الفِعْلِ «يَرْمِي».
    reponses:
    - لَمْ يَرْمِ
    erreurs:
      لم يرمي: عدم حذف حرف العلة في الجزم
    indice: المُضَارِعُ المُعْتَلُّ الآخِرِ يُجْزَمُ بِحَذْفِ حَرْفِ العِلَّةِ.
    explication: نَقُولُ «لَمْ يَرْمِ» بِحَذْفِ اليَاءِ، لِأَنَّ الفِعْلَ مُعْتَلُّ الآخِرِ.
  - id: naqis-4
    difficulte: 1
    enonce: مَا نَوْعُ الفِعْلِ «دَعَا»؟ (مِثَالٌ / أَجْوَفُ / نَاقِصٌ)
    reponses:
    - نَاقِصٌ
    erreurs:
      مِثَالٌ: خطأ في أنواع المعتل
      أَجْوَفُ: خطأ في أنواع المعتل
    indice: المِثَالُ حَرْفُ العِلَّةِ فِي أَوَّلِهِ، وَالأَجْوَفُ فِي وَسَطِهِ، وَالنَّاقِصُ فِي آخِرِهِ.
    explication: '«دَعَا» نَاقِصٌ: حَرْفُ العِلَّةِ فِي آخِرِهِ.'
  - id: naqis-5
    difficulte: 1
    enonce: مَا نَوْعُ الفِعْلِ «مَشَى»؟ (مِثَالٌ / أَجْوَفُ / نَاقِصٌ)
    reponses:
    - نَاقِصٌ
    erreurs:
      مِثَالٌ: خطأ في أنواع المعتل
      أَجْوَفُ: خطأ في أنواع المعتل
    indice: المِثَالُ حَرْفُ العِلَّةِ فِي أَوَّلِهِ، وَالأَجْوَفُ فِي وَسَطِهِ، وَالنَّاقِصُ فِي آخِرِهِ.
    explication: «مَشَى» نَاقِصٌ يَائِيٌّ (يَمْشِي).
  - id: naqis-6
    difficulte: 1
    enonce: مَا مُضَارِعُ «جَرَى»؟ (يَجْرُو / يَجْرِي / يَجْرَى)
    reponses:
    - يَجْرِي
    erreurs:
      يَجْرُو: خطأ في تصريف الناقص
      يَجْرَى: خطأ في تصريف الناقص
    indice: أَلِفُ «جَرَى» أَصْلُهَا يَاءٌ.
    explication: 'مُضَارِعُ «جَرَى»: يَجْرِي.'
  - id: naqis-7
    difficulte: 2
    enonce: مَا مُضَارِعُ «سَمَا»؟ (يَسْمِي / يَسْمُو / يَسْمَى)
    reponses:
    - يَسْمُو
    erreurs:
      يَسْمِي: خطأ في تصريف الناقص
      يَسْمَى: خطأ في تصريف الناقص
    indice: أَلِفُ «سَمَا» أَصْلُهَا وَاوٌ.
    explication: 'مُضَارِعُ «سَمَا»: يَسْمُو.'
  - id: naqis-8
    difficulte: 2
    enonce: 'أَدْخِلْ «لَمْ» عَلَى «يَدْعُو»: (لَمْ يَدْعُو / لَمْ يَدْعُ / لَمْ يَدْعَا)'
    reponses:
    - لَمْ يَدْعُ
    erreurs:
      لَمْ يَدْعُو: خطأ في جزم الناقص
      لَمْ يَدْعَا: خطأ في جزم الناقص
    indice: يُجْزَمُ المُضَارِعُ النَّاقِصُ بِحَذْفِ حَرْفِ العِلَّةِ.
    explication: 'نَقُولُ: لَمْ يَدْعُ.'
  - id: naqis-9
    difficulte: 2
    enonce: 'مَا عَلَامَةُ نَصْبِ «يَرْمِيَ» فِي: لَنْ يَرْمِيَ؟ (الفَتْحَةُ الظَّاهِرَةُ / الفَتْحَةُ المُقَدَّرَةُ / حَذْفُ حَرْفِ العِلَّةِ)'
    reponses:
    - الفَتْحَةُ الظَّاهِرَةُ
    erreurs:
      الفَتْحَةُ المُقَدَّرَةُ: خطأ في علامة إعراب الناقص
      حَذْفُ حَرْفِ العِلَّةِ: خطأ في علامة إعراب الناقص
    indice: الفَتْحَةُ تَظْهَرُ عَلَى اليَاءِ وَالوَاوِ، وَلَا تَظْهَرُ عَلَى الأَلِفِ.
    explication: «يَرْمِيَ» مَنْصُوبٌ بِـ«لَنْ» وَعَلَامَةُ نَصْبِهِ الفَتْحَةُ الظَّاهِرَةُ عَلَى اليَاءِ.
  - id: naqis-10
    difficulte: 2
    enonce: مَا الأَمْرُ مِنْ «مَشَى»؟ (اِمْشِ / اِمْشِي / مَشْ)
    reponses:
    - اِمْشِ
    erreurs:
      اِمْشِي: خطأ في أمر الناقص
      مَشْ: خطأ في أمر الناقص
    indice: الأَمْرُ يُبْنَى عَلَى حَذْفِ حَرْفِ العِلَّةِ.
    explication: 'الأَمْرُ مِنْ «مَشَى»: اِمْشِ.'
  - id: naqis-11
    difficulte: 3
    enonce: 'أَسْنِدْ «رَمَى» إِلَى وَاوِ الجَمَاعَةِ: (رَمَيُوا / رَمَوْا / رَمُوا)'
    reponses:
    - رَمَوْا
    erreurs:
      رَمَيُوا: خطأ في إسناد الناقص
      رَمُوا: خطأ في إسناد الناقص
    indice: تُحْذَفُ الأَلِفُ وَيَبْقَى مَا قَبْلَهَا مَفْتُوحًا.
    explication: 'نَقُولُ: رَمَوْا.'
  - id: naqis-12
    difficulte: 3
    enonce: مَا الأَمْرُ مِنْ «دَعَا»؟ (اُدْعُ / اُدْعُو / اِدْعَ)
    reponses:
    - اُدْعُ
    erreurs:
      اُدْعُو: خطأ في أمر الناقص
      اِدْعَ: خطأ في أمر الناقص
    indice: الأَمْرُ يُبْنَى عَلَى حَذْفِ حَرْفِ العِلَّةِ.
    explication: 'الأَمْرُ مِنْ «دَعَا»: اُدْعُ.'
  - id: naqis-13
    difficulte: 3
    enonce: 'مَا عَلَامَةُ رَفْعِ «يَسْعَى» فِي: يَسْعَى العَامِلُ إِلَى رِزْقِهِ؟ (الضَّمَّةُ المُقَدَّرَةُ / الضَّمَّةُ الظَّاهِرَةُ / ثُبُوتُ النُّونِ)'
    reponses:
    - الضَّمَّةُ المُقَدَّرَةُ
    erreurs:
      الضَّمَّةُ الظَّاهِرَةُ: خطأ في علامة إعراب الناقص
      ثُبُوتُ النُّونِ: خطأ في علامة إعراب الناقص
    indice: لَا تَظْهَرُ الحَرَكَةُ عَلَى الأَلِفِ.
    explication: «يَسْعَى» مَرْفُوعٌ بِضَمَّةٍ مُقَدَّرَةٍ عَلَى الأَلِفِ.
- notion: اللفيف
  exercices:
  - id: lafif-1
    difficulte: 1
    enonce: 'مَا نَوْعُ الفِعْلِ «طَوَى»: لَفِيفٌ مَفْرُوقٌ أَمْ لَفِيفٌ مَقْرُونٌ؟'
    reponses:
    - لَفِيفٌ مَقْرُونٌ
    - مَقْرُونٌ
    erreurs:
      لفيف مفروق: خلط بين اللفيف المفروق والمقرون
      مفروق: خلط بين اللفيف المفروق والمقرون
    indice: هَلْ حَرْفَا العِلَّةِ مُتَجَاوِرَانِ أَمْ بَيْنَهُمَا حَرْفٌ صَحِيحٌ؟
    explication: «طَوَى» لَفِيفٌ مَقْرُونٌ، لِأَنَّ حَرْفَيِ العِلَّةِ (الوَاوَ وَالأَلِفَ) مُتَجَاوِرَانِ.
  - id: lafif-2
    difficulte: 2
    enonce: 'مَا نَوْعُ الفِعْلِ «وَفَى»: لَفِيفٌ مَفْرُوقٌ أَمْ لَفِيفٌ مَقْرُونٌ؟'
    reponses:
    - لَفِيفٌ مَفْرُوقٌ
    - مَفْرُوقٌ
    erreurs:
      لفيف مقرون: خلط بين اللفيف المفروق والمقرون
      مقرون: خلط بين اللفيف المفروق والمقرون
    indice: حَرْفَا العِلَّةِ فِي أَوَّلِ الفِعْلِ وَآخِرِهِ، يَفْصِلُ بَيْنَهُمَا حَرْفٌ صَحِيحٌ.
    explication: «وَفَى» لَفِيفٌ مَفْرُوقٌ، لِأَنَّ فَاءَهُ وَلَامَهُ حَرْفَا عِلَّةٍ يَفْصِلُ بَيْنَهُمَا حَرْفٌ صَحِيحٌ.
  - id: lafif-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: مَا فِعْلُ الأَمْرِ مِنْ «وَقَى» لِلْمُفْرَدِ المُذَكَّرِ؟
    reponses:
    - قِ
    - قِهْ
    erreurs:
      اوق: عدم حذف الواو في الأمر
      قي: عدم حذف حرف العلة في الأمر
    indice: 'يُحْذَفُ أَوَّلُهُ كَالمِثَالِ، وَيُحْذَفُ آخِرُهُ كَالنَّاقِصِ: يَبْقَى حَرْفٌ وَاحِدٌ.'
    explication: 'الأَمْرُ مِنْ «وَقَى» هُوَ «قِ» (وَعِنْدَ الوَقْفِ «قِهْ»): حُذِفَتِ الفَاءُ وَاللَّامُ مَعًا.'
  - id: lafif-4
    difficulte: 1
    enonce: مَا اللَّفِيفُ؟ (فِعْلٌ فِيهِ حَرْفَا عِلَّةٍ / فِعْلٌ فِيهِ هَمْزَةٌ / فِعْلٌ مُضَعَّفٌ)
    reponses:
    - فِعْلٌ فِيهِ حَرْفَا عِلَّةٍ
    erreurs:
      فِعْلٌ فِيهِ هَمْزَةٌ: خطأ في تعريف اللفيف
      فِعْلٌ مُضَعَّفٌ: خطأ في تعريف اللفيف
    indice: 'مِثَالٌ: وَقَى، طَوَى.'
    explication: اللَّفِيفُ فِعْلٌ فِيهِ حَرْفَا عِلَّةٍ.
  - id: lafif-5
    difficulte: 1
    enonce: مَا نَوْعُ «وَعَى»؟ (لَفِيفٌ مَفْرُوقٌ / لَفِيفٌ مَقْرُونٌ)
    reponses:
    - لَفِيفٌ مَفْرُوقٌ
    erreurs:
      لَفِيفٌ مَقْرُونٌ: خلط بين اللفيف المفروق والمقرون
    indice: حَرْفَا العِلَّةِ فِي الأَوَّلِ وَالآخِرِ.
    explication: '«وَعَى» لَفِيفٌ مَفْرُوقٌ: الوَاوُ فِي أَوَّلِهِ وَالأَلِفُ فِي آخِرِهِ.'
  - id: lafif-6
    difficulte: 1
    enonce: مَا نَوْعُ «رَوَى»؟ (لَفِيفٌ مَفْرُوقٌ / لَفِيفٌ مَقْرُونٌ)
    reponses:
    - لَفِيفٌ مَقْرُونٌ
    erreurs:
      لَفِيفٌ مَفْرُوقٌ: خلط بين اللفيف المفروق والمقرون
    indice: حَرْفَا العِلَّةِ مُتَجَاوِرَانِ.
    explication: '«رَوَى» لَفِيفٌ مَقْرُونٌ: الوَاوُ وَالأَلِفُ مُتَجَاوِرَتَانِ.'
  - id: lafif-7
    difficulte: 2
    enonce: مَا نَوْعُ «نَوَى»؟ (لَفِيفٌ مَفْرُوقٌ / لَفِيفٌ مَقْرُونٌ)
    reponses:
    - لَفِيفٌ مَقْرُونٌ
    erreurs:
      لَفِيفٌ مَفْرُوقٌ: خلط بين اللفيف المفروق والمقرون
    indice: أَيْنَ حَرْفَا العِلَّةِ؟
    explication: «نَوَى» لَفِيفٌ مَقْرُونٌ.
  - id: lafif-8
    difficulte: 2
    enonce: مَا نَوْعُ «وَلِيَ»؟ (لَفِيفٌ مَفْرُوقٌ / لَفِيفٌ مَقْرُونٌ)
    reponses:
    - لَفِيفٌ مَفْرُوقٌ
    erreurs:
      لَفِيفٌ مَقْرُونٌ: خلط بين اللفيف المفروق والمقرون
    indice: أَيْنَ حَرْفَا العِلَّةِ؟
    explication: «وَلِيَ» لَفِيفٌ مَفْرُوقٌ.
  - id: lafif-9
    difficulte: 2
    enonce: مَا مُضَارِعُ «وَفَى»؟ (يَفِي / يَوْفِي / يَفُو)
    reponses:
    - يَفِي
    erreurs:
      يَوْفِي: خطأ في تصريف اللفيف
      يَفُو: خطأ في تصريف اللفيف
    indice: تُحْذَفُ الوَاوُ كَالمِثَالِ، وَتَبْقَى اليَاءُ كَالنَّاقِصِ.
    explication: 'مُضَارِعُ «وَفَى»: يَفِي.'
  - id: lafif-10
    difficulte: 2
    enonce: مَا مُضَارِعُ «شَوَى»؟ (يَشْوِي / يَشِي / يَشْوُو)
    reponses:
    - يَشْوِي
    erreurs:
      يَشِي: خطأ في تصريف اللفيف
      يَشْوُو: خطأ في تصريف اللفيف
    indice: المَقْرُونُ لَا تُحْذَفُ وَاوُهُ.
    explication: 'مُضَارِعُ «شَوَى»: يَشْوِي.'
  - id: lafif-11
    difficulte: 3
    enonce: مَا الأَمْرُ مِنْ «وَعَى»؟ (عِ / اوْعِ / عِي)
    reponses:
    - عِ
    erreurs:
      اوْعِ: خطأ في أمر اللفيف المفروق
      عِي: خطأ في أمر اللفيف المفروق
    indice: 'تُحْذَفُ الوَاوُ (كَالمِثَالِ) وَاليَاءُ (كَالنَّاقِصِ)، وَنَقِفُ بِهَاءِ السَّكْتِ: عِهْ.'
    explication: 'الأَمْرُ مِنْ «وَعَى»: عِ (وَيُوقَفُ عَلَيْهِ بِالهَاءِ: عِهْ).'
  - id: lafif-12
    difficulte: 3
    enonce: مَا الأَمْرُ مِنْ «طَوَى»؟ (اِطْوِ / طِ / اِطْوِي)
    reponses:
    - اِطْوِ
    erreurs:
      طِ: خطأ في أمر اللفيف المقرون
      اِطْوِي: خطأ في أمر اللفيف المقرون
    indice: المَقْرُونُ يُعَامَلُ كَالنَّاقِصِ فِي الأَمْرِ.
    explication: 'الأَمْرُ مِنْ «طَوَى»: اِطْوِ.'
  - id: lafif-13
    difficulte: 3
    enonce: 'أَدْخِلْ «لَمْ» عَلَى «يَقِي»: (لَمْ يَقِي / لَمْ يَقِ / لَمْ يَقَ)'
    reponses:
    - لَمْ يَقِ
    erreurs:
      لَمْ يَقِي: خطأ في جزم اللفيف
      لَمْ يَقَ: خطأ في جزم اللفيف
    indice: يُحْذَفُ حَرْفُ العِلَّةِ الأَخِيرُ فِي الجَزْمِ.
    explication: 'نَقُولُ: لَمْ يَقِ.'
- notion: الإعراب والبناء
  exercices:
  - id: irab-1
    difficulte: 1
    enonce: مَا اسْمُ تَغَيُّرِ حَرَكَةِ آخِرِ الكَلِمَةِ بِتَغَيُّرِ مَوْقِعِهَا فِي الجُمْلَةِ؟
    reponses:
    - الإِعْرَابُ
    erreurs:
      البناء: خلط بين الإعراب والبناء
