    indice: المُبْتَدَأُ مُثَنًّى، فَيَجِبُ أَنْ يَكُونَ الخَبَرُ مُثَنًّى مَرْفُوعًا بِالأَلِفِ.
    explication: 'نَقُولُ «الطَّالِبَانِ مُجْتَهِدَانِ»: يُطَابِقُ الخَبَرُ المُبْتَدَأَ فِي التَّثْنِيَةِ.'
  - id: tatabuq-3
