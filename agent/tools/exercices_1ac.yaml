    erreurs:
      سَرِيعُونَ: خطأ في المطابقة
      سَرِيعَانِ: خطأ في المطابقة
    indice: 'جَمْعُ غَيْرِ العَاقِلِ يُخْبَرُ عَنْهُ بِالمُفْرَدِ المُؤَنَّثِ (وَيَجُوزُ: سَرِيعَاتٌ).'
    explication: 'نَقُولُ: الطَّائِرَاتُ سَرِيعَةٌ.'
  - id: tatabuq-12
