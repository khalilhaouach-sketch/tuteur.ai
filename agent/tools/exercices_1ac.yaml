      مُضَعَّفٌ: خطأ في أنواع الفعل الصحيح
    indice: السَّالِمُ لَيْسَ فِيهِ هَمْزَةٌ وَلَا تَضْعِيفٌ وَلَا حَرْفُ عِلَّةٍ، وَالمَهْمُوزُ فِيهِ هَمْزَةٌ، وَالمُضَعَّفُ تَكَرَّرَ فِيهِ حَرْفٌ.
    explication: «أَمَرَ» فِعْلٌ مَهْمُوزُ الفَاءِ.
  - id: sahih-6
