# Banque d'exercices d'arabe de 1AC (profil P2) — à relire par le professeur.
# Une notion par leçon du programme (docs/programmes/1ac_arabe.md), 13 exercices : 3 à réponse écrite, puis 10 à choix (boutons).
# reponses : réponses acceptées, entièrement vocalisées (une voyelle écrite par l'élève est vérifiée).
# voyelles_obligatoires : la réponse doit être entièrement vocalisée.
# erreurs : réponse fausse fréquente -> type d'erreur (avec voyelles : comparée voyelles comprises).
# indice : donné après la 1re erreur ; explication : donnée après la 2e.

niveau: P2
notions:
- notion: الميزان الصرفي
  exercices:
  - id: mizan-1
    difficulte: 1
    voyelles_obligatoires: true
    enonce: مَا وَزْنُ الفِعْلِ «جَلَسَ»؟
    reponses:
    - فَعَلَ
    erreurs:
      فاعل: زيادة حرف غير موجود في الكلمة
      جلس: عدم استعمال الميزان (ف ع ل)
    indice: يُقَابِلُ الحَرْفُ الأَوَّلُ الفَاءَ، وَالثَّانِي العَيْنَ، وَالثَّالِثُ اللَّامَ.
    explication: 'وَزْنُ «جَلَسَ» هُوَ «فَعَلَ»: الجِيمُ تُقَابِلُ الفَاءَ، وَاللَّامُ تُقَابِلُ العَيْنَ، وَالسِّينُ تُقَابِلُ اللَّامَ.'
  - id: mizan-2
    difficulte: 2
    voyelles_obligatoires: true
    enonce: مَا وَزْنُ الفِعْلِ «أَكْرَمَ»؟
    reponses:
    - أَفْعَلَ
    erreurs:
      فعل: إغفال الحرف الزائد في الميزان
      افتعل: خطأ في موضع الحرف الزائد
    indice: '«أَكْرَمَ» فِعْلٌ مَزِيدٌ: أَصْلُهُ «كَرُمَ»، وَالهَمْزَةُ فِي أَوَّلِهِ زَائِدَةٌ، وَالزَّائِدُ يُكْتَبُ فِي المِيزَانِ كَمَا هُوَ.'
    explication: 'وَزْنُ «أَكْرَمَ» هُوَ «أَفْعَلَ»: الهَمْزَةُ زَائِدَةٌ نَكْتُبُهَا كَمَا هِيَ، وَ«ك ر م» تُقَابِلُ «ف ع ل».'
  - id: mizan-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: مَا وَزْنُ الفِعْلِ «اِسْتَخْرَجَ»؟
    reponses:
    - اِسْتَفْعَلَ
    erreurs:
      فعل: إغفال الحروف الزائدة في الميزان
      افتعل: خطأ في عدد الحروف الزائدة
    indice: 'حُرُوفُهُ الأَصْلِيَّةُ «خ ر ج»، وَقَدْ زِيدَتْ فِي أَوَّلِهِ ثَلَاثَةُ أَحْرُفٍ: ا، س، ت.'
    explication: 'وَزْنُ «اِسْتَخْرَجَ» هُوَ «اِسْتَفْعَلَ»: زِيدَتِ الأَلِفُ وَالسِّينُ وَالتَّاءُ، وَ«خ ر ج» تُقَابِلُ «ف ع ل».'
  - id: mizan-4
    difficulte: 1
    voyelles_obligatoires: true
    enonce: مَا وَزْنُ «كَتَبَ»؟ (فَعَلَ / فَعِلَ / فَعُلَ)
    reponses:
    - فَعَلَ
    erreurs:
      فَعِلَ: خطأ في الوزن
      فَعُلَ: خطأ في الوزن
    indice: نُقَابِلُ الحُرُوفَ الأَصْلِيَّةَ بِـ«ف ع ل» مَعَ حَرَكَاتِهَا.
    explication: «كَتَبَ» عَلَى وَزْنِ «فَعَلَ».
  - id: mizan-5
    difficulte: 1
    voyelles_obligatoires: true
    enonce: مَا وَزْنُ «فَهِمَ»؟ (فَعَلَ / فَعِلَ / فَعُلَ)
    reponses:
    - فَعِلَ
    erreurs:
      فَعَلَ: خطأ في الوزن
      فَعُلَ: خطأ في الوزن
    indice: عَيْنُ الفِعْلِ (الهَاءُ) مَكْسُورَةٌ.
    explication: «فَهِمَ» عَلَى وَزْنِ «فَعِلَ».
  - id: mizan-6
    difficulte: 1
    voyelles_obligatoires: true
    enonce: مَا وَزْنُ «كَرُمَ»؟ (فَعَلَ / فَعِلَ / فَعُلَ)
    reponses:
    - فَعُلَ
    erreurs:
      فَعَلَ: خطأ في الوزن
      فَعِلَ: خطأ في الوزن
    indice: عَيْنُ الفِعْلِ (الرَّاءُ) مَضْمُومَةٌ.
    explication: «كَرُمَ» عَلَى وَزْنِ «فَعُلَ».
  - id: mizan-7
    difficulte: 2
    voyelles_obligatoires: true
    enonce: مَا وَزْنُ «يَكْتُبُ»؟ (يَفْعَلُ / يَفْعُلُ / يَفْعِلُ)
    reponses:
    - يَفْعُلُ
    erreurs:
      يَفْعَلُ: خطأ في الوزن
      يَفْعِلُ: خطأ في الوزن
    indice: حَرَكَةُ عَيْنِ المُضَارِعِ (التَّاءِ) ضَمَّةٌ.
    explication: «يَكْتُبُ» عَلَى وَزْنِ «يَفْعُلُ».
  - id: mizan-8
    difficulte: 2
    voyelles_obligatoires: true
    enonce: مَا وَزْنُ «مَكْتُوبٌ»؟ (مَفْعُولٌ / فَاعِلٌ / مَفْعَلٌ)
    reponses:
    - مَفْعُولٌ
    erreurs:
      فَاعِلٌ: خطأ في الوزن
      مَفْعَلٌ: خطأ في الوزن
    indice: 'نُبْقِي الحُرُوفَ الزَّائِدَةَ كَمَا هِيَ: المِيمُ وَالوَاوُ.'
    explication: «مَكْتُوبٌ» عَلَى وَزْنِ «مَفْعُولٌ».
  - id: mizan-9
    difficulte: 2
    voyelles_obligatoires: true
    enonce: مَا وَزْنُ «كَاتِبٌ»؟ (فَعِيلٌ / فَاعِلٌ / فَعَّالٌ)
    reponses:
    - فَاعِلٌ
    erreurs:
      فَعِيلٌ: خطأ في الوزن
      فَعَّالٌ: خطأ في الوزن
    indice: الأَلِفُ زَائِدَةٌ بَعْدَ الفَاءِ.
    explication: «كَاتِبٌ» عَلَى وَزْنِ «فَاعِلٌ».
  - id: mizan-10
    difficulte: 2
    voyelles_obligatoires: true
    enonce: مَا وَزْنُ «اسْتَخْدَمَ»؟ (اسْتَفْعَلَ / افْتَعَلَ / تَفَاعَلَ)
    reponses:
    - اسْتَفْعَلَ
    erreurs:
      افْتَعَلَ: خطأ في الوزن
      تَفَاعَلَ: خطأ في الوزن
    indice: 'الزَّوَائِدُ: الهَمْزَةُ وَالسِّينُ وَالتَّاءُ، وَالأُصُولُ: خ د م.'
    explication: «اسْتَخْدَمَ» عَلَى وَزْنِ «اسْتَفْعَلَ».
  - id: mizan-11
    difficulte: 3
    voyelles_obligatoires: true
    enonce: مَا وَزْنُ «انْكَسَرَ»؟ (افْتَعَلَ / انْفَعَلَ / اسْتَفْعَلَ)
    reponses:
    - انْفَعَلَ
    erreurs:
      افْتَعَلَ: خطأ في الوزن
      اسْتَفْعَلَ: خطأ في الوزن
    indice: 'الزَّوَائِدُ: الهَمْزَةُ وَالنُّونُ.'
    explication: «انْكَسَرَ» عَلَى وَزْنِ «انْفَعَلَ».
  - id: mizan-12
    difficulte: 3
    voyelles_obligatoires: true
    enonce: مَا وَزْنُ «اجْتَمَعَ»؟ (افْتَعَلَ / انْفَعَلَ / تَفَاعَلَ)
    reponses:
    - افْتَعَلَ
    erreurs:
      انْفَعَلَ: خطأ في الوزن
      تَفَاعَلَ: خطأ في الوزن
    indice: 'الزَّوَائِدُ: الهَمْزَةُ وَالتَّاءُ بَعْدَ الفَاءِ.'
    explication: «اجْتَمَعَ» عَلَى وَزْنِ «افْتَعَلَ».
  - id: mizan-13
    difficulte: 3
    voyelles_obligatoires: true
    enonce: مَا وَزْنُ «دَحْرَجَ»؟ (فَعْلَلَ / فَعَّلَ / فَاعَلَ)
    reponses:
    - فَعْلَلَ
    erreurs:
      فَعَّلَ: خطأ في الوزن
      فَاعَلَ: خطأ في الوزن
    indice: 'الفِعْلُ رُبَاعِيٌّ مُجَرَّدٌ: نُضِيفُ لَامًا ثَانِيَةً.'
    explication: «دَحْرَجَ» رُبَاعِيٌّ عَلَى وَزْنِ «فَعْلَلَ».
- notion: مزيد الثلاثي والرباعي
  exercices:
  - id: ziyada-1
    difficulte: 1
    voyelles_obligatoires: true
    enonce: مَا وَزْنُ الفِعْلِ «عَلَّمَ»؟
    reponses:
    - فَعَّلَ
    erreurs:
      فَعَلَ: إغفال التضعيف في الميزان
    indice: عَيْنُ الفِعْلِ مُضَعَّفَةٌ (عَلَّمَ)، وَالتَّضْعِيفُ يَظْهَرُ فِي المِيزَانِ أَيْضًا.
    explication: 'وَزْنُ «عَلَّمَ» هُوَ «فَعَّلَ»: اللَّامُ المُضَعَّفَةُ تُقَابِلُ العَيْنَ المُضَعَّفَةَ.'
  - id: ziyada-2
    difficulte: 2
    voyelles_obligatoires: true
    enonce: مَا وَزْنُ الفِعْلِ «تَعَاوَنَ»؟
    reponses:
    - تَفَاعَلَ
    erreurs:
      فاعل: إغفال التاء الزائدة في الميزان
      تفعل: خطأ في موضع الألف الزائدة
    indice: أَصْلُ الفِعْلِ «عَوَنَ»، وَزِيدَتِ التَّاءُ فِي أَوَّلِهِ وَالأَلِفُ بَعْدَ الفَاءِ.
    explication: 'وَزْنُ «تَعَاوَنَ» هُوَ «تَفَاعَلَ»: زِيدَتِ التَّاءُ وَالأَلِفُ، وَ«ع و ن» تُقَابِلُ «ف ع ل».'
  - id: ziyada-3
    difficulte: 3
    enonce: مَا مَعْنَى الزِّيَادَةِ فِي الفِعْلِ «اِسْتَغْفَرَ»؟
    reponses:
    - الطَّلَبُ
    - طَلَبُ المَغْفِرَةِ
    erreurs:
      المشاركة: خلط بين معنى الطلب ومعنى المشاركة
      التعدية: خلط بين معنى الطلب ومعنى التعدية
    indice: 'صِيغَةُ «اِسْتَفْعَلَ» تَدُلُّ غَالِبًا عَلَى أَنَّ الفَاعِلَ يَطْلُبُ شَيْئًا: مَاذَا يَطْلُبُ مَنْ يَسْتَغْفِرُ؟'
    explication: مَعْنَى الزِّيَادَةِ فِي «اِسْتَغْفَرَ» هُوَ الطَّلَبُ، أَيْ طَلَبُ المَغْفِرَةِ.
  - id: ziyada-4
    difficulte: 1
    enonce: هَلِ الفِعْلُ «خَرَجَ» مُجَرَّدٌ أَمْ مَزِيدٌ؟ (مُجَرَّدٌ / مَزِيدٌ)
    reponses:
    - مُجَرَّدٌ
    erreurs:
      مَزِيدٌ: خلط بين المجرد والمزيد
    indice: هَلْ كُلُّ حُرُوفِهِ أَصْلِيَّةٌ؟
    explication: '«خَرَجَ» ثُلَاثِيٌّ مُجَرَّدٌ: كُلُّ حُرُوفِهِ أَصْلِيَّةٌ.'
  - id: ziyada-5
    difficulte: 1
    enonce: هَلِ الفِعْلُ «أَخْرَجَ» مُجَرَّدٌ أَمْ مَزِيدٌ؟ (مُجَرَّدٌ / مَزِيدٌ)
    reponses:
    - مَزِيدٌ
    erreurs:
      مُجَرَّدٌ: خلط بين المجرد والمزيد
    indice: قَارِنْهُ بِـ«خَرَجَ».
    explication: '«أَخْرَجَ» ثُلَاثِيٌّ مَزِيدٌ بِحَرْفٍ: الهَمْزَةِ.'
  - id: ziyada-6
    difficulte: 1
    enonce: كَمْ حَرْفًا زِيدَ فِي «اسْتَعْمَلَ»؟ (حَرْفٌ / حَرْفَانِ / ثَلَاثَةُ أَحْرُفٍ)
    reponses:
    - ثَلَاثَةُ أَحْرُفٍ
    erreurs:
      حَرْفٌ: خطأ في عدد الزوائد
      حَرْفَانِ: خطأ في عدد الزوائد
    indice: الأَصْلُ «عَمِلَ».
    explication: 'زِيدَ فِي «اسْتَعْمَلَ» ثَلَاثَةُ أَحْرُفٍ: ا، س، ت.'
  - id: ziyada-7
    difficulte: 2
    voyelles_obligatoires: true
    enonce: مَا وَزْنُ «قَاتَلَ»؟ (فَاعَلَ / فَعَّلَ / أَفْعَلَ)
    reponses:
    - فَاعَلَ
    erreurs:
      فَعَّلَ: خطأ في الوزن
      أَفْعَلَ: خطأ في الوزن
    indice: زِيدَتْ أَلِفٌ بَعْدَ الفَاءِ.
    explication: «قَاتَلَ» عَلَى وَزْنِ «فَاعَلَ».
  - id: ziyada-8
    difficulte: 2
    voyelles_obligatoires: true
    enonce: مَا وَزْنُ «كَسَّرَ»؟ (فَاعَلَ / فَعَّلَ / تَفَعَّلَ)
    reponses:
    - فَعَّلَ
    erreurs:
      فَاعَلَ: خطأ في الوزن
      تَفَعَّلَ: خطأ في الوزن
    indice: زِيدَ حَرْفٌ بِتَضْعِيفِ العَيْنِ.
    explication: «كَسَّرَ» عَلَى وَزْنِ «فَعَّلَ».
  - id: ziyada-9
    difficulte: 2
    voyelles_obligatoires: true
    enonce: مَا وَزْنُ «تَعَلَّمَ»؟ (تَفَاعَلَ / تَفَعَّلَ / افْتَعَلَ)
    reponses:
    - تَفَعَّلَ
    erreurs:
      تَفَاعَلَ: خطأ في الوزن
      افْتَعَلَ: خطأ في الوزن
    indice: زِيدَتِ التَّاءُ فِي أَوَّلِهِ وَضُعِّفَتِ العَيْنُ.
    explication: «تَعَلَّمَ» عَلَى وَزْنِ «تَفَعَّلَ».
  - id: ziyada-10
    difficulte: 2
    enonce: مَا مَعْنَى الزِّيَادَةِ فِي «تَشَارَكَ» (تَفَاعَلَ)؟ (المُشَارَكَةُ / الطَّلَبُ / المُطَاوَعَةُ)
    reponses:
    - المُشَارَكَةُ
    erreurs:
      الطَّلَبُ: خطأ في معاني الزيادة
      المُطَاوَعَةُ: خطأ في معاني الزيادة
    indice: 'تَشَارَكَ التِّلْمِيذَانِ: كُلٌّ مِنْهُمَا شَارَكَ الآخَرَ.'
    explication: «تَفَاعَلَ» يُفِيدُ المُشَارَكَةَ بَيْنَ اثْنَيْنِ أَوْ أَكْثَرَ.
  - id: ziyada-11
    difficulte: 3
    enonce: مَا مَعْنَى الزِّيَادَةِ فِي «اسْتَخْرَجَ» (اسْتَفْعَلَ)؟ (المُشَارَكَةُ / الطَّلَبُ / التَّكْثِيرُ)
    reponses:
    - الطَّلَبُ
    erreurs:
      المُشَارَكَةُ: خطأ في معاني الزيادة
      التَّكْثِيرُ: خطأ في معاني الزيادة
    indice: 'اسْتَخْرَجَ المَاءَ: طَلَبَ خُرُوجَهُ.'
    explication: '«اسْتَفْعَلَ» يُفِيدُ الطَّلَبَ غَالِبًا: اسْتَخْرَجَ، اسْتَغْفَرَ.'
  - id: ziyada-12
    difficulte: 3
    enonce: مَا مَعْنَى الزِّيَادَةِ فِي «انْكَسَرَ» (انْفَعَلَ)؟ (المُطَاوَعَةُ / الطَّلَبُ / المُشَارَكَةُ)
    reponses:
    - المُطَاوَعَةُ
    erreurs:
      الطَّلَبُ: خطأ في معاني الزيادة
      المُشَارَكَةُ: خطأ في معاني الزيادة
    indice: كَسَرْتُ الزُّجَاجَ فَانْكَسَرَ.
    explication: '«انْفَعَلَ» يُفِيدُ المُطَاوَعَةَ: قَبُولَ أَثَرِ الفِعْلِ.'
  - id: ziyada-13
    difficulte: 3
    voyelles_obligatoires: true
    enonce: مَا وَزْنُ «تَدَحْرَجَ»؟ (تَفَعْلَلَ / تَفَعَّلَ / افْعَلَّلَ)
    reponses:
    - تَفَعْلَلَ
    erreurs:
      تَفَعَّلَ: خطأ في الوزن
      افْعَلَّلَ: خطأ في الوزن
    indice: رُبَاعِيٌّ مَزِيدٌ بِالتَّاءِ.
    explication: «تَدَحْرَجَ» رُبَاعِيٌّ مَزِيدٌ بِحَرْفٍ عَلَى وَزْنِ «تَفَعْلَلَ».
- notion: الفعل الصحيح
  exercices:
  - id: sahih-1
    difficulte: 1
    enonce: هَلِ الفِعْلُ «قَرَأَ» سَالِمٌ أَمْ مَهْمُوزٌ أَمْ مُضَعَّفٌ؟
    reponses:
    - مَهْمُوزٌ
    - مَهْمُوزُ اللَّامِ
    erreurs:
      سالم: عدم الانتباه إلى الهمزة
      مضعف: خلط بين المهموز والمضعف
    indice: اُنْظُرْ إِلَى الحَرْفِ الأَخِيرِ مِنَ الفِعْلِ.
    explication: «قَرَأَ» مَهْمُوزُ اللَّامِ، لِأَنَّ لَامَهُ هَمْزَةٌ.
  - id: sahih-2
    difficulte: 2
    voyelles_obligatoires: true
    enonce: مَا فِعْلُ الأَمْرِ مِنْ «أَخَذَ» لِلْمُفْرَدِ المُذَكَّرِ؟
    reponses:
    - خُذْ
    erreurs:
      أخذ: إبقاء الهمزة في الأمر
      اخذ: إبقاء الهمزة في الأمر
    indice: 'مِثْلُ «أَكَلَ ← كُلْ»: تُحْذَفُ الهَمْزَةُ فِي الأَمْرِ.'
    explication: 'الأَمْرُ مِنْ «أَخَذَ» هُوَ «خُذْ» بِحَذْفِ الهَمْزَةِ، كَمَا نَقُولُ مِنْ «أَكَلَ»: «كُلْ».'
  - id: sahih-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: أَسْنِدِ الفِعْلَ «مَدَّ» إِلَى تَاءِ الفَاعِلِ (أَنَا).
    reponses:
    - مَدَدْتُ
    erreurs:
      مدت: عدم فك الإدغام مع ضمير الرفع المتحرك
    indice: 'مَعَ تَاءِ الفَاعِلِ يُفَكُّ الإِدْغَامُ: تَظْهَرُ الدَّالَانِ.'
    explication: نَقُولُ «مَدَدْتُ» بِفَكِّ الإِدْغَامِ، لِأَنَّ الفِعْلَ المُضَعَّفَ اتَّصَلَ بِضَمِيرِ رَفْعٍ مُتَحَرِّكٍ.
  - id: sahih-4
    difficulte: 1
    enonce: مَا نَوْعُ الفِعْلِ «جَلَسَ»؟ (سَالِمٌ / مَهْمُوزٌ / مُضَعَّفٌ)
    reponses:
    - سَالِمٌ
    erreurs:
      مَهْمُوزٌ: خطأ في أنواع الفعل الصحيح
      مُضَعَّفٌ: خطأ في أنواع الفعل الصحيح
    indice: السَّالِمُ لَيْسَ فِيهِ هَمْزَةٌ وَلَا تَضْعِيفٌ وَلَا حَرْفُ عِلَّةٍ، وَالمَهْمُوزُ فِيهِ هَمْزَةٌ، وَالمُضَعَّفُ تَكَرَّرَ فِيهِ حَرْفٌ.
    explication: «جَلَسَ» فِعْلٌ صَحِيحٌ سَالِمٌ.
  - id: sahih-5
    difficulte: 1
    enonce: مَا نَوْعُ الفِعْلِ «أَمَرَ»؟ (سَالِمٌ / مَهْمُوزٌ / مُضَعَّفٌ)
    reponses:
