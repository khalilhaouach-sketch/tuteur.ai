  - id: tatabuq-7
    difficulte: 2
    enonce: 'أَكْمِلْ بِخَبَرٍ مُطَابِقٍ: الأُخْتَانِ ... (مُتَعَاوِنَتَانِ / مُتَعَاوِنَتَيْنِ / مُتَعَاوِنَاتٌ)'
    reponses:
    - مُتَعَاوِنَتَانِ
    erreurs:
      مُتَعَاوِنَتَيْنِ: خطأ في المطابقة
      مُتَعَاوِنَاتٌ: خطأ في المطابقة
    indice: المُبْتَدَأُ مُثَنًّى مُؤَنَّثٌ مَرْفُوعٌ.
    explication: 'نَقُولُ: الأُخْتَانِ مُتَعَاوِنَتَانِ.'
  - id: tatabuq-8
    difficulte: 2
    enonce: 'أَكْمِلْ بِخَبَرٍ مُطَابِقٍ: المُمَرِّضَاتُ ... (حَاضِرُونَ / حَاضِرَاتٌ / حَاضِرَةٌ)'
    reponses:
    - حَاضِرَاتٌ
    erreurs:
      حَاضِرُونَ: خطأ في المطابقة
      حَاضِرَةٌ: خطأ في المطابقة
    indice: المُبْتَدَأُ جَمْعُ مُؤَنَّثٍ سَالِمٌ.
    explication: 'نَقُولُ: المُمَرِّضَاتُ حَاضِرَاتٌ.'
  - id: tatabuq-9
    difficulte: 2
    enonce: 'أَكْمِلْ بِخَبَرٍ مُطَابِقٍ: الجَبَلَانِ ... (عَالِيَانِ / عَالِيَيْنِ / عَالٍ)'
    reponses:
    - عَالِيَانِ
    erreurs:
      عَالِيَيْنِ: خطأ في المطابقة
      عَالٍ: خطأ في المطابقة
    indice: المُبْتَدَأُ مُثَنًّى مُذَكَّرٌ مَرْفُوعٌ.
    explication: 'نَقُولُ: الجَبَلَانِ عَالِيَانِ.'
  - id: tatabuq-10
    difficulte: 2
    enonce: فِي أَيِّ شَيْءٍ يُطَابِقُ الخَبَرُ المُفْرَدُ المُشْتَقُّ مُبْتَدَأَهُ؟ (فِي العَدَدِ وَالجِنْسِ / فِي التَّعْرِيفِ / لَا يُطَابِقُهُ)
    reponses:
    - فِي العَدَدِ وَالجِنْسِ
    erreurs:
      فِي التَّعْرِيفِ: خطأ في المطابقة
      لَا يُطَابِقُهُ: خطأ في المطابقة
    indice: 'قَارِنْ: الطَّالِبُ مُجْتَهِدٌ، الطَّالِبَتَانِ مُجْتَهِدَتَانِ.'
    explication: يُطَابِقُ الخَبَرُ المُبْتَدَأَ فِي العَدَدِ (الإِفْرَادِ وَالتَّثْنِيَةِ وَالجَمْعِ) وَفِي الجِنْسِ (التَّذْكِيرِ وَالتَّأْنِيثِ).
  - id: tatabuq-11
    difficulte: 3
    enonce: 'أَكْمِلْ بِخَبَرٍ مُطَابِقٍ: الطَّائِرَاتُ ... (سَرِيعُونَ / سَرِيعَةٌ / سَرِيعَانِ)'
    reponses:
