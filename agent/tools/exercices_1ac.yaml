    indice: أُضِيفَ إِلَى نَكِرَةٍ.
    explication: '«كِتَابُ تِلْمِيذٍ» نَكِرَةٌ: المُضَافُ إِلَى نَكِرَةٍ لَا يَتَعَرَّفُ.'
  - id: nakira-13
