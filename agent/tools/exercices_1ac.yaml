    erreurs:
      عَلَمٌ: خطأ في أنواع المعرفة
      اسْمُ إِشَارَةٍ: خطأ في أنواع المعرفة
    indice: «أَنْتَ» يَدُلُّ عَلَى المُخَاطَبِ.
    explication: '«أَنْتَ» مَعْرِفَةٌ: ضَمِيرٌ.'
  - id: nakira-8
    difficulte: 2
    enonce: مَا نَوْعُ المَعْرِفَةِ فِي «الَّذِي»؟ (اسْمُ إِشَارَةٍ / اسْمٌ مَوْصُولٌ / عَلَمٌ)
    reponses:
