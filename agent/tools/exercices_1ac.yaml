    indice: هُوَ اسْمُ إِشَارَةٍ.
    explication: '«هَؤُلَاءِ» مَعْرِفَةٌ: اسْمُ إِشَارَةٍ.'
- notion: العلم
  exercices:
  - id: alam-1
    difficulte: 1
    enonce: 'مَا نَوْعُ العَلَمِ «أَبُو بَكْرٍ»: اسْمٌ أَمْ كُنْيَةٌ أَمْ لَقَبٌ؟'
    reponses:
    - كُنْيَةٌ
    erreurs:
      لقب: خلط بين الكنية واللقب
      اسم: خلط بين الاسم والكنية
    indice: العَلَمُ الَّذِي يَبْدَأُ بِـ«أَبٍ» أَوْ «أُمٍّ» لَهُ اسْمٌ خَاصٌّ.
    explication: «أَبُو بَكْرٍ» كُنْيَةٌ، لِأَنَّهُ صُدِّرَ بِـ«أَبٍ».
  - id: alam-2
    difficulte: 2
    enonce: 'مَا نَوْعُ العَلَمِ «الفَارُوقُ»: اسْمٌ أَمْ كُنْيَةٌ أَمْ لَقَبٌ؟'
    reponses:
    - لَقَبٌ
    erreurs:
      كنية: خلط بين الكنية واللقب
      اسم: خلط بين الاسم واللقب
    indice: هَذَا العَلَمُ يَدُلُّ عَلَى صِفَةِ مَدْحٍ.
    explication: «الفَارُوقُ» لَقَبٌ، لِأَنَّهُ يَدُلُّ عَلَى مَدْحٍ.
  - id: alam-3
    difficulte: 3
    enonce: مَا نَوْعُ العَلَمِ «عَبْدُ اللَّهِ» مِنْ حَيْثُ التَّرْكِيبُ؟
    reponses:
    - مُرَكَّبٌ إِضَافِيٌّ
    erreurs:
      مركب مزجي: خلط بين المركب الإضافي والمزجي
      مفرد: إغفال أن العلم مكوَّن من كلمتين
    indice: العَلَمُ مُكَوَّنٌ مِنْ كَلِمَتَيْنِ، الثَّانِيَةُ مُضَافٌ إِلَيْهِ.
    explication: '«عَبْدُ اللَّهِ» مُرَكَّبٌ إِضَافِيٌّ: «عَبْدُ» مُضَافٌ وَ«اللَّهِ» مُضَافٌ إِلَيْهِ.'
  - id: alam-4
    difficulte: 1
    enonce: مَا نَوْعُ العَلَمِ «أُمُّ كُلْثُومٍ»؟ (اسْمٌ / كُنْيَةٌ / لَقَبٌ)
    reponses:
    - كُنْيَةٌ
    erreurs:
      اسْمٌ: خلط بين الاسم والكنية واللقب
      لَقَبٌ: خلط بين الاسم والكنية واللقب
    indice: الكُنْيَةُ تَبْدَأُ بِـ«أَبٍ» أَوْ «أُمٍّ».
    explication: «أُمُّ كُلْثُومٍ» كُنْيَةٌ.
  - id: alam-5
    difficulte: 1
    enonce: مَا نَوْعُ العَلَمِ «خَدِيجَةُ»؟ (اسْمٌ / كُنْيَةٌ / لَقَبٌ)
    reponses:
    - اسْمٌ
    erreurs:
      كُنْيَةٌ: خلط بين الاسم والكنية واللقب
      لَقَبٌ: خلط بين الاسم والكنية واللقب
    indice: هُوَ الاِسْمُ الَّذِي وُضِعَ لِلشَّخْصِ أَوَّلًا.
    explication: «خَدِيجَةُ» اسْمٌ.
  - id: alam-6
    difficulte: 1
    enonce: مَا نَوْعُ العَلَمِ «الرَّشِيدُ»؟ (اسْمٌ / كُنْيَةٌ / لَقَبٌ)
    reponses:
    - لَقَبٌ
    erreurs:
      اسْمٌ: خلط بين الاسم والكنية واللقب
      كُنْيَةٌ: خلط بين الاسم والكنية واللقب
    indice: اللَّقَبُ يَدُلُّ عَلَى مَدْحٍ أَوْ ذَمٍّ.
    explication: «الرَّشِيدُ» لَقَبٌ يَدُلُّ عَلَى المَدْحِ.
  - id: alam-7
    difficulte: 2
    enonce: مَا نَوْعُ العَلَمِ «أَبُو هُرَيْرَةَ»؟ (اسْمٌ / كُنْيَةٌ / لَقَبٌ)
    reponses:
    - كُنْيَةٌ
    erreurs:
      اسْمٌ: خلط بين الاسم والكنية واللقب
      لَقَبٌ: خلط بين الاسم والكنية واللقب
    indice: بِمَاذَا يَبْدَأُ؟
    explication: «أَبُو هُرَيْرَةَ» كُنْيَةٌ.
  - id: alam-8
    difficulte: 2
    enonce: مَا نَوْعُ العَلَمِ «الصِّدِّيقُ»؟ (اسْمٌ / كُنْيَةٌ / لَقَبٌ)
    reponses:
    - لَقَبٌ
    erreurs:
      اسْمٌ: خلط بين الاسم والكنية واللقب
      كُنْيَةٌ: خلط بين الاسم والكنية واللقب
    indice: هُوَ وَصْفٌ لِلْمَدْحِ.
    explication: «الصِّدِّيقُ» لَقَبُ أَبِي بَكْرٍ.
  - id: alam-9
    difficulte: 2
    enonce: مَا نَوْعُ العَلَمِ «مُحَمَّدٌ» مِنْ حَيْثُ التَّرْكِيبُ؟ (مُفْرَدٌ / مُرَكَّبٌ إِضَافِيٌّ / مُرَكَّبٌ مَزْجِيٌّ)
    reponses:
    - مُفْرَدٌ
    erreurs:
      مُرَكَّبٌ إِضَافِيٌّ: خطأ في أنواع العلم من حيث التركيب
      مُرَكَّبٌ مَزْجِيٌّ: خطأ في أنواع العلم من حيث التركيب
    indice: هَلْ هُوَ كَلِمَةٌ وَاحِدَةٌ؟
    explication: «مُحَمَّدٌ» عَلَمٌ مُفْرَدٌ.
  - id: alam-10
    difficulte: 2
    enonce: مَا نَوْعُ العَلَمِ «عَبْدُ الرَّحْمَنِ» مِنْ حَيْثُ التَّرْكِيبُ؟ (مُفْرَدٌ / مُرَكَّبٌ إِضَافِيٌّ / مُرَكَّبٌ مَزْجِيٌّ)
    reponses:
    - مُرَكَّبٌ إِضَافِيٌّ
    erreurs:
      مُفْرَدٌ: خطأ في أنواع العلم من حيث التركيب
      مُرَكَّبٌ مَزْجِيٌّ: خطأ في أنواع العلم من حيث التركيب
    indice: 'كَلِمَتَانِ: مُضَافٌ وَمُضَافٌ إِلَيْهِ.'
    explication: «عَبْدُ الرَّحْمَنِ» عَلَمٌ مُرَكَّبٌ تَرْكِيبًا إِضَافِيًّا.
  - id: alam-11
    difficulte: 3
    enonce: مَا نَوْعُ العَلَمِ «حَضْرَمَوْتُ» مِنْ حَيْثُ التَّرْكِيبُ؟ (مُفْرَدٌ / مُرَكَّبٌ إِضَافِيٌّ / مُرَكَّبٌ مَزْجِيٌّ)
    reponses:
    - مُرَكَّبٌ مَزْجِيٌّ
    erreurs:
      مُفْرَدٌ: خطأ في أنواع العلم من حيث التركيب
      مُرَكَّبٌ إِضَافِيٌّ: خطأ في أنواع العلم من حيث التركيب
    indice: كَلِمَتَانِ امْتَزَجَتَا فَصَارَتَا كَلِمَةً وَاحِدَةً.
    explication: «حَضْرَمَوْتُ» عَلَمٌ مُرَكَّبٌ تَرْكِيبًا مَزْجِيًّا.
  - id: alam-12
    difficulte: 3
    enonce: أَيُّ هَذِهِ أَعْلَامٌ لِأَمَاكِنَ؟ (الرِّبَاطُ / مَدِينَةٌ / عَاصِمَةٌ)
    reponses:
    - الرِّبَاطُ
    erreurs:
      مَدِينَةٌ: خلط بين العلم والنكرة
      عَاصِمَةٌ: خلط بين العلم والنكرة
    indice: العَلَمُ يُعَيِّنُ مَكَانًا بِعَيْنِهِ.
    explication: «الرِّبَاطُ» عَلَمٌ عَلَى مَدِينَةٍ؛ «مَدِينَةٌ» وَ«عَاصِمَةٌ» نَكِرَتَانِ.
  - id: alam-13
    difficulte: 3
    enonce: إِذَا اجْتَمَعَ الاِسْمُ وَاللَّقَبُ فَأَيُّهُمَا يَتَقَدَّمُ غَالِبًا؟ (الاِسْمُ / اللَّقَبُ)
    reponses:
    - الاِسْمُ
    erreurs:
      اللَّقَبُ: خطأ في ترتيب الاسم واللقب
    indice: 'مِثَالٌ: هَارُونُ الرَّشِيدُ.'
    explication: 'يَتَقَدَّمُ الاِسْمُ وَيَتَأَخَّرُ اللَّقَبُ: هَارُونُ الرَّشِيدُ، عُمَرُ الفَارُوقُ.'
- notion: الضمير البارز والمستتر
  exercices:
  - id: mustatir-1
    difficulte: 1
    enonce: مَا الضَّمِيرُ المُسْتَتِرُ فِي الفِعْلِ «أَكْتُبُ»؟
    reponses:
    - أَنَا
    erreurs:
      هو: خطأ في تقدير الضمير
      أنت: خطأ في تقدير الضمير
    indice: 'الفِعْلُ يَبْدَأُ بِالهَمْزَةِ: مَنِ المُتَكَلِّمُ؟'
    explication: الضَّمِيرُ المُسْتَتِرُ فِي «أَكْتُبُ» تَقْدِيرُهُ «أَنَا».
  - id: mustatir-2
    difficulte: 2
    enonce: مَا الضَّمِيرُ المُسْتَتِرُ فِي الفِعْلِ «نَكْتُبُ»؟
    reponses:
    - نَحْنُ
    erreurs:
      أنا: خطأ في تقدير الضمير
      هم: خطأ في تقدير الضمير
    indice: 'الفِعْلُ يَبْدَأُ بِالنُّونِ: مَنِ المُتَكَلِّمُونَ؟'
    explication: الضَّمِيرُ المُسْتَتِرُ فِي «نَكْتُبُ» تَقْدِيرُهُ «نَحْنُ».
  - id: mustatir-3
    difficulte: 3
    enonce: هَلِ الضَّمِيرُ المُسْتَتِرُ فِي «الطَّالِبُ كَتَبَ» مُسْتَتِرٌ وُجُوبًا أَمْ جَوَازًا؟
    reponses:
    - جَوَازًا
    - مُسْتَتِرٌ جَوَازًا
    erreurs:
      وجوبا: خلط بين الاستتار الواجب والجائز
      مستتر وجوبا: خلط بين الاستتار الواجب والجائز
    indice: 'الضَّمِيرُ هُنَا لِلْغَائِبِ (هُوَ): هَلْ يُمْكِنُ أَنْ يَحُلَّ مَحَلَّهُ اسْمٌ ظَاهِرٌ؟'
    explication: 'الضَّمِيرُ مُسْتَتِرٌ جَوَازًا لِأَنَّهُ لِلْغَائِبِ، وَيُمْكِنُ أَنْ نَقُولَ: كَتَبَ الطَّالِبُ.'
  - id: mustatir-4
    difficulte: 1
    enonce: مَا الضَّمِيرُ المُسْتَتِرُ فِي «تَكْتُبُ» (لِلْمُخَاطَبِ)؟ (أَنْتَ / هُوَ / نَحْنُ)
    reponses:
    - أَنْتَ
    erreurs:
      هُوَ: خطأ في تقدير الضمير المستتر
      نَحْنُ: خطأ في تقدير الضمير المستتر
    indice: المُضَارِعُ المَبْدُوءُ بِتَاءِ الخِطَابِ.
    explication: الضَّمِيرُ المُسْتَتِرُ تَقْدِيرُهُ «أَنْتَ».
  - id: mustatir-5
    difficulte: 1
    enonce: مَا الضَّمِيرُ المُسْتَتِرُ فِي «اِقْرَأْ»؟ (أَنَا / أَنْتَ / هُوَ)
    reponses:
    - أَنْتَ
    erreurs:
      أَنَا: خطأ في تقدير الضمير المستتر
      هُوَ: خطأ في تقدير الضمير المستتر
    indice: فِعْلُ الأَمْرِ لِلْمُفْرَدِ المُخَاطَبِ.
    explication: فِي «اِقْرَأْ» ضَمِيرٌ مُسْتَتِرٌ وُجُوبًا تَقْدِيرُهُ «أَنْتَ».
  - id: mustatir-6
    difficulte: 1
    enonce: هَلِ الضَّمِيرُ فِي «كَتَبْتُ» بَارِزٌ أَمْ مُسْتَتِرٌ؟ (بَارِزٌ / مُسْتَتِرٌ)
    reponses:
    - بَارِزٌ
    erreurs:
      مُسْتَتِرٌ: خلط بين البارز والمستتر
    indice: هَلْ لَهُ صُورَةٌ فِي الكِتَابَةِ؟
    explication: التَّاءُ فِي «كَتَبْتُ» ضَمِيرٌ بَارِزٌ مُتَّصِلٌ.
  - id: mustatir-7
    difficulte: 2
    enonce: 'الضَّمِيرُ فِي «أَلْعَبُ»: (مُسْتَتِرٌ وُجُوبًا / مُسْتَتِرٌ جَوَازًا)'
    reponses:
    - مُسْتَتِرٌ وُجُوبًا
    erreurs:
      مُسْتَتِرٌ جَوَازًا: خلط بين الاستتار وجوبا وجوازا
    indice: المُضَارِعُ المَبْدُوءُ بِالهَمْزَةِ.
    explication: فِي «أَلْعَبُ» ضَمِيرٌ مُسْتَتِرٌ وُجُوبًا تَقْدِيرُهُ «أَنَا».
  - id: mustatir-8
    difficulte: 2
    enonce: 'الضَّمِيرُ فِي «الوَلَدُ يَلْعَبُ»: (مُسْتَتِرٌ وُجُوبًا / مُسْتَتِرٌ جَوَازًا)'
    reponses:
    - مُسْتَتِرٌ جَوَازًا
    erreurs:
      مُسْتَتِرٌ وُجُوبًا: خلط بين الاستتار وجوبا وجوازا
    indice: الغَائِبُ يَجُوزُ أَنْ يَحُلَّ مَحَلَّهُ اسْمٌ ظَاهِرٌ.
    explication: فِي «يَلْعَبُ» ضَمِيرٌ مُسْتَتِرٌ جَوَازًا تَقْدِيرُهُ «هُوَ».
  - id: mustatir-9
    difficulte: 2
    enonce: 'الضَّمِيرُ فِي «نَدْرُسُ»: (مُسْتَتِرٌ وُجُوبًا / مُسْتَتِرٌ جَوَازًا)'
    reponses:
    - مُسْتَتِرٌ وُجُوبًا
    erreurs:
      مُسْتَتِرٌ جَوَازًا: خلط بين الاستتار وجوبا وجوازا
    indice: المُضَارِعُ المَبْدُوءُ بِالنُّونِ.
    explication: فِي «نَدْرُسُ» ضَمِيرٌ مُسْتَتِرٌ وُجُوبًا تَقْدِيرُهُ «نَحْنُ».
  - id: mustatir-10
    difficulte: 2
    enonce: مَا الضَّمِيرُ المُسْتَتِرُ فِي «البِنْتُ تَرْسُمُ»؟ (هِيَ / أَنْتِ / هُوَ)
    reponses:
    - هِيَ
    erreurs:
      أَنْتِ: خطأ في تقدير الضمير المستتر
      هُوَ: خطأ في تقدير الضمير المستتر
    indice: الفِعْلُ لِلْغَائِبَةِ.
    explication: فِي «تَرْسُمُ» ضَمِيرٌ مُسْتَتِرٌ جَوَازًا تَقْدِيرُهُ «هِيَ».
  - id: mustatir-11
    difficulte: 3
    enonce: 'الضَّمِيرُ فِي «الشَّمْسُ طَلَعَتْ»: (مُسْتَتِرٌ وُجُوبًا / مُسْتَتِرٌ جَوَازًا)'
    reponses:
    - مُسْتَتِرٌ جَوَازًا
    erreurs:
      مُسْتَتِرٌ وُجُوبًا: خلط بين الاستتار وجوبا وجوازا
    indice: التَّاءُ لِلتَّأْنِيثِ، وَالفَاعِلُ ضَمِيرٌ لِلْغَائِبَةِ.
    explication: فِي «طَلَعَتْ» ضَمِيرٌ مُسْتَتِرٌ جَوَازًا تَقْدِيرُهُ «هِيَ»؛ وَالتَّاءُ حَرْفُ تَأْنِيثٍ.
  - id: mustatir-12
    difficulte: 3
    enonce: مَا الضَّمِيرُ البَارِزُ فِي «اُكْتُبُوا»؟ (أَنْتُمْ / وَاوُ الجَمَاعَةِ / لَا يُوجَدُ)
    reponses:
