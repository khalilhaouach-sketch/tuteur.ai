    reponses:
    - حَاضِرُونَ
    erreurs:
      حَاضِرَاتٌ: خطأ في المطابقة
      حَاضِرَةٌ: خطأ في المطابقة
    indice: إِذَا اجْتَمَعَ المُذَكَّرُ وَالمُؤَنَّثُ غُلِّبَ المُذَكَّرُ.
    explication: 'نَقُولُ: المُعَلِّمُونَ وَالمُعَلِّمَاتُ حَاضِرُونَ.'
  - id: tatabuq-13
    difficulte: 3
    enonce: 'أَكْمِلْ بِمُبْتَدَإٍ مُطَابِقٍ: ... مُتَفَوِّقَتَانِ. (التِّلْمِيذَتَانِ / التِّلْمِيذَتَيْنِ / التِّلْمِيذَاتُ)'
    reponses:
    - التِّلْمِيذَتَانِ
    erreurs:
