      التِّلْمِيذَاتُ: خطأ في المطابقة
    indice: الخَبَرُ مُثَنًّى مُؤَنَّثٌ، وَالمُبْتَدَأُ مَرْفُوعٌ.
    explication: 'نَقُولُ: التِّلْمِيذَتَانِ مُتَفَوِّقَتَانِ.'
- notion: ظن وأخواتها
  exercices:
  - id: zanna-1
    difficulte: 1
    enonce: 'مَا المَفْعُولُ بِهِ الأَوَّلُ فِي الجُمْلَةِ: ظَنَنْتُ الجَوَّ بَارِدًا؟'
    reponses:
    - الجَوَّ
    erreurs:
      باردا: خلط بين المفعول الأول والثاني
    indice: 'المَفْعُولُ الأَوَّلُ كَانَ فِي الأَصْلِ مُبْتَدَأً: الجَوُّ بَارِدٌ.'
    explication: المَفْعُولُ بِهِ الأَوَّلُ هُوَ «الجَوَّ»، وَالثَّانِي «بَارِدًا».
  - id: zanna-2
    difficulte: 2
    enonce: 'مَا المَفْعُولُ بِهِ الثَّانِي فِي الجُمْلَةِ: جَعَلَ الصَّانِعُ الطِّينَ خَزَفًا؟'
    reponses:
    - خَزَفًا
    erreurs:
      الطين: خلط بين المفعول الأول والثاني
      الصانع: خلط بين الفاعل والمفعول به
    indice: 'المَفْعُولُ الثَّانِي كَانَ فِي الأَصْلِ خَبَرًا: الطِّينُ خَزَفٌ.'
    explication: المَفْعُولُ بِهِ الثَّانِي هُوَ «خَزَفًا»، وَالأَوَّلُ «الطِّينَ».
  - id: zanna-3
    difficulte: 3
    enonce: أَدْخِلْ «ظَنَّ» عَلَى الجُمْلَةِ «الاِمْتِحَانُ سَهْلٌ» مَعَ الفَاعِلِ «التِّلْمِيذُ».
    reponses:
    - ظَنَّ التِّلْمِيذُ الامْتِحَانَ سَهْلًا
    erreurs:
      ظن التلميذ الامتحان سهل: نسيان نصب المفعول الثاني
    indice: '«ظَنَّ» تَنْصِبُ المُبْتَدَأَ وَالخَبَرَ مَفْعُولَيْنِ: كَيْفَ يَصِيرُ «سَهْلٌ»؟'
    explication: 'نَقُولُ «ظَنَّ التِّلْمِيذُ الاِمْتِحَانَ سَهْلًا»: «الاِمْتِحَانَ» مَفْعُولٌ أَوَّلُ وَ«سَهْلًا» مَفْعُولٌ ثَانٍ، مَنْصُوبَانِ.'
  - id: zanna-4
    difficulte: 1
    enonce: 'مَا المَفْعُولُ بِهِ الأَوَّلُ فِي: حَسِبْتُ الطَّرِيقَ قَصِيرًا؟ (الطَّرِيقَ / قَصِيرًا / حَسِبْتُ)'
    reponses:
    - الطَّرِيقَ
    erreurs:
      قَصِيرًا: خلط بين المفعول الأول والثاني
      حَسِبْتُ: خلط بين المفعول الأول والثاني
    indice: 'أَصْلُ الجُمْلَةِ: الطَّرِيقُ قَصِيرٌ.'
    explication: المَفْعُولُ الأَوَّلُ «الطَّرِيقَ» (كَانَ مُبْتَدَأً)، وَالثَّانِي «قَصِيرًا» (كَانَ خَبَرًا).
  - id: zanna-5
    difficulte: 1
    enonce: 'مَا المَفْعُولُ بِهِ الثَّانِي فِي: وَجَدْتُ العَمَلَ مُفِيدًا؟ (العَمَلَ / مُفِيدًا / وَجَدْتُ)'
    reponses:
    - مُفِيدًا
    erreurs:
      العَمَلَ: خلط بين المفعول الأول والثاني
      وَجَدْتُ: خلط بين المفعول الأول والثاني
    indice: المَفْعُولُ الثَّانِي أَصْلُهُ خَبَرٌ.
    explication: المَفْعُولُ الثَّانِي «مُفِيدًا».
  - id: zanna-6
    difficulte: 1
    enonce: أَيُّ فِعْلٍ مِنْ أَخَوَاتِ «ظَنَّ»؟ (أَعْطَى / عَلِمَ / كَانَ)
    reponses:
    - عَلِمَ
    erreurs:
      أَعْطَى: خلط بين ظن وأخواتها وغيرها
      كَانَ: خلط بين ظن وأخواتها وغيرها
    indice: 'أَخَوَاتُ «ظَنَّ»: حَسِبَ، خَالَ، زَعَمَ، عَلِمَ، رَأَى، وَجَدَ، جَعَلَ، صَيَّرَ، اتَّخَذَ.'
    explication: «عَلِمَ» مِنْ أَخَوَاتِ «ظَنَّ» (أَفْعَالِ اليَقِينِ).
  - id: zanna-7
    difficulte: 2
    enonce: 'أَدْخِلْ «ظَنَّ» عَلَى: الجَوُّ مُمْطِرٌ (مَعَ «ظَنَنْتُ»): (ظَنَنْتُ الجَوَّ مُمْطِرًا / ظَنَنْتُ الجَوُّ مُمْطِرٌ / ظَنَنْتُ الجَوَّ مُمْطِرٌ)'
    reponses:
    - ظَنَنْتُ الجَوَّ مُمْطِرًا
    erreurs:
      ظَنَنْتُ الجَوُّ مُمْطِرٌ: خطأ في إعراب مفعولي ظن
      ظَنَنْتُ الجَوَّ مُمْطِرٌ: خطأ في إعراب مفعولي ظن
    indice: يُنْصَبُ المُبْتَدَأُ وَالخَبَرُ مَفْعُولَيْنِ.
    explication: 'نَقُولُ: ظَنَنْتُ الجَوَّ مُمْطِرًا.'
  - id: zanna-8
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: جَعَلَ النَّجَّارُ الخَشَبَ ... (كُرْسِيٌّ / كُرْسِيًّا / كُرْسِيٍّ)'
    reponses:
    - كُرْسِيًّا
    erreurs:
      كُرْسِيٌّ: خطأ في إعراب مفعولي ظن
      كُرْسِيٍّ: خطأ في إعراب مفعولي ظن
    indice: «جَعَلَ» (لِلتَّحْوِيلِ) تَنْصِبُ مَفْعُولَيْنِ.
    explication: 'نَقُولُ: جَعَلَ النَّجَّارُ الخَشَبَ كُرْسِيًّا.'
  - id: zanna-9
    difficulte: 2
    enonce: إِلَى أَيِّ قِسْمٍ يَنْتَمِي «صَيَّرَ»؟ (أَفْعَالُ التَّحْوِيلِ / أَفْعَالُ اليَقِينِ / أَفْعَالُ الرُّجْحَانِ)
    reponses:
    - أَفْعَالُ التَّحْوِيلِ
    erreurs:
      أَفْعَالُ اليَقِينِ: خطأ في أقسام ظن وأخواتها
      أَفْعَالُ الرُّجْحَانِ: خطأ في أقسام ظن وأخواتها
    indice: 'صَيَّرَ الشَّيْءَ: حَوَّلَهُ مِنْ حَالٍ إِلَى حَالٍ.'
    explication: «صَيَّرَ» مِنْ أَفْعَالِ التَّحْوِيلِ، مِثْلُ «جَعَلَ» وَ«اتَّخَذَ».
  - id: zanna-10
    difficulte: 2
    enonce: إِلَى أَيِّ قِسْمٍ يَنْتَمِي «حَسِبَ»؟ (أَفْعَالُ التَّحْوِيلِ / أَفْعَالُ اليَقِينِ / أَفْعَالُ الرُّجْحَانِ)
    reponses:
    - أَفْعَالُ الرُّجْحَانِ
    erreurs:
      أَفْعَالُ التَّحْوِيلِ: خطأ في أقسام ظن وأخواتها
      أَفْعَالُ اليَقِينِ: خطأ في أقسام ظن وأخواتها
    indice: «حَسِبَ» تَدُلُّ عَلَى ظَنٍّ لَا عَلَى يَقِينٍ.
    explication: «حَسِبَ» مِنْ أَفْعَالِ الرُّجْحَانِ، مِثْلُ «ظَنَّ» وَ«خَالَ».
  - id: zanna-11
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: رَأَيْتُ العِلْمَ ... (نَافِعٌ / نَافِعًا / نَافِعٍ)'
    reponses:
    - نَافِعًا
    erreurs:
      نَافِعٌ: خطأ في إعراب مفعولي ظن
      نَافِعٍ: خطأ في إعراب مفعولي ظن
    indice: '«رَأَى» هُنَا بِمَعْنَى «عَلِمَ»: تَنْصِبُ مَفْعُولَيْنِ.'
    explication: 'نَقُولُ: رَأَيْتُ العِلْمَ نَافِعًا.'
  - id: zanna-12
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: اتَّخَذْتُ الكِتَابَ ... (صَدِيقٌ / صَدِيقًا / صَدِيقٍ)'
    reponses:
    - صَدِيقًا
    erreurs:
      صَدِيقٌ: خطأ في إعراب مفعولي ظن
      صَدِيقٍ: خطأ في إعراب مفعولي ظن
    indice: «اتَّخَذَ» مِنْ أَفْعَالِ التَّحْوِيلِ.
    explication: 'نَقُولُ: اتَّخَذْتُ الكِتَابَ صَدِيقًا.'
  - id: zanna-13
    difficulte: 3
    enonce: هَلْ يَصْلُحُ مَفْعُولَا «ظَنَّ» أَنْ يَكُونَا مُبْتَدَأً وَخَبَرًا؟ (نَعَمْ / لَا)
    reponses:
    - نَعَمْ
    erreurs:
      لَا: خلط بين ظن وأخواتها وأعطى وأخواتها
    indice: 'اِحْذِفِ الفِعْلَ وَالفَاعِلَ: «ظَنَنْتُ الجَوَّ بَارِدًا» ← «الجَوُّ بَارِدٌ».'
    explication: 'نَعَمْ: أَصْلُ مَفْعُولَيْ «ظَنَّ» مُبْتَدَأٌ وَخَبَرٌ، بِخِلَافِ «أَعْطَى».'
- notion: أعطى وأخواتها
  exercices:
  - id: aata-1
    difficulte: 1
    enonce: 'مَا المَفْعُولُ بِهِ الأَوَّلُ فِي الجُمْلَةِ: أَعْطَى الأُسْتَاذُ التِّلْمِيذَ جَائِزَةً؟'
    reponses:
    - التِّلْمِيذَ
    erreurs:
      جائزة: خلط بين المفعول الأول والثاني
      الأستاذ: خلط بين الفاعل والمفعول به
    indice: مَنِ الَّذِي أَخَذَ الجَائِزَةَ؟
    explication: المَفْعُولُ بِهِ الأَوَّلُ هُوَ «التِّلْمِيذَ»، وَالثَّانِي «جَائِزَةً».
  - id: aata-2
    difficulte: 2
    enonce: 'مَا المَفْعُولُ بِهِ الثَّانِي فِي الجُمْلَةِ: كَسَا البَرْدُ الجِبَالَ ثَلْجًا؟'
    reponses:
    - ثَلْجًا
    erreurs:
      الجبال: خلط بين المفعول الأول والثاني
      البرد: خلط بين الفاعل والمفعول به
    indice: بِمَاذَا كَسَا البَرْدُ الجِبَالَ؟
    explication: المَفْعُولُ بِهِ الثَّانِي هُوَ «ثَلْجًا»، وَالأَوَّلُ «الجِبَالَ».
  - id: aata-3
    difficulte: 3
    enonce: هَلْ يَصْلُحُ المَفْعُولَانِ فِي «مَنَحَ المُدِيرُ الفَائِزَ جَائِزَةً» أَنْ يَكُونَا مُبْتَدَأً وَخَبَرًا؟ أَجِبْ بِـ«نَعَمْ» أَوْ «لَا».
    reponses:
    - لَا
    erreurs:
      نعم: خلط بين «أعطى وأخواتها» و«ظن وأخواتها»
    indice: 'جَرِّبْ: هَلْ تَصِحُّ الجُمْلَةُ «الفَائِزُ جَائِزَةٌ»؟'
    explication: 'لَا يَصْلُحَانِ: لَا نَقُولُ «الفَائِزُ جَائِزَةٌ»، لِأَنَّ «مَنَحَ» مِنْ أَخَوَاتِ «أَعْطَى».'
  - id: aata-4
    difficulte: 1
    enonce: 'مَا المَفْعُولُ بِهِ الأَوَّلُ فِي: مَنَحَ المُدِيرُ التِّلْمِيذَ جَائِزَةً؟ (المُدِيرُ / التِّلْمِيذَ / جَائِزَةً)'
    reponses:
    - التِّلْمِيذَ
    erreurs:
      المُدِيرُ: خلط بين المفعول الأول والثاني
      جَائِزَةً: خلط بين المفعول الأول والثاني
    indice: مَنِ الَّذِي أَخَذَ الجَائِزَةَ؟
    explication: المَفْعُولُ الأَوَّلُ «التِّلْمِيذَ»، وَالثَّانِي «جَائِزَةً».
  - id: aata-5
    difficulte: 1
    enonce: 'مَا المَفْعُولُ بِهِ الثَّانِي فِي: أَلْبَسَتِ الأُمُّ الطِّفْلَ مِعْطَفًا؟ (الطِّفْلَ / مِعْطَفًا / الأُمُّ)'
    reponses:
    - مِعْطَفًا
    erreurs:
      الطِّفْلَ: خلط بين المفعول الأول والثاني
      الأُمُّ: خلط بين المفعول الأول والثاني
    indice: مَاذَا أَلْبَسَتْهُ؟
    explication: المَفْعُولُ الثَّانِي «مِعْطَفًا».
  - id: aata-6
    difficulte: 1
    enonce: أَيُّ فِعْلٍ مِنْ أَخَوَاتِ «أَعْطَى»؟ (ظَنَّ / كَسَا / أَصْبَحَ)
    reponses:
    - كَسَا
    erreurs:
      ظَنَّ: خلط بين أعطى وأخواتها وغيرها
      أَصْبَحَ: خلط بين أعطى وأخواتها وغيرها
    indice: 'أَخَوَاتُ «أَعْطَى»: مَنَحَ، كَسَا، أَلْبَسَ، سَأَلَ، مَنَعَ، أَطْعَمَ...'
    explication: «كَسَا» مِنْ أَخَوَاتِ «أَعْطَى».
  - id: aata-7
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: أَطْعَمَ الرَّجُلُ الفَقِيرَ ... (خُبْزٌ / خُبْزًا / خُبْزٍ)'
    reponses:
    - خُبْزًا
    erreurs:
      خُبْزٌ: خطأ في إعراب مفعولي أعطى
      خُبْزٍ: خطأ في إعراب مفعولي أعطى
    indice: «أَطْعَمَ» تَنْصِبُ مَفْعُولَيْنِ.
    explication: 'نَقُولُ: أَطْعَمَ الرَّجُلُ الفَقِيرَ خُبْزًا.'
  - id: aata-8
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: سَأَلَ التِّلْمِيذُ ... سُؤَالًا. (المُعَلِّمُ / المُعَلِّمَ / المُعَلِّمِ)'
    reponses:
    - المُعَلِّمَ
    erreurs:
      المُعَلِّمُ: خطأ في إعراب مفعولي أعطى
      المُعَلِّمِ: خطأ في إعراب مفعولي أعطى
    indice: '«سَأَلَ» تَنْصِبُ مَفْعُولَيْنِ: مَنْ؟ وَمَاذَا؟'
    explication: 'نَقُولُ: سَأَلَ التِّلْمِيذُ المُعَلِّمَ سُؤَالًا.'
  - id: aata-9
    difficulte: 2
    enonce: هَلْ يَصْلُحُ مَفْعُولَا «أَعْطَى» أَنْ يَكُونَا مُبْتَدَأً وَخَبَرًا؟ (نَعَمْ / لَا)
    reponses:
    - لَا
    erreurs:
      نَعَمْ: خلط بين ظن وأخواتها وأعطى وأخواتها
    indice: 'جَرِّبْ: «أَعْطَيْتُ الفَقِيرَ مَالًا» ← «الفَقِيرُ مَالٌ»؟'
    explication: 'لَا: «الفَقِيرُ مَالٌ» لَا تَصِحُّ؛ مَفْعُولَا «أَعْطَى» لَيْسَ أَصْلُهُمَا مُبْتَدَأً وَخَبَرًا.'
  - id: aata-10
    difficulte: 2
    enonce: كَمْ مَفْعُولًا تَنْصِبُ «أَعْطَى»؟ (وَاحِدًا / اثْنَيْنِ / ثَلَاثَةً)
    reponses:
    - اثْنَيْنِ
    erreurs:
      وَاحِدًا: خطأ في عدد المفاعيل
      ثَلَاثَةً: خطأ في عدد المفاعيل
    indice: أَعْطَى مَنْ؟ وَأَعْطَى مَاذَا؟
    explication: «أَعْطَى» تَنْصِبُ مَفْعُولَيْنِ.
  - id: aata-11
    difficulte: 3
    enonce: 'مَا المَفْعُولُ بِهِ الأَوَّلُ فِي: مَنَعَ الشُّرْطِيُّ السَّائِقَ المُرُورَ؟ (الشُّرْطِيُّ / السَّائِقَ / المُرُورَ)'
    reponses:
    - السَّائِقَ
    erreurs:
      الشُّرْطِيُّ: خلط بين المفعول الأول والثاني
      المُرُورَ: خلط بين المفعول الأول والثاني
    indice: مَنِ الَّذِي مُنِعَ؟
    explication: المَفْعُولُ الأَوَّلُ «السَّائِقَ»، وَالثَّانِي «المُرُورَ».
  - id: aata-12
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: كَسَا الرَّبِيعُ الأَرْضَ ... (خُضْرَةٌ / خُضْرَةً / خُضْرَةٍ)'
    reponses:
    - خُضْرَةً
    erreurs:
      خُضْرَةٌ: خطأ في إعراب مفعولي أعطى
      خُضْرَةٍ: خطأ في إعراب مفعولي أعطى
    indice: «كَسَا» تَنْصِبُ مَفْعُولَيْنِ.
    explication: 'نَقُولُ: كَسَا الرَّبِيعُ الأَرْضَ خُضْرَةً.'
  - id: aata-13
    difficulte: 3
    enonce: 'مَا الفَاعِلُ فِي: أَعْطَتْنِي أُمِّي هَدِيَّةً؟ (اليَاءُ / أُمِّي / هَدِيَّةً)'
    reponses:
    - أُمِّي
    erreurs:
      اليَاءُ: خلط بين الفاعل والمفعول
      هَدِيَّةً: خلط بين الفاعل والمفعول
    indice: مَنِ الَّتِي أَعْطَتْ؟
    explication: الفَاعِلُ «أُمِّي»؛ وَيَاءُ المُتَكَلِّمِ مَفْعُولٌ أَوَّلُ، وَ«هَدِيَّةً» مَفْعُولٌ ثَانٍ.
- notion: المبني للمجهول
  exercices:
  - id: majhul-1
    difficulte: 1
    voyelles_obligatoires: true
    enonce: اِبْنِ الفِعْلَ «كَتَبَ» لِلْمَجْهُولِ.
    reponses:
    - كُتِبَ
    erreurs:
      كَتَبَ: عدم تغيير حركات الفعل
    indice: 'فِي المَاضِي: يُضَمُّ أَوَّلُهُ وَيُكْسَرُ مَا قَبْلَ آخِرِهِ.'
    explication: المَبْنِيُّ لِلْمَجْهُولِ مِنْ «كَتَبَ» هُوَ «كُتِبَ».
  - id: majhul-2
    difficulte: 2
    voyelles_obligatoires: true
    enonce: اِبْنِ الفِعْلَ «يَكْتُبُ» لِلْمَجْهُولِ.
    reponses:
    - يُكْتَبُ
    erreurs:
      يُكْتِبُ: خطأ في حركة ما قبل الآخر في المضارع
    indice: 'فِي المُضَارِعِ: يُضَمُّ أَوَّلُهُ وَيُفْتَحُ مَا قَبْلَ آخِرِهِ.'
    explication: المَبْنِيُّ لِلْمَجْهُولِ مِنْ «يَكْتُبُ» هُوَ «يُكْتَبُ».
  - id: majhul-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: اِبْنِ الفِعْلَ «قَالَ» لِلْمَجْهُولِ.
    reponses:
    - قِيلَ
    erreurs:
      قول: عدم مراعاة حكم الأجوف
      قال: عدم تغيير الفعل
    indice: 'الفِعْلُ أَجْوَفُ: مِثْلُ «بَاعَ ← بِيعَ».'
    explication: المَبْنِيُّ لِلْمَجْهُولِ مِنْ «قَالَ» هُوَ «قِيلَ».
  - id: majhul-4
    difficulte: 1
    voyelles_obligatoires: true
    enonce: 'اِبْنِ الفِعْلَ «فَتَحَ» لِلْمَجْهُولِ: (فُتِحَ / فَتِحَ / فُتَحَ)'
    reponses:
    - فُتِحَ
    erreurs:
      فَتِحَ: خطأ في البناء للمجهول
      فُتَحَ: خطأ في البناء للمجهول
    indice: 'المَاضِي: نَضُمُّ أَوَّلَهُ وَنَكْسِرُ مَا قَبْلَ آخِرِهِ.'
    explication: «فَتَحَ» ← «فُتِحَ».
  - id: majhul-5
    difficulte: 1
    voyelles_obligatoires: true
    enonce: 'اِبْنِ الفِعْلَ «يَشْرَبُ» لِلْمَجْهُولِ: (يُشْرِبُ / يُشْرَبُ / يَشْرَبُ)'
    reponses:
    - يُشْرَبُ
    erreurs:
      يُشْرِبُ: خطأ في البناء للمجهول
      يَشْرَبُ: خطأ في البناء للمجهول
    indice: 'المُضَارِعُ: نَضُمُّ أَوَّلَهُ وَنَفْتَحُ مَا قَبْلَ آخِرِهِ.'
    explication: «يَشْرَبُ» ← «يُشْرَبُ».
  - id: majhul-6
    difficulte: 1
    enonce: 'مَا نَائِبُ الفَاعِلِ فِي: نُظِّفَ القِسْمُ؟ (نُظِّفَ / القِسْمُ)'
    reponses:
    - القِسْمُ
    erreurs:
      نُظِّفَ: خلط بين الفعل ونائب الفاعل
    indice: مَا الَّذِي نُظِّفَ؟
    explication: نَائِبُ الفَاعِلِ «القِسْمُ».
  - id: majhul-7
    difficulte: 2
    voyelles_obligatoires: true
    enonce: 'اِبْنِ الفِعْلَ «بَاعَ» لِلْمَجْهُولِ: (بُوعَ / بِيعَ / بُيِعَ)'
    reponses:
    - بِيعَ
    erreurs:
      بُوعَ: خطأ في البناء للمجهول
      بُيِعَ: خطأ في البناء للمجهول
    indice: 'الأَجْوَفُ: يُكْسَرُ أَوَّلُهُ وَيُقْلَبُ حَرْفُ العِلَّةِ يَاءً.'
    explication: «بَاعَ» ← «بِيعَ».
  - id: majhul-8
    difficulte: 2
    voyelles_obligatoires: true
    enonce: 'اِبْنِ الفِعْلَ «يَقُولُ» لِلْمَجْهُولِ: (يُقُولُ / يُقَالُ / يُقِيلُ)'
    reponses:
    - يُقَالُ
    erreurs:
      يُقُولُ: خطأ في البناء للمجهول
      يُقِيلُ: خطأ في البناء للمجهول
    indice: 'مُضَارِعُ الأَجْوَفِ: يُقْلَبُ حَرْفُ العِلَّةِ أَلِفًا.'
    explication: «يَقُولُ» ← «يُقَالُ».
  - id: majhul-9
    difficulte: 2
    voyelles_obligatoires: true
    tolerer_hamza: false
    enonce: 'اِبْنِ الفِعْلَ «أَكْرَمَ» لِلْمَجْهُولِ: (أُكْرِمَ / أَكْرِمَ / أُكْرَمَ)'
    reponses:
    - أُكْرِمَ
    erreurs:
      أَكْرِمَ: خطأ في البناء للمجهول
      أُكْرَمَ: خطأ في البناء للمجهول
    indice: نَضُمُّ أَوَّلَهُ وَنَكْسِرُ مَا قَبْلَ آخِرِهِ.
    explication: «أَكْرَمَ» ← «أُكْرِمَ».
  - id: majhul-10
    difficulte: 2
    enonce: 'حَوِّلْ إِلَى المَبْنِيِّ لِلْمَجْهُولِ: قَطَفَ الفَلَّاحُ الثِّمَارَ. (قُطِفَتِ الثِّمَارُ / قَطَفَتِ الثِّمَارُ / قُطِفَتِ الثِّمَارَ)'
    reponses:
    - قُطِفَتِ الثِّمَارُ
    erreurs:
      قَطَفَتِ الثِّمَارُ: خطأ في البناء للمجهول
      قُطِفَتِ الثِّمَارَ: خطأ في البناء للمجهول
    indice: يُحْذَفُ الفَاعِلُ، وَيَصِيرُ المَفْعُولُ نَائِبَ فَاعِلٍ مَرْفُوعًا.
    explication: 'نَقُولُ: قُطِفَتِ الثِّمَارُ.'
  - id: majhul-11
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'اِبْنِ الفِعْلَ «اسْتَخْرَجَ» لِلْمَجْهُولِ: (اُسْتُخْرِجَ / اسْتَخْرِجَ / اُسْتُخْرَجَ)'
    reponses:
    - اُسْتُخْرِجَ
    erreurs:
      اسْتَخْرِجَ: خطأ في البناء للمجهول
      اُسْتُخْرَجَ: خطأ في البناء للمجهول
    indice: يُضَمُّ الأَوَّلُ وَالثَّالِثُ، وَيُكْسَرُ مَا قَبْلَ الآخِرِ.
    explication: «اسْتَخْرَجَ» ← «اُسْتُخْرِجَ».
