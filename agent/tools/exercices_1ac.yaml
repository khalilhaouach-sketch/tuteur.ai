    explication: '«شَدَّ» فِعْلٌ مُضَعَّفٌ: أَصْلُهُ «شَدَدَ».'
  - id: sahih-7
    difficulte: 2
    enonce: مَا نَوْعُ الفِعْلِ «سَأَلَ»؟ (سَالِمٌ / مَهْمُوزٌ / مُضَعَّفٌ)
    reponses:
    - مَهْمُوزٌ
    erreurs:
      سَالِمٌ: خطأ في أنواع الفعل الصحيح
      مُضَعَّفٌ: خطأ في أنواع الفعل الصحيح
    indice: السَّالِمُ لَيْسَ فِيهِ هَمْزَةٌ وَلَا تَضْعِيفٌ وَلَا حَرْفُ عِلَّةٍ، وَالمَهْمُوزُ فِيهِ هَمْزَةٌ، وَالمُضَعَّفُ تَكَرَّرَ فِيهِ حَرْفٌ.
    explication: «سَأَلَ» فِعْلٌ مَهْمُوزُ العَيْنِ.
  - id: sahih-8
    difficulte: 2
    enonce: مَا نَوْعُ الفِعْلِ «بَدَأَ»؟ (سَالِمٌ / مَهْمُوزٌ / مُضَعَّفٌ)
    reponses:
    - مَهْمُوزٌ
    erreurs:
      سَالِمٌ: خطأ في أنواع الفعل الصحيح
      مُضَعَّفٌ: خطأ في أنواع الفعل الصحيح
    indice: السَّالِمُ لَيْسَ فِيهِ هَمْزَةٌ وَلَا تَضْعِيفٌ وَلَا حَرْفُ عِلَّةٍ، وَالمَهْمُوزُ فِيهِ هَمْزَةٌ، وَالمُضَعَّفُ تَكَرَّرَ فِيهِ حَرْفٌ.
    explication: «بَدَأَ» فِعْلٌ مَهْمُوزُ اللَّامِ.
  - id: sahih-9
    difficulte: 2
    enonce: مَا نَوْعُ الفِعْلِ «زَلْزَلَ»؟ (سَالِمٌ / مَهْمُوزٌ / مُضَعَّفٌ)
    reponses:
    - مُضَعَّفٌ
    erreurs:
      سَالِمٌ: خطأ في أنواع الفعل الصحيح
      مَهْمُوزٌ: خطأ في أنواع الفعل الصحيح
    indice: 'فِي الرُّبَاعِيِّ: تَكَرَّرَ مَقْطَعَانِ (زَلْ زَلْ).'
    explication: «زَلْزَلَ» فِعْلٌ رُبَاعِيٌّ مُضَعَّفٌ.
  - id: sahih-10
    difficulte: 2
    enonce: 'اِخْتَرِ الفِعْلَ الصَّحِيحَ: (وَعَدَ / قَالَ / ذَهَبَ)'
    reponses:
    - ذَهَبَ
    erreurs:
      وَعَدَ: خلط بين الصحيح والمعتل
      قَالَ: خلط بين الصحيح والمعتل
    indice: الفِعْلُ الصَّحِيحُ لَيْسَ فِي حُرُوفِهِ الأَصْلِيَّةِ حَرْفُ عِلَّةٍ.
    explication: «ذَهَبَ» فِعْلٌ صَحِيحٌ؛ «وَعَدَ» وَ«قَالَ» مُعْتَلَّانِ.
  - id: sahih-11
    difficulte: 3
    enonce: مَا الأَمْرُ مِنْ «أَكَلَ» لِلْمُفْرَدِ المُذَكَّرِ؟ (اُؤْكُلْ / كُلْ / أَكِلْ)
    reponses:
    - كُلْ
    erreurs:
      اُؤْكُلْ: خطأ في أمر المهموز
      أَكِلْ: خطأ في أمر المهموز
    indice: تُحْذَفُ الهَمْزَةُ فِي أَمْرِ «أَكَلَ» وَ«أَخَذَ».
    explication: 'الأَمْرُ مِنْ «أَكَلَ»: كُلْ.'
  - id: sahih-12
    difficulte: 3
    enonce: 'أَسْنِدِ الفِعْلَ «رَدَّ» إِلَى «نَا» الفَاعِلِينَ: (رَدْنَا / رَدَدْنَا / رَدَّنَا)'
    reponses:
    - رَدَدْنَا
    erreurs:
      رَدْنَا: خطأ في إسناد المضعف
      رَدَّنَا: خطأ في إسناد المضعف
    indice: مَعَ ضَمَائِرِ الرَّفْعِ المُتَحَرِّكَةِ يُفَكُّ التَّضْعِيفُ.
    explication: 'نَقُولُ: رَدَدْنَا (يُفَكُّ الإِدْغَامُ).'
  - id: sahih-13
    difficulte: 3
    enonce: مَا الأَمْرُ مِنْ «سَأَلَ» لِلْمُفْرَدِ المُذَكَّرِ؟ (سَلْ / اسْأَلْ / كِلَاهُمَا صَحِيحٌ)
    reponses:
    - كِلَاهُمَا صَحِيحٌ
    erreurs:
      سَلْ: خطأ في أمر المهموز
      اسْأَلْ: خطأ في أمر المهموز
    indice: يَجُوزُ حَذْفُ الهَمْزَةِ وَإِثْبَاتُهَا فِي أَمْرِ «سَأَلَ».
    explication: 'يَجُوزُ: اسْأَلْ وَسَلْ.'
- notion: المثال والأجوف
  exercices:
  - id: mithal-1
    difficulte: 1
    enonce: 'مَا نَوْعُ الفِعْلِ المُعْتَلِّ «وَعَدَ»: مِثَالٌ أَمْ أَجْوَفُ؟'
    reponses:
    - مِثَالٌ
    erreurs:
      أجوف: خلط بين المثال والأجوف
    indice: 'أَيْنَ حَرْفُ العِلَّةِ فِي الفِعْلِ: فِي أَوَّلِهِ أَمْ فِي وَسَطِهِ؟'
    explication: «وَعَدَ» مِثَالٌ، لِأَنَّ فَاءَهُ (أَوَّلَ حُرُوفِهِ) حَرْفُ عِلَّةٍ.
  - id: mithal-2
    difficulte: 2
    voyelles_obligatoires: true
    enonce: مَا فِعْلُ الأَمْرِ مِنْ «وَصَلَ» لِلْمُفْرَدِ المُذَكَّرِ؟
    reponses:
    - صِلْ
    erreurs:
      اوصل: عدم حذف الواو في الأمر
      وصل: عدم حذف الواو في الأمر
    indice: 'مِثْلُ «وَعَدَ ← يَعِدُ ← عِدْ»: مَا مُضَارِعُ «وَصَلَ»؟'
    explication: مُضَارِعُ «وَصَلَ» «يَصِلُ»، وَالأَمْرُ «صِلْ» بِحَذْفِ الوَاوِ.
  - id: mithal-3
    difficulte: 3
    voyelles_obligatoires: true
    enonce: أَسْنِدِ الفِعْلَ «قَالَ» إِلَى تَاءِ الفَاعِلِ (أَنَا).
    reponses:
    - قُلْتُ
    erreurs:
      قالت: عدم حذف عين الأجوف مع ضمير الرفع المتحرك
    indice: الفِعْلُ الأَجْوَفُ تُحْذَفُ عَيْنُهُ إِذَا اتَّصَلَ بِضَمِيرِ رَفْعٍ مُتَحَرِّكٍ.
    explication: نَقُولُ «قُلْتُ» بِحَذْفِ الأَلِفِ، لِأَنَّ الأَجْوَفَ اتَّصَلَ بِضَمِيرِ رَفْعٍ مُتَحَرِّكٍ.
  - id: mithal-4
    difficulte: 1
    enonce: مَا نَوْعُ الفِعْلِ «وَصَلَ»؟ (مِثَالٌ / أَجْوَفُ / نَاقِصٌ)
    reponses:
    - مِثَالٌ
    erreurs:
      أَجْوَفُ: خطأ في أنواع المعتل
      نَاقِصٌ: خطأ في أنواع المعتل
    indice: المِثَالُ حَرْفُ العِلَّةِ فِي أَوَّلِهِ، وَالأَجْوَفُ فِي وَسَطِهِ، وَالنَّاقِصُ فِي آخِرِهِ.
    explication: '«وَصَلَ» مِثَالٌ: حَرْفُ العِلَّةِ فِي أَوَّلِهِ.'
  - id: mithal-5
    difficulte: 1
    enonce: مَا نَوْعُ الفِعْلِ «نَامَ»؟ (مِثَالٌ / أَجْوَفُ / نَاقِصٌ)
