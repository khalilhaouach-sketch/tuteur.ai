      لَأَ: خطأ في جواب القسم
      لَقَدْ: خطأ في جواب القسم
    indice: الجَوَابُ المَنْفِيُّ لَا يُؤَكَّدُ بِاللَّامِ وَالنُّونِ.
    explication: 'نَقُولُ: وَاللَّهِ لَا أَخُونُ الأَمَانَةَ؛ الجَوَابُ مَنْفِيٌّ.'
  - id: qasam-9
    difficulte: 3
    enonce: مَا مَوْقِعُ جُمْلَةِ جَوَابِ القَسَمِ؟ (لَا مَحَلَّ لَهَا مِنَ الإِعْرَابِ / فِي مَحَلِّ رَفْعٍ / فِي مَحَلِّ نَصْبٍ)
    reponses:
    - لَا مَحَلَّ لَهَا مِنَ الإِعْرَابِ
    erreurs:
      فِي مَحَلِّ رَفْعٍ: خطأ في إعراب جواب القسم
      فِي مَحَلِّ نَصْبٍ: خطأ في إعراب جواب القسم
    indice: جُمْلَةُ جَوَابِ القَسَمِ مِنَ الجُمَلِ الَّتِي لَا مَحَلَّ لَهَا.
    explication: جُمْلَةُ جَوَابِ القَسَمِ لَا مَحَلَّ لَهَا مِنَ الإِعْرَابِ.
  - id: qasam-10
    difficulte: 3
    enonce: أَيُّ حُرُوفِ القَسَمِ يُذْكَرُ مَعَهُ فِعْلُ القَسَمِ؟ (البَاءُ / الوَاوُ / التَّاءُ)
    reponses:
    - البَاءُ
    erreurs:
      الوَاوُ: خطأ في حروف القسم
      التَّاءُ: خطأ في حروف القسم
    indice: 'مِثَالٌ: أُقْسِمُ بِاللَّهِ.'
    explication: 'البَاءُ يَجُوزُ أَنْ يُذْكَرَ مَعَهَا فِعْلُ القَسَمِ: أُقْسِمُ بِاللَّهِ.'
  - id: qasam-11
    difficulte: 3
    enonce: 'مَا إِعْرَابُ «اللَّهِ» فِي: وَاللَّهِ لَأَنْجَحَنَّ؟ (اسْمٌ مَجْرُورٌ بِوَاوِ القَسَمِ / مُبْتَدَأٌ / مَفْعُولٌ بِهِ)'
    reponses:
    - اسْمٌ مَجْرُورٌ بِوَاوِ القَسَمِ
    erreurs:
      مُبْتَدَأٌ: خطأ في إعراب المقسم به
      مَفْعُولٌ بِهِ: خطأ في إعراب المقسم به
    indice: 'حُرُوفُ القَسَمِ: الوَاوُ، البَاءُ، التَّاءُ (مَعَ لَفْظِ الجَلَالَةِ فَقَطْ). المُقْسَمُ بِهِ مَجْرُورٌ، وَجَوَابُ القَسَمِ المُثْبَتُ يُؤَكَّدُ بِاللَّامِ وَالنُّونِ أَوْ بِـ«قَدْ».'
    explication: «اللَّهِ» اسْمٌ مَجْرُورٌ بِوَاوِ القَسَمِ، وَالجَارُّ وَالمَجْرُورُ مُتَعَلِّقَانِ بِفِعْلٍ مَحْذُوفٍ تَقْدِيرُهُ «أُقْسِمُ».
  - id: qasam-12
    difficulte: 3
    enonce: مَا عَنَاصِرُ أُسْلُوبِ القَسَمِ؟ (حَرْفُ القَسَمِ وَالمُقْسَمُ بِهِ وَجَوَابُ القَسَمِ / فِعْلٌ وَفَاعِلٌ وَمَفْعُولٌ / مُبْتَدَأٌ وَخَبَرٌ)
    reponses:
    - حَرْفُ القَسَمِ وَالمُقْسَمُ بِهِ وَجَوَابُ القَسَمِ
    erreurs:
      فِعْلٌ وَفَاعِلٌ وَمَفْعُولٌ: خطأ في عناصر القسم
      مُبْتَدَأٌ وَخَبَرٌ: خطأ في عناصر القسم
    indice: 'حُرُوفُ القَسَمِ: الوَاوُ، البَاءُ، التَّاءُ (مَعَ لَفْظِ الجَلَالَةِ فَقَطْ). المُقْسَمُ بِهِ مَجْرُورٌ، وَجَوَابُ القَسَمِ المُثْبَتُ يُؤَكَّدُ بِاللَّامِ وَالنُّونِ أَوْ بِـ«قَدْ».'
    explication: 'عَنَاصِرُهُ: أَدَاةُ القَسَمِ، وَالمُقْسَمُ بِهِ، وَجَوَابُ القَسَمِ.'
  - id: qasam-13
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: لَعَمْرُكَ ... الحَقَّ لَمُنْتَصِرٌ. (إِنَّ / أَنْ / لَنْ)'
    reponses:
    - إِنَّ
    erreurs:
      أَنْ: خطأ في جواب القسم
      لَنْ: خطأ في جواب القسم
    indice: جَوَابُ القَسَمِ الاِسْمِيُّ يُؤَكَّدُ بِـ«إِنَّ» أَوِ اللَّامِ.
    explication: 'الجَوَابُ جُمْلَةٌ اسْمِيَّةٌ تُؤَكَّدُ بِـ«إِنَّ»: لَعَمْرُكَ إِنَّ الحَقَّ لَمُنْتَصِرٌ.'
