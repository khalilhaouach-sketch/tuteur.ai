    indice: 'جَمْعُ القِلَّةِ (مِنْ 3 إِلَى 10) أَوْزَانُهُ: أَفْعُلٌ، أَفْعَالٌ، أَفْعِلَةٌ، فِعْلَةٌ؛ وَمَا سِوَاهَا جُمُوعُ كَثْرَةٍ.'
    explication: «أَرْغِفَةٌ» جَمْعُ قِلَّةٍ عَلَى وَزْنِ «أَفْعِلَةٌ».
  - id: qilla-6
    difficulte: 2
    enonce: مَا نَوْعُ الجَمْعِ «رِجَالٌ»؟ (جَمْعُ قِلَّةٍ / جَمْعُ كَثْرَةٍ)
    reponses:
    - جَمْعُ كَثْرَةٍ
    erreurs:
