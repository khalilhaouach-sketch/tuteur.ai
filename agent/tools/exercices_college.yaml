    indice: جَوَابُ القَسَمِ المَاضِي المُثْبَتُ يُؤَكَّدُ بِـ«لَقَدْ».
    explication: 'نَقُولُ: تَاللَّهِ لَقَدْ نَجَحَ المُجْتَهِدُ.'
  - id: qasam-8
