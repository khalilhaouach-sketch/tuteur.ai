    indice: بَعْدَ الضَّادِ تُبْدَلُ التَّاءُ طَاءً.
    explication: 'نَقُولُ: اضْطَرَّ.'
  - id: ibdal-10
    difficulte: 3
    enonce: مَا الفَرْقُ بَيْنَ الإِعْلَالِ وَالإِبْدَالِ؟ (الإِعْلَالُ فِي حُرُوفِ العِلَّةِ وَالإِبْدَالُ فِي الحُرُوفِ الصَّحِيحَةِ غَالِبًا / لَا فَرْقَ / الإِبْدَالُ فِي حُرُوفِ العِلَّةِ فَقَطْ)
    reponses:
