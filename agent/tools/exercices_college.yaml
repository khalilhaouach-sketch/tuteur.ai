    enonce: مِنْ كَمْ إِلَى كَمْ يَدُلُّ جَمْعُ القِلَّةِ؟ (مِنْ ثَلَاثَةٍ إِلَى عَشَرَةٍ / مِنْ عَشَرَةٍ فَمَا فَوْقُ / مِنْ وَاحِدٍ إِلَى اثْنَيْنِ)
