    enonce: 'مَا الإِعْلَالُ فِي «يَدْعُو» (أَصْلُهُ: يَدْعُوُ)؟ (تَسْكِينُ الوَاوِ / حَذْفُ الوَاوِ / قَلْبُ الوَاوِ يَاءً)'
