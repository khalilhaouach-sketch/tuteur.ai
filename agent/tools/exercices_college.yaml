      إِعْلَالٌ بِالتَّسْكِينِ: خلط بين أنواع الإعلال
    indice: الإِعْلَالُ تَغْيِيرٌ يُصِيبُ حُرُوفَ العِلَّةِ (ا، و، ي) بِالقَلْبِ أَوِ الحَذْفِ أَوِ التَّسْكِينِ، لِلتَّخْفِيفِ.
    explication: 'حُذِفَتِ الوَاوُ لِالْتِقَاءِ السَّاكِنَيْنِ: إِعْلَالٌ بِالحَذْفِ.'
