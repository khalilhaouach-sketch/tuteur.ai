    indice: 'جَمْعُ القِلَّةِ (مِنْ 3 إِلَى 10) أَوْزَانُهُ: أَفْعُلٌ، أَفْعَالٌ، أَفْعِلَةٌ، فِعْلَةٌ؛ وَمَا سِوَاهَا جُمُوعُ كَثْرَةٍ.'
    explication: جَمْعُ القِلَّةِ يَدُلُّ عَلَى مَا بَيْنَ الثَّلَاثَةِ وَالعَشَرَةِ.
  - id: qilla-4
    difficulte: 2
    enonce: مَا نَوْعُ الجَمْعِ «أَنْهُرٌ»؟ (جَمْعُ قِلَّةٍ / جَمْعُ كَثْرَةٍ)
    reponses:
