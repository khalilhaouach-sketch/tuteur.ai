      سَمَاوِيٌّ: خطأ في النسبة إلى الممدود
      سَمَائِيٌّ: خطأ في النسبة إلى الممدود
    indice: الهَمْزَةُ المُنْقَلِبَةُ عَنْ أَصْلٍ يَجُوزُ فِيهَا الوَجْهَانِ.
    explication: 'يَجُوزُ: سَمَاوِيٌّ وَسَمَائِيٌّ، لِأَنَّ هَمْزَتَهَا مُنْقَلِبَةٌ عَنْ وَاوٍ.'
  - id: nisba-10
    difficulte: 3
    enonce: مَا النِّسْبَةُ إِلَى «مَدِينَةٌ» (المَدِينَةِ المُنَوَّرَةِ)؟ (مَدَنِيٌّ / مَدِينِيٌّ / مُدُنِيٌّ)
    reponses:
    - مَدَنِيٌّ
    erreurs:
      مَدِينِيٌّ: خطأ في النسبة إلى فعيلة
      مُدُنِيٌّ: خطأ في النسبة إلى فعيلة
    indice: «فَعِيلَةٌ» يُنْسَبُ إِلَيْهَا عَلَى «فَعَلِيٌّ».
    explication: 'النِّسْبَةُ إِلَى «مَدِينَةٌ»: مَدَنِيٌّ (حَذْفُ التَّاءِ وَاليَاءِ وَفَتْحُ العَيْنِ).'
  - id: nisba-11
    difficulte: 3
    tolerer_hamza: false
    enonce: مَا النِّسْبَةُ إِلَى «أَبٌ»؟ (أَبَوِيٌّ / أَبِّيٌّ / أَبِيٌّ)
    reponses:
    - أَبَوِيٌّ
    erreurs:
      أَبِّيٌّ: خطأ في النسبة إلى المحذوف اللام
      أَبِيٌّ: خطأ في النسبة إلى المحذوف اللام
    indice: 'تُرَدُّ اللَّامُ المَحْذُوفَةُ: أَبَوَانِ.'
    explication: 'النِّسْبَةُ إِلَى «أَبٌ»: أَبَوِيٌّ.'
  - id: nisba-12
    difficulte: 3
    enonce: مَاذَا يَحْدُثُ لِلتَّاءِ المَرْبُوطَةِ عِنْدَ النِّسْبَةِ؟ (تُحْذَفُ / تَبْقَى / تُقْلَبُ هَاءً)
    reponses:
    - تُحْذَفُ
    erreurs:
      تَبْقَى: خطأ في النسبة إلى المختوم بالتاء
      تُقْلَبُ هَاءً: خطأ في النسبة إلى المختوم بالتاء
    indice: 'قَارِنْ: مَكَّةُ ← مَكِّيٌّ.'
    explication: تُحْذَفُ التَّاءُ المَرْبُوطَةُ عِنْدَ النِّسْبَةِ.
  - id: nisba-13
