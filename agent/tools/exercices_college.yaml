    indice: نُقِلَتْ ضَمَّةُ الوَاوِ إِلَى القَافِ السَّاكِنَةِ قَبْلَهَا.
    explication: 'نُقِلَتْ حَرَكَةُ الوَاوِ إِلَى مَا قَبْلَهَا فَسَكَنَتْ: إِعْلَالٌ بِالنَّقْلِ (التَّسْكِينِ).'
  - id: ilal-6
