# Banque d'exercices du collège (2AC et 3AC) — à relire par le professeur.
# Liste des leçons proposée sans le programme officiel sous les yeux : à caler sur les manuels.
# 13 exercices à choix (boutons) par leçon. Même format que exercices_1ac.yaml.

niveau: P2
notions:
- notion: المفعول معه
  exercices:
  - id: maah-1
    difficulte: 1
    enonce: 'مَا المَفْعُولُ مَعَهُ فِي: سِرْتُ وَالنَّهْرَ؟ (سِرْتُ / النَّهْرَ / الوَاوُ)'
    reponses:
    - النَّهْرَ
    erreurs:
      سِرْتُ: خلط بين المفعول معه وغيره
      الوَاوُ: خلط بين المفعول معه وغيره
    indice: المَفْعُولُ مَعَهُ اسْمٌ مَنْصُوبٌ يَأْتِي بَعْدَ «وَاوِ المَعِيَّةِ» (بِمَعْنَى «مَعَ»).
    explication: '«النَّهْرَ» مَفْعُولٌ مَعَهُ مَنْصُوبٌ: سِرْتُ مَعَ النَّهْرِ.'
  - id: maah-2
    difficulte: 1
    enonce: 'مَا المَفْعُولُ مَعَهُ فِي: اسْتَيْقَظْتُ وَطُلُوعَ الشَّمْسِ؟ (طُلُوعَ / الشَّمْسِ / اسْتَيْقَظْتُ)'
    reponses:
    - طُلُوعَ
    erreurs:
      الشَّمْسِ: خلط بين المفعول معه وغيره
      اسْتَيْقَظْتُ: خلط بين المفعول معه وغيره
    indice: المَفْعُولُ مَعَهُ اسْمٌ مَنْصُوبٌ يَأْتِي بَعْدَ «وَاوِ المَعِيَّةِ» (بِمَعْنَى «مَعَ»).
    explication: '«طُلُوعَ» مَفْعُولٌ مَعَهُ: اسْتَيْقَظْتُ مَعَ طُلُوعِ الشَّمْسِ.'
  - id: maah-3
    difficulte: 1
    enonce: مَا حُكْمُ المَفْعُولِ مَعَهُ؟ (مَنْصُوبٌ / مَرْفُوعٌ / مَجْرُورٌ)
    reponses:
    - مَنْصُوبٌ
    erreurs:
      مَرْفُوعٌ: خطأ في حكم المفعول معه
      مَجْرُورٌ: خطأ في حكم المفعول معه
    indice: المَفْعُولُ مَعَهُ اسْمٌ مَنْصُوبٌ يَأْتِي بَعْدَ «وَاوِ المَعِيَّةِ» (بِمَعْنَى «مَعَ»).
    explication: المَفْعُولُ مَعَهُ مَنْصُوبٌ دَائِمًا.
  - id: maah-4
    difficulte: 1
    enonce: 'مَا مَعْنَى الوَاوِ فِي: مَشَيْتُ وَالشَّاطِئَ؟ (مَعَ / ثُمَّ / أَوْ)'
    reponses:
    - مَعَ
    erreurs:
      ثُمَّ: خلط بين واو المعية وواو العطف
      أَوْ: خلط بين واو المعية وواو العطف
    indice: هَلْ يَمْشِي الشَّاطِئُ؟
    explication: 'الوَاوُ هُنَا لِلْمَعِيَّةِ بِمَعْنَى «مَعَ»: مَشَيْتُ مَعَ الشَّاطِئِ.'
  - id: maah-5
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: سَافَرْتُ وَ... (اللَّيْلُ / اللَّيْلَ / اللَّيْلِ)'
    reponses:
    - اللَّيْلَ
    erreurs:
      اللَّيْلُ: خطأ في إعراب المفعول معه
      اللَّيْلِ: خطأ في إعراب المفعول معه
    indice: المَفْعُولُ مَعَهُ اسْمٌ مَنْصُوبٌ يَأْتِي بَعْدَ «وَاوِ المَعِيَّةِ» (بِمَعْنَى «مَعَ»).
    explication: 'نَقُولُ: سَافَرْتُ وَاللَّيْلَ؛ «اللَّيْلَ» مَفْعُولٌ مَعَهُ مَنْصُوبٌ.'
  - id: maah-6
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: ذَاكَرْتُ وَ... الفَجْرِ. (ضَوْءُ / ضَوْءَ / ضَوْءِ)'
    reponses:
    - ضَوْءَ
    erreurs:
      ضَوْءُ: خطأ في إعراب المفعول معه
      ضَوْءِ: خطأ في إعراب المفعول معه
    indice: المَفْعُولُ مَعَهُ اسْمٌ مَنْصُوبٌ يَأْتِي بَعْدَ «وَاوِ المَعِيَّةِ» (بِمَعْنَى «مَعَ»).
    explication: 'نَقُولُ: ذَاكَرْتُ وَضَوْءَ الفَجْرِ.'
  - id: maah-7
    difficulte: 2
    enonce: فِي أَيِّ جُمْلَةٍ مَفْعُولٌ مَعَهُ؟ (جَاءَ أَحْمَدُ وَخَالِدٌ / جَلَسْتُ وَالشَّجَرَةَ / أَكَلْتُ خُبْزًا وَجُبْنًا)
    reponses:
    - جَلَسْتُ وَالشَّجَرَةَ
    erreurs:
      جَاءَ أَحْمَدُ وَخَالِدٌ: خلط بين واو المعية وواو العطف
      أَكَلْتُ خُبْزًا وَجُبْنًا: خلط بين واو المعية وواو العطف
    indice: هَلْ يُمْكِنُ أَنْ يَشْتَرِكَ الاِسْمُ فِي الفِعْلِ؟
    explication: '«الشَّجَرَةَ» مَفْعُولٌ مَعَهُ: الشَّجَرَةُ لَا تَجْلِسُ، فَالوَاوُ بِمَعْنَى «مَعَ».'
  - id: maah-8
    difficulte: 2
    enonce: هَلِ الوَاوُ فِي «جَاءَ الأَبُ وَالأُمُّ» لِلْعَطْفِ أَمْ لِلْمَعِيَّةِ؟ (لِلْعَطْفِ / لِلْمَعِيَّةِ)
    reponses:
    - لِلْعَطْفِ
    erreurs:
      لِلْمَعِيَّةِ: خلط بين واو المعية وواو العطف
    indice: هَلْ جَاءَتِ الأُمُّ أَيْضًا؟ وَهَلْ «الأُمُّ» مَرْفُوعٌ؟
    explication: 'الوَاوُ لِلْعَطْفِ: الأُمُّ جَاءَتْ أَيْضًا، وَ«الأُمُّ» مَرْفُوعٌ مِثْلُ «الأَبُ».'
  - id: maah-9
    difficulte: 2
    enonce: 'مَا المَفْعُولُ مَعَهُ فِي: انْتَظَرْتُكَ وَغُرُوبَ الشَّمْسِ؟ (الكَافُ / غُرُوبَ / الشَّمْسِ)'
    reponses:
    - غُرُوبَ
    erreurs:
      الكَافُ: خلط بين المفعول معه وغيره
      الشَّمْسِ: خلط بين المفعول معه وغيره
    indice: المَفْعُولُ مَعَهُ اسْمٌ مَنْصُوبٌ يَأْتِي بَعْدَ «وَاوِ المَعِيَّةِ» (بِمَعْنَى «مَعَ»).
    explication: «غُرُوبَ» مَفْعُولٌ مَعَهُ مَنْصُوبٌ.
  - id: maah-10
    difficulte: 3
    enonce: مَا شَرْطُ المَفْعُولِ مَعَهُ؟ (أَنْ تَسْبِقَهُ جُمْلَةٌ وَوَاوٌ بِمَعْنَى «مَعَ» / أَنْ يَكُونَ مَصْدَرًا / أَنْ يَكُونَ نَكِرَةً)
    reponses:
    - أَنْ تَسْبِقَهُ جُمْلَةٌ وَوَاوٌ بِمَعْنَى «مَعَ»
    erreurs:
      أَنْ يَكُونَ مَصْدَرًا: خطأ في شروط المفعول معه
      أَنْ يَكُونَ نَكِرَةً: خطأ في شروط المفعول معه
    indice: 'مِثَالٌ: سِرْتُ وَالنَّهْرَ.'
    explication: المَفْعُولُ مَعَهُ اسْمٌ تَسْبِقُهُ جُمْلَةٌ وَوَاوٌ بِمَعْنَى «مَعَ».
  - id: maah-11
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: تَرَكْتُ الطِّفْلَ وَ... (أُمُّهُ / أُمَّهُ / أُمِّهِ)'
    reponses:
    - أُمَّهُ
    erreurs:
      أُمُّهُ: خطأ في إعراب المفعول معه
      أُمِّهِ: خطأ في إعراب المفعول معه
    indice: تَرَكْتُ الطِّفْلَ مَعَ أُمِّهِ.
    explication: 'نَقُولُ: تَرَكْتُ الطِّفْلَ وَأُمَّهُ؛ مَفْعُولٌ مَعَهُ مَنْصُوبٌ.'
  - id: maah-12
    difficulte: 3
    enonce: مَا الفَرْقُ بَيْنَ «سَافَرَ أَحْمَدُ وَأَخُوهُ» وَ«سَافَرَ أَحْمَدُ وَالقِطَارَ»؟ (الأُولَى عَطْفٌ وَالثَّانِيَةُ مَعِيَّةٌ / الأُولَى مَعِيَّةٌ وَالثَّانِيَةُ عَطْفٌ / كِلْتَاهُمَا عَطْفٌ)
    reponses:
    - الأُولَى عَطْفٌ وَالثَّانِيَةُ مَعِيَّةٌ
    erreurs:
      الأُولَى مَعِيَّةٌ وَالثَّانِيَةُ عَطْفٌ: خلط بين واو المعية وواو العطف
      كِلْتَاهُمَا عَطْفٌ: خلط بين واو المعية وواو العطف
    indice: هَلْ يُسَافِرُ القِطَارُ كَمَا يُسَافِرُ الأَخُ؟
    explication: فِي الأُولَى عَطْفٌ (الأَخُ سَافَرَ أَيْضًا، مَرْفُوعٌ)، وَفِي الثَّانِيَةِ مَعِيَّةٌ («القِطَارَ» مَنْصُوبٌ).
  - id: maah-13
    difficulte: 3
    enonce: 'مَا إِعْرَابُ «وَالمِصْبَاحَ» فِي: قَرَأْتُ وَالمِصْبَاحَ؟ (الوَاوُ لِلْمَعِيَّةِ وَ«المِصْبَاحَ» مَفْعُولٌ مَعَهُ / الوَاوُ لِلْعَطْفِ وَ«المِصْبَاحَ» مَعْطُوفٌ / «المِصْبَاحَ» مَفْعُولٌ بِهِ)'
    reponses:
    - الوَاوُ لِلْمَعِيَّةِ وَ«المِصْبَاحَ» مَفْعُولٌ مَعَهُ
    erreurs:
      الوَاوُ لِلْعَطْفِ وَ«المِصْبَاحَ» مَعْطُوفٌ: خطأ في إعراب المفعول معه
      «المِصْبَاحَ» مَفْعُولٌ بِهِ: خطأ في إعراب المفعول معه
    indice: هَلِ المِصْبَاحُ يَقْرَأُ؟
    explication: الوَاوُ لِلْمَعِيَّةِ، وَ«المِصْبَاحَ» مَفْعُولٌ مَعَهُ مَنْصُوبٌ.
- notion: الممنوع من الصرف
  exercices:
  - id: mamnu-1
    difficulte: 1
    enonce: هَلْ «أَحْمَدُ» مَمْنُوعٌ مِنَ الصَّرْفِ؟ (مَمْنُوعٌ مِنَ الصَّرْفِ / مَصْرُوفٌ)
    reponses:
    - مَمْنُوعٌ مِنَ الصَّرْفِ
    erreurs:
      مَصْرُوفٌ: خلط بين الممنوع من الصرف والمصروف
    indice: عَلَمٌ عَلَى وَزْنِ «أَفْعَلُ».
    explication: '«أَحْمَدُ» مَمْنُوعٌ مِنَ الصَّرْفِ: عَلَمٌ عَلَى وَزْنِ الفِعْلِ.'
  - id: mamnu-2
    difficulte: 1
    enonce: هَلْ «مُحَمَّدٌ» مَمْنُوعٌ مِنَ الصَّرْفِ؟ (مَمْنُوعٌ مِنَ الصَّرْفِ / مَصْرُوفٌ)
    reponses:
    - مَصْرُوفٌ
    erreurs:
      مَمْنُوعٌ مِنَ الصَّرْفِ: خلط بين الممنوع من الصرف والمصروف
    indice: هَلْ يُنَوَّنُ؟
    explication: '«مُحَمَّدٌ» مَصْرُوفٌ: يُنَوَّنُ.'
  - id: mamnu-3
    difficulte: 1
    enonce: هَلْ «فَاطِمَةُ» مَمْنُوعٌ مِنَ الصَّرْفِ؟ (مَمْنُوعٌ مِنَ الصَّرْفِ / مَصْرُوفٌ)
    reponses:
    - مَمْنُوعٌ مِنَ الصَّرْفِ
    erreurs:
      مَصْرُوفٌ: خلط بين الممنوع من الصرف والمصروف
    indice: عَلَمٌ مُؤَنَّثٌ بِالتَّاءِ.
    explication: '«فَاطِمَةُ» مَمْنُوعَةٌ مِنَ الصَّرْفِ: عَلَمٌ مُؤَنَّثٌ.'
  - id: mamnu-4
    difficulte: 1
    enonce: 'اِخْتَرِ الصَّحِيحَ: سَلَّمْتُ عَلَى ... (يُوسُفَ / يُوسُفٍ / يُوسُفِ)'
    reponses:
    - يُوسُفَ
    erreurs:
      يُوسُفٍ: خطأ في جر الممنوع من الصرف
      يُوسُفِ: خطأ في جر الممنوع من الصرف
    indice: المَمْنُوعُ مِنَ الصَّرْفِ لَا يُنَوَّنُ، وَيُجَرُّ بِالفَتْحَةِ بَدَلَ الكَسْرَةِ (إِذَا لَمْ يَكُنْ فِيهِ «ال» وَلَمْ يُضَفْ).
    explication: 'نَقُولُ: سَلَّمْتُ عَلَى يُوسُفَ؛ يُجَرُّ بِالفَتْحَةِ.'
  - id: mamnu-5
    difficulte: 2
    enonce: هَلْ «مَسَاجِدُ» مَمْنُوعٌ مِنَ الصَّرْفِ؟ (مَمْنُوعٌ مِنَ الصَّرْفِ / مَصْرُوفٌ)
    reponses:
    - مَمْنُوعٌ مِنَ الصَّرْفِ
    erreurs:
      مَصْرُوفٌ: خلط بين الممنوع من الصرف والمصروف
    indice: جَمْعٌ عَلَى صِيغَةِ «مَفَاعِلُ» (صِيغَةِ مُنْتَهَى الجُمُوعِ).
    explication: '«مَسَاجِدُ» مَمْنُوعٌ مِنَ الصَّرْفِ: صِيغَةُ مُنْتَهَى الجُمُوعِ.'
  - id: mamnu-6
    difficulte: 2
    enonce: هَلْ «صَحْرَاءُ» مَمْنُوعٌ مِنَ الصَّرْفِ؟ (مَمْنُوعٌ مِنَ الصَّرْفِ / مَصْرُوفٌ)
    reponses:
    - مَمْنُوعٌ مِنَ الصَّرْفِ
    erreurs:
      مَصْرُوفٌ: خلط بين الممنوع من الصرف والمصروف
    indice: فِي آخِرِهِ أَلِفُ تَأْنِيثٍ مَمْدُودَةٌ.
    explication: '«صَحْرَاءُ» مَمْنُوعٌ مِنَ الصَّرْفِ: آخِرُهُ أَلِفُ تَأْنِيثٍ مَمْدُودَةٌ.'
  - id: mamnu-7
    difficulte: 2
    enonce: هَلْ «أَحْمَرُ» مَمْنُوعٌ مِنَ الصَّرْفِ؟ (مَمْنُوعٌ مِنَ الصَّرْفِ / مَصْرُوفٌ)
    reponses:
    - مَمْنُوعٌ مِنَ الصَّرْفِ
    erreurs:
      مَصْرُوفٌ: خلط بين الممنوع من الصرف والمصروف
    indice: صِفَةٌ عَلَى وَزْنِ «أَفْعَلُ».
    explication: '«أَحْمَرُ» مَمْنُوعٌ مِنَ الصَّرْفِ: صِفَةٌ عَلَى وَزْنِ «أَفْعَلُ».'
  - id: mamnu-8
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: صَلَّيْتُ فِي ... كَثِيرَةٍ. (مَسَاجِدَ / مَسَاجِدٍ / مَسَاجِدِ)'
    reponses:
    - مَسَاجِدَ
    erreurs:
      مَسَاجِدٍ: خطأ في جر الممنوع من الصرف
      مَسَاجِدِ: خطأ في جر الممنوع من الصرف
    indice: المَمْنُوعُ مِنَ الصَّرْفِ لَا يُنَوَّنُ، وَيُجَرُّ بِالفَتْحَةِ بَدَلَ الكَسْرَةِ (إِذَا لَمْ يَكُنْ فِيهِ «ال» وَلَمْ يُضَفْ).
    explication: 'نَقُولُ: صَلَّيْتُ فِي مَسَاجِدَ كَثِيرَةٍ.'
  - id: mamnu-9
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: صَلَّيْتُ فِي ... الكَبِيرَةِ. (المَسَاجِدَ / المَسَاجِدِ / المَسَاجِدٍ)'
    reponses:
    - المَسَاجِدِ
    erreurs:
      المَسَاجِدَ: خطأ في جر الممنوع من الصرف
      المَسَاجِدٍ: خطأ في جر الممنوع من الصرف
    indice: إِذَا دَخَلَتْ عَلَيْهِ «ال» جُرَّ بِالكَسْرَةِ.
    explication: 'نَقُولُ: فِي المَسَاجِدِ؛ مَعَ «ال» يُجَرُّ بِالكَسْرَةِ.'
  - id: mamnu-10
    difficulte: 3
    enonce: هَلْ «عَطْشَانُ» مَمْنُوعٌ مِنَ الصَّرْفِ؟ (مَمْنُوعٌ مِنَ الصَّرْفِ / مَصْرُوفٌ)
    reponses:
    - مَمْنُوعٌ مِنَ الصَّرْفِ
    erreurs:
      مَصْرُوفٌ: خلط بين الممنوع من الصرف والمصروف
    indice: صِفَةٌ عَلَى وَزْنِ «فَعْلَانُ» (مُؤَنَّثُهَا عَطْشَى).
    explication: '«عَطْشَانُ» مَمْنُوعٌ مِنَ الصَّرْفِ: صِفَةٌ عَلَى وَزْنِ «فَعْلَانُ».'
  - id: mamnu-11
    difficulte: 3
    enonce: هَلْ «مَكَّةُ» مَمْنُوعٌ مِنَ الصَّرْفِ؟ (مَمْنُوعٌ مِنَ الصَّرْفِ / مَصْرُوفٌ)
    reponses:
    - مَمْنُوعٌ مِنَ الصَّرْفِ
    erreurs:
      مَصْرُوفٌ: خلط بين الممنوع من الصرف والمصروف
    indice: عَلَمٌ مُؤَنَّثٌ (اسْمُ مَدِينَةٍ).
    explication: '«مَكَّةُ» مَمْنُوعَةٌ مِنَ الصَّرْفِ: عَلَمٌ مُؤَنَّثٌ.'
  - id: mamnu-12
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: مَرَرْتُ بِرَجُلٍ ... (أَحْمَرَ / أَحْمَرٍ / أَحْمَرِ)'
    reponses:
    - أَحْمَرَ
    erreurs:
      أَحْمَرٍ: خطأ في جر الممنوع من الصرف
      أَحْمَرِ: خطأ في جر الممنوع من الصرف
    indice: المَمْنُوعُ مِنَ الصَّرْفِ لَا يُنَوَّنُ، وَيُجَرُّ بِالفَتْحَةِ بَدَلَ الكَسْرَةِ (إِذَا لَمْ يَكُنْ فِيهِ «ال» وَلَمْ يُضَفْ).
    explication: 'نَقُولُ: مَرَرْتُ بِرَجُلٍ أَحْمَرَ؛ نَعْتٌ مَجْرُورٌ بِالفَتْحَةِ لِأَنَّهُ مَمْنُوعٌ مِنَ الصَّرْفِ.'
  - id: mamnu-13
    difficulte: 3
    enonce: 'مَا عَلَامَةُ جَرِّ «إِبْرَاهِيمَ» فِي: صَلَّى اللَّهُ عَلَى إِبْرَاهِيمَ؟ (الكَسْرَةُ / الفَتْحَةُ نِيَابَةً عَنِ الكَسْرَةِ / اليَاءُ)'
    reponses:
    - الفَتْحَةُ نِيَابَةً عَنِ الكَسْرَةِ
    erreurs:
      الكَسْرَةُ: خطأ في جر الممنوع من الصرف
      اليَاءُ: خطأ في جر الممنوع من الصرف
    indice: «إِبْرَاهِيمُ» عَلَمٌ أَعْجَمِيٌّ.
    explication: '«إِبْرَاهِيمَ» مَجْرُورٌ بِالفَتْحَةِ نِيَابَةً عَنِ الكَسْرَةِ: عَلَمٌ أَعْجَمِيٌّ مَمْنُوعٌ مِنَ الصَّرْفِ.'
- notion: الصفة المشبهة
  exercices:
  - id: mushabbaha-1
    difficulte: 1
    enonce: مَا نَوْعُ «جَمِيلٌ»؟ (صِفَةٌ مُشَبَّهَةٌ / اسْمُ فَاعِلٍ / صِيغَةُ مُبَالَغَةٍ)
    reponses:
    - صِفَةٌ مُشَبَّهَةٌ
    erreurs:
      اسْمُ فَاعِلٍ: خلط بين الصفة المشبهة واسم الفاعل وصيغة المبالغة
      صِيغَةُ مُبَالَغَةٍ: خلط بين الصفة المشبهة واسم الفاعل وصيغة المبالغة
    indice: الصِّفَةُ المُشَبَّهَةُ تَدُلُّ عَلَى صِفَةٍ ثَابِتَةٍ (جَمِيلٌ، أَحْمَرُ، عَطْشَانُ)، وَاسْمُ الفَاعِلِ عَلَى حَدَثٍ (كَاتِبٌ)، وَصِيغَةُ المُبَالَغَةِ عَلَى كَثْرَةِ الحَدَثِ (كَذَّابٌ).
    explication: '«جَمِيلٌ» صِفَةٌ مُشَبَّهَةٌ: صِفَةٌ ثَابِتَةٌ.'
  - id: mushabbaha-2
    difficulte: 1
    enonce: مَا نَوْعُ «كَاتِبٌ»؟ (صِفَةٌ مُشَبَّهَةٌ / اسْمُ فَاعِلٍ / صِيغَةُ مُبَالَغَةٍ)
    reponses:
    - اسْمُ فَاعِلٍ
    erreurs:
      صِفَةٌ مُشَبَّهَةٌ: خلط بين الصفة المشبهة واسم الفاعل وصيغة المبالغة
      صِيغَةُ مُبَالَغَةٍ: خلط بين الصفة المشبهة واسم الفاعل وصيغة المبالغة
    indice: الصِّفَةُ المُشَبَّهَةُ تَدُلُّ عَلَى صِفَةٍ ثَابِتَةٍ (جَمِيلٌ، أَحْمَرُ، عَطْشَانُ)، وَاسْمُ الفَاعِلِ عَلَى حَدَثٍ (كَاتِبٌ)، وَصِيغَةُ المُبَالَغَةِ عَلَى كَثْرَةِ الحَدَثِ (كَذَّابٌ).
    explication: '«كَاتِبٌ» اسْمُ فَاعِلٍ: يَدُلُّ عَلَى مَنْ قَامَ بِالكِتَابَةِ.'
  - id: mushabbaha-3
    difficulte: 1
    enonce: مَا نَوْعُ «أَبْيَضُ»؟ (صِفَةٌ مُشَبَّهَةٌ / اسْمُ فَاعِلٍ / صِيغَةُ مُبَالَغَةٍ)
    reponses:
    - صِفَةٌ مُشَبَّهَةٌ
    erreurs:
      اسْمُ فَاعِلٍ: خلط بين الصفة المشبهة واسم الفاعل وصيغة المبالغة
      صِيغَةُ مُبَالَغَةٍ: خلط بين الصفة المشبهة واسم الفاعل وصيغة المبالغة
    indice: الأَلْوَانُ صِفَاتٌ ثَابِتَةٌ عَلَى وَزْنِ «أَفْعَلُ».
    explication: «أَبْيَضُ» صِفَةٌ مُشَبَّهَةٌ عَلَى وَزْنِ «أَفْعَلُ».
  - id: mushabbaha-4
    difficulte: 1
    enonce: 'اِخْتَرِ الصِّفَةَ المُشَبَّهَةَ: (شُجَاعٌ / مَكْتُوبٌ / قَارِئٌ)'
    reponses:
    - شُجَاعٌ
    erreurs:
      مَكْتُوبٌ: خلط بين الصفة المشبهة وغيرها
      قَارِئٌ: خلط بين الصفة المشبهة وغيرها
    indice: الصِّفَةُ المُشَبَّهَةُ تَدُلُّ عَلَى صِفَةٍ ثَابِتَةٍ (جَمِيلٌ، أَحْمَرُ، عَطْشَانُ)، وَاسْمُ الفَاعِلِ عَلَى حَدَثٍ (كَاتِبٌ)، وَصِيغَةُ المُبَالَغَةِ عَلَى كَثْرَةِ الحَدَثِ (كَذَّابٌ).
    explication: «شُجَاعٌ» صِفَةٌ مُشَبَّهَةٌ عَلَى وَزْنِ «فُعَالٌ».
  - id: mushabbaha-5
    difficulte: 2
    enonce: مَا نَوْعُ «عَطْشَانُ»؟ (صِفَةٌ مُشَبَّهَةٌ / اسْمُ فَاعِلٍ / صِيغَةُ مُبَالَغَةٍ)
    reponses:
    - صِفَةٌ مُشَبَّهَةٌ
    erreurs:
      اسْمُ فَاعِلٍ: خلط بين الصفة المشبهة واسم الفاعل وصيغة المبالغة
      صِيغَةُ مُبَالَغَةٍ: خلط بين الصفة المشبهة واسم الفاعل وصيغة المبالغة
    indice: عَلَى وَزْنِ «فَعْلَانُ».
    explication: «عَطْشَانُ» صِفَةٌ مُشَبَّهَةٌ عَلَى وَزْنِ «فَعْلَانُ».
  - id: mushabbaha-6
    difficulte: 2
    voyelles_obligatoires: true
    enonce: عَلَى أَيِّ وَزْنٍ جَاءَتِ الصِّفَةُ المُشَبَّهَةُ «كَرِيمٌ»؟ (فَعِيلٌ / فَاعِلٌ / فَعَّالٌ)
    reponses:
    - فَعِيلٌ
    erreurs:
      فَاعِلٌ: خطأ في أوزان الصفة المشبهة
      فَعَّالٌ: خطأ في أوزان الصفة المشبهة
    indice: 'قَابِلْ: كَرِيمٌ / فَعِيلٌ.'
    explication: «كَرِيمٌ» عَلَى وَزْنِ «فَعِيلٌ».
  - id: mushabbaha-7
    difficulte: 2
    voyelles_obligatoires: true
    enonce: عَلَى أَيِّ وَزْنٍ جَاءَتِ الصِّفَةُ المُشَبَّهَةُ «صَعْبٌ»؟ (فَعْلٌ / فَعِلٌ / فَعِيلٌ)
    reponses:
    - فَعْلٌ
    erreurs:
      فَعِلٌ: خطأ في أوزان الصفة المشبهة
      فَعِيلٌ: خطأ في أوزان الصفة المشبهة
    indice: 'قَابِلْ: صَعْبٌ / فَعْلٌ.'
    explication: «صَعْبٌ» عَلَى وَزْنِ «فَعْلٌ».
  - id: mushabbaha-8
    difficulte: 2
    voyelles_obligatoires: true
    enonce: مَا الصِّفَةُ المُشَبَّهَةُ مِنْ «فَرِحَ»؟ (فَارِحٌ / فَرِحٌ / مَفْرُوحٌ)
    reponses:
    - فَرِحٌ
    erreurs:
      فَارِحٌ: خطأ في صياغة الصفة المشبهة
      مَفْرُوحٌ: خطأ في صياغة الصفة المشبهة
    indice: عَلَى وَزْنِ «فَعِلٌ».
    explication: 'الصِّفَةُ المُشَبَّهَةُ مِنْ «فَرِحَ»: فَرِحٌ.'
  - id: mushabbaha-9
    difficulte: 2
    enonce: مَا مُؤَنَّثُ «أَخْضَرُ»؟ (خَضْرَاءُ / أَخْضَرَةٌ / خُضْرَى)
    reponses:
    - خَضْرَاءُ
    erreurs:
      أَخْضَرَةٌ: خطأ في مؤنث الصفة المشبهة
      خُضْرَى: خطأ في مؤنث الصفة المشبهة
    indice: مُؤَنَّثُ «أَفْعَلُ» لِلْأَلْوَانِ عَلَى وَزْنِ «فَعْلَاءُ».
    explication: 'مُؤَنَّثُ «أَخْضَرُ»: خَضْرَاءُ.'
  - id: mushabbaha-10
    difficulte: 3
    enonce: مَا الفَرْقُ بَيْنَ «ذَاهِبٌ» وَ«حَسَنٌ»؟ («ذَاهِبٌ» حَدَثٌ مُتَغَيِّرٌ وَ«حَسَنٌ» صِفَةٌ ثَابِتَةٌ / كِلَاهُمَا صِفَةٌ ثَابِتَةٌ / كِلَاهُمَا حَدَثٌ مُتَغَيِّرٌ)
    reponses:
    - «ذَاهِبٌ» حَدَثٌ مُتَغَيِّرٌ وَ«حَسَنٌ» صِفَةٌ ثَابِتَةٌ
    erreurs:
      كِلَاهُمَا صِفَةٌ ثَابِتَةٌ: خلط بين الصفة المشبهة واسم الفاعل
      كِلَاهُمَا حَدَثٌ مُتَغَيِّرٌ: خلط بين الصفة المشبهة واسم الفاعل
    indice: الصِّفَةُ المُشَبَّهَةُ تَدُلُّ عَلَى صِفَةٍ ثَابِتَةٍ (جَمِيلٌ، أَحْمَرُ، عَطْشَانُ)، وَاسْمُ الفَاعِلِ عَلَى حَدَثٍ (كَاتِبٌ)، وَصِيغَةُ المُبَالَغَةِ عَلَى كَثْرَةِ الحَدَثِ (كَذَّابٌ).
    explication: «ذَاهِبٌ» اسْمُ فَاعِلٍ (حَدَثٌ عَارِضٌ)، وَ«حَسَنٌ» صِفَةٌ مُشَبَّهَةٌ (صِفَةٌ ثَابِتَةٌ).
  - id: mushabbaha-11
    difficulte: 3
    enonce: مِنْ أَيِّ فِعْلٍ تُصَاغُ الصِّفَةُ المُشَبَّهَةُ غَالِبًا؟ (الفِعْلِ الثُّلَاثِيِّ اللَّازِمِ / الفِعْلِ المُتَعَدِّي / الفِعْلِ الرُّبَاعِيِّ)
    reponses:
    - الفِعْلِ الثُّلَاثِيِّ اللَّازِمِ
    erreurs:
      الفِعْلِ المُتَعَدِّي: خطأ في صياغة الصفة المشبهة
      الفِعْلِ الرُّبَاعِيِّ: خطأ في صياغة الصفة المشبهة
    indice: 'أَمْثِلَةٌ: كَرُمَ ← كَرِيمٌ، عَطِشَ ← عَطْشَانُ.'
    explication: تُصَاغُ الصِّفَةُ المُشَبَّهَةُ مِنَ الفِعْلِ الثُّلَاثِيِّ اللَّازِمِ غَالِبًا.
  - id: mushabbaha-12
    difficulte: 3
    enonce: مَا نَوْعُ «أَعْرَجُ»؟ (صِفَةٌ مُشَبَّهَةٌ / اسْمُ فَاعِلٍ / صِيغَةُ مُبَالَغَةٍ)
    reponses:
    - صِفَةٌ مُشَبَّهَةٌ
    erreurs:
      اسْمُ فَاعِلٍ: خلط بين الصفة المشبهة واسم الفاعل وصيغة المبالغة
      صِيغَةُ مُبَالَغَةٍ: خلط بين الصفة المشبهة واسم الفاعل وصيغة المبالغة
    indice: العُيُوبُ الخِلْقِيَّةُ عَلَى وَزْنِ «أَفْعَلُ».
    explication: «أَعْرَجُ» صِفَةٌ مُشَبَّهَةٌ عَلَى وَزْنِ «أَفْعَلُ».
  - id: mushabbaha-13
    difficulte: 3
    enonce: مَا نَوْعُ «طَاهِرٌ» فِي «الثَّوْبُ طَاهِرٌ»؟ (صِفَةٌ مُشَبَّهَةٌ / اسْمُ فَاعِلٍ / صِيغَةُ مُبَالَغَةٍ)
    reponses:
    - صِفَةٌ مُشَبَّهَةٌ
    erreurs:
      اسْمُ فَاعِلٍ: خلط بين الصفة المشبهة واسم الفاعل
      صِيغَةُ مُبَالَغَةٍ: خلط بين الصفة المشبهة واسم الفاعل
    indice: الطَّهَارَةُ هُنَا صِفَةٌ ثَابِتَةٌ، وَالفِعْلُ «طَهُرَ» لَازِمٌ.
    explication: '«طَاهِرٌ» هُنَا صِفَةٌ مُشَبَّهَةٌ عَلَى وَزْنِ اسْمِ الفَاعِلِ: تَدُلُّ عَلَى صِفَةٍ ثَابِتَةٍ.'
- notion: صيغ المبالغة
  exercices:
  - id: mubalagha-1
    difficulte: 1
    enonce: 'اِخْتَرْ صِيغَةَ المُبَالَغَةِ: (عَالِمٌ / عَلَّامٌ / مَعْلُومٌ)'
    reponses:
    - عَلَّامٌ
    erreurs:
      عَالِمٌ: خلط بين صيغة المبالغة واسم الفاعل
      مَعْلُومٌ: خلط بين صيغة المبالغة واسم الفاعل
    indice: 'صِيغَةُ المُبَالَغَةِ تَدُلُّ عَلَى الكَثْرَةِ: «فَعَّالٌ».'
    explication: «عَلَّامٌ» صِيغَةُ مُبَالَغَةٍ عَلَى وَزْنِ «فَعَّالٌ».
  - id: mubalagha-2
    difficulte: 1
    enonce: مَا صِيغَةُ المُبَالَغَةِ مِنْ «أَكَلَ» عَلَى وَزْنِ «فَعُولٌ»؟ (آكِلٌ / أَكُولٌ / مَأْكُولٌ)
    reponses:
    - أَكُولٌ
    erreurs:
      آكِلٌ: خطأ في صياغة صيغة المبالغة
      مَأْكُولٌ: خطأ في صياغة صيغة المبالغة
    indice: 'قَابِلْ: فَعُولٌ.'
    explication: 'صِيغَةُ المُبَالَغَةِ: أَكُولٌ (كَثِيرُ الأَكْلِ).'
  - id: mubalagha-3
    difficulte: 1
    enonce: مَاذَا تُفِيدُ صِيغَةُ المُبَالَغَةِ؟ (كَثْرَةَ الحَدَثِ / المَكَانَ / الآلَةَ)
    reponses:
    - كَثْرَةَ الحَدَثِ
    erreurs:
      المَكَانَ: خطأ في معنى صيغة المبالغة
      الآلَةَ: خطأ في معنى صيغة المبالغة
    indice: 'قَارِنْ: صَابِرٌ / صَبُورٌ.'
    explication: صِيغَةُ المُبَالَغَةِ تَدُلُّ عَلَى كَثْرَةِ الحَدَثِ.
  - id: mubalagha-4
    difficulte: 1
    enonce: مَا نَوْعُ «كَذَّابٌ»؟ (صِفَةٌ مُشَبَّهَةٌ / اسْمُ فَاعِلٍ / صِيغَةُ مُبَالَغَةٍ)
    reponses:
    - صِيغَةُ مُبَالَغَةٍ
    erreurs:
      صِفَةٌ مُشَبَّهَةٌ: خلط بين الصفة المشبهة واسم الفاعل وصيغة المبالغة
      اسْمُ فَاعِلٍ: خلط بين الصفة المشبهة واسم الفاعل وصيغة المبالغة
    indice: الصِّفَةُ المُشَبَّهَةُ تَدُلُّ عَلَى صِفَةٍ ثَابِتَةٍ (جَمِيلٌ، أَحْمَرُ، عَطْشَانُ)، وَاسْمُ الفَاعِلِ عَلَى حَدَثٍ (كَاتِبٌ)، وَصِيغَةُ المُبَالَغَةِ عَلَى كَثْرَةِ الحَدَثِ (كَذَّابٌ).
    explication: «كَذَّابٌ» صِيغَةُ مُبَالَغَةٍ عَلَى وَزْنِ «فَعَّالٌ».
  - id: mubalagha-5
    difficulte: 2
    voyelles_obligatoires: true
    enonce: عَلَى أَيِّ وَزْنٍ جَاءَتْ «مِقْدَامٌ»؟ (مِفْعَالٌ / فَعِيلٌ / فَعُولٌ)
    reponses:
    - مِفْعَالٌ
    erreurs:
      فَعِيلٌ: خطأ في أوزان صيغ المبالغة
      فَعُولٌ: خطأ في أوزان صيغ المبالغة
    indice: 'قَابِلِ الحُرُوفَ: مِـ قْ دَا مٌ.'
    explication: «مِقْدَامٌ» عَلَى وَزْنِ «مِفْعَالٌ».
  - id: mubalagha-6
    difficulte: 2
    voyelles_obligatoires: true
    enonce: عَلَى أَيِّ وَزْنٍ جَاءَتْ «سَمِيعٌ»؟ (فَعِيلٌ / فَعُولٌ / فَعِلٌ)
    reponses:
    - فَعِيلٌ
    erreurs:
      فَعُولٌ: خطأ في أوزان صيغ المبالغة
      فَعِلٌ: خطأ في أوزان صيغ المبالغة
    indice: 'قَابِلْ: سَمِيعٌ / فَعِيلٌ.'
    explication: «سَمِيعٌ» عَلَى وَزْنِ «فَعِيلٌ».
  - id: mubalagha-7
    difficulte: 2
    voyelles_obligatoires: true
    enonce: عَلَى أَيِّ وَزْنٍ جَاءَتْ «حَذِرٌ»؟ (فَعِلٌ / فَعِيلٌ / فَاعِلٌ)
    reponses:
    - فَعِلٌ
    erreurs:
      فَعِيلٌ: خطأ في أوزان صيغ المبالغة
      فَاعِلٌ: خطأ في أوزان صيغ المبالغة
    indice: 'قَابِلْ: حَذِرٌ / فَعِلٌ.'
    explication: «حَذِرٌ» عَلَى وَزْنِ «فَعِلٌ».
  - id: mubalagha-8
    difficulte: 2
    enonce: مَا صِيغَةُ المُبَالَغَةِ مِنْ «صَبَرَ» عَلَى وَزْنِ «فَعُولٌ»؟ (صَابِرٌ / صَبُورٌ / مَصْبُورٌ)
    reponses:
    - صَبُورٌ
    erreurs:
      صَابِرٌ: خطأ في صياغة صيغة المبالغة
      مَصْبُورٌ: خطأ في صياغة صيغة المبالغة
    indice: 'قَابِلْ: فَعُولٌ.'
    explication: 'صِيغَةُ المُبَالَغَةِ: صَبُورٌ.'
  - id: mubalagha-9
    difficulte: 2
    tolerer_hamza: false
    enonce: 'اِخْتَرِ الصَّحِيحَ: هُوَ ... كَثِيرُ الأَسْئِلَةِ. (سَائِلٌ / سَأَّالٌ / مَسْؤُولٌ)'
    reponses:
    - سَأَّالٌ
    erreurs:
      سَائِلٌ: خطأ في استعمال صيغة المبالغة
      مَسْؤُولٌ: خطأ في استعمال صيغة المبالغة
    indice: كَثِيرُ السُّؤَالِ.
    explication: 'نَقُولُ: هُوَ سَأَّالٌ؛ صِيغَةُ مُبَالَغَةٍ عَلَى «فَعَّالٌ».'
  - id: mubalagha-10
    difficulte: 3
    enonce: كَمْ وَزْنًا قِيَاسِيًّا لِصِيَغِ المُبَالَغَةِ؟ (خَمْسَةٌ / ثَلَاثَةٌ / سَبْعَةٌ)
    reponses:
    - خَمْسَةٌ
    erreurs:
      ثَلَاثَةٌ: خطأ في أوزان صيغ المبالغة
      سَبْعَةٌ: خطأ في أوزان صيغ المبالغة
    indice: فَعَّالٌ، مِفْعَالٌ، فَعُولٌ، فَعِيلٌ، فَعِلٌ.
    explication: 'أَوْزَانُهَا القِيَاسِيَّةُ خَمْسَةٌ: فَعَّالٌ، مِفْعَالٌ، فَعُولٌ، فَعِيلٌ، فَعِلٌ.'
  - id: mubalagha-11
    difficulte: 3
    enonce: مِنْ أَيِّ فِعْلٍ تُصَاغُ صِيَغُ المُبَالَغَةِ؟ (الثُّلَاثِيِّ المُتَصَرِّفِ غَالِبًا / الرُّبَاعِيِّ فَقَطْ / الجَامِدِ)
    reponses:
    - الثُّلَاثِيِّ المُتَصَرِّفِ غَالِبًا
    erreurs:
      الرُّبَاعِيِّ فَقَطْ: خطأ في صياغة صيغة المبالغة
      الجَامِدِ: خطأ في صياغة صيغة المبالغة
    indice: 'أَمْثِلَةٌ: عَلِمَ ← عَلَّامٌ، صَبَرَ ← صَبُورٌ.'
    explication: تُصَاغُ مِنَ الفِعْلِ الثُّلَاثِيِّ المُتَصَرِّفِ غَالِبًا.
  - id: mubalagha-12
    difficulte: 3
    enonce: مَا الفَرْقُ بَيْنَ «غَافِرٌ» وَ«غَفُورٌ»؟ («غَفُورٌ» تَدُلُّ عَلَى كَثْرَةِ المَغْفِرَةِ / لَا فَرْقَ / «غَافِرٌ» أَقْوَى)
    reponses:
    - «غَفُورٌ» تَدُلُّ عَلَى كَثْرَةِ المَغْفِرَةِ
    erreurs:
      لَا فَرْقَ: خلط بين صيغة المبالغة واسم الفاعل
      «غَافِرٌ» أَقْوَى: خلط بين صيغة المبالغة واسم الفاعل
    indice: «غَافِرٌ» اسْمُ فَاعِلٍ.
    explication: «غَفُورٌ» صِيغَةُ مُبَالَغَةٍ تَدُلُّ عَلَى كَثْرَةِ المَغْفِرَةِ، وَ«غَافِرٌ» اسْمُ فَاعِلٍ.
  - id: mubalagha-13
    difficulte: 3
    enonce: 'اِخْتَرْ صِيغَةَ المُبَالَغَةِ: (مِعْطَاءٌ / مِفْتَاحٌ / مِنْشَارٌ)'
    reponses:
    - مِعْطَاءٌ
    erreurs:
      مِفْتَاحٌ: خلط بين صيغة المبالغة واسم الآلة
      مِنْشَارٌ: خلط بين صيغة المبالغة واسم الآلة
    indice: '«مِفْعَالٌ» وَزْنٌ لِصِيغَةِ المُبَالَغَةِ وَلِاسْمِ الآلَةِ: أَيُّهَا يَدُلُّ عَلَى إِنْسَانٍ كَثِيرِ العَطَاءِ؟'
    explication: «مِعْطَاءٌ» صِيغَةُ مُبَالَغَةٍ (كَثِيرُ العَطَاءِ)، وَ«مِفْتَاحٌ» وَ«مِنْشَارٌ» اسْمَا آلَةٍ.
- notion: المصدر الصريح والمصدر المؤول
  exercices:
  - id: muawwal-1
    difficulte: 1
    enonce: 'مَا نَوْعُ المَصْدَرِ فِي: يَسُرُّنِي نَجَاحُكَ؟ (مَصْدَرٌ صَرِيحٌ / مَصْدَرٌ مُؤَوَّلٌ)'
    reponses:
    - مَصْدَرٌ صَرِيحٌ
    erreurs:
      مَصْدَرٌ مُؤَوَّلٌ: خلط بين المصدر الصريح والمؤول
    indice: المَصْدَرُ المُؤَوَّلُ يَتَكَوَّنُ مِنْ حَرْفٍ مَصْدَرِيٍّ (أَنْ، أَنَّ، مَا) وَمَا بَعْدَهُ، وَيُمْكِنُ تَحْوِيلُهُ إِلَى مَصْدَرٍ صَرِيحٍ.
    explication: «نَجَاحُ» مَصْدَرٌ صَرِيحٌ.
  - id: muawwal-2
    difficulte: 1
    enonce: 'مَا نَوْعُ المَصْدَرِ فِي: يَسُرُّنِي أَنْ تَنْجَحَ؟ (مَصْدَرٌ صَرِيحٌ / مَصْدَرٌ مُؤَوَّلٌ)'
    reponses:
    - مَصْدَرٌ مُؤَوَّلٌ
    erreurs:
      مَصْدَرٌ صَرِيحٌ: خلط بين المصدر الصريح والمؤول
    indice: المَصْدَرُ المُؤَوَّلُ يَتَكَوَّنُ مِنْ حَرْفٍ مَصْدَرِيٍّ (أَنْ، أَنَّ، مَا) وَمَا بَعْدَهُ، وَيُمْكِنُ تَحْوِيلُهُ إِلَى مَصْدَرٍ صَرِيحٍ.
    explication: '«أَنْ تَنْجَحَ» مَصْدَرٌ مُؤَوَّلٌ تَقْدِيرُهُ: نَجَاحُكَ.'
  - id: muawwal-3
    difficulte: 1
    enonce: أَيُّ هَذِهِ حَرْفٌ مَصْدَرِيٌّ؟ (أَنْ / فِي / لَمْ)
    reponses:
    - أَنْ
    erreurs:
      فِي: خطأ في الحروف المصدرية
      لَمْ: خطأ في الحروف المصدرية
    indice: 'الحُرُوفُ المَصْدَرِيَّةُ: أَنْ، أَنَّ، مَا، كَيْ، لَوْ.'
    explication: «أَنْ» حَرْفٌ مَصْدَرِيٌّ.
  - id: muawwal-4
    difficulte: 1
    enonce: 'حَوِّلْ إِلَى مَصْدَرٍ صَرِيحٍ: أُحِبُّ أَنْ أَقْرَأَ. (أُحِبُّ القِرَاءَةَ / أُحِبُّ القَارِئَ / أُحِبُّ المَقْرُوءَ)'
    reponses:
    - أُحِبُّ القِرَاءَةَ
    erreurs:
      أُحِبُّ القَارِئَ: خطأ في تحويل المصدر المؤول
      أُحِبُّ المَقْرُوءَ: خطأ في تحويل المصدر المؤول
    indice: 'مَصْدَرُ «قَرَأَ»: قِرَاءَةٌ.'
    explication: 'نَقُولُ: أُحِبُّ القِرَاءَةَ.'
  - id: muawwal-5
    difficulte: 2
    enonce: 'حَوِّلْ إِلَى مَصْدَرٍ مُؤَوَّلٍ: يَجِبُ احْتِرَامُ الكَبِيرِ. (يَجِبُ أَنْ نَحْتَرِمَ الكَبِيرَ / يَجِبُ مُحْتَرِمُ الكَبِيرِ / يَجِبُ احْتِرَامًا الكَبِيرَ)'
    reponses:
    - يَجِبُ أَنْ نَحْتَرِمَ الكَبِيرَ
    erreurs:
      يَجِبُ مُحْتَرِمُ الكَبِيرِ: خطأ في تحويل المصدر الصريح
      يَجِبُ احْتِرَامًا الكَبِيرَ: خطأ في تحويل المصدر الصريح
    indice: نَسْتَعْمِلُ «أَنْ» + المُضَارِعَ.
    explication: 'نَقُولُ: يَجِبُ أَنْ نَحْتَرِمَ الكَبِيرَ.'
  - id: muawwal-6
    difficulte: 2
    enonce: 'مَا المَصْدَرُ المُؤَوَّلُ فِي: عَلِمْتُ أَنَّكَ مُجْتَهِدٌ؟ (عَلِمْتُ / أَنَّكَ مُجْتَهِدٌ / مُجْتَهِدٌ)'
    reponses:
    - أَنَّكَ مُجْتَهِدٌ
    erreurs:
      عَلِمْتُ: خطأ في تحديد المصدر المؤول
      مُجْتَهِدٌ: خطأ في تحديد المصدر المؤول
    indice: «أَنَّ» حَرْفٌ مَصْدَرِيٌّ.
    explication: '«أَنَّكَ مُجْتَهِدٌ» مَصْدَرٌ مُؤَوَّلٌ تَقْدِيرُهُ: اجْتِهَادَكَ.'
  - id: muawwal-7
    difficulte: 2
    enonce: 'مَا تَقْدِيرُ المَصْدَرِ المُؤَوَّلِ فِي: يُعْجِبُنِي أَنْ تَصْدُقَ؟ (صِدْقُكَ / صَادِقٌ / مَصْدُوقٌ)'
    reponses:
    - صِدْقُكَ
    erreurs:
      صَادِقٌ: خطأ في تحويل المصدر المؤول
      مَصْدُوقٌ: خطأ في تحويل المصدر المؤول
    indice: مَا مَصْدَرُ «صَدَقَ»؟
    explication: 'التَّقْدِيرُ: يُعْجِبُنِي صِدْقُكَ.'
  - id: muawwal-8
    difficulte: 2
    enonce: 'مَا مَوْقِعُ المَصْدَرِ المُؤَوَّلِ فِي: يَسُرُّنِي أَنْ تَنْجَحَ؟ (فَاعِلٌ / مَفْعُولٌ بِهِ / مُبْتَدَأٌ)'
    reponses:
    - فَاعِلٌ
    erreurs:
      مَفْعُولٌ بِهِ: خطأ في موقع المصدر المؤول
      مُبْتَدَأٌ: خطأ في موقع المصدر المؤول
    indice: مَا الَّذِي يَسُرُّنِي؟
    explication: '«أَنْ تَنْجَحَ» فِي مَحَلِّ رَفْعٍ فَاعِلٌ: يَسُرُّنِي نَجَاحُكَ.'
  - id: muawwal-9
    difficulte: 3
    enonce: 'مَا مَوْقِعُ المَصْدَرِ المُؤَوَّلِ فِي: أُرِيدُ أَنْ أُسَافِرَ؟ (فَاعِلٌ / مَفْعُولٌ بِهِ / خَبَرٌ)'
    reponses:
    - مَفْعُولٌ بِهِ
    erreurs:
      فَاعِلٌ: خطأ في موقع المصدر المؤول
      خَبَرٌ: خطأ في موقع المصدر المؤول
    indice: مَاذَا أُرِيدُ؟
    explication: '«أَنْ أُسَافِرَ» فِي مَحَلِّ نَصْبٍ مَفْعُولٌ بِهِ: أُرِيدُ السَّفَرَ.'
  - id: muawwal-10
    difficulte: 3
    enonce: 'مَا الحَرْفُ المَصْدَرِيُّ فِي: سُرِرْتُ بِمَا فَعَلْتَ؟ (البَاءُ / مَا / التَّاءُ)'
    reponses:
    - مَا
    erreurs:
      البَاءُ: خطأ في الحروف المصدرية
      التَّاءُ: خطأ في الحروف المصدرية
    indice: 'التَّقْدِيرُ: سُرِرْتُ بِفِعْلِكَ.'
    explication: '«مَا» حَرْفٌ مَصْدَرِيٌّ: سُرِرْتُ بِفِعْلِكَ.'
  - id: muawwal-11
    difficulte: 3
    enonce: 'مَا مَوْقِعُ المَصْدَرِ المُؤَوَّلِ فِي: مِنَ الأَدَبِ أَنْ تَسْتَمِعَ؟ (مُبْتَدَأٌ مُؤَخَّرٌ / خَبَرٌ / فَاعِلٌ)'
    reponses:
    - مُبْتَدَأٌ مُؤَخَّرٌ
    erreurs:
      خَبَرٌ: خطأ في موقع المصدر المؤول
      فَاعِلٌ: خطأ في موقع المصدر المؤول
    indice: 'التَّقْدِيرُ: الاِسْتِمَاعُ مِنَ الأَدَبِ.'
    explication: «أَنْ تَسْتَمِعَ» فِي مَحَلِّ رَفْعٍ مُبْتَدَأٌ مُؤَخَّرٌ، وَ«مِنَ الأَدَبِ» خَبَرٌ مُقَدَّمٌ.
  - id: muawwal-12
    difficulte: 3
    enonce: 'حَوِّلْ إِلَى مَصْدَرٍ صَرِيحٍ: عَرَفْتُ أَنَّ الامْتِحَانَ قَرِيبٌ. (عَرَفْتُ قُرْبَ الامْتِحَانِ / عَرَفْتُ قَرِيبَ الامْتِحَانِ / عَرَفْتُ الامْتِحَانَ)'
    reponses:
    - عَرَفْتُ قُرْبَ الامْتِحَانِ
    erreurs:
      عَرَفْتُ قَرِيبَ الامْتِحَانِ: خطأ في تحويل المصدر المؤول
      عَرَفْتُ الامْتِحَانَ: خطأ في تحويل المصدر المؤول
    indice: 'مَصْدَرُ «قَرُبَ»: قُرْبٌ.'
    explication: 'نَقُولُ: عَرَفْتُ قُرْبَ الامْتِحَانِ.'
  - id: muawwal-13
    difficulte: 3
    enonce: مِمَّ يَتَكَوَّنُ المَصْدَرُ المُؤَوَّلُ؟ (حَرْفٍ مَصْدَرِيٍّ وَمَا بَعْدَهُ / فِعْلٍ وَفَاعِلٍ فَقَطْ / اسْمٍ مَجْرُورٍ)
    reponses:
    - حَرْفٍ مَصْدَرِيٍّ وَمَا بَعْدَهُ
    erreurs:
      فِعْلٍ وَفَاعِلٍ فَقَطْ: خطأ في تعريف المصدر المؤول
      اسْمٍ مَجْرُورٍ: خطأ في تعريف المصدر المؤول
    indice: 'مِثَالٌ: أَنْ + تَنْجَحَ.'
    explication: المَصْدَرُ المُؤَوَّلُ = حَرْفٌ مَصْدَرِيٌّ (أَنْ، أَنَّ، مَا...) + مَا بَعْدَهُ.
- notion: المصدر الميمي والمصدر الصناعي
  exercices:
  - id: mimi-1
    difficulte: 1
    enonce: 'مَا نَوْعُ «مَوْعِدٌ» فِي: حَانَ مَوْعِدُ السَّفَرِ؟ (مَصْدَرٌ مِيمِيٌّ / مَصْدَرٌ صِنَاعِيٌّ / مَصْدَرٌ صَرِيحٌ عَادِيٌّ)'
    reponses:
    - مَصْدَرٌ مِيمِيٌّ
    erreurs:
      مَصْدَرٌ صِنَاعِيٌّ: خلط بين أنواع المصادر
      مَصْدَرٌ صَرِيحٌ عَادِيٌّ: خلط بين أنواع المصادر
    indice: المَصْدَرُ المِيمِيُّ يَبْدَأُ بِمِيمٍ زَائِدَةٍ (مَوْعِدٌ، مَطْلَبٌ)، وَالصِّنَاعِيُّ يَنْتَهِي بِيَاءٍ مُشَدَّدَةٍ وَتَاءٍ (إِنْسَانِيَّةٌ).
    explication: «مَوْعِدٌ» مَصْدَرٌ مِيمِيٌّ بِمَعْنَى «الوَعْدِ».
  - id: mimi-2
    difficulte: 1
    enonce: مَا نَوْعُ «الإِنْسَانِيَّةُ»؟ (مَصْدَرٌ مِيمِيٌّ / مَصْدَرٌ صِنَاعِيٌّ / مَصْدَرٌ صَرِيحٌ عَادِيٌّ)
    reponses:
    - مَصْدَرٌ صِنَاعِيٌّ
    erreurs:
      مَصْدَرٌ مِيمِيٌّ: خلط بين أنواع المصادر
      مَصْدَرٌ صَرِيحٌ عَادِيٌّ: خلط بين أنواع المصادر
    indice: المَصْدَرُ المِيمِيُّ يَبْدَأُ بِمِيمٍ زَائِدَةٍ (مَوْعِدٌ، مَطْلَبٌ)، وَالصِّنَاعِيُّ يَنْتَهِي بِيَاءٍ مُشَدَّدَةٍ وَتَاءٍ (إِنْسَانِيَّةٌ).
    explication: '«الإِنْسَانِيَّةُ» مَصْدَرٌ صِنَاعِيٌّ: «إِنْسَانٌ» + يَاءٌ مُشَدَّدَةٌ + تَاءٌ.'
  - id: mimi-3
    difficulte: 1
    enonce: مَا نَوْعُ «الكِتَابَةُ»؟ (مَصْدَرٌ مِيمِيٌّ / مَصْدَرٌ صِنَاعِيٌّ / مَصْدَرٌ صَرِيحٌ عَادِيٌّ)
    reponses:
    - مَصْدَرٌ صَرِيحٌ عَادِيٌّ
    erreurs:
      مَصْدَرٌ مِيمِيٌّ: خلط بين أنواع المصادر
      مَصْدَرٌ صِنَاعِيٌّ: خلط بين أنواع المصادر
    indice: المَصْدَرُ المِيمِيُّ يَبْدَأُ بِمِيمٍ زَائِدَةٍ (مَوْعِدٌ، مَطْلَبٌ)، وَالصِّنَاعِيُّ يَنْتَهِي بِيَاءٍ مُشَدَّدَةٍ وَتَاءٍ (إِنْسَانِيَّةٌ).
    explication: «الكِتَابَةُ» مَصْدَرٌ عَادِيٌّ لِلْفِعْلِ «كَتَبَ».
  - id: mimi-4
    difficulte: 1
    enonce: بِمَاذَا يَبْدَأُ المَصْدَرُ المِيمِيُّ؟ (بِمِيمٍ زَائِدَةٍ / بِهَمْزَةٍ / بِتَاءٍ)
    reponses:
    - بِمِيمٍ زَائِدَةٍ
    erreurs:
      بِهَمْزَةٍ: خطأ في تعريف المصدر الميمي
      بِتَاءٍ: خطأ في تعريف المصدر الميمي
    indice: 'أَمْثِلَةٌ: مَطْلَبٌ، مَوْعِدٌ، مُنْطَلَقٌ.'
    explication: المَصْدَرُ المِيمِيُّ يَبْدَأُ بِمِيمٍ زَائِدَةٍ.
  - id: mimi-5
    difficulte: 2
    enonce: مَا المَصْدَرُ المِيمِيُّ مِنْ «طَلَبَ»؟ (مَطْلَبٌ / طَالِبٌ / مَطْلُوبٌ)
    reponses:
    - مَطْلَبٌ
    erreurs:
      طَالِبٌ: خطأ في صياغة المصدر الميمي
      مَطْلُوبٌ: خطأ في صياغة المصدر الميمي
    indice: مِنَ الثُّلَاثِيِّ عَلَى وَزْنِ «مَفْعَلٌ».
    explication: 'المَصْدَرُ المِيمِيُّ مِنْ «طَلَبَ»: مَطْلَبٌ.'
  - id: mimi-6
    difficulte: 2
    enonce: مَا المَصْدَرُ الصِّنَاعِيُّ مِنْ «حُرٌّ»؟ (حُرِّيَّةٌ / تَحْرِيرٌ / مُحَرَّرٌ)
    reponses:
    - حُرِّيَّةٌ
    erreurs:
      تَحْرِيرٌ: خطأ في صياغة المصدر الصناعي
      مُحَرَّرٌ: خطأ في صياغة المصدر الصناعي
    indice: نُضِيفُ يَاءً مُشَدَّدَةً وَتَاءً مَرْبُوطَةً.
    explication: 'المَصْدَرُ الصِّنَاعِيُّ مِنْ «حُرٌّ»: حُرِّيَّةٌ.'
  - id: mimi-7
    difficulte: 2
    enonce: مَا المَصْدَرُ الصِّنَاعِيُّ مِنْ «وَطَنٌ»؟ (مُوَاطِنٌ / وَطَنِيَّةٌ / تَوْطِينٌ)
    reponses:
    - وَطَنِيَّةٌ
    erreurs:
      مُوَاطِنٌ: خطأ في صياغة المصدر الصناعي
      تَوْطِينٌ: خطأ في صياغة المصدر الصناعي
    indice: نُضِيفُ يَاءً مُشَدَّدَةً وَتَاءً مَرْبُوطَةً.
    explication: 'المَصْدَرُ الصِّنَاعِيُّ مِنْ «وَطَنٌ»: وَطَنِيَّةٌ.'
  - id: mimi-8
    difficulte: 2
    voyelles_obligatoires: true
    enonce: مَا المَصْدَرُ المِيمِيُّ مِنْ «انْطَلَقَ»؟ (مُنْطَلِقٌ / مُنْطَلَقٌ / انْطِلَاقٌ)
    reponses:
    - مُنْطَلَقٌ
    erreurs:
      مُنْطَلِقٌ: خطأ في صياغة المصدر الميمي
      انْطِلَاقٌ: خطأ في صياغة المصدر الميمي
    indice: 'مِنْ غَيْرِ الثُّلَاثِيِّ: عَلَى وَزْنِ اسْمِ المَفْعُولِ.'
    explication: 'المَصْدَرُ المِيمِيُّ مِنْ «انْطَلَقَ»: مُنْطَلَقٌ.'
  - id: mimi-9
    difficulte: 2
    enonce: مَا نَوْعُ «المَسْؤُولِيَّةُ»؟ (مَصْدَرٌ مِيمِيٌّ / مَصْدَرٌ صِنَاعِيٌّ / مَصْدَرٌ صَرِيحٌ عَادِيٌّ)
    reponses:
    - مَصْدَرٌ صِنَاعِيٌّ
    erreurs:
      مَصْدَرٌ مِيمِيٌّ: خلط بين أنواع المصادر
      مَصْدَرٌ صَرِيحٌ عَادِيٌّ: خلط بين أنواع المصادر
    indice: المَصْدَرُ المِيمِيُّ يَبْدَأُ بِمِيمٍ زَائِدَةٍ (مَوْعِدٌ، مَطْلَبٌ)، وَالصِّنَاعِيُّ يَنْتَهِي بِيَاءٍ مُشَدَّدَةٍ وَتَاءٍ (إِنْسَانِيَّةٌ).
    explication: «المَسْؤُولِيَّةُ» مَصْدَرٌ صِنَاعِيٌّ مِنْ «مَسْؤُولٌ».
  - id: mimi-10
    difficulte: 3
    enonce: 'مَا نَوْعُ «مَرْجِعٌ» فِي: إِلَى اللَّهِ مَرْجِعُكُمْ؟ (مَصْدَرٌ مِيمِيٌّ / مَصْدَرٌ صِنَاعِيٌّ / مَصْدَرٌ صَرِيحٌ عَادِيٌّ)'
    reponses:
    - مَصْدَرٌ مِيمِيٌّ
    erreurs:
      مَصْدَرٌ صِنَاعِيٌّ: خلط بين أنواع المصادر
      مَصْدَرٌ صَرِيحٌ عَادِيٌّ: خلط بين أنواع المصادر
    indice: «مَرْجِعُكُمْ» بِمَعْنَى «رُجُوعُكُمْ».
    explication: «مَرْجِعٌ» مَصْدَرٌ مِيمِيٌّ بِمَعْنَى الرُّجُوعِ.
  - id: mimi-11
    difficulte: 3
    enonce: كَيْفَ نُفَرِّقُ بَيْنَ المَصْدَرِ المِيمِيِّ وَاسْمِ المَكَانِ؟ (المَصْدَرُ يَدُلُّ عَلَى الحَدَثِ، وَاسْمُ المَكَانِ عَلَى مَوْضِعِهِ / لَا فَرْقَ / بِالحَرْفِ الأَخِيرِ)
    reponses:
    - المَصْدَرُ يَدُلُّ عَلَى الحَدَثِ، وَاسْمُ المَكَانِ عَلَى مَوْضِعِهِ
    erreurs:
      لَا فَرْقَ: خلط بين المصدر الميمي واسم المكان
      بِالحَرْفِ الأَخِيرِ: خلط بين المصدر الميمي واسم المكان
    indice: 'قَارِنْ: «مَطْلَبُنَا العِلْمُ» / «هَذَا مَلْعَبُنَا».'
    explication: المَصْدَرُ المِيمِيُّ يَدُلُّ عَلَى الحَدَثِ، وَاسْمُ المَكَانِ عَلَى مَوْضِعِهِ، وَالسِّيَاقُ يُفَرِّقُ بَيْنَهُمَا.
  - id: mimi-12
    difficulte: 3
    enonce: مَا المَصْدَرُ الصِّنَاعِيُّ مِنْ «إِنْسَانٌ»؟ (إِنْسَانِيَّةٌ / أُنْسٌ / أَنِيسٌ)
    reponses:
    - إِنْسَانِيَّةٌ
    erreurs:
      أُنْسٌ: خطأ في صياغة المصدر الصناعي
      أَنِيسٌ: خطأ في صياغة المصدر الصناعي
    indice: نُضِيفُ يَاءً مُشَدَّدَةً وَتَاءً مَرْبُوطَةً.
    explication: 'المَصْدَرُ الصِّنَاعِيُّ مِنْ «إِنْسَانٌ»: إِنْسَانِيَّةٌ.'
  - id: mimi-13
    difficulte: 3
    voyelles_obligatoires: true
    enonce: عَلَى أَيِّ وَزْنٍ يُصَاغُ المَصْدَرُ المِيمِيُّ مِنَ الثُّلَاثِيِّ غَالِبًا؟ (مَفْعَلٌ / مُفْعِلٌ / فَعَّالٌ)
    reponses:
    - مَفْعَلٌ
    erreurs:
      مُفْعِلٌ: خطأ في صياغة المصدر الميمي
      فَعَّالٌ: خطأ في صياغة المصدر الميمي
    indice: 'أَمْثِلَةٌ: مَطْلَبٌ، مَشْرَبٌ.'
    explication: 'يُصَاغُ مِنَ الثُّلَاثِيِّ عَلَى «مَفْعَلٌ» (وَعَلَى «مَفْعِلٌ» فِي المِثَالِ: مَوْعِدٌ).'
- notion: مصدر المرة ومصدر الهيئة
  exercices:
  - id: marra-1
    difficulte: 1
    enonce: 'مَا نَوْعُ «جَلْسَةً» فِي: جَلَسْتُ جَلْسَةً؟ (مَصْدَرُ مَرَّةٍ / مَصْدَرُ هَيْئَةٍ)'
    reponses:
    - مَصْدَرُ مَرَّةٍ
    erreurs:
      مَصْدَرُ هَيْئَةٍ: خلط بين مصدر المرة ومصدر الهيئة
    indice: مَصْدَرُ المَرَّةِ عَلَى وَزْنِ «فَعْلَةٌ» وَيَدُلُّ عَلَى عَدَدِ مَرَّاتِ الفِعْلِ، وَمَصْدَرُ الهَيْئَةِ عَلَى وَزْنِ «فِعْلَةٌ» وَيَدُلُّ عَلَى طَرِيقَتِهِ.
    explication: «جَلْسَةً» مَصْدَرُ مَرَّةٍ عَلَى وَزْنِ «فَعْلَةٌ».
  - id: marra-2
    difficulte: 1
    enonce: 'مَا نَوْعُ «جِلْسَةَ» فِي: جَلَسْتُ جِلْسَةَ المُؤَدَّبِ؟ (مَصْدَرُ مَرَّةٍ / مَصْدَرُ هَيْئَةٍ)'
    reponses:
    - مَصْدَرُ هَيْئَةٍ
    erreurs:
      مَصْدَرُ مَرَّةٍ: خلط بين مصدر المرة ومصدر الهيئة
    indice: مَصْدَرُ المَرَّةِ عَلَى وَزْنِ «فَعْلَةٌ» وَيَدُلُّ عَلَى عَدَدِ مَرَّاتِ الفِعْلِ، وَمَصْدَرُ الهَيْئَةِ عَلَى وَزْنِ «فِعْلَةٌ» وَيَدُلُّ عَلَى طَرِيقَتِهِ.
    explication: «جِلْسَةَ» مَصْدَرُ هَيْئَةٍ عَلَى وَزْنِ «فِعْلَةٌ».
  - id: marra-3
    difficulte: 1
    voyelles_obligatoires: true
    enonce: مَا مَصْدَرُ المَرَّةِ مِنْ «ضَرَبَ»؟ (ضَرْبَةٌ / ضِرْبَةٌ / ضَارِبٌ)
    reponses:
    - ضَرْبَةٌ
    erreurs:
      ضِرْبَةٌ: خطأ في صياغة مصدر المرة
      ضَارِبٌ: خطأ في صياغة مصدر المرة
    indice: عَلَى وَزْنِ «فَعْلَةٌ».
    explication: 'مَصْدَرُ المَرَّةِ: ضَرْبَةٌ.'
  - id: marra-4
    difficulte: 1
    voyelles_obligatoires: true
    enonce: مَا مَصْدَرُ الهَيْئَةِ مِنْ «مَشَى»؟ (مَشْيَةٌ / مِشْيَةٌ / مَاشٍ)
    reponses:
    - مِشْيَةٌ
    erreurs:
      مَشْيَةٌ: خطأ في صياغة مصدر الهيئة
      مَاشٍ: خطأ في صياغة مصدر الهيئة
    indice: عَلَى وَزْنِ «فِعْلَةٌ».
    explication: 'مَصْدَرُ الهَيْئَةِ: مِشْيَةٌ.'
  - id: marra-5
    difficulte: 2
    voyelles_obligatoires: true
    enonce: مَا مَصْدَرُ المَرَّةِ مِنْ «قَفَزَ»؟ (قِفْزَةٌ / قَفْزَةٌ / قَافِزٌ)
    reponses:
    - قَفْزَةٌ
    erreurs:
      قِفْزَةٌ: خطأ في صياغة مصدر المرة
      قَافِزٌ: خطأ في صياغة مصدر المرة
    indice: عَلَى وَزْنِ «فَعْلَةٌ».
    explication: 'مَصْدَرُ المَرَّةِ: قَفْزَةٌ.'
  - id: marra-6
    difficulte: 2
    voyelles_obligatoires: true
    enonce: مَا مَصْدَرُ الهَيْئَةِ مِنْ «نَامَ»؟ (نَوْمَةٌ / نِيمَةٌ / نَائِمٌ)
    reponses:
    - نِيمَةٌ
    erreurs:
      نَوْمَةٌ: خطأ في صياغة مصدر الهيئة
      نَائِمٌ: خطأ في صياغة مصدر الهيئة
    indice: عَلَى وَزْنِ «فِعْلَةٌ»؛ الوَاوُ بَعْدَ الكَسْرَةِ تُقْلَبُ يَاءً.
    explication: 'مَصْدَرُ الهَيْئَةِ: نِيمَةٌ (نَامَ نِيمَةَ الهَادِئِ).'
  - id: marra-7
    difficulte: 2
    enonce: مَا مَصْدَرُ المَرَّةِ مِنْ «أَكْرَمَ» (غَيْرِ الثُّلَاثِيِّ)؟ (إِكْرَامَةٌ / كَرْمَةٌ / مُكْرِمَةٌ)
    reponses:
    - إِكْرَامَةٌ
    erreurs:
      كَرْمَةٌ: خطأ في صياغة مصدر المرة
      مُكْرِمَةٌ: خطأ في صياغة مصدر المرة
    indice: 'مِنْ غَيْرِ الثُّلَاثِيِّ: نُضِيفُ تَاءً إِلَى المَصْدَرِ.'
    explication: 'مَصْدَرُ المَرَّةِ مِنْ «أَكْرَمَ»: إِكْرَامَةٌ.'
  - id: marra-8
    difficulte: 2
    enonce: مَاذَا يُبَيِّنُ مَصْدَرُ الهَيْئَةِ؟ (طَرِيقَةَ وُقُوعِ الفِعْلِ / عَدَدَ مَرَّاتِ الفِعْلِ / زَمَانَ الفِعْلِ)
    reponses:
    - طَرِيقَةَ وُقُوعِ الفِعْلِ
    erreurs:
      عَدَدَ مَرَّاتِ الفِعْلِ: خلط بين مصدر المرة ومصدر الهيئة
      زَمَانَ الفِعْلِ: خلط بين مصدر المرة ومصدر الهيئة
    indice: مَصْدَرُ المَرَّةِ عَلَى وَزْنِ «فَعْلَةٌ» وَيَدُلُّ عَلَى عَدَدِ مَرَّاتِ الفِعْلِ، وَمَصْدَرُ الهَيْئَةِ عَلَى وَزْنِ «فِعْلَةٌ» وَيَدُلُّ عَلَى طَرِيقَتِهِ.
    explication: مَصْدَرُ الهَيْئَةِ يُبَيِّنُ طَرِيقَةَ (هَيْئَةَ) وُقُوعِ الفِعْلِ.
  - id: marra-9
    difficulte: 2
    enonce: 'مَا نَوْعُ «وَقْفَةً» فِي: وَقَفْتُ وَقْفَةً قَصِيرَةً؟ (مَصْدَرُ مَرَّةٍ / مَصْدَرُ هَيْئَةٍ)'
    reponses:
    - مَصْدَرُ مَرَّةٍ
    erreurs:
      مَصْدَرُ هَيْئَةٍ: خلط بين مصدر المرة ومصدر الهيئة
    indice: مَصْدَرُ المَرَّةِ عَلَى وَزْنِ «فَعْلَةٌ» وَيَدُلُّ عَلَى عَدَدِ مَرَّاتِ الفِعْلِ، وَمَصْدَرُ الهَيْئَةِ عَلَى وَزْنِ «فِعْلَةٌ» وَيَدُلُّ عَلَى طَرِيقَتِهِ.
    explication: «وَقْفَةً» مَصْدَرُ مَرَّةٍ عَلَى وَزْنِ «فَعْلَةٌ».
  - id: marra-10
    difficulte: 3
    enonce: مَا مَصْدَرُ المَرَّةِ مِنْ «رَحِمَ» وَمَصْدَرُهُ «رَحْمَةٌ»؟ (رَحْمَةً وَاحِدَةً / رِحْمَةً / رَاحِمَةً)
    reponses:
    - رَحْمَةً وَاحِدَةً
    erreurs:
      رِحْمَةً: خطأ في صياغة مصدر المرة
      رَاحِمَةً: خطأ في صياغة مصدر المرة
    indice: إِذَا كَانَ المَصْدَرُ مَخْتُومًا بِالتَّاءِ نَصِفُهُ بِـ«وَاحِدَةٍ».
    explication: 'نَقُولُ: رَحْمَةً وَاحِدَةً؛ لِأَنَّ المَصْدَرَ الأَصْلِيَّ فِيهِ التَّاءُ.'
  - id: marra-11
    difficulte: 3
    enonce: 'مَا نَوْعُ «مِيتَةَ» فِي: مَاتَ مِيتَةَ الأَبْطَالِ؟ (مَصْدَرُ مَرَّةٍ / مَصْدَرُ هَيْئَةٍ)'
    reponses:
    - مَصْدَرُ هَيْئَةٍ
    erreurs:
      مَصْدَرُ مَرَّةٍ: خلط بين مصدر المرة ومصدر الهيئة
    indice: مَصْدَرُ المَرَّةِ عَلَى وَزْنِ «فَعْلَةٌ» وَيَدُلُّ عَلَى عَدَدِ مَرَّاتِ الفِعْلِ، وَمَصْدَرُ الهَيْئَةِ عَلَى وَزْنِ «فِعْلَةٌ» وَيَدُلُّ عَلَى طَرِيقَتِهِ.
    explication: «مِيتَةَ» مَصْدَرُ هَيْئَةٍ عَلَى وَزْنِ «فِعْلَةٌ».
  - id: marra-12
    difficulte: 3
    enonce: مَا مَصْدَرُ المَرَّةِ مِنْ «انْطَلَقَ»؟ (انْطِلَاقَةٌ / طَلْقَةٌ / مُنْطَلَقٌ)
    reponses:
    - انْطِلَاقَةٌ
    erreurs:
      طَلْقَةٌ: خطأ في صياغة مصدر المرة
      مُنْطَلَقٌ: خطأ في صياغة مصدر المرة
    indice: 'مِنْ غَيْرِ الثُّلَاثِيِّ: المَصْدَرُ + تَاءٌ.'
    explication: 'مَصْدَرُ المَرَّةِ مِنْ «انْطَلَقَ»: انْطِلَاقَةٌ.'
  - id: marra-13
    difficulte: 3
    enonce: مِنْ أَيِّ فِعْلٍ يُصَاغُ مَصْدَرُ الهَيْئَةِ؟ (الثُّلَاثِيِّ فَقَطْ / غَيْرِ الثُّلَاثِيِّ فَقَطْ / كُلِّ الأَفْعَالِ)
    reponses:
    - الثُّلَاثِيِّ فَقَطْ
    erreurs:
      غَيْرِ الثُّلَاثِيِّ فَقَطْ: خطأ في صياغة مصدر الهيئة
      كُلِّ الأَفْعَالِ: خطأ في صياغة مصدر الهيئة
    indice: وَزْنُهُ «فِعْلَةٌ» لَا يَكُونُ إِلَّا مِنَ الثُّلَاثِيِّ.
    explication: يُصَاغُ مَصْدَرُ الهَيْئَةِ مِنَ الفِعْلِ الثُّلَاثِيِّ عَلَى وَزْنِ «فِعْلَةٌ».
- notion: كاد وأخواتها
  exercices:
  - id: kada-1
    difficulte: 1
    enonce: 'مَا اسْمُ «كَادَ» فِي: كَادَ القِطَارُ يَصِلُ؟ (القِطَارُ / يَصِلُ / كَادَ)'
    reponses:
    - القِطَارُ
    erreurs:
      يَصِلُ: خلط بين اسم كاد وخبرها
      كَادَ: خلط بين اسم كاد وخبرها
    indice: «كَادَ» وَأَخَوَاتُهَا تَرْفَعُ الاِسْمَ وَتَنْصِبُ الخَبَرَ، وَخَبَرُهَا جُمْلَةٌ فِعْلِيَّةٌ فِعْلُهَا مُضَارِعٌ.
    explication: اسْمُ «كَادَ» «القِطَارُ» (مَرْفُوعٌ)، وَخَبَرُهَا جُمْلَةُ «يَصِلُ».
  - id: kada-2
    difficulte: 1
    enonce: 'مَا خَبَرُ «أَوْشَكَ» فِي: أَوْشَكَ المَطَرُ يَنْزِلُ؟ (المَطَرُ / يَنْزِلُ / أَوْشَكَ)'
    reponses:
    - يَنْزِلُ
    erreurs:
      المَطَرُ: خلط بين اسم كاد وخبرها
      أَوْشَكَ: خلط بين اسم كاد وخبرها
    indice: «كَادَ» وَأَخَوَاتُهَا تَرْفَعُ الاِسْمَ وَتَنْصِبُ الخَبَرَ، وَخَبَرُهَا جُمْلَةٌ فِعْلِيَّةٌ فِعْلُهَا مُضَارِعٌ.
    explication: خَبَرُ «أَوْشَكَ» الجُمْلَةُ الفِعْلِيَّةُ «يَنْزِلُ» فِي مَحَلِّ نَصْبٍ.
  - id: kada-3
    difficulte: 1
    enonce: مَا نَوْعُ «كَادَ»؟ (مُقَارَبَةٌ / رَجَاءٌ / شُرُوعٌ)
    reponses:
    - مُقَارَبَةٌ
    erreurs:
      رَجَاءٌ: خطأ في أقسام كاد وأخواتها
      شُرُوعٌ: خطأ في أقسام كاد وأخواتها
    indice: 'أَفْعَالُ المُقَارَبَةِ: كَادَ، أَوْشَكَ، كَرَبَ؛ وَالرَّجَاءِ: عَسَى، حَرَى، اخْلَوْلَقَ؛ وَالشُّرُوعِ: بَدَأَ، شَرَعَ، أَخَذَ، جَعَلَ، طَفِقَ، أَنْشَأَ.'
    explication: '«كَادَ» مِنْ أَفْعَالِ المُقَارَبَةِ: تَدُلُّ عَلَى قُرْبِ وُقُوعِ الخَبَرِ.'
  - id: kada-4
    difficulte: 1
    enonce: مَا نَوْعُ «عَسَى»؟ (مُقَارَبَةٌ / رَجَاءٌ / شُرُوعٌ)
    reponses:
    - رَجَاءٌ
    erreurs:
      مُقَارَبَةٌ: خطأ في أقسام كاد وأخواتها
      شُرُوعٌ: خطأ في أقسام كاد وأخواتها
    indice: 'أَفْعَالُ المُقَارَبَةِ: كَادَ، أَوْشَكَ، كَرَبَ؛ وَالرَّجَاءِ: عَسَى، حَرَى، اخْلَوْلَقَ؛ وَالشُّرُوعِ: بَدَأَ، شَرَعَ، أَخَذَ، جَعَلَ، طَفِقَ، أَنْشَأَ.'
    explication: «عَسَى» مِنْ أَفْعَالِ الرَّجَاءِ.
  - id: kada-5
    difficulte: 2
    enonce: مَا نَوْعُ «شَرَعَ»؟ (مُقَارَبَةٌ / رَجَاءٌ / شُرُوعٌ)
    reponses:
    - شُرُوعٌ
    erreurs:
      مُقَارَبَةٌ: خطأ في أقسام كاد وأخواتها
      رَجَاءٌ: خطأ في أقسام كاد وأخواتها
    indice: 'أَفْعَالُ المُقَارَبَةِ: كَادَ، أَوْشَكَ، كَرَبَ؛ وَالرَّجَاءِ: عَسَى، حَرَى، اخْلَوْلَقَ؛ وَالشُّرُوعِ: بَدَأَ، شَرَعَ، أَخَذَ، جَعَلَ، طَفِقَ، أَنْشَأَ.'
    explication: '«شَرَعَ» مِنْ أَفْعَالِ الشُّرُوعِ: بَدَأَ فِي العَمَلِ.'
  - id: kada-6
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: كَادَ الطِّفْلُ ... (نَائِمًا / يَنَامُ / نَامَ)'
    reponses:
    - يَنَامُ
    erreurs:
      نَائِمًا: خطأ في خبر كاد
      نَامَ: خطأ في خبر كاد
    indice: «كَادَ» وَأَخَوَاتُهَا تَرْفَعُ الاِسْمَ وَتَنْصِبُ الخَبَرَ، وَخَبَرُهَا جُمْلَةٌ فِعْلِيَّةٌ فِعْلُهَا مُضَارِعٌ.
    explication: 'نَقُولُ: كَادَ الطِّفْلُ يَنَامُ؛ خَبَرُ «كَادَ» فِعْلٌ مُضَارِعٌ.'
  - id: kada-7
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: عَسَى ... أَنْ يَتَحَسَّنَ. (الجَوَّ / الجَوُّ / الجَوِّ)'
    reponses:
    - الجَوُّ
    erreurs:
      الجَوَّ: خطأ في إعراب اسم كاد
      الجَوِّ: خطأ في إعراب اسم كاد
    indice: اسْمُ «عَسَى» مَرْفُوعٌ.
    explication: 'نَقُولُ: عَسَى الجَوُّ أَنْ يَتَحَسَّنَ.'
  - id: kada-8
    difficulte: 2
    enonce: أَيُّ فِعْلٍ يَقْتَرِنُ خَبَرُهُ بِـ«أَنْ» غَالِبًا؟ (عَسَى / شَرَعَ / أَخَذَ)
    reponses:
    - عَسَى
    erreurs:
      شَرَعَ: خطأ في اقتران الخبر بأن
      أَخَذَ: خطأ في اقتران الخبر بأن
    indice: أَفْعَالُ الشُّرُوعِ لَا يَقْتَرِنُ خَبَرُهَا بِـ«أَنْ».
    explication: 'خَبَرُ «عَسَى» يَقْتَرِنُ بِـ«أَنْ» غَالِبًا: عَسَى الفَرَجُ أَنْ يَقْرُبَ.'
  - id: kada-9
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: أَخَذَ التِّلْمِيذُ ... (أَنْ يَكْتُبَ / يَكْتُبُ / كَاتِبًا)'
    reponses:
    - يَكْتُبُ
    erreurs:
      أَنْ يَكْتُبَ: خطأ في خبر كاد
      كَاتِبًا: خطأ في خبر كاد
    indice: أَفْعَالُ الشُّرُوعِ لَا يَقْتَرِنُ خَبَرُهَا بِـ«أَنْ».
    explication: 'نَقُولُ: أَخَذَ التِّلْمِيذُ يَكْتُبُ.'
  - id: kada-10
    difficulte: 3
    enonce: مَا عَمَلُ «كَادَ» وَأَخَوَاتِهَا؟ (تَرْفَعُ الاِسْمَ وَتَنْصِبُ الخَبَرَ / تَنْصِبُ الاِسْمَ وَتَرْفَعُ الخَبَرَ / تَنْصِبُ مَفْعُولَيْنِ)
    reponses:
    - تَرْفَعُ الاِسْمَ وَتَنْصِبُ الخَبَرَ
    erreurs:
      تَنْصِبُ الاِسْمَ وَتَرْفَعُ الخَبَرَ: خطأ في عمل كاد وأخواتها
      تَنْصِبُ مَفْعُولَيْنِ: خطأ في عمل كاد وأخواتها
    indice: «كَادَ» وَأَخَوَاتُهَا تَرْفَعُ الاِسْمَ وَتَنْصِبُ الخَبَرَ، وَخَبَرُهَا جُمْلَةٌ فِعْلِيَّةٌ فِعْلُهَا مُضَارِعٌ.
    explication: 'تَعْمَلُ عَمَلَ «كَانَ»: تَرْفَعُ الاِسْمَ وَتَنْصِبُ الخَبَرَ.'
  - id: kada-11
    difficulte: 3
    enonce: مَا شَرْطُ خَبَرِ «كَادَ» وَأَخَوَاتِهَا؟ (جُمْلَةٌ فِعْلِيَّةٌ فِعْلُهَا مُضَارِعٌ / اسْمٌ مُفْرَدٌ / شِبْهُ جُمْلَةٍ)
    reponses:
    - جُمْلَةٌ فِعْلِيَّةٌ فِعْلُهَا مُضَارِعٌ
    erreurs:
      اسْمٌ مُفْرَدٌ: خطأ في خبر كاد
      شِبْهُ جُمْلَةٍ: خطأ في خبر كاد
    indice: «كَادَ» وَأَخَوَاتُهَا تَرْفَعُ الاِسْمَ وَتَنْصِبُ الخَبَرَ، وَخَبَرُهَا جُمْلَةٌ فِعْلِيَّةٌ فِعْلُهَا مُضَارِعٌ.
    explication: خَبَرُهَا جُمْلَةٌ فِعْلِيَّةٌ فِعْلُهَا مُضَارِعٌ.
  - id: kada-12
    difficulte: 3
    enonce: 'مَا نَوْعُ «طَفِقَ» فِي: طَفِقَ الوَلَدُ يَبْكِي؟ (مُقَارَبَةٌ / رَجَاءٌ / شُرُوعٌ)'
    reponses:
    - شُرُوعٌ
    erreurs:
      مُقَارَبَةٌ: خطأ في أقسام كاد وأخواتها
      رَجَاءٌ: خطأ في أقسام كاد وأخواتها
    indice: 'أَفْعَالُ المُقَارَبَةِ: كَادَ، أَوْشَكَ، كَرَبَ؛ وَالرَّجَاءِ: عَسَى، حَرَى، اخْلَوْلَقَ؛ وَالشُّرُوعِ: بَدَأَ، شَرَعَ، أَخَذَ، جَعَلَ، طَفِقَ، أَنْشَأَ.'
    explication: «طَفِقَ» مِنْ أَفْعَالِ الشُّرُوعِ.
  - id: kada-13
    difficulte: 3
    enonce: 'مَا مَوْقِعُ جُمْلَةِ «يَغْرَقُ» فِي: كَادَ الرَّجُلُ يَغْرَقُ؟ (فِي مَحَلِّ نَصْبٍ خَبَرُ «كَادَ» / فِي مَحَلِّ رَفْعٍ خَبَرُ «كَادَ» / حَالٌ)'
    reponses:
    - فِي مَحَلِّ نَصْبٍ خَبَرُ «كَادَ»
    erreurs:
      فِي مَحَلِّ رَفْعٍ خَبَرُ «كَادَ»: خطأ في إعراب خبر كاد
      حَالٌ: خطأ في إعراب خبر كاد
    indice: «كَادَ» وَأَخَوَاتُهَا تَرْفَعُ الاِسْمَ وَتَنْصِبُ الخَبَرَ، وَخَبَرُهَا جُمْلَةٌ فِعْلِيَّةٌ فِعْلُهَا مُضَارِعٌ.
    explication: جُمْلَةُ «يَغْرَقُ» فِي مَحَلِّ نَصْبٍ خَبَرُ «كَادَ».
- notion: لا النافية للجنس
  exercices:
  - id: lanafia-1
    difficulte: 1
    enonce: 'مَا اسْمُ «لَا» فِي: لَا كَسُولَ نَاجِحٌ؟ (كَسُولَ / نَاجِحٌ / لَا)'
    reponses:
    - كَسُولَ
    erreurs:
      نَاجِحٌ: خلط بين اسم لا وخبرها
      لَا: خلط بين اسم لا وخبرها
    indice: '«لَا» النَّافِيَةُ لِلْجِنْسِ تَعْمَلُ عَمَلَ «إِنَّ»: تَنْصِبُ الاِسْمَ وَتَرْفَعُ الخَبَرَ، وَاسْمُهَا المُفْرَدُ يُبْنَى عَلَى الفَتْحِ.'
    explication: اسْمُ «لَا» «كَسُولَ» مَبْنِيٌّ عَلَى الفَتْحِ، وَخَبَرُهَا «نَاجِحٌ».
  - id: lanafia-2
    difficulte: 1
    enonce: 'مَا خَبَرُ «لَا» فِي: لَا رَجُلَ فِي البَيْتِ؟ (رَجُلَ / فِي البَيْتِ / لَا)'
    reponses:
    - فِي البَيْتِ
    erreurs:
      رَجُلَ: خلط بين اسم لا وخبرها
      لَا: خلط بين اسم لا وخبرها
    indice: '«لَا» النَّافِيَةُ لِلْجِنْسِ تَعْمَلُ عَمَلَ «إِنَّ»: تَنْصِبُ الاِسْمَ وَتَرْفَعُ الخَبَرَ، وَاسْمُهَا المُفْرَدُ يُبْنَى عَلَى الفَتْحِ.'
    explication: خَبَرُ «لَا» شِبْهُ الجُمْلَةِ «فِي البَيْتِ».
  - id: lanafia-3
    difficulte: 1
    enonce: مَاذَا تَنْفِي «لَا» النَّافِيَةُ لِلْجِنْسِ؟ (الجِنْسَ كُلَّهُ / فَرْدًا وَاحِدًا / الفِعْلَ)
    reponses:
    - الجِنْسَ كُلَّهُ
    erreurs:
      فَرْدًا وَاحِدًا: خطأ في معنى لا النافية للجنس
      الفِعْلَ: خطأ في معنى لا النافية للجنس
    indice: '«لَا رَجُلَ فِي البَيْتِ»: لَا وَاحِدَ وَلَا أَكْثَرَ.'
    explication: تَنْفِي الحُكْمَ عَنْ جِنْسِ اسْمِهَا كُلِّهِ.
  - id: lanafia-4
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: لَا ... فِي السَّمَاءِ. (سَحَابٌ / سَحَابَ / سَحَابٍ)'
    reponses:
    - سَحَابَ
    erreurs:
      سَحَابٌ: خطأ في إعراب اسم لا
      سَحَابٍ: خطأ في إعراب اسم لا
    indice: '«لَا» النَّافِيَةُ لِلْجِنْسِ تَعْمَلُ عَمَلَ «إِنَّ»: تَنْصِبُ الاِسْمَ وَتَرْفَعُ الخَبَرَ، وَاسْمُهَا المُفْرَدُ يُبْنَى عَلَى الفَتْحِ.'
    explication: 'نَقُولُ: لَا سَحَابَ فِي السَّمَاءِ؛ اسْمُهَا مَبْنِيٌّ عَلَى الفَتْحِ.'
  - id: lanafia-5
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: لَا طَالِبَ عِلْمٍ ... (خَاسِرٌ / خَاسِرًا / خَاسِرٍ)'
    reponses:
    - خَاسِرٌ
    erreurs:
      خَاسِرًا: خطأ في إعراب خبر لا
      خَاسِرٍ: خطأ في إعراب خبر لا
    indice: خَبَرُ «لَا» مَرْفُوعٌ.
    explication: 'نَقُولُ: لَا طَالِبَ عِلْمٍ خَاسِرٌ.'
  - id: lanafia-6
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: لَا ... عِلْمٍ مَكْرُوهٌ. (طَالِبُ / طَالِبَ / طَالِبٌ)'
    reponses:
    - طَالِبَ
    erreurs:
      طَالِبُ: خطأ في إعراب اسم لا
      طَالِبٌ: خطأ في إعراب اسم لا
    indice: اسْمُ «لَا» المُضَافُ مَنْصُوبٌ.
    explication: 'نَقُولُ: لَا طَالِبَ عِلْمٍ مَكْرُوهٌ؛ اسْمُهَا مُضَافٌ مَنْصُوبٌ.'
  - id: lanafia-7
    difficulte: 2
    enonce: مَا عَمَلُ «لَا» النَّافِيَةِ لِلْجِنْسِ؟ (عَمَلُ «إِنَّ» / عَمَلُ «كَانَ» / لَا تَعْمَلُ)
    reponses:
    - عَمَلُ «إِنَّ»
    erreurs:
      عَمَلُ «كَانَ»: خطأ في عمل لا النافية للجنس
      لَا تَعْمَلُ: خطأ في عمل لا النافية للجنس
    indice: '«لَا» النَّافِيَةُ لِلْجِنْسِ تَعْمَلُ عَمَلَ «إِنَّ»: تَنْصِبُ الاِسْمَ وَتَرْفَعُ الخَبَرَ، وَاسْمُهَا المُفْرَدُ يُبْنَى عَلَى الفَتْحِ.'
    explication: 'تَعْمَلُ عَمَلَ «إِنَّ»: تَنْصِبُ الاِسْمَ وَتَرْفَعُ الخَبَرَ.'
  - id: lanafia-8
    difficulte: 2
    enonce: عَلَامَ يُبْنَى اسْمُ «لَا» المُفْرَدُ؟ (عَلَى مَا يُنْصَبُ بِهِ / عَلَى الضَّمِّ / عَلَى السُّكُونِ)
    reponses:
    - عَلَى مَا يُنْصَبُ بِهِ
    erreurs:
      عَلَى الضَّمِّ: خطأ في بناء اسم لا
      عَلَى السُّكُونِ: خطأ في بناء اسم لا
    indice: لَا تِلْمِيذَ (فَتْحَةٌ)، لَا تِلْمِيذَيْنِ (يَاءٌ).
    explication: 'يُبْنَى اسْمُ «لَا» المُفْرَدُ عَلَى مَا يُنْصَبُ بِهِ: الفَتْحِ أَوِ اليَاءِ أَوِ الكَسْرِ.'
  - id: lanafia-9
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: لَا ... غَائِبَانِ. (تِلْمِيذَانِ / تِلْمِيذَيْنِ / تِلْمِيذَ)'
    reponses:
    - تِلْمِيذَيْنِ
    erreurs:
      تِلْمِيذَانِ: خطأ في بناء اسم لا
      تِلْمِيذَ: خطأ في بناء اسم لا
    indice: المُثَنَّى يُبْنَى عَلَى اليَاءِ.
    explication: 'نَقُولُ: لَا تِلْمِيذَيْنِ غَائِبَانِ.'
  - id: lanafia-10
    difficulte: 3
    enonce: مَا شَرْطُ عَمَلِ «لَا» النَّافِيَةِ لِلْجِنْسِ؟ (أَنْ يَكُونَ اسْمُهَا وَخَبَرُهَا نَكِرَتَيْنِ / أَنْ يَكُونَ اسْمُهَا مَعْرِفَةً / أَنْ يَتَقَدَّمَ خَبَرُهَا)
    reponses:
    - أَنْ يَكُونَ اسْمُهَا وَخَبَرُهَا نَكِرَتَيْنِ
    erreurs:
      أَنْ يَكُونَ اسْمُهَا مَعْرِفَةً: خطأ في شروط لا النافية للجنس
      أَنْ يَتَقَدَّمَ خَبَرُهَا: خطأ في شروط لا النافية للجنس
    indice: 'قَارِنْ: لَا رَجُلَ فِي الدَّارِ / لَا زَيْدٌ فِي الدَّارِ وَلَا عَمْرٌو.'
    explication: تَعْمَلُ إِذَا كَانَ اسْمُهَا وَخَبَرُهَا نَكِرَتَيْنِ، وَلَمْ يُفْصَلْ بَيْنَهَا وَبَيْنَ اسْمِهَا.
  - id: lanafia-11
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: لَا ... حَاضِرَاتٌ. (مُعَلِّمَاتِ / مُعَلِّمَاتٌ / مُعَلِّمَاتٍ)'
    reponses:
    - مُعَلِّمَاتِ
    erreurs:
      مُعَلِّمَاتٌ: خطأ في بناء اسم لا
      مُعَلِّمَاتٍ: خطأ في بناء اسم لا
    indice: جَمْعُ المُؤَنَّثِ السَّالِمُ يُبْنَى عَلَى الكَسْرِ (أَوِ الفَتْحِ).
    explication: 'نَقُولُ: لَا مُعَلِّمَاتِ حَاضِرَاتٌ؛ مَبْنِيٌّ عَلَى الكَسْرِ بِلَا تَنْوِينٍ.'
  - id: lanafia-12
    difficulte: 3
    enonce: فِي أَيِّ جُمْلَةٍ «لَا» نَافِيَةٌ لِلْجِنْسِ؟ (لَا شَكَّ فِي ذَلِكَ / لَا تَكْذِبْ / جَاءَ أَحْمَدُ لَا خَالِدٌ)
    reponses:
    - لَا شَكَّ فِي ذَلِكَ
    erreurs:
      لَا تَكْذِبْ: خلط بين أنواع لا
      جَاءَ أَحْمَدُ لَا خَالِدٌ: خلط بين أنواع لا
    indice: اِبْحَثْ عَنْ «لَا» بَعْدَهَا اسْمٌ نَكِرَةٌ مَبْنِيٌّ عَلَى الفَتْحِ.
    explication: «لَا شَكَّ» نَافِيَةٌ لِلْجِنْسِ؛ «لَا تَكْذِبْ» نَاهِيَةٌ، وَ«لَا خَالِدٌ» عَاطِفَةٌ.
  - id: lanafia-13
    difficulte: 3
    enonce: 'مَا إِعْرَابُ «شَكَّ» فِي: لَا شَكَّ فِي ذَلِكَ؟ (اسْمُ «لَا» مَبْنِيٌّ عَلَى الفَتْحِ فِي مَحَلِّ نَصْبٍ / مَفْعُولٌ بِهِ / مُبْتَدَأٌ مَرْفُوعٌ)'
    reponses:
    - اسْمُ «لَا» مَبْنِيٌّ عَلَى الفَتْحِ فِي مَحَلِّ نَصْبٍ
    erreurs:
      مَفْعُولٌ بِهِ: خطأ في إعراب اسم لا
      مُبْتَدَأٌ مَرْفُوعٌ: خطأ في إعراب اسم لا
    indice: '«لَا» النَّافِيَةُ لِلْجِنْسِ تَعْمَلُ عَمَلَ «إِنَّ»: تَنْصِبُ الاِسْمَ وَتَرْفَعُ الخَبَرَ، وَاسْمُهَا المُفْرَدُ يُبْنَى عَلَى الفَتْحِ.'
    explication: «شَكَّ» اسْمُ «لَا» مَبْنِيٌّ عَلَى الفَتْحِ فِي مَحَلِّ نَصْبٍ.
- notion: الأفعال الجامدة والمتصرفة
  exercices:
  - id: jamid-1
    difficulte: 1
    enonce: هَلِ الفِعْلُ «لَيْسَ» جَامِدٌ أَمْ مُتَصَرِّفٌ؟ (جَامِدٌ / مُتَصَرِّفٌ)
    reponses:
    - جَامِدٌ
    erreurs:
      مُتَصَرِّفٌ: خلط بين الجامد والمتصرف
    indice: الجَامِدُ يَلْزَمُ صُورَةً وَاحِدَةً (لَيْسَ، عَسَى، نِعْمَ، بِئْسَ)، وَالمُتَصَرِّفُ يَأْتِي مِنْهُ المَاضِي وَالمُضَارِعُ وَالأَمْرُ.
    explication: '«لَيْسَ» فِعْلٌ جَامِدٌ: لَا مُضَارِعَ لَهُ وَلَا أَمْرَ.'
  - id: jamid-2
    difficulte: 1
    enonce: هَلِ الفِعْلُ «كَتَبَ» جَامِدٌ أَمْ مُتَصَرِّفٌ؟ (جَامِدٌ / مُتَصَرِّفٌ)
    reponses:
    - مُتَصَرِّفٌ
    erreurs:
      جَامِدٌ: خلط بين الجامد والمتصرف
    indice: الجَامِدُ يَلْزَمُ صُورَةً وَاحِدَةً (لَيْسَ، عَسَى، نِعْمَ، بِئْسَ)، وَالمُتَصَرِّفُ يَأْتِي مِنْهُ المَاضِي وَالمُضَارِعُ وَالأَمْرُ.
    explication: '«كَتَبَ» مُتَصَرِّفٌ تَامُّ التَّصَرُّفِ: كَتَبَ، يَكْتُبُ، اُكْتُبْ.'
  - id: jamid-3
    difficulte: 1
    enonce: هَلِ الفِعْلُ «نِعْمَ» جَامِدٌ أَمْ مُتَصَرِّفٌ؟ (جَامِدٌ / مُتَصَرِّفٌ)
    reponses:
    - جَامِدٌ
    erreurs:
      مُتَصَرِّفٌ: خلط بين الجامد والمتصرف
    indice: الجَامِدُ يَلْزَمُ صُورَةً وَاحِدَةً (لَيْسَ، عَسَى، نِعْمَ، بِئْسَ)، وَالمُتَصَرِّفُ يَأْتِي مِنْهُ المَاضِي وَالمُضَارِعُ وَالأَمْرُ.
    explication: «نِعْمَ» فِعْلٌ جَامِدٌ لِلْمَدْحِ.
  - id: jamid-4
    difficulte: 2
    enonce: هَلِ الفِعْلُ «عَسَى» جَامِدٌ أَمْ مُتَصَرِّفٌ؟ (جَامِدٌ / مُتَصَرِّفٌ)
    reponses:
    - جَامِدٌ
    erreurs:
      مُتَصَرِّفٌ: خلط بين الجامد والمتصرف
    indice: الجَامِدُ يَلْزَمُ صُورَةً وَاحِدَةً (لَيْسَ، عَسَى، نِعْمَ، بِئْسَ)، وَالمُتَصَرِّفُ يَأْتِي مِنْهُ المَاضِي وَالمُضَارِعُ وَالأَمْرُ.
    explication: «عَسَى» فِعْلٌ جَامِدٌ يَلْزَمُ صُورَةَ المَاضِي.
  - id: jamid-5
    difficulte: 2
    enonce: مَا نَوْعُ تَصَرُّفِ «كَادَ»؟ (تَامُّ التَّصَرُّفِ / نَاقِصُ التَّصَرُّفِ / جَامِدٌ)
    reponses:
    - نَاقِصُ التَّصَرُّفِ
    erreurs:
      تَامُّ التَّصَرُّفِ: خطأ في أنواع التصرف
      جَامِدٌ: خطأ في أنواع التصرف
    indice: لَهُ مَاضٍ (كَادَ) وَمُضَارِعٌ (يَكَادُ)، وَلَا أَمْرَ لَهُ.
    explication: '«كَادَ» نَاقِصُ التَّصَرُّفِ: مَاضٍ وَمُضَارِعٌ دُونَ أَمْرٍ.'
  - id: jamid-6
    difficulte: 2
    enonce: مَا نَوْعُ تَصَرُّفِ «لَعِبَ»؟ (تَامُّ التَّصَرُّفِ / نَاقِصُ التَّصَرُّفِ / جَامِدٌ)
    reponses:
    - تَامُّ التَّصَرُّفِ
    erreurs:
      نَاقِصُ التَّصَرُّفِ: خطأ في أنواع التصرف
      جَامِدٌ: خطأ في أنواع التصرف
    indice: هَلْ لَهُ مَاضٍ وَمُضَارِعٌ وَأَمْرٌ؟
    explication: '«لَعِبَ» تَامُّ التَّصَرُّفِ: لَعِبَ، يَلْعَبُ، اِلْعَبْ.'
  - id: jamid-7
    difficulte: 2
    enonce: أَيُّ هَذِهِ الأَفْعَالِ جَامِدٌ؟ (بِئْسَ / شَرِبَ / جَلَسَ)
    reponses:
    - بِئْسَ
    erreurs:
      شَرِبَ: خلط بين الجامد والمتصرف
      جَلَسَ: خلط بين الجامد والمتصرف
    indice: الجَامِدُ يَلْزَمُ صُورَةً وَاحِدَةً (لَيْسَ، عَسَى، نِعْمَ، بِئْسَ)، وَالمُتَصَرِّفُ يَأْتِي مِنْهُ المَاضِي وَالمُضَارِعُ وَالأَمْرُ.
    explication: «بِئْسَ» فِعْلٌ جَامِدٌ لِلذَّمِّ.
  - id: jamid-8
    difficulte: 2
    enonce: هَلْ لِلْفِعْلِ «لَيْسَ» مُضَارِعٌ؟ (نَعَمْ / لَا)
    reponses:
    - لَا
    erreurs:
      نَعَمْ: خلط بين الجامد والمتصرف
    indice: «لَيْسَ» يَلْزَمُ صُورَةً وَاحِدَةً.
    explication: 'لَا: «لَيْسَ» جَامِدٌ، لَا مُضَارِعَ لَهُ وَلَا أَمْرَ.'
  - id: jamid-9
    difficulte: 3
    enonce: مَا نَوْعُ تَصَرُّفِ «زَالَ» (النَّاسِخَةِ)؟ (تَامُّ التَّصَرُّفِ / نَاقِصُ التَّصَرُّفِ / جَامِدٌ)
    reponses:
    - نَاقِصُ التَّصَرُّفِ
    erreurs:
      تَامُّ التَّصَرُّفِ: خطأ في أنواع التصرف
      جَامِدٌ: خطأ في أنواع التصرف
    indice: 'نَقُولُ: مَا زَالَ، لَا يَزَالُ؛ وَلَا أَمْرَ لَهَا.'
    explication: «زَالَ» النَّاسِخَةُ نَاقِصَةُ التَّصَرُّفِ.
  - id: jamid-10
    difficulte: 3
    enonce: أَيُّ صِيغَةٍ يَلْزَمُهَا فِعْلُ التَّعَجُّبِ «أَفْعَلَ» (مَا أَجْمَلَ!)؟ (المَاضِي / المُضَارِعُ / الأَمْرُ)
    reponses:
    - المَاضِي
    erreurs:
      المُضَارِعُ: خلط بين الجامد والمتصرف
      الأَمْرُ: خلط بين الجامد والمتصرف
    indice: «مَا أَجْمَلَ السَّمَاءَ!» لَا يَتَغَيَّرُ.
    explication: فِعْلُ التَّعَجُّبِ جَامِدٌ يَلْزَمُ صُورَةَ المَاضِي.
  - id: jamid-11
    difficulte: 3
    enonce: مَا الفِعْلُ الجَامِدُ الَّذِي يَلْزَمُ صُورَةَ الأَمْرِ؟ (هَبْ / كَتَبَ / يَقْرَأُ)
    reponses:
    - هَبْ
    erreurs:
      كَتَبَ: خلط بين الجامد والمتصرف
      يَقْرَأُ: خلط بين الجامد والمتصرف
    indice: '«هَبْ» بِمَعْنَى «اِفْتَرِضْ»: هَبْ أَنَّكَ نَجَحْتَ.'
    explication: «هَبْ» (بِمَعْنَى اِفْتَرِضْ) فِعْلٌ جَامِدٌ يَلْزَمُ صُورَةَ الأَمْرِ.
  - id: jamid-12
    difficulte: 3
    enonce: هَلِ الفِعْلُ «حَبَّذَا» جَامِدٌ أَمْ مُتَصَرِّفٌ؟ (جَامِدٌ / مُتَصَرِّفٌ)
    reponses:
    - جَامِدٌ
    erreurs:
      مُتَصَرِّفٌ: خلط بين الجامد والمتصرف
    indice: «حَبَّذَا» لِلْمَدْحِ.
    explication: «حَبَّ» فِي «حَبَّذَا» فِعْلٌ جَامِدٌ لِلْمَدْحِ.
  - id: jamid-13
    difficulte: 3
    enonce: لِمَاذَا نُسَمِّي الفِعْلَ جَامِدًا؟ (لِأَنَّهُ يَلْزَمُ صُورَةً وَاحِدَةً / لِأَنَّهُ لَازِمٌ / لِأَنَّهُ مَبْنِيٌّ لِلْمَجْهُولِ)
    reponses:
    - لِأَنَّهُ يَلْزَمُ صُورَةً وَاحِدَةً
    erreurs:
      لِأَنَّهُ لَازِمٌ: خلط بين الجامد والمتصرف
      لِأَنَّهُ مَبْنِيٌّ لِلْمَجْهُولِ: خلط بين الجامد والمتصرف
    indice: الجَامِدُ يَلْزَمُ صُورَةً وَاحِدَةً (لَيْسَ، عَسَى، نِعْمَ، بِئْسَ)، وَالمُتَصَرِّفُ يَأْتِي مِنْهُ المَاضِي وَالمُضَارِعُ وَالأَمْرُ.
    explication: الفِعْلُ الجَامِدُ يَلْزَمُ صُورَةً وَاحِدَةً وَلَا يَتَصَرَّفُ.
- notion: نونا التوكيد
  exercices:
  - id: tawkidnun-1
    difficulte: 1
    enonce: أَيُّ فِعْلٍ فِيهِ نُونُ تَوْكِيدٍ ثَقِيلَةٌ؟ (لَأَجْتَهِدَنَّ / أَجْتَهِدُ / اجْتَهَدْنَا)
    reponses:
    - لَأَجْتَهِدَنَّ
    erreurs:
      أَجْتَهِدُ: خطأ في تحديد نون التوكيد
      اجْتَهَدْنَا: خطأ في تحديد نون التوكيد
    indice: نُونُ التَّوْكِيدِ ثَقِيلَةٌ (نَّ) أَوْ خَفِيفَةٌ (نْ)، تَدْخُلُ عَلَى المُضَارِعِ وَالأَمْرِ، وَلَا تَدْخُلُ عَلَى المَاضِي.
    explication: «لَأَجْتَهِدَنَّ» فِيهِ نُونُ تَوْكِيدٍ ثَقِيلَةٌ (مُشَدَّدَةٌ).
  - id: tawkidnun-2
    difficulte: 1
    enonce: عَلَى أَيِّ فِعْلٍ لَا تَدْخُلُ نُونُ التَّوْكِيدِ؟ (المَاضِي / المُضَارِعِ / الأَمْرِ)
    reponses:
    - المَاضِي
    erreurs:
      المُضَارِعِ: خطأ في مواضع نون التوكيد
      الأَمْرِ: خطأ في مواضع نون التوكيد
    indice: نُونُ التَّوْكِيدِ ثَقِيلَةٌ (نَّ) أَوْ خَفِيفَةٌ (نْ)، تَدْخُلُ عَلَى المُضَارِعِ وَالأَمْرِ، وَلَا تَدْخُلُ عَلَى المَاضِي.
    explication: لَا تَدْخُلُ نُونُ التَّوْكِيدِ عَلَى المَاضِي.
  - id: tawkidnun-3
    difficulte: 1
    enonce: مَا نَوْعُ النُّونِ فِي «اُكْتُبَنْ»؟ (ثَقِيلَةٌ / خَفِيفَةٌ)
    reponses:
    - خَفِيفَةٌ
    erreurs:
      ثَقِيلَةٌ: خلط بين النون الثقيلة والخفيفة
    indice: نُونُ التَّوْكِيدِ ثَقِيلَةٌ (نَّ) أَوْ خَفِيفَةٌ (نْ)، تَدْخُلُ عَلَى المُضَارِعِ وَالأَمْرِ، وَلَا تَدْخُلُ عَلَى المَاضِي.
    explication: النُّونُ فِي «اُكْتُبَنْ» خَفِيفَةٌ (سَاكِنَةٌ).
  - id: tawkidnun-4
    difficulte: 2
    voyelles_obligatoires: true
    enonce: 'أَكِّدِ الأَمْرَ «اُدْرُسْ» بِالنُّونِ الثَّقِيلَةِ: (اُدْرُسَنَّ / اُدْرُسْنَ / اُدْرُسُنَّ)'
    reponses:
    - اُدْرُسَنَّ
    erreurs:
      اُدْرُسْنَ: خطأ في توكيد الفعل بالنون
      اُدْرُسُنَّ: خطأ في توكيد الفعل بالنون
    indice: يُبْنَى الفِعْلُ عَلَى الفَتْحِ مَعَ نُونِ التَّوْكِيدِ.
    explication: 'نَقُولُ: اُدْرُسَنَّ؛ مَبْنِيٌّ عَلَى الفَتْحِ.'
  - id: tawkidnun-5
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: وَاللَّهِ ... بِوَعْدِي. (لَأَفِيَنَّ / لَأَفِي / لَوَفَيْتُ)'
    reponses:
    - لَأَفِيَنَّ
    erreurs:
      لَأَفِي: خطأ في توكيد الفعل بالنون
      لَوَفَيْتُ: خطأ في توكيد الفعل بالنون
    indice: جَوَابُ القَسَمِ المُضَارِعُ المُثْبَتُ يُؤَكَّدُ بِاللَّامِ وَالنُّونِ.
    explication: 'نَقُولُ: وَاللَّهِ لَأَفِيَنَّ بِوَعْدِي.'
  - id: tawkidnun-6
    difficulte: 2
    enonce: عَلَامَ يُبْنَى المُضَارِعُ المُتَّصِلُ بِنُونِ التَّوْكِيدِ اتِّصَالًا مُبَاشِرًا؟ (الفَتْحِ / السُّكُونِ / الضَّمِّ)
    reponses:
    - الفَتْحِ
    erreurs:
      السُّكُونِ: خطأ في بناء المضارع المؤكد
      الضَّمِّ: خطأ في بناء المضارع المؤكد
    indice: 'مِثَالٌ: لَأَجْتَهِدَنَّ.'
    explication: 'يُبْنَى عَلَى الفَتْحِ: لَأَجْتَهِدَنَّ.'
  - id: tawkidnun-7
    difficulte: 2
    enonce: هَلْ يُؤَكَّدُ فِعْلُ الأَمْرِ بِالنُّونِ؟ (نَعَمْ جَوَازًا / لَا أَبَدًا / وُجُوبًا)
    reponses:
    - نَعَمْ جَوَازًا
    erreurs:
      لَا أَبَدًا: خطأ في مواضع نون التوكيد
      وُجُوبًا: خطأ في مواضع نون التوكيد
    indice: 'مِثَالٌ: اُكْتُبَنَّ.'
    explication: 'يَجُوزُ تَوْكِيدُ فِعْلِ الأَمْرِ بِالنُّونِ: اُكْتُبَنَّ.'
  - id: tawkidnun-8
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'أَكِّدْ «لَا تَتَأَخَّرُوا» بِالنُّونِ الثَّقِيلَةِ: (لَا تَتَأَخَّرُنَّ / لَا تَتَأَخَّرَنَّ / لَا تَتَأَخَّرُونَنَّ)'
    reponses:
    - لَا تَتَأَخَّرُنَّ
    erreurs:
      لَا تَتَأَخَّرَنَّ: خطأ في توكيد الفعل بالنون
      لَا تَتَأَخَّرُونَنَّ: خطأ في توكيد الفعل بالنون
    indice: مَعَ وَاوِ الجَمَاعَةِ تُحْذَفُ الوَاوُ وَتَبْقَى الضَّمَّةُ.
    explication: 'نَقُولُ: لَا تَتَأَخَّرُنَّ (تُحْذَفُ وَاوُ الجَمَاعَةِ لِالْتِقَاءِ السَّاكِنَيْنِ).'
  - id: tawkidnun-9
    difficulte: 3
    voyelles_obligatoires: true
    enonce: 'أَكِّدْ «اُكْتُبِي» بِالنُّونِ الثَّقِيلَةِ: (اُكْتُبِنَّ / اُكْتُبَنَّ / اُكْتُبُنَّ)'
    reponses:
    - اُكْتُبِنَّ
    erreurs:
      اُكْتُبَنَّ: خطأ في توكيد الفعل بالنون
      اُكْتُبُنَّ: خطأ في توكيد الفعل بالنون
    indice: مَعَ يَاءِ المُخَاطَبَةِ تُحْذَفُ اليَاءُ وَتَبْقَى الكَسْرَةُ.
    explication: 'نَقُولُ: اُكْتُبِنَّ.'
  - id: tawkidnun-10
    difficulte: 3
    enonce: مَتَى يَجِبُ تَوْكِيدُ المُضَارِعِ بِالنُّونِ؟ (إِذَا كَانَ جَوَابَ قَسَمٍ مُثْبَتًا مُسْتَقْبَلًا / بَعْدَ «لَمْ» / بَعْدَ «لَنْ»)
    reponses:
    - إِذَا كَانَ جَوَابَ قَسَمٍ مُثْبَتًا مُسْتَقْبَلًا
    erreurs:
      بَعْدَ «لَمْ»: خطأ في مواضع نون التوكيد
      بَعْدَ «لَنْ»: خطأ في مواضع نون التوكيد
    indice: 'مِثَالٌ: وَاللَّهِ لَأَنْجَحَنَّ.'
    explication: يَجِبُ تَوْكِيدُهُ إِذَا وَقَعَ جَوَابَ قَسَمٍ مُثْبَتًا دَالًّا عَلَى المُسْتَقْبَلِ، وَلَمْ يُفْصَلْ عَنِ اللَّامِ.
  - id: tawkidnun-11
    difficulte: 3
    enonce: 'مَا إِعْرَابُ «يَنْجَحَنَّ» فِي: لَيَنْجَحَنَّ المُجْتَهِدُ؟ (مُضَارِعٌ مَبْنِيٌّ عَلَى الفَتْحِ / مُضَارِعٌ مَنْصُوبٌ / مُضَارِعٌ مَرْفُوعٌ)'
    reponses:
    - مُضَارِعٌ مَبْنِيٌّ عَلَى الفَتْحِ
    erreurs:
      مُضَارِعٌ مَنْصُوبٌ: خطأ في بناء المضارع المؤكد
      مُضَارِعٌ مَرْفُوعٌ: خطأ في بناء المضارع المؤكد
    indice: نُونُ التَّوْكِيدِ ثَقِيلَةٌ (نَّ) أَوْ خَفِيفَةٌ (نْ)، تَدْخُلُ عَلَى المُضَارِعِ وَالأَمْرِ، وَلَا تَدْخُلُ عَلَى المَاضِي.
    explication: «يَنْجَحَنَّ» مُضَارِعٌ مَبْنِيٌّ عَلَى الفَتْحِ لِاتِّصَالِهِ بِنُونِ التَّوْكِيدِ.
  - id: tawkidnun-12
    difficulte: 3
    enonce: أَيُّ جُمْلَةٍ صَحِيحَةٌ؟ (هَلْ تُسَافِرَنَّ غَدًا؟ / سَافَرَنَّ أَمْسِ / لَمْ يُسَافِرَنَّ)
    reponses:
    - هَلْ تُسَافِرَنَّ غَدًا؟
    erreurs:
      سَافَرَنَّ أَمْسِ: خطأ في مواضع نون التوكيد
      لَمْ يُسَافِرَنَّ: خطأ في مواضع نون التوكيد
    indice: لَا تَدْخُلُ النُّونُ عَلَى المَاضِي، وَيَجُوزُ التَّوْكِيدُ بَعْدَ الاِسْتِفْهَامِ.
    explication: '«هَلْ تُسَافِرَنَّ غَدًا؟» صَحِيحَةٌ: يَجُوزُ التَّوْكِيدُ بَعْدَ الاِسْتِفْهَامِ.'
  - id: tawkidnun-13
    difficulte: 3
    enonce: مَا الفَرْقُ بَيْنَ النُّونَيْنِ؟ (الثَّقِيلَةُ مُشَدَّدَةٌ مَفْتُوحَةٌ وَالخَفِيفَةُ سَاكِنَةٌ / لَا فَرْقَ / الخَفِيفَةُ تَدْخُلُ عَلَى المَاضِي)
    reponses:
    - الثَّقِيلَةُ مُشَدَّدَةٌ مَفْتُوحَةٌ وَالخَفِيفَةُ سَاكِنَةٌ
    erreurs:
      لَا فَرْقَ: خلط بين النون الثقيلة والخفيفة
      الخَفِيفَةُ تَدْخُلُ عَلَى المَاضِي: خلط بين النون الثقيلة والخفيفة
    indice: نُونُ التَّوْكِيدِ ثَقِيلَةٌ (نَّ) أَوْ خَفِيفَةٌ (نْ)، تَدْخُلُ عَلَى المُضَارِعِ وَالأَمْرِ، وَلَا تَدْخُلُ عَلَى المَاضِي.
    explication: 'الثَّقِيلَةُ: نَّ (مُشَدَّدَةٌ مَفْتُوحَةٌ)، وَالخَفِيفَةُ: نْ (سَاكِنَةٌ).'
- notion: الإضافة
  exercices:
  - id: idafa-1
    difficulte: 1
    enonce: 'مَا المُضَافُ إِلَيْهِ فِي: بَابُ البَيْتِ مَفْتُوحٌ؟ (بَابُ / البَيْتِ / مَفْتُوحٌ)'
    reponses:
    - البَيْتِ
    erreurs:
      بَابُ: خلط بين المضاف والمضاف إليه
      مَفْتُوحٌ: خلط بين المضاف والمضاف إليه
    indice: المُضَافُ يُعْرَبُ حَسَبَ مَوْقِعِهِ وَلَا يُنَوَّنُ وَلَا تَدْخُلُهُ «ال»، وَالمُضَافُ إِلَيْهِ مَجْرُورٌ دَائِمًا.
    explication: «البَيْتِ» مُضَافٌ إِلَيْهِ مَجْرُورٌ، وَ«بَابُ» مُضَافٌ.
  - id: idafa-2
    difficulte: 1
    enonce: 'مَا المُضَافُ فِي: قَرَأْتُ كِتَابَ التَّارِيخِ؟ (قَرَأْتُ / كِتَابَ / التَّارِيخِ)'
    reponses:
    - كِتَابَ
    erreurs:
      قَرَأْتُ: خلط بين المضاف والمضاف إليه
      التَّارِيخِ: خلط بين المضاف والمضاف إليه
    indice: المُضَافُ يُعْرَبُ حَسَبَ مَوْقِعِهِ وَلَا يُنَوَّنُ وَلَا تَدْخُلُهُ «ال»، وَالمُضَافُ إِلَيْهِ مَجْرُورٌ دَائِمًا.
    explication: «كِتَابَ» مُضَافٌ (مَفْعُولٌ بِهِ مَنْصُوبٌ)، وَ«التَّارِيخِ» مُضَافٌ إِلَيْهِ.
  - id: idafa-3
    difficulte: 1
    enonce: مَا حُكْمُ المُضَافِ إِلَيْهِ؟ (مَجْرُورٌ دَائِمًا / مَرْفُوعٌ / حَسَبَ مَوْقِعِهِ)
    reponses:
    - مَجْرُورٌ دَائِمًا
    erreurs:
      مَرْفُوعٌ: خطأ في حكم المضاف إليه
      حَسَبَ مَوْقِعِهِ: خطأ في حكم المضاف إليه
    indice: المُضَافُ يُعْرَبُ حَسَبَ مَوْقِعِهِ وَلَا يُنَوَّنُ وَلَا تَدْخُلُهُ «ال»، وَالمُضَافُ إِلَيْهِ مَجْرُورٌ دَائِمًا.
    explication: المُضَافُ إِلَيْهِ مَجْرُورٌ دَائِمًا.
  - id: idafa-4
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: هَذِهِ ... المَدْرَسَةِ. (حَدِيقَةٌ / حَدِيقَةُ / الحَدِيقَةُ)'
    reponses:
    - حَدِيقَةُ
    erreurs:
      حَدِيقَةٌ: خطأ في المضاف
      الحَدِيقَةُ: خطأ في المضاف
    indice: المُضَافُ لَا يُنَوَّنُ وَلَا تَدْخُلُهُ «ال».
    explication: 'نَقُولُ: هَذِهِ حَدِيقَةُ المَدْرَسَةِ.'
  - id: idafa-5
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: سَلَّمْتُ عَلَى مُدِيرِ ... (المَدْرَسَةُ / المَدْرَسَةَ / المَدْرَسَةِ)'
    reponses:
    - المَدْرَسَةِ
    erreurs:
      المَدْرَسَةُ: خطأ في إعراب المضاف إليه
      المَدْرَسَةَ: خطأ في إعراب المضاف إليه
    indice: المُضَافُ يُعْرَبُ حَسَبَ مَوْقِعِهِ وَلَا يُنَوَّنُ وَلَا تَدْخُلُهُ «ال»، وَالمُضَافُ إِلَيْهِ مَجْرُورٌ دَائِمًا.
    explication: 'نَقُولُ: مُدِيرِ المَدْرَسَةِ؛ المُضَافُ إِلَيْهِ مَجْرُورٌ.'
  - id: idafa-6
    difficulte: 2
    enonce: 'أَضِفْ «مُعَلِّمُونَ» إِلَى «المَدْرَسَةِ»: (مُعَلِّمُونَ المَدْرَسَةِ / مُعَلِّمُو المَدْرَسَةِ / مُعَلِّمِينَ المَدْرَسَةِ)'
    reponses:
    - مُعَلِّمُو المَدْرَسَةِ
    erreurs:
      مُعَلِّمُونَ المَدْرَسَةِ: خطأ في إضافة المثنى والجمع
      مُعَلِّمِينَ المَدْرَسَةِ: خطأ في إضافة المثنى والجمع
    indice: تُحْذَفُ نُونُ جَمْعِ المُذَكَّرِ السَّالِمِ عِنْدَ الإِضَافَةِ.
    explication: 'نَقُولُ: مُعَلِّمُو المَدْرَسَةِ؛ تُحْذَفُ النُّونُ.'
  - id: idafa-7
    difficulte: 2
    enonce: 'أَضِفْ «كِتَابَانِ» إِلَى «أَحْمَدَ»: (كِتَابَانِ أَحْمَدَ / كِتَابَا أَحْمَدَ / كِتَابَيْنِ أَحْمَدَ)'
    reponses:
    - كِتَابَا أَحْمَدَ
    erreurs:
      كِتَابَانِ أَحْمَدَ: خطأ في إضافة المثنى والجمع
      كِتَابَيْنِ أَحْمَدَ: خطأ في إضافة المثنى والجمع
    indice: تُحْذَفُ نُونُ المُثَنَّى عِنْدَ الإِضَافَةِ.
    explication: 'نَقُولُ: كِتَابَا أَحْمَدَ.'
  - id: idafa-8
    difficulte: 3
    enonce: 'مَا المُضَافُ إِلَيْهِ فِي: قَلَمِي جَدِيدٌ؟ (قَلَمِ / اليَاءُ / جَدِيدٌ)'
    reponses:
    - اليَاءُ
    erreurs:
      قَلَمِ: خلط بين المضاف والمضاف إليه
      جَدِيدٌ: خلط بين المضاف والمضاف إليه
    indice: قَدْ يَكُونُ المُضَافُ إِلَيْهِ ضَمِيرًا.
    explication: يَاءُ المُتَكَلِّمِ ضَمِيرٌ فِي مَحَلِّ جَرٍّ مُضَافٌ إِلَيْهِ.
  - id: idafa-9
    difficulte: 3
    enonce: مَاذَا يَكْتَسِبُ المُضَافُ مِنَ المُضَافِ إِلَيْهِ المَعْرِفَةِ؟ (التَّعْرِيفَ / التَّنْوِينَ / الجَرَّ)
    reponses:
    - التَّعْرِيفَ
    erreurs:
      التَّنْوِينَ: خطأ في فائدة الإضافة
      الجَرَّ: خطأ في فائدة الإضافة
    indice: 'قَارِنْ: «كِتَابُ تِلْمِيذٍ» / «كِتَابُ التِّلْمِيذِ».'
    explication: يَكْتَسِبُ المُضَافُ التَّعْرِيفَ إِذَا أُضِيفَ إِلَى مَعْرِفَةٍ، وَالتَّخْصِيصَ إِذَا أُضِيفَ إِلَى نَكِرَةٍ.
  - id: idafa-10
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: رَأَيْتُ ... الحَدِيقَةِ. (عَامِلِي / عَامِلِينَ / عَامِلُو)'
    reponses:
    - عَامِلِي
    erreurs:
      عَامِلِينَ: خطأ في إضافة المثنى والجمع
      عَامِلُو: خطأ في إضافة المثنى والجمع
    indice: 'مَفْعُولٌ بِهِ جَمْعُ مُذَكَّرٍ سَالِمٌ مُضَافٌ: يُنْصَبُ بِاليَاءِ وَتُحْذَفُ النُّونُ.'
    explication: 'نَقُولُ: رَأَيْتُ عَامِلِي الحَدِيقَةِ.'
  - id: idafa-11
    difficulte: 3
    enonce: 'كَمْ مُضَافًا فِي: هَذَا بَابُ بَيْتِ جَدِّي؟ (وَاحِدٌ / اثْنَانِ / ثَلَاثَةٌ)'
    reponses:
    - اثْنَانِ
    erreurs:
      وَاحِدٌ: خطأ في تحديد المضاف
      ثَلَاثَةٌ: خطأ في تحديد المضاف
    indice: «بَابُ» مُضَافٌ إِلَى «بَيْتِ»، وَ«بَيْتِ» مُضَافٌ إِلَى «جَدِّ».
    explication: 'مُضَافَانِ: «بَابُ» وَ«بَيْتِ»؛ وَ«بَيْتِ» مُضَافٌ وَمُضَافٌ إِلَيْهِ مَعًا.'
  - id: idafa-12
    difficulte: 3
    enonce: لِمَاذَا لَا نَقُولُ «البَابُ البَيْتِ»؟ (لِأَنَّ المُضَافَ لَا تَدْخُلُهُ «ال» / لِأَنَّ البَيْتَ مُذَكَّرٌ / لِأَنَّ البَابَ مُؤَنَّثٌ)
    reponses:
    - لِأَنَّ المُضَافَ لَا تَدْخُلُهُ «ال»
    erreurs:
      لِأَنَّ البَيْتَ مُذَكَّرٌ: خطأ في المضاف
      لِأَنَّ البَابَ مُؤَنَّثٌ: خطأ في المضاف
    indice: المُضَافُ يُعْرَبُ حَسَبَ مَوْقِعِهِ وَلَا يُنَوَّنُ وَلَا تَدْخُلُهُ «ال»، وَالمُضَافُ إِلَيْهِ مَجْرُورٌ دَائِمًا.
    explication: 'المُضَافُ لَا تَدْخُلُهُ «ال»: نَقُولُ «بَابُ البَيْتِ».'
  - id: idafa-13
    difficulte: 3
    enonce: 'مَا إِعْرَابُ «يَوْمِ» فِي: سَافَرْتُ صَبَاحَ يَوْمِ الجُمُعَةِ؟ (مُضَافٌ إِلَيْهِ مَجْرُورٌ وَهُوَ مُضَافٌ / ظَرْفُ زَمَانٍ مَنْصُوبٌ / مَفْعُولٌ بِهِ)'
    reponses:
    - مُضَافٌ إِلَيْهِ مَجْرُورٌ وَهُوَ مُضَافٌ
    erreurs:
      ظَرْفُ زَمَانٍ مَنْصُوبٌ: خطأ في إعراب المضاف إليه
      مَفْعُولٌ بِهِ: خطأ في إعراب المضاف إليه
    indice: «صَبَاحَ» ظَرْفٌ مُضَافٌ إِلَى «يَوْمِ».
    explication: «يَوْمِ» مُضَافٌ إِلَيْهِ مَجْرُورٌ، وَهُوَ مُضَافٌ إِلَى «الجُمُعَةِ».
- notion: الابتداء بالنكرة
  exercices:
  - id: nakiramub-1
    difficulte: 1
    enonce: 'لِمَاذَا جَازَ الاِبْتِدَاءُ بِالنَّكِرَةِ فِي: فِي البَيْتِ رَجُلٌ؟ (لِتَقَدُّمِ الخَبَرِ شِبْهِ الجُمْلَةِ / لِأَنَّهَا مَوْصُوفَةٌ / لِأَنَّهَا مُضَافَةٌ)'
    reponses:
    - لِتَقَدُّمِ الخَبَرِ شِبْهِ الجُمْلَةِ
    erreurs:
      لِأَنَّهَا مَوْصُوفَةٌ: خطأ في مسوغات الابتداء بالنكرة
      لِأَنَّهَا مُضَافَةٌ: خطأ في مسوغات الابتداء بالنكرة
    indice: 'لَا يُبْتَدَأُ بِالنَّكِرَةِ إِلَّا إِذَا أَفَادَتْ: إِذَا تَقَدَّمَ الخَبَرُ شِبْهُ الجُمْلَةِ، أَوْ وُصِفَتْ، أَوْ أُضِيفَتْ، أَوْ سَبَقَهَا نَفْيٌ أَوِ اسْتِفْهَامٌ.'
    explication: جَازَ لِأَنَّ الخَبَرَ شِبْهُ جُمْلَةٍ تَقَدَّمَ عَلَيْهَا.
  - id: nakiramub-2
    difficulte: 1
    enonce: 'لِمَاذَا جَازَ الاِبْتِدَاءُ بِالنَّكِرَةِ فِي: طَالِبٌ مُجْتَهِدٌ خَيْرٌ مِنْ كَسُولٍ؟ (لِأَنَّهَا مَوْصُوفَةٌ / لِتَقَدُّمِ الخَبَرِ / لِأَنَّهَا مُضَافَةٌ)'
    reponses:
    - لِأَنَّهَا مَوْصُوفَةٌ
    erreurs:
      لِتَقَدُّمِ الخَبَرِ: خطأ في مسوغات الابتداء بالنكرة
      لِأَنَّهَا مُضَافَةٌ: خطأ في مسوغات الابتداء بالنكرة
    indice: 'لَا يُبْتَدَأُ بِالنَّكِرَةِ إِلَّا إِذَا أَفَادَتْ: إِذَا تَقَدَّمَ الخَبَرُ شِبْهُ الجُمْلَةِ، أَوْ وُصِفَتْ، أَوْ أُضِيفَتْ، أَوْ سَبَقَهَا نَفْيٌ أَوِ اسْتِفْهَامٌ.'
    explication: جَازَ لِأَنَّ النَّكِرَةَ «طَالِبٌ» مَوْصُوفَةٌ بِـ«مُجْتَهِدٌ».
  - id: nakiramub-3
    difficulte: 1
    enonce: أَيُّ جُمْلَةٍ غَيْرُ صَحِيحَةٍ؟ (رَجُلٌ فِي الدَّارِ / فِي الدَّارِ رَجُلٌ / عِنْدِي كِتَابٌ)
    reponses:
    - رَجُلٌ فِي الدَّارِ
    erreurs:
      فِي الدَّارِ رَجُلٌ: خطأ في الابتداء بالنكرة
      عِنْدِي كِتَابٌ: خطأ في الابتداء بالنكرة
    indice: النَّكِرَةُ لَا يُبْتَدَأُ بِهَا إِلَّا إِذَا أَفَادَتْ.
    explication: '«رَجُلٌ فِي الدَّارِ» لَا تَصِحُّ: يَجِبُ تَقْدِيمُ الخَبَرِ: فِي الدَّارِ رَجُلٌ.'
  - id: nakiramub-4
    difficulte: 2
    enonce: 'لِمَاذَا جَازَ الاِبْتِدَاءُ بِالنَّكِرَةِ فِي: كِتَابُ عِلْمٍ مُفِيدٌ؟ (لِأَنَّهَا مُضَافَةٌ / لِأَنَّهَا مَوْصُوفَةٌ / لِتَقَدُّمِ الخَبَرِ)'
    reponses:
    - لِأَنَّهَا مُضَافَةٌ
    erreurs:
      لِأَنَّهَا مَوْصُوفَةٌ: خطأ في مسوغات الابتداء بالنكرة
      لِتَقَدُّمِ الخَبَرِ: خطأ في مسوغات الابتداء بالنكرة
    indice: 'لَا يُبْتَدَأُ بِالنَّكِرَةِ إِلَّا إِذَا أَفَادَتْ: إِذَا تَقَدَّمَ الخَبَرُ شِبْهُ الجُمْلَةِ، أَوْ وُصِفَتْ، أَوْ أُضِيفَتْ، أَوْ سَبَقَهَا نَفْيٌ أَوِ اسْتِفْهَامٌ.'
    explication: جَازَ لِأَنَّ «كِتَابُ» مُضَافَةٌ إِلَى «عِلْمٍ».
  - id: nakiramub-5
    difficulte: 2
    enonce: 'لِمَاذَا جَازَ الاِبْتِدَاءُ بِالنَّكِرَةِ فِي: مَا أَحَدٌ غَائِبٌ؟ (لِأَنَّهَا مَسْبُوقَةٌ بِنَفْيٍ / لِأَنَّهَا مَوْصُوفَةٌ / لِأَنَّهَا مُضَافَةٌ)'
    reponses:
    - لِأَنَّهَا مَسْبُوقَةٌ بِنَفْيٍ
    erreurs:
      لِأَنَّهَا مَوْصُوفَةٌ: خطأ في مسوغات الابتداء بالنكرة
      لِأَنَّهَا مُضَافَةٌ: خطأ في مسوغات الابتداء بالنكرة
    indice: 'لَا يُبْتَدَأُ بِالنَّكِرَةِ إِلَّا إِذَا أَفَادَتْ: إِذَا تَقَدَّمَ الخَبَرُ شِبْهُ الجُمْلَةِ، أَوْ وُصِفَتْ، أَوْ أُضِيفَتْ، أَوْ سَبَقَهَا نَفْيٌ أَوِ اسْتِفْهَامٌ.'
    explication: جَازَ لِأَنَّ النَّكِرَةَ سَبَقَهَا نَفْيٌ.
  - id: nakiramub-6
    difficulte: 2
    enonce: 'لِمَاذَا جَازَ الاِبْتِدَاءُ بِالنَّكِرَةِ فِي: هَلْ صَدِيقٌ مَعَكَ؟ (لِأَنَّهَا مَسْبُوقَةٌ بِاسْتِفْهَامٍ / لِأَنَّهَا مَوْصُوفَةٌ / لِأَنَّهَا مُضَافَةٌ)'
    reponses:
    - لِأَنَّهَا مَسْبُوقَةٌ بِاسْتِفْهَامٍ
    erreurs:
      لِأَنَّهَا مَوْصُوفَةٌ: خطأ في مسوغات الابتداء بالنكرة
      لِأَنَّهَا مُضَافَةٌ: خطأ في مسوغات الابتداء بالنكرة
    indice: 'لَا يُبْتَدَأُ بِالنَّكِرَةِ إِلَّا إِذَا أَفَادَتْ: إِذَا تَقَدَّمَ الخَبَرُ شِبْهُ الجُمْلَةِ، أَوْ وُصِفَتْ، أَوْ أُضِيفَتْ، أَوْ سَبَقَهَا نَفْيٌ أَوِ اسْتِفْهَامٌ.'
    explication: جَازَ لِأَنَّ النَّكِرَةَ سَبَقَهَا اسْتِفْهَامٌ.
  - id: nakiramub-7
    difficulte: 2
    enonce: 'مَا المُبْتَدَأُ فِي: لِكُلِّ مُجْتَهِدٍ نَصِيبٌ؟ (كُلِّ / نَصِيبٌ / مُجْتَهِدٍ)'
    reponses:
    - نَصِيبٌ
    erreurs:
      كُلِّ: خطأ في تحديد المبتدأ المؤخر
      مُجْتَهِدٍ: خطأ في تحديد المبتدأ المؤخر
    indice: الخَبَرُ شِبْهُ جُمْلَةٍ مُقَدَّمٌ.
    explication: المُبْتَدَأُ «نَصِيبٌ» (مُؤَخَّرٌ)، وَالخَبَرُ «لِكُلِّ مُجْتَهِدٍ» (مُقَدَّمٌ).
  - id: nakiramub-8
    difficulte: 3
    enonce: 'حَوِّلْ إِلَى جُمْلَةٍ صَحِيحَةٍ: «أَزْهَارٌ فِي الحَدِيقَةِ». (فِي الحَدِيقَةِ أَزْهَارٌ / الأَزْهَارُ الحَدِيقَةُ / أَزْهَارًا فِي الحَدِيقَةِ)'
    reponses:
    - فِي الحَدِيقَةِ أَزْهَارٌ
    erreurs:
      الأَزْهَارُ الحَدِيقَةُ: خطأ في الابتداء بالنكرة
      أَزْهَارًا فِي الحَدِيقَةِ: خطأ في الابتداء بالنكرة
    indice: نُقَدِّمُ الخَبَرَ شِبْهَ الجُمْلَةِ.
    explication: 'نَقُولُ: فِي الحَدِيقَةِ أَزْهَارٌ.'
  - id: nakiramub-9
    difficulte: 3
    enonce: 'مَا حُكْمُ تَقْدِيمِ الخَبَرِ فِي: عِنْدِي قَلَمٌ؟ (وَاجِبٌ / جَائِزٌ / مُمْتَنِعٌ)'
    reponses:
    - وَاجِبٌ
    erreurs:
      جَائِزٌ: خطأ في تقديم الخبر
      مُمْتَنِعٌ: خطأ في تقديم الخبر
    indice: 'لَا يُبْتَدَأُ بِالنَّكِرَةِ إِلَّا إِذَا أَفَادَتْ: إِذَا تَقَدَّمَ الخَبَرُ شِبْهُ الجُمْلَةِ، أَوْ وُصِفَتْ، أَوْ أُضِيفَتْ، أَوْ سَبَقَهَا نَفْيٌ أَوِ اسْتِفْهَامٌ.'
    explication: 'تَقْدِيمُ الخَبَرِ وَاجِبٌ: المُبْتَدَأُ نَكِرَةٌ غَيْرُ مَوْصُوفَةٍ، وَالخَبَرُ شِبْهُ جُمْلَةٍ.'
  - id: nakiramub-10
    difficulte: 3
    enonce: 'لِمَاذَا جَازَ الاِبْتِدَاءُ بِالنَّكِرَةِ فِي: رَجُلٌ صَالِحٌ زَارَنَا؟ (لِأَنَّهَا مَوْصُوفَةٌ / لِتَقَدُّمِ الخَبَرِ / لِأَنَّهَا مَسْبُوقَةٌ بِنَفْيٍ)'
    reponses:
    - لِأَنَّهَا مَوْصُوفَةٌ
    erreurs:
      لِتَقَدُّمِ الخَبَرِ: خطأ في مسوغات الابتداء بالنكرة
      لِأَنَّهَا مَسْبُوقَةٌ بِنَفْيٍ: خطأ في مسوغات الابتداء بالنكرة
    indice: 'لَا يُبْتَدَأُ بِالنَّكِرَةِ إِلَّا إِذَا أَفَادَتْ: إِذَا تَقَدَّمَ الخَبَرُ شِبْهُ الجُمْلَةِ، أَوْ وُصِفَتْ، أَوْ أُضِيفَتْ، أَوْ سَبَقَهَا نَفْيٌ أَوِ اسْتِفْهَامٌ.'
    explication: جَازَ لِأَنَّ «رَجُلٌ» مَوْصُوفَةٌ بِـ«صَالِحٌ».
  - id: nakiramub-11
    difficulte: 3
    enonce: لِمَاذَا لَا يُبْتَدَأُ بِالنَّكِرَةِ فِي الأَصْلِ؟ (لِأَنَّهَا لَا تُفِيدُ / لِأَنَّهَا مَنْصُوبَةٌ / لِأَنَّهَا مُؤَنَّثَةٌ)
    reponses:
    - لِأَنَّهَا لَا تُفِيدُ
    erreurs:
      لِأَنَّهَا مَنْصُوبَةٌ: خطأ في الابتداء بالنكرة
      لِأَنَّهَا مُؤَنَّثَةٌ: خطأ في الابتداء بالنكرة
    indice: نُخْبِرُ عَنْ شَيْءٍ مَعْرُوفٍ.
    explication: الأَصْلُ أَنْ يَكُونَ المُبْتَدَأُ مَعْرِفَةً، وَالنَّكِرَةُ لَا يُبْتَدَأُ بِهَا إِلَّا إِذَا أَفَادَتْ.
  - id: nakiramub-12
    difficulte: 3
    enonce: أَيُّ جُمْلَةٍ صَحِيحَةٌ؟ (مَا طَالِبٌ غَائِبٌ / طَالِبٌ غَائِبٌ / غَائِبٌ طَالِبٌ)
    reponses:
    - مَا طَالِبٌ غَائِبٌ
    erreurs:
      طَالِبٌ غَائِبٌ: خطأ في الابتداء بالنكرة
      غَائِبٌ طَالِبٌ: خطأ في الابتداء بالنكرة
    indice: مَا الَّذِي يُجِيزُ الاِبْتِدَاءَ بِالنَّكِرَةِ هُنَا؟
    explication: '«مَا طَالِبٌ غَائِبٌ» صَحِيحَةٌ: سَبَقَ النَّكِرَةَ نَفْيٌ.'
  - id: nakiramub-13
    difficulte: 3
    enonce: 'مَا الخَبَرُ فِي: أَمَامَ البَيْتِ شَجَرَةٌ؟ (أَمَامَ البَيْتِ / شَجَرَةٌ / البَيْتِ)'
    reponses:
    - أَمَامَ البَيْتِ
    erreurs:
      شَجَرَةٌ: خطأ في تحديد الخبر المقدم
      البَيْتِ: خطأ في تحديد الخبر المقدم
    indice: الخَبَرُ شِبْهُ جُمْلَةٍ (ظَرْفٌ).
    explication: الخَبَرُ «أَمَامَ البَيْتِ» (مُقَدَّمٌ)، وَالمُبْتَدَأُ «شَجَرَةٌ» (مُؤَخَّرٌ).
- notion: تعدد الخبر
  exercices:
  - id: taaddud-1
    difficulte: 1
    enonce: 'كَمْ خَبَرًا فِي: الجَوُّ بَارِدٌ مُمْطِرٌ؟ (وَاحِدٌ / اثْنَانِ / ثَلَاثَةٌ)'
    reponses:
    - اثْنَانِ
    erreurs:
      وَاحِدٌ: خطأ في تعدد الخبر
      ثَلَاثَةٌ: خطأ في تعدد الخبر
    indice: 'قَدْ يَكُونُ لِلْمُبْتَدَإِ الوَاحِدِ أَكْثَرُ مِنْ خَبَرٍ، وَكُلُّهَا مَرْفُوعَةٌ: الطَّقْسُ بَارِدٌ مُمْطِرٌ.'
    explication: 'خَبَرَانِ: «بَارِدٌ» وَ«مُمْطِرٌ».'
  - id: taaddud-2
    difficulte: 1
    enonce: 'كَمْ خَبَرًا فِي: المُعَلِّمُ صَبُورٌ حَلِيمٌ عَادِلٌ؟ (اثْنَانِ / ثَلَاثَةٌ / أَرْبَعَةٌ)'
    reponses:
    - ثَلَاثَةٌ
    erreurs:
      اثْنَانِ: خطأ في تعدد الخبر
      أَرْبَعَةٌ: خطأ في تعدد الخبر
    indice: 'قَدْ يَكُونُ لِلْمُبْتَدَإِ الوَاحِدِ أَكْثَرُ مِنْ خَبَرٍ، وَكُلُّهَا مَرْفُوعَةٌ: الطَّقْسُ بَارِدٌ مُمْطِرٌ.'
    explication: 'ثَلَاثَةُ أَخْبَارٍ: «صَبُورٌ»، «حَلِيمٌ»، «عَادِلٌ».'
  - id: taaddud-3
    difficulte: 1
    enonce: مَا حُكْمُ الأَخْبَارِ المُتَعَدِّدَةِ؟ (كُلُّهَا مَرْفُوعَةٌ / الأَوَّلُ مَرْفُوعٌ وَالبَاقِي مَنْصُوبٌ / مَجْرُورَةٌ)
    reponses:
    - كُلُّهَا مَرْفُوعَةٌ
    erreurs:
      الأَوَّلُ مَرْفُوعٌ وَالبَاقِي مَنْصُوبٌ: خطأ في إعراب الخبر المتعدد
      مَجْرُورَةٌ: خطأ في إعراب الخبر المتعدد
    indice: 'قَدْ يَكُونُ لِلْمُبْتَدَإِ الوَاحِدِ أَكْثَرُ مِنْ خَبَرٍ، وَكُلُّهَا مَرْفُوعَةٌ: الطَّقْسُ بَارِدٌ مُمْطِرٌ.'
    explication: الأَخْبَارُ المُتَعَدِّدَةُ كُلُّهَا مَرْفُوعَةٌ.
  - id: taaddud-4
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: الشَّايُ سَاخِنٌ ... (لَذِيذًا / لَذِيذٌ / لَذِيذٍ)'
    reponses:
    - لَذِيذٌ
    erreurs:
      لَذِيذًا: خطأ في إعراب الخبر المتعدد
      لَذِيذٍ: خطأ في إعراب الخبر المتعدد
    indice: 'قَدْ يَكُونُ لِلْمُبْتَدَإِ الوَاحِدِ أَكْثَرُ مِنْ خَبَرٍ، وَكُلُّهَا مَرْفُوعَةٌ: الطَّقْسُ بَارِدٌ مُمْطِرٌ.'
    explication: 'نَقُولُ: الشَّايُ سَاخِنٌ لَذِيذٌ؛ خَبَرٌ ثَانٍ مَرْفُوعٌ.'
  - id: taaddud-5
    difficulte: 2
    enonce: 'مَا إِعْرَابُ «مُمْطِرٌ» فِي: الجَوُّ بَارِدٌ مُمْطِرٌ؟ (خَبَرٌ ثَانٍ مَرْفُوعٌ / نَعْتٌ / حَالٌ)'
    reponses:
    - خَبَرٌ ثَانٍ مَرْفُوعٌ
    erreurs:
      نَعْتٌ: خلط بين الخبر المتعدد والنعت
      حَالٌ: خلط بين الخبر المتعدد والنعت
    indice: «بَارِدٌ» نَكِرَةٌ خَبَرٌ، وَ«مُمْطِرٌ» يُخْبِرُ أَيْضًا عَنِ الجَوِّ.
    explication: «مُمْطِرٌ» خَبَرٌ ثَانٍ مَرْفُوعٌ.
  - id: taaddud-6
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: البِنْتُ ذَكِيَّةٌ ... (نَشِيطٌ / نَشِيطَةٌ / نَشِيطَةً)'
    reponses:
    - نَشِيطَةٌ
    erreurs:
      نَشِيطٌ: خطأ في مطابقة الخبر المتعدد
      نَشِيطَةً: خطأ في مطابقة الخبر المتعدد
    indice: كُلُّ خَبَرٍ يُطَابِقُ المُبْتَدَأَ.
    explication: 'نَقُولُ: البِنْتُ ذَكِيَّةٌ نَشِيطَةٌ.'
  - id: taaddud-7
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: كَانَ الطَّرِيقُ طَوِيلًا ... (مُتْعِبٌ / مُتْعِبًا / مُتْعِبٍ)'
    reponses:
    - مُتْعِبًا
    erreurs:
      مُتْعِبٌ: خطأ في إعراب الخبر المتعدد
      مُتْعِبٍ: خطأ في إعراب الخبر المتعدد
    indice: خَبَرُ «كَانَ» مَنْصُوبٌ، وَكَذَلِكَ الخَبَرُ الثَّانِي.
    explication: 'نَقُولُ: كَانَ الطَّرِيقُ طَوِيلًا مُتْعِبًا.'
  - id: taaddud-8
    difficulte: 3
    enonce: 'مَا الأَخْبَارُ فِي: الحَدِيقَةُ جَمِيلَةٌ أَزْهَارُهَا مُتَفَتِّحَةٌ؟ (جَمِيلَةٌ وَجُمْلَةُ أَزْهَارُهَا مُتَفَتِّحَةٌ / جَمِيلَةٌ فَقَطْ / أَزْهَارُهَا فَقَطْ)'
    reponses:
    - جَمِيلَةٌ وَجُمْلَةُ أَزْهَارُهَا مُتَفَتِّحَةٌ
    erreurs:
      جَمِيلَةٌ فَقَطْ: خطأ في تعدد الخبر
      أَزْهَارُهَا فَقَطْ: خطأ في تعدد الخبر
    indice: قَدْ يَكُونُ أَحَدُ الأَخْبَارِ جُمْلَةً.
    explication: خَبَرٌ أَوَّلُ مُفْرَدٌ «جَمِيلَةٌ»، وَخَبَرٌ ثَانٍ جُمْلَةٌ اسْمِيَّةٌ «أَزْهَارُهَا مُتَفَتِّحَةٌ».
  - id: taaddud-9
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: إِنَّ البَحْرَ وَاسِعٌ ... (عَمِيقًا / عَمِيقٌ / عَمِيقٍ)'
    reponses:
    - عَمِيقٌ
    erreurs:
      عَمِيقًا: خطأ في إعراب الخبر المتعدد
      عَمِيقٍ: خطأ في إعراب الخبر المتعدد
    indice: خَبَرُ «إِنَّ» مَرْفُوعٌ، وَكَذَلِكَ الخَبَرُ الثَّانِي.
    explication: 'نَقُولُ: إِنَّ البَحْرَ وَاسِعٌ عَمِيقٌ.'
  - id: taaddud-10
    difficulte: 3
    enonce: كَيْفَ نُفَرِّقُ بَيْنَ الخَبَرِ الثَّانِي وَالنَّعْتِ؟ (الخَبَرُ يَصِفُ المُبْتَدَأَ وَالنَّعْتُ يَصِفُ الاِسْمَ الَّذِي قَبْلَهُ / لَا فَرْقَ / النَّعْتُ دَائِمًا مَنْصُوبٌ)
    reponses:
    - الخَبَرُ يَصِفُ المُبْتَدَأَ وَالنَّعْتُ يَصِفُ الاِسْمَ الَّذِي قَبْلَهُ
    erreurs:
      لَا فَرْقَ: خلط بين الخبر المتعدد والنعت
      النَّعْتُ دَائِمًا مَنْصُوبٌ: خلط بين الخبر المتعدد والنعت
    indice: 'قَارِنْ: «الوَلَدُ ذَكِيٌّ مُؤَدَّبٌ» / «هَذَا وَلَدٌ ذَكِيٌّ».'
    explication: الخَبَرُ الثَّانِي يُخْبِرُ عَنِ المُبْتَدَإِ، وَالنَّعْتُ يَصِفُ الاِسْمَ النَّكِرَةَ الَّذِي قَبْلَهُ.
  - id: taaddud-11
    difficulte: 3
    enonce: 'مَا إِعْرَابُ «حَنُونٌ» فِي: أُمِّي طَيِّبَةٌ حَنُونٌ؟ (خَبَرٌ ثَانٍ مَرْفُوعٌ / نَعْتٌ لِـ«طَيِّبَةٌ» / مُبْتَدَأٌ)'
    reponses:
    - خَبَرٌ ثَانٍ مَرْفُوعٌ
    erreurs:
      نَعْتٌ لِـ«طَيِّبَةٌ»: خلط بين الخبر المتعدد والنعت
      مُبْتَدَأٌ: خلط بين الخبر المتعدد والنعت
    indice: هَلْ «حَنُونٌ» تَصِفُ الأُمَّ أَمِ الطِّيبَةَ؟
    explication: '«حَنُونٌ» خَبَرٌ ثَانٍ مَرْفُوعٌ: يُخْبِرُ عَنِ الأُمِّ.'
  - id: taaddud-12
    difficulte: 3
    enonce: أَيُّ جُمْلَةٍ فِيهَا خَبَرٌ مُتَعَدِّدٌ؟ (الكِتَابُ مُفِيدٌ مُمْتِعٌ / الكِتَابُ المُفِيدُ مُمْتِعٌ / هَذَا كِتَابٌ مُفِيدٌ)
    reponses:
    - الكِتَابُ مُفِيدٌ مُمْتِعٌ
    erreurs:
      الكِتَابُ المُفِيدُ مُمْتِعٌ: خلط بين الخبر المتعدد والنعت
      هَذَا كِتَابٌ مُفِيدٌ: خلط بين الخبر المتعدد والنعت
    indice: اِبْحَثْ عَنْ خَبَرَيْنِ لِمُبْتَدَإٍ وَاحِدٍ.
    explication: '«الكِتَابُ مُفِيدٌ مُمْتِعٌ»: خَبَرَانِ لِـ«الكِتَابُ».'
  - id: taaddud-13
    difficulte: 3
    enonce: 'مَا الخَبَرُ الأَوَّلُ فِي: السَّمَاءُ صَافِيَةٌ زَرْقَاءُ؟ (صَافِيَةٌ / زَرْقَاءُ / السَّمَاءُ)'
    reponses:
    - صَافِيَةٌ
    erreurs:
      زَرْقَاءُ: خطأ في تعدد الخبر
      السَّمَاءُ: خطأ في تعدد الخبر
    indice: 'قَدْ يَكُونُ لِلْمُبْتَدَإِ الوَاحِدِ أَكْثَرُ مِنْ خَبَرٍ، وَكُلُّهَا مَرْفُوعَةٌ: الطَّقْسُ بَارِدٌ مُمْطِرٌ.'
    explication: الخَبَرُ الأَوَّلُ «صَافِيَةٌ»، وَالثَّانِي «زَرْقَاءُ».
- notion: الإعلال
  exercices:
  - id: ilal-1
    difficulte: 1
    enonce: مَا أَصْلُ الأَلِفِ فِي «قَالَ»؟ (الوَاوُ / اليَاءُ / الهَمْزَةُ)
    reponses:
    - الوَاوُ
    erreurs:
      اليَاءُ: خطأ في أصل حرف العلة
      الهَمْزَةُ: خطأ في أصل حرف العلة
    indice: مُضَارِعُهُ «يَقُولُ» وَمَصْدَرُهُ «قَوْلٌ».
    explication: 'أَصْلُ الأَلِفِ فِي «قَالَ» وَاوٌ: قَوَلَ ← قَالَ (إِعْلَالٌ بِالقَلْبِ).'
  - id: ilal-2
    difficulte: 1
    enonce: مَا أَصْلُ الأَلِفِ فِي «بَاعَ»؟ (الوَاوُ / اليَاءُ / الهَمْزَةُ)
    reponses:
    - اليَاءُ
    erreurs:
      الوَاوُ: خطأ في أصل حرف العلة
      الهَمْزَةُ: خطأ في أصل حرف العلة
    indice: مُضَارِعُهُ «يَبِيعُ» وَمَصْدَرُهُ «بَيْعٌ».
    explication: 'أَصْلُ الأَلِفِ فِي «بَاعَ» يَاءٌ: بَيَعَ ← بَاعَ.'
  - id: ilal-3
    difficulte: 1
    enonce: 'مَا نَوْعُ الإِعْلَالِ فِي «قُلْ» (أَصْلُهُ: اُقْوُلْ)؟ (إِعْلَالٌ بِالحَذْفِ / إِعْلَالٌ بِالقَلْبِ / إِعْلَالٌ بِالتَّسْكِينِ)'
    reponses:
    - إِعْلَالٌ بِالحَذْفِ
    erreurs:
