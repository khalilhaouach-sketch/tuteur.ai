    erreurs:
      لَا فَرْقَ: خلط بين الإعلال والإبدال
      الإِبْدَالُ فِي حُرُوفِ العِلَّةِ فَقَطْ: خلط بين الإعلال والإبدال
    indice: 'قَارِنْ: قَالَ (قَوَلَ) / اصْطَبَرَ (اصْتَبَرَ).'
    explication: الإِعْلَالُ يَخُصُّ حُرُوفَ العِلَّةِ، وَالإِبْدَالُ يَكُونُ غَالِبًا فِي الحُرُوفِ الصَّحِيحَةِ.
