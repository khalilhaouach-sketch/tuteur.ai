    explication: يَقَعُ الإِعْلَالُ فِي حُرُوفِ العِلَّةِ (ا، و، ي) وَالهَمْزَةِ.
- notion: الإبدال
  exercices:
  - id: ibdal-1
    difficulte: 1
    enonce: مَا أَصْلُ «اصْطَبَرَ»؟ (اصْتَبَرَ / اصْبَرَ / اصْدَبَرَ)
    reponses:
    - اصْتَبَرَ
    erreurs:
      اصْبَرَ: خطأ في أصل الإبدال
      اصْدَبَرَ: خطأ في أصل الإبدال
    indice: عَلَى وَزْنِ «افْتَعَلَ» مِنْ «صَبَرَ».
    explication: 'أَصْلُهُ «اصْتَبَرَ»: أُبْدِلَتِ التَّاءُ طَاءً بَعْدَ الصَّادِ.'
  - id: ibdal-2
    difficulte: 1
    enonce: مَا الحَرْفُ المُبْدَلُ فِي «اضْطَرَبَ»؟ (الطَّاءُ بَدَلَ التَّاءِ / الضَّادُ بَدَلَ الدَّالِ / الرَّاءُ)
    reponses:
    - الطَّاءُ بَدَلَ التَّاءِ
    erreurs:
      الضَّادُ بَدَلَ الدَّالِ: خطأ في تحديد الحرف المبدل
      الرَّاءُ: خطأ في تحديد الحرف المبدل
    indice: الإِبْدَالُ وَضْعُ حَرْفٍ صَحِيحٍ مَكَانَ حَرْفٍ آخَرَ، كَإِبْدَالِ تَاءِ «افْتَعَلَ» طَاءً أَوْ دَالًا.
    explication: 'أَصْلُهُ «اضْتَرَبَ»: أُبْدِلَتِ التَّاءُ طَاءً.'
  - id: ibdal-3
    difficulte: 1
    enonce: مَا أَصْلُ «ازْدَهَرَ»؟ (ازْتَهَرَ / ازْهَرَ / ازْطَهَرَ)
    reponses:
    - ازْتَهَرَ
    erreurs:
      ازْهَرَ: خطأ في أصل الإبدال
      ازْطَهَرَ: خطأ في أصل الإبدال
    indice: عَلَى وَزْنِ «افْتَعَلَ» مِنْ «زَهَرَ».
    explication: 'أَصْلُهُ «ازْتَهَرَ»: أُبْدِلَتِ التَّاءُ دَالًا بَعْدَ الزَّايِ.'
  - id: ibdal-4
    difficulte: 2
    enonce: بَعْدَ أَيِّ حُرُوفٍ تُبْدَلُ تَاءُ «افْتَعَلَ» طَاءً؟ (الصَّادِ وَالضَّادِ وَالطَّاءِ وَالظَّاءِ / الدَّالِ وَالذَّالِ وَالزَّايِ / القَافِ وَالكَافِ وَاللَّامِ)
    reponses:
    - الصَّادِ وَالضَّادِ وَالطَّاءِ وَالظَّاءِ
    erreurs:
      الدَّالِ وَالذَّالِ وَالزَّايِ: خطأ في قاعدة الإبدال
      القَافِ وَالكَافِ وَاللَّامِ: خطأ في قاعدة الإبدال
    indice: حُرُوفُ الإِطْبَاقِ.
    explication: 'تُبْدَلُ التَّاءُ طَاءً بَعْدَ حُرُوفِ الإِطْبَاقِ: الصَّادِ وَالضَّادِ وَالطَّاءِ وَالظَّاءِ.'
  - id: ibdal-5
    difficulte: 2
    enonce: بَعْدَ أَيِّ حُرُوفٍ تُبْدَلُ تَاءُ «افْتَعَلَ» دَالًا؟ (الدَّالِ وَالذَّالِ وَالزَّايِ / الصَّادِ وَالضَّادِ وَالطَّاءِ / السِّينِ وَالشِّينِ وَالثَّاءِ)
    reponses:
