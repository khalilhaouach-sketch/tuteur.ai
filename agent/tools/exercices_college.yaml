    enonce: مَا نَوْعُ الجَمْعِ «أَصْدِقَاءُ»؟ (جَمْعُ قِلَّةٍ / جَمْعُ كَثْرَةٍ)
    reponses:
    - جَمْعُ كَثْرَةٍ
    erreurs:
      جَمْعُ قِلَّةٍ: خلط بين جمع القلة والكثرة
    indice: وَزْنُهُ «أَفْعِلَاءُ»، وَلَيْسَ مِنْ أَوْزَانِ القِلَّةِ الأَرْبَعَةِ.
    explication: «أَصْدِقَاءُ» جَمْعُ كَثْرَةٍ عَلَى وَزْنِ «أَفْعِلَاءُ».
  - id: qilla-13
