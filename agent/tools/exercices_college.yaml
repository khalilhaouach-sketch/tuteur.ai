    erreurs:
      مُنْتَجٌ: خطأ في تحديد الاسم المنسوب
      هَذَا: خطأ في تحديد الاسم المنسوب
    indice: اِبْحَثْ عَنِ اليَاءِ المُشَدَّدَةِ.
    explication: «وَطَنِيٌّ» اسْمٌ مَنْسُوبٌ إِلَى «وَطَنٌ».
