- notion: أسلوب القسم
  exercices:
  - id: qasam-1
    difficulte: 1
    enonce: 'مَا حَرْفُ القَسَمِ فِي: وَاللَّهِ لَأَجْتَهِدَنَّ؟ (الوَاوُ / اللَّامُ / النُّونُ)'
    reponses:
    - الوَاوُ
    erreurs:
      اللَّامُ: خطأ في حروف القسم
      النُّونُ: خطأ في حروف القسم
    indice: 'حُرُوفُ القَسَمِ: الوَاوُ، البَاءُ، التَّاءُ (مَعَ لَفْظِ الجَلَالَةِ فَقَطْ). المُقْسَمُ بِهِ مَجْرُورٌ، وَجَوَابُ القَسَمِ المُثْبَتُ يُؤَكَّدُ بِاللَّامِ وَالنُّونِ أَوْ بِـ«قَدْ».'
    explication: حَرْفُ القَسَمِ «الوَاوُ»، وَ«اللَّهِ» مُقْسَمٌ بِهِ.
  - id: qasam-2
    difficulte: 1
    enonce: 'مَا المُقْسَمُ بِهِ فِي: وَالعَصْرِ؟ (الوَاوُ / العَصْرِ)'
    reponses:
    - العَصْرِ
    erreurs:
      الوَاوُ: خطأ في عناصر القسم
    indice: 'حُرُوفُ القَسَمِ: الوَاوُ، البَاءُ، التَّاءُ (مَعَ لَفْظِ الجَلَالَةِ فَقَطْ). المُقْسَمُ بِهِ مَجْرُورٌ، وَجَوَابُ القَسَمِ المُثْبَتُ يُؤَكَّدُ بِاللَّامِ وَالنُّونِ أَوْ بِـ«قَدْ».'
    explication: المُقْسَمُ بِهِ «العَصْرِ»، مَجْرُورٌ بِوَاوِ القَسَمِ.
  - id: qasam-3
    difficulte: 1
    enonce: أَيُّ حُرُوفِ القَسَمِ لَا يَدْخُلُ إِلَّا عَلَى لَفْظِ الجَلَالَةِ؟ (التَّاءُ / الوَاوُ / البَاءُ)
    reponses:
    - التَّاءُ
    erreurs:
      الوَاوُ: خطأ في حروف القسم
      البَاءُ: خطأ في حروف القسم
    indice: 'مِثَالٌ: تَاللَّهِ.'
    explication: 'التَّاءُ لَا تَدْخُلُ إِلَّا عَلَى لَفْظِ الجَلَالَةِ: تَاللَّهِ.'
  - id: qasam-4
    difficulte: 2
    enonce: مَا حُكْمُ المُقْسَمِ بِهِ؟ (مَجْرُورٌ / مَنْصُوبٌ / مَرْفُوعٌ)
    reponses:
    - مَجْرُورٌ
    erreurs:
      مَنْصُوبٌ: خطأ في إعراب المقسم به
      مَرْفُوعٌ: خطأ في إعراب المقسم به
    indice: 'حُرُوفُ القَسَمِ: الوَاوُ، البَاءُ، التَّاءُ (مَعَ لَفْظِ الجَلَالَةِ فَقَطْ). المُقْسَمُ بِهِ مَجْرُورٌ، وَجَوَابُ القَسَمِ المُثْبَتُ يُؤَكَّدُ بِاللَّامِ وَالنُّونِ أَوْ بِـ«قَدْ».'
    explication: المُقْسَمُ بِهِ مَجْرُورٌ بِحَرْفِ القَسَمِ.
  - id: qasam-5
