    explication: يَجِبُ حَذْفُ الفِعْلِ لِأَنَّ الاِسْمَ مُكَرَّرٌ.
  - id: ighra-13
    difficulte: 3
    enonce: 'مَا نَوْعُ الأُسْلُوبِ فِي: المُرُوءَةَ وَالنَّجْدَةَ؟ (إِغْرَاءٌ / تَحْذِيرٌ)'
    reponses:
    - إِغْرَاءٌ
    erreurs:
      تَحْذِيرٌ: خلط بين الإغراء والتحذير
    indice: الإِغْرَاءُ تَنْبِيهُ المُخَاطَبِ إِلَى أَمْرٍ مَحْمُودٍ لِيَلْزَمَهُ (الصِّدْقَ الصِّدْقَ)، وَالتَّحْذِيرُ تَنْبِيهُهُ إِلَى أَمْرٍ مَكْرُوهٍ لِيَجْتَنِبَهُ (إِيَّاكَ وَالكَذِبَ). وَالاِسْمُ فِيهِمَا مَنْصُوبٌ بِفِعْلٍ مَحْذُوفٍ.
    explication: 'إِغْرَاءٌ بِالعَطْفِ: اِلْزَمِ المُرُوءَةَ وَالنَّجْدَةَ.'
- notion: أسلوب الاختصاص
  exercices:
  - id: ikhtisas-1
    difficulte: 1
    enonce: 'مَا الاِسْمُ المُخْتَصُّ فِي: نَحْنُ التَّلَامِيذَ نُحِبُّ العِلْمَ؟ (نَحْنُ / التَّلَامِيذَ / العِلْمَ)'
    reponses:
    - التَّلَامِيذَ
    erreurs:
      نَحْنُ: خطأ في تحديد الاسم المختص
      العِلْمَ: خطأ في تحديد الاسم المختص
    indice: 'الاِخْتِصَاصُ: اسْمٌ مَنْصُوبٌ بَعْدَ ضَمِيرِ المُتَكَلِّمِ يُوَضِّحُهُ، بِفِعْلٍ مَحْذُوفٍ تَقْدِيرُهُ «أَخُصُّ»: نَحْنُ المَغَارِبَةَ نُحِبُّ وَطَنَنَا.'
    explication: الاِسْمُ المُخْتَصُّ «التَّلَامِيذَ»، مَنْصُوبٌ بِفِعْلٍ مَحْذُوفٍ تَقْدِيرُهُ «أَخُصُّ».
  - id: ikhtisas-2
    difficulte: 1
    enonce: 'اِخْتَرِ الصَّحِيحَ: نَحْنُ ... نُحِبُّ وَطَنَنَا. (المَغَارِبَةُ / المَغَارِبَةَ / المَغَارِبَةِ)'
    reponses:
    - المَغَارِبَةَ
    erreurs:
      المَغَارِبَةُ: خطأ في إعراب الاسم المختص
      المَغَارِبَةِ: خطأ في إعراب الاسم المختص
    indice: الاِسْمُ المُخْتَصُّ مَنْصُوبٌ.
    explication: 'نَقُولُ: نَحْنُ المَغَارِبَةَ نُحِبُّ وَطَنَنَا.'
  - id: ikhtisas-3
    difficulte: 1
    enonce: مَا تَقْدِيرُ الفِعْلِ المَحْذُوفِ فِي أُسْلُوبِ الاِخْتِصَاصِ؟ (أَخُصُّ / اِحْذَرْ / اِلْزَمْ)
    reponses:
    - أَخُصُّ
    erreurs:
      اِحْذَرْ: خطأ في تقدير الفعل المحذوف
      اِلْزَمْ: خطأ في تقدير الفعل المحذوف
    indice: 'الاِخْتِصَاصُ: اسْمٌ مَنْصُوبٌ بَعْدَ ضَمِيرِ المُتَكَلِّمِ يُوَضِّحُهُ، بِفِعْلٍ مَحْذُوفٍ تَقْدِيرُهُ «أَخُصُّ»: نَحْنُ المَغَارِبَةَ نُحِبُّ وَطَنَنَا.'
    explication: 'التَّقْدِيرُ: أَخُصُّ (أَوْ أَعْنِي).'
  - id: ikhtisas-4
    difficulte: 2
    enonce: بَعْدَ أَيِّ ضَمِيرٍ يَأْتِي الاِسْمُ المُخْتَصُّ غَالِبًا؟ (ضَمِيرِ المُتَكَلِّمِ / ضَمِيرِ الغَائِبِ / ضَمِيرِ المُخَاطَبِ)
    reponses:
    - ضَمِيرِ المُتَكَلِّمِ
    erreurs:
      ضَمِيرِ الغَائِبِ: خطأ في شروط الاختصاص
      ضَمِيرِ المُخَاطَبِ: خطأ في شروط الاختصاص
    indice: 'مِثَالٌ: نَحْنُ العَرَبَ، أَنَا المُعَلِّمَ.'
    explication: يَأْتِي الاِسْمُ المُخْتَصُّ بَعْدَ ضَمِيرِ المُتَكَلِّمِ غَالِبًا.
  - id: ikhtisas-5
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: عَلَيْنَا ... أَنْ نُتْقِنَ عَمَلَنَا. (العُمَّالُ / العُمَّالَ / العُمَّالِ)'
    reponses:
    - العُمَّالَ
    erreurs:
      العُمَّالُ: خطأ في إعراب الاسم المختص
      العُمَّالِ: خطأ في إعراب الاسم المختص
    indice: الاِسْمُ المُخْتَصُّ مَنْصُوبٌ.
    explication: 'نَقُولُ: عَلَيْنَا العُمَّالَ أَنْ نُتْقِنَ عَمَلَنَا.'
  - id: ikhtisas-6
    difficulte: 2
    enonce: مَا الغَرَضُ مِنْ أُسْلُوبِ الاِخْتِصَاصِ؟ (تَوْضِيحُ الضَّمِيرِ أَوِ الفَخْرُ / السُّؤَالُ / التَّحْذِيرُ)
    reponses:
    - تَوْضِيحُ الضَّمِيرِ أَوِ الفَخْرُ
    erreurs:
      السُّؤَالُ: خطأ في أغراض الاختصاص
      التَّحْذِيرُ: خطأ في أغراض الاختصاص
    indice: '«نَحْنُ المُسْلِمِينَ...»: مَنْ نَحْنُ؟'
    explication: يُوَضِّحُ الضَّمِيرَ قَبْلَهُ، وَيُفِيدُ الفَخْرَ أَوِ التَّوَاضُعَ.
  - id: ikhtisas-7
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: نَحْنُ ... نَحْتَرِمُ مُعَلِّمِينَا. (المُتَعَلِّمُونَ / المُتَعَلِّمِينَ / المُتَعَلِّمَانِ)'
    reponses:
    - المُتَعَلِّمِينَ
    erreurs:
      المُتَعَلِّمُونَ: خطأ في إعراب الاسم المختص
      المُتَعَلِّمَانِ: خطأ في إعراب الاسم المختص
    indice: الاِسْمُ المُخْتَصُّ مَنْصُوبٌ، وَجَمْعُ المُذَكَّرِ يُنْصَبُ بِاليَاءِ.
    explication: 'نَقُولُ: نَحْنُ المُتَعَلِّمِينَ نَحْتَرِمُ مُعَلِّمِينَا.'
  - id: ikhtisas-8
    difficulte: 3
    enonce: مَا الفَرْقُ بَيْنَ «نَحْنُ المَغَارِبَةُ» وَ«نَحْنُ المَغَارِبَةَ نُحِبُّ الضَّيْفَ»؟ (الأُولَى مُبْتَدَأٌ وَخَبَرٌ وَالثَّانِيَةُ اخْتِصَاصٌ / كِلْتَاهُمَا اخْتِصَاصٌ / كِلْتَاهُمَا مُبْتَدَأٌ وَخَبَرٌ)
    reponses:
    - الأُولَى مُبْتَدَأٌ وَخَبَرٌ وَالثَّانِيَةُ اخْتِصَاصٌ
    erreurs:
      كِلْتَاهُمَا اخْتِصَاصٌ: خلط بين الاختصاص والخبر
      كِلْتَاهُمَا مُبْتَدَأٌ وَخَبَرٌ: خلط بين الاختصاص والخبر
    indice: فِي الثَّانِيَةِ، الخَبَرُ هُوَ «نُحِبُّ الضَّيْفَ».
    explication: فِي الأُولَى «المَغَارِبَةُ» خَبَرٌ مَرْفُوعٌ، وَفِي الثَّانِيَةِ «المَغَارِبَةَ» مَنْصُوبٌ عَلَى الاِخْتِصَاصِ.
  - id: ikhtisas-9
    difficulte: 3
    enonce: 'مَا مَوْقِعُ جُمْلَةِ «أَخُصُّ المُعَلِّمِينَ» المَحْذُوفَةِ فِي: نَحْنُ المُعَلِّمِينَ نُرَبِّي الأَجْيَالَ؟ (اعْتِرَاضِيَّةٌ لَا مَحَلَّ لَهَا / خَبَرٌ / حَالٌ)'
    reponses:
    - اعْتِرَاضِيَّةٌ لَا مَحَلَّ لَهَا
    erreurs:
      خَبَرٌ: خطأ في إعراب جملة الاختصاص
      حَالٌ: خطأ في إعراب جملة الاختصاص
    indice: تَقَعُ بَيْنَ المُبْتَدَإِ وَخَبَرِهِ.
    explication: جُمْلَةُ الاِخْتِصَاصِ اعْتِرَاضِيَّةٌ لَا مَحَلَّ لَهَا مِنَ الإِعْرَابِ، وَالخَبَرُ «نُرَبِّي الأَجْيَالَ».
  - id: ikhtisas-10
    difficulte: 3
    enonce: هَلْ يَكُونُ الاِسْمُ المُخْتَصُّ نَكِرَةً؟ (لَا / نَعَمْ)
    reponses:
    - لَا
    erreurs:
      نَعَمْ: خطأ في شروط الاختصاص
    indice: 'قَارِنْ: نَحْنُ العَرَبَ.'
    explication: 'لَا: يَكُونُ مُعَرَّفًا بِـ«ال» أَوْ مُضَافًا أَوْ «أَيُّهَا/أَيَّتُهَا».'
  - id: ikhtisas-11
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: أَنَا ... أَعْتَزُّ بِعَمَلِي. (المُعَلِّمُ / المُعَلِّمَ / مُعَلِّمٌ)'
    reponses:
    - المُعَلِّمَ
    erreurs:
      المُعَلِّمُ: خطأ في إعراب الاسم المختص
      مُعَلِّمٌ: خطأ في إعراب الاسم المختص
    indice: 'الاِسْمُ بَعْدَ ضَمِيرِ المُتَكَلِّمِ يُبَيِّنُهُ: اخْتِصَاصٌ.'
    explication: 'نَقُولُ: أَنَا المُعَلِّمَ أَعْتَزُّ بِعَمَلِي.'
  - id: ikhtisas-12
    difficulte: 3
    enonce: 'مَا الاِسْمُ المُخْتَصُّ فِي: نَحْنُ أَبْنَاءَ المَغْرِبِ نَعْتَزُّ بِتَارِيخِنَا؟ (أَبْنَاءَ / المَغْرِبِ / تَارِيخِنَا)'
    reponses:
    - أَبْنَاءَ
    erreurs:
      المَغْرِبِ: خطأ في تحديد الاسم المختص
      تَارِيخِنَا: خطأ في تحديد الاسم المختص
    indice: قَدْ يَكُونُ المُخْتَصُّ مُضَافًا.
    explication: «أَبْنَاءَ» اسْمٌ مُخْتَصٌّ مَنْصُوبٌ، وَهُوَ مُضَافٌ.
  - id: ikhtisas-13
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: إِنَّا ... نُكْرِمُ الضَّيْفَ. (العَرَبُ / العَرَبَ / العَرَبِ)'
    reponses:
    - العَرَبَ
    erreurs:
      العَرَبُ: خطأ في إعراب الاسم المختص
      العَرَبِ: خطأ في إعراب الاسم المختص
    indice: اسْمٌ مُخْتَصٌّ بَعْدَ ضَمِيرِ المُتَكَلِّمِ «نَا».
    explication: 'نَقُولُ: إِنَّا العَرَبَ نُكْرِمُ الضَّيْفَ.'
- notion: أسلوب الاستفهام
  exercices:
  - id: istifham-1
    difficulte: 1
    enonce: هَلْ «هَلْ» حَرْفُ اسْتِفْهَامٍ أَمِ اسْمُ اسْتِفْهَامٍ؟ (حَرْفٌ / اسْمٌ)
    reponses:
    - حَرْفٌ
    erreurs:
      اسْمٌ: خلط بين حروف الاستفهام وأسمائه
    indice: 'أَدَوَاتُ الاِسْتِفْهَامِ: الهَمْزَةُ وَهَلْ (حَرْفَانِ)، وَمَنْ، مَا، مَتَى، أَيْنَ، كَيْفَ، كَمْ، أَيٌّ، أَيَّانَ، أَنَّى (أَسْمَاءٌ).'
    explication: «هَلْ» حَرْفُ اسْتِفْهَامٍ.
  - id: istifham-2
    difficulte: 1
    enonce: هَلْ «مَتَى» حَرْفُ اسْتِفْهَامٍ أَمِ اسْمُ اسْتِفْهَامٍ؟ (حَرْفٌ / اسْمٌ)
    reponses:
    - اسْمٌ
    erreurs:
      حَرْفٌ: خلط بين حروف الاستفهام وأسمائه
    indice: 'أَدَوَاتُ الاِسْتِفْهَامِ: الهَمْزَةُ وَهَلْ (حَرْفَانِ)، وَمَنْ، مَا، مَتَى، أَيْنَ، كَيْفَ، كَمْ، أَيٌّ، أَيَّانَ، أَنَّى (أَسْمَاءٌ).'
    explication: «مَتَى» اسْمُ اسْتِفْهَامٍ عَنِ الزَّمَانِ.
  - id: istifham-3
    difficulte: 1
    enonce: 'اِخْتَرْ أَدَاةَ الاِسْتِفْهَامِ المُنَاسِبَةَ: ... تَسْكُنُ؟ — فِي فَاسَ. (مَتَى / أَيْنَ / كَيْفَ)'
    reponses:
    - أَيْنَ
    erreurs:
      مَتَى: خطأ في اختيار أداة الاستفهام
      كَيْفَ: خطأ في اختيار أداة الاستفهام
    indice: الجَوَابُ مَكَانٌ.
    explication: نَسْأَلُ عَنِ المَكَانِ بِـ«أَيْنَ».
  - id: istifham-4
    difficulte: 1
    enonce: 'اِخْتَرْ أَدَاةَ الاِسْتِفْهَامِ المُنَاسِبَةَ: ... حَالُكَ؟ (كَيْفَ / مَنْ / كَمْ)'
    reponses:
    - كَيْفَ
    erreurs:
      مَنْ: خطأ في اختيار أداة الاستفهام
      كَمْ: خطأ في اختيار أداة الاستفهام
    indice: نَسْأَلُ عَنِ الحَالِ.
    explication: نَسْأَلُ عَنِ الحَالِ بِـ«كَيْفَ».
  - id: istifham-5
    difficulte: 2
    enonce: بِأَيِّ أَدَاةٍ نَسْأَلُ عَنِ العَاقِلِ؟ (مَنْ / مَا / مَتَى)
    reponses:
    - مَنْ
    erreurs:
      مَا: خطأ في اختيار أداة الاستفهام
      مَتَى: خطأ في اختيار أداة الاستفهام
    indice: مَنْ جَاءَ؟ — أَحْمَدُ.
    explication: نَسْأَلُ عَنِ العَاقِلِ بِـ«مَنْ»، وَعَنْ غَيْرِ العَاقِلِ بِـ«مَا».
  - id: istifham-6
    difficulte: 2
    enonce: مَا الفَرْقُ بَيْنَ «هَلْ» وَالهَمْزَةِ؟ (الهَمْزَةُ لِلتَّصَوُّرِ وَالتَّصْدِيقِ وَ«هَلْ» لِلتَّصْدِيقِ فَقَطْ / لَا فَرْقَ / «هَلْ» لِلتَّصَوُّرِ فَقَطْ)
    reponses:
    - الهَمْزَةُ لِلتَّصَوُّرِ وَالتَّصْدِيقِ وَ«هَلْ» لِلتَّصْدِيقِ فَقَطْ
    erreurs:
      لَا فَرْقَ: خطأ في معاني أدوات الاستفهام
      «هَلْ» لِلتَّصَوُّرِ فَقَطْ: خطأ في معاني أدوات الاستفهام
    indice: «أَشَايًا تَشْرَبُ أَمْ قَهْوَةً؟» لَا تَصِحُّ بِـ«هَلْ».
    explication: الهَمْزَةُ يُطْلَبُ بِهَا التَّصَوُّرُ وَالتَّصْدِيقُ، وَ«هَلْ» يُطْلَبُ بِهَا التَّصْدِيقُ (نَعَمْ / لَا) فَقَطْ.
  - id: istifham-7
    difficulte: 2
    enonce: 'اِخْتَرِ الأَدَاةَ المُنَاسِبَةَ: ... أَخُوكَ أَمْ أُخْتُكَ فِي البَيْتِ؟ (هَلْ / الهَمْزَةُ: أَ / مَتَى)'
    reponses:
    - 'الهَمْزَةُ: أَ'
    erreurs:
      هَلْ: خطأ في معاني أدوات الاستفهام
      مَتَى: خطأ في معاني أدوات الاستفهام
    indice: فِي السُّؤَالِ «أَمْ» تَطْلُبُ التَّعْيِينَ (التَّصَوُّرَ).
    explication: 'نَقُولُ: أَأَخُوكَ فِي البَيْتِ أَمْ أُخْتُكَ؟ «هَلْ» لَا تَأْتِي مَعَ «أَمْ» المُعَادِلَةِ.'
  - id: istifham-8
    difficulte: 2
    enonce: 'مَا المَعْنَى البَلَاغِيُّ لِلِاسْتِفْهَامِ فِي: هَلْ جَزَاءُ الإِحْسَانِ إِلَّا الإِحْسَانُ؟ (النَّفْيُ / التَّعَجُّبُ / السُّؤَالُ الحَقِيقِيُّ)'
    reponses:
    - النَّفْيُ
    erreurs:
      التَّعَجُّبُ: خطأ في المعاني البلاغية للاستفهام
      السُّؤَالُ الحَقِيقِيُّ: خطأ في المعاني البلاغية للاستفهام
    indice: 'المَعْنَى: مَا جَزَاءُ الإِحْسَانِ إِلَّا الإِحْسَانُ.'
    explication: 'الاِسْتِفْهَامُ هُنَا لِلنَّفْيِ: لَا جَزَاءَ لِلْإِحْسَانِ إِلَّا الإِحْسَانُ.'
  - id: istifham-9
    difficulte: 3
    enonce: 'مَا المَعْنَى البَلَاغِيُّ لِلِاسْتِفْهَامِ فِي: أَتَكْذِبُ وَأَنْتَ تِلْمِيذٌ مُؤَدَّبٌ؟ (الإِنْكَارُ وَالتَّوْبِيخُ / السُّؤَالُ الحَقِيقِيُّ / التَّمَنِّي)'
    reponses:
    - الإِنْكَارُ وَالتَّوْبِيخُ
    erreurs:
      السُّؤَالُ الحَقِيقِيُّ: خطأ في المعاني البلاغية للاستفهام
      التَّمَنِّي: خطأ في المعاني البلاغية للاستفهام
    indice: المُتَكَلِّمُ لَا يَنْتَظِرُ جَوَابًا.
    explication: الاِسْتِفْهَامُ هُنَا لِلْإِنْكَارِ وَالتَّوْبِيخِ.
  - id: istifham-10
    difficulte: 3
    enonce: 'مَا إِعْرَابُ «مَنْ» فِي: مَنْ جَاءَ؟ (اسْمُ اسْتِفْهَامٍ فِي مَحَلِّ رَفْعٍ مُبْتَدَأٌ / حَرْفُ اسْتِفْهَامٍ / مَفْعُولٌ بِهِ)'
    reponses:
    - اسْمُ اسْتِفْهَامٍ فِي مَحَلِّ رَفْعٍ مُبْتَدَأٌ
    erreurs:
      حَرْفُ اسْتِفْهَامٍ: خطأ في إعراب أسماء الاستفهام
      مَفْعُولٌ بِهِ: خطأ في إعراب أسماء الاستفهام
    indice: الفِعْلُ بَعْدَهُ لَازِمٌ، فَهُوَ مُبْتَدَأٌ وَالجُمْلَةُ خَبَرُهُ.
    explication: «مَنْ» اسْمُ اسْتِفْهَامٍ مَبْنِيٌّ فِي مَحَلِّ رَفْعٍ مُبْتَدَأٌ، وَجُمْلَةُ «جَاءَ» خَبَرُهُ.
  - id: istifham-11
    difficulte: 3
    enonce: 'مَا إِعْرَابُ «مَتَى» فِي: مَتَى تُسَافِرُ؟ (اسْمُ اسْتِفْهَامٍ فِي مَحَلِّ نَصْبٍ ظَرْفُ زَمَانٍ / مُبْتَدَأٌ / حَرْفٌ)'
    reponses:
    - اسْمُ اسْتِفْهَامٍ فِي مَحَلِّ نَصْبٍ ظَرْفُ زَمَانٍ
    erreurs:
      مُبْتَدَأٌ: خطأ في إعراب أسماء الاستفهام
      حَرْفٌ: خطأ في إعراب أسماء الاستفهام
    indice: «مَتَى» يَسْأَلُ عَنِ الزَّمَانِ.
    explication: «مَتَى» اسْمُ اسْتِفْهَامٍ مَبْنِيٌّ فِي مَحَلِّ نَصْبٍ مَفْعُولٌ فِيهِ (ظَرْفُ زَمَانٍ).
  - id: istifham-12
    difficulte: 3
    enonce: أَيُّ أَسْمَاءِ الاِسْتِفْهَامِ مُعْرَبٌ؟ (أَيٌّ / مَنْ / كَيْفَ)
    reponses:
    - أَيٌّ
    erreurs:
      مَنْ: خطأ في إعراب أسماء الاستفهام
      كَيْفَ: خطأ في إعراب أسماء الاستفهام
    indice: 'قَارِنْ: أَيُّ / أَيَّ / أَيِّ.'
    explication: «أَيٌّ» هُوَ اسْمُ الاِسْتِفْهَامِ الوَحِيدُ المُعْرَبُ.
  - id: istifham-13
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: ... كِتَابٍ قَرَأْتَ؟ (أَيَّ / أَيُّ / أَيِّ)'
    reponses:
    - أَيَّ
    erreurs:
      أَيُّ: خطأ في إعراب أسماء الاستفهام
      أَيِّ: خطأ في إعراب أسماء الاستفهام
    indice: «أَيَّ» هُنَا مَفْعُولٌ بِهِ مُقَدَّمٌ لِـ«قَرَأْتَ».
    explication: 'نَقُولُ: أَيَّ كِتَابٍ قَرَأْتَ؟ مَفْعُولٌ بِهِ مَنْصُوبٌ.'
- notion: أسلوب الشرط
  exercices:
  - id: shart-1
    difficulte: 1
    enonce: 'مَا أَدَاةُ الشَّرْطِ فِي: إِنْ تَجْتَهِدْ تَنْجَحْ؟ (إِنْ / تَجْتَهِدْ / تَنْجَحْ)'
    reponses:
    - إِنْ
    erreurs:
      تَجْتَهِدْ: خلط بين عناصر الشرط
      تَنْجَحْ: خلط بين عناصر الشرط
    indice: 'أَدَوَاتُ الشَّرْطِ الجَازِمَةُ: إِنْ، مَنْ، مَا، مَهْمَا، مَتَى، أَيْنَ، حَيْثُمَا، كَيْفَمَا...؛ وَغَيْرُ الجَازِمَةِ: إِذَا، لَوْ، لَوْلَا، كُلَّمَا.'
    explication: أَدَاةُ الشَّرْطِ «إِنْ»، وَفِعْلُ الشَّرْطِ «تَجْتَهِدْ»، وَجَوَابُهُ «تَنْجَحْ».
  - id: shart-2
    difficulte: 1
    enonce: 'مَا جَوَابُ الشَّرْطِ فِي: مَنْ يَزْرَعْ يَحْصُدْ؟ (مَنْ / يَزْرَعْ / يَحْصُدْ)'
    reponses:
    - يَحْصُدْ
    erreurs:
      مَنْ: خلط بين عناصر الشرط
      يَزْرَعْ: خلط بين عناصر الشرط
    indice: 'أَدَوَاتُ الشَّرْطِ الجَازِمَةُ: إِنْ، مَنْ، مَا، مَهْمَا، مَتَى، أَيْنَ، حَيْثُمَا، كَيْفَمَا...؛ وَغَيْرُ الجَازِمَةِ: إِذَا، لَوْ، لَوْلَا، كُلَّمَا.'
    explication: جَوَابُ الشَّرْطِ «يَحْصُدْ»، مَجْزُومٌ.
  - id: shart-3
    difficulte: 1
    tolerer_hamza: false
    enonce: 'اِخْتَرِ الصَّحِيحَ: إِنْ ... تَتَعَلَّمْ. (تَقْرَأُ / تَقْرَأْ / تَقْرَأَ)'
    reponses:
    - تَقْرَأْ
    erreurs:
      تَقْرَأُ: خطأ في جزم فعل الشرط
      تَقْرَأَ: خطأ في جزم فعل الشرط
    indice: «إِنْ» تَجْزِمُ فِعْلَيْنِ.
    explication: 'نَقُولُ: إِنْ تَقْرَأْ تَتَعَلَّمْ.'
  - id: shart-4
    difficulte: 1
    enonce: هَلْ «إِذَا» أَدَاةُ شَرْطٍ جَازِمَةٌ؟ (جَازِمَةٌ / غَيْرُ جَازِمَةٍ)
    reponses:
    - غَيْرُ جَازِمَةٍ
    erreurs:
      جَازِمَةٌ: خلط بين الجازمة وغير الجازمة
    indice: 'أَدَوَاتُ الشَّرْطِ الجَازِمَةُ: إِنْ، مَنْ، مَا، مَهْمَا، مَتَى، أَيْنَ، حَيْثُمَا، كَيْفَمَا...؛ وَغَيْرُ الجَازِمَةِ: إِذَا، لَوْ، لَوْلَا، كُلَّمَا.'
    explication: «إِذَا» أَدَاةُ شَرْطٍ غَيْرُ جَازِمَةٍ.
  - id: shart-5
    difficulte: 2
    enonce: هَلْ «مَهْمَا» أَدَاةُ شَرْطٍ جَازِمَةٌ؟ (جَازِمَةٌ / غَيْرُ جَازِمَةٍ)
    reponses:
    - جَازِمَةٌ
    erreurs:
      غَيْرُ جَازِمَةٍ: خلط بين الجازمة وغير الجازمة
    indice: 'أَدَوَاتُ الشَّرْطِ الجَازِمَةُ: إِنْ، مَنْ، مَا، مَهْمَا، مَتَى، أَيْنَ، حَيْثُمَا، كَيْفَمَا...؛ وَغَيْرُ الجَازِمَةِ: إِذَا، لَوْ، لَوْلَا، كُلَّمَا.'
    explication: '«مَهْمَا» أَدَاةُ شَرْطٍ جَازِمَةٌ: مَهْمَا تَفْعَلْ تُجْزَ بِهِ.'
  - id: shart-6
    difficulte: 2
    enonce: هَلْ «لَوْ» أَدَاةُ شَرْطٍ جَازِمَةٌ؟ (جَازِمَةٌ / غَيْرُ جَازِمَةٍ)
    reponses:
    - غَيْرُ جَازِمَةٍ
    erreurs:
      جَازِمَةٌ: خلط بين الجازمة وغير الجازمة
    indice: 'أَدَوَاتُ الشَّرْطِ الجَازِمَةُ: إِنْ، مَنْ، مَا، مَهْمَا، مَتَى، أَيْنَ، حَيْثُمَا، كَيْفَمَا...؛ وَغَيْرُ الجَازِمَةِ: إِذَا، لَوْ، لَوْلَا، كُلَّمَا.'
    explication: '«لَوْ» أَدَاةُ شَرْطٍ غَيْرُ جَازِمَةٍ: لَوِ اجْتَهَدْتَ لَنَجَحْتَ.'
  - id: shart-7
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: مَتَى ... الرَّبِيعُ تَتَفَتَّحْ الأَزْهَارُ. (يَأْتِي / يَأْتِ / يَأْتِيَ)'
    reponses:
    - يَأْتِ
    erreurs:
      يَأْتِي: خطأ في جزم فعل الشرط
      يَأْتِيَ: خطأ في جزم فعل الشرط
    indice: «مَتَى» جَازِمَةٌ، وَالفِعْلُ مُعْتَلُّ الآخِرِ.
    explication: 'نَقُولُ: مَتَى يَأْتِ الرَّبِيعُ تَتَفَتَّحِ الأَزْهَارُ.'
  - id: shart-8
    difficulte: 2
    enonce: 'لِمَاذَا اقْتَرَنَ الجَوَابُ بِالفَاءِ فِي: إِنْ تَصْدُقْ فَأَنْتَ مُحْتَرَمٌ؟ (لِأَنَّ الجَوَابَ جُمْلَةٌ اسْمِيَّةٌ / لِأَنَّ الفِعْلَ مَاضٍ / لِأَنَّ الأَدَاةَ غَيْرُ جَازِمَةٍ)'
    reponses:
    - لِأَنَّ الجَوَابَ جُمْلَةٌ اسْمِيَّةٌ
    erreurs:
      لِأَنَّ الفِعْلَ مَاضٍ: خطأ في اقتران الجواب بالفاء
      لِأَنَّ الأَدَاةَ غَيْرُ جَازِمَةٍ: خطأ في اقتران الجواب بالفاء
    indice: الجَوَابُ «أَنْتَ مُحْتَرَمٌ».
    explication: يَقْتَرِنُ الجَوَابُ بِالفَاءِ إِذَا كَانَ جُمْلَةً اسْمِيَّةً.
  - id: shart-9
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: إِذَا جَاءَ الضَّيْفُ ... (فَأَكْرِمْهُ / أَكْرِمُهُ / تُكْرِمْهُ)'
    reponses:
    - فَأَكْرِمْهُ
    erreurs:
      أَكْرِمُهُ: خطأ في اقتران الجواب بالفاء
      تُكْرِمْهُ: خطأ في اقتران الجواب بالفاء
    indice: الجَوَابُ جُمْلَةٌ طَلَبِيَّةٌ (فِعْلُ أَمْرٍ).
    explication: 'نَقُولُ: إِذَا جَاءَ الضَّيْفُ فَأَكْرِمْهُ؛ الجَوَابُ طَلَبِيٌّ فَاقْتَرَنَ بِالفَاءِ.'
  - id: shart-10
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: لَوْ صَدَقْتَ ... (لَصَدَّقْتُكَ / فَصَدَّقْتُكَ / تُصَدِّقْكَ)'
    reponses:
    - لَصَدَّقْتُكَ
    erreurs:
      فَصَدَّقْتُكَ: خطأ في جواب لو
      تُصَدِّقْكَ: خطأ في جواب لو
    indice: جَوَابُ «لَوْ» المُثْبَتُ يَقْتَرِنُ بِاللَّامِ غَالِبًا.
    explication: 'نَقُولُ: لَوْ صَدَقْتَ لَصَدَّقْتُكَ.'
  - id: shart-11
    difficulte: 3
    enonce: 'مَاذَا تُفِيدُ «لَوْلَا» فِي: لَوْلَا المَطَرُ لَجَفَّتِ الأَرْضُ؟ (امْتِنَاعَ الجَوَابِ لِوُجُودِ الشَّرْطِ / امْتِنَاعَ الجَوَابِ لِامْتِنَاعِ الشَّرْطِ / الاِسْتِفْهَامَ)'
    reponses:
    - امْتِنَاعَ الجَوَابِ لِوُجُودِ الشَّرْطِ
    erreurs:
      امْتِنَاعَ الجَوَابِ لِامْتِنَاعِ الشَّرْطِ: خطأ في معاني أدوات الشرط
      الاِسْتِفْهَامَ: خطأ في معاني أدوات الشرط
    indice: المَطَرُ مَوْجُودٌ، فَلَمْ تَجِفَّ الأَرْضُ.
    explication: «لَوْلَا» حَرْفُ امْتِنَاعٍ لِوُجُودٍ.
  - id: shart-12
    difficulte: 3
    enonce: 'مَاذَا تُفِيدُ «لَوْ» فِي: لَوْ دَرَسْتَ لَنَجَحْتَ؟ (امْتِنَاعَ الجَوَابِ لِامْتِنَاعِ الشَّرْطِ / امْتِنَاعَ الجَوَابِ لِوُجُودِ الشَّرْطِ / التَّمَنِّي)'
    reponses:
    - امْتِنَاعَ الجَوَابِ لِامْتِنَاعِ الشَّرْطِ
    erreurs:
      امْتِنَاعَ الجَوَابِ لِوُجُودِ الشَّرْطِ: خطأ في معاني أدوات الشرط
      التَّمَنِّي: خطأ في معاني أدوات الشرط
    indice: لَمْ تَدْرُسْ، فَلَمْ تَنْجَحْ.
    explication: «لَوْ» حَرْفُ امْتِنَاعٍ لِامْتِنَاعٍ.
  - id: shart-13
    difficulte: 3
    enonce: كَمْ فِعْلًا تَجْزِمُ أَدَوَاتُ الشَّرْطِ الجَازِمَةُ؟ (فِعْلَيْنِ / فِعْلًا وَاحِدًا / لَا تَجْزِمُ)
    reponses:
    - فِعْلَيْنِ
    erreurs:
      فِعْلًا وَاحِدًا: خلط بين الجازمة وغير الجازمة
      لَا تَجْزِمُ: خلط بين الجازمة وغير الجازمة
    indice: 'مِثَالٌ: إِنْ تَدْرُسْ تَنْجَحْ.'
    explication: 'تَجْزِمُ فِعْلَيْنِ: فِعْلَ الشَّرْطِ وَجَوَابَهُ.'
- notion: الاستغاثة والندبة
  exercices:
  - id: istighatha-1
    difficulte: 1
    enonce: مَا نَوْعُ الأُسْلُوبِ فِي «يَا لَلنَّاسِ لِلْغَرِيقِ»؟ (اسْتِغَاثَةٌ / نُدْبَةٌ / نِدَاءٌ عَادِيٌّ)
    reponses:
    - اسْتِغَاثَةٌ
    erreurs:
      نُدْبَةٌ: خلط بين الاستغاثة والندبة
      نِدَاءٌ عَادِيٌّ: خلط بين الاستغاثة والندبة
