      تَسْكِينُ اليَاءِ: خلط بين أنواع الإعلال
    indice: أَصْلُ المُضَارِعِ «تَرْمِي».
    explication: 'حُذِفَتِ اليَاءُ فِي الأَمْرِ: إِعْلَالٌ بِالحَذْفِ.'
  - id: ilal-12
