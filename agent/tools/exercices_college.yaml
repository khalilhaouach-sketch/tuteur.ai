    reponses:
    - جَمْعُ قِلَّةٍ
    erreurs:
      جَمْعُ كَثْرَةٍ: خلط بين جمع القلة والكثرة
    indice: 'جَمْعُ القِلَّةِ (مِنْ 3 إِلَى 10) أَوْزَانُهُ: أَفْعُلٌ، أَفْعَالٌ، أَفْعِلَةٌ، فِعْلَةٌ؛ وَمَا سِوَاهَا جُمُوعُ كَثْرَةٍ.'
    explication: «أَقْلَامٌ» جَمْعُ قِلَّةٍ عَلَى وَزْنِ «أَفْعَالٌ».
  - id: qilla-2
    difficulte: 1
    enonce: مَا نَوْعُ الجَمْعِ «كُتُبٌ»؟ (جَمْعُ قِلَّةٍ / جَمْعُ كَثْرَةٍ)
    reponses:
    - جَمْعُ كَثْرَةٍ
    erreurs:
