    erreurs:
      اطْتَلَعَ: خطأ في صياغة الإبدال
      اتَّلَعَ: خطأ في صياغة الإبدال
    indice: تُبْدَلُ التَّاءُ طَاءً ثُمَّ تُدْغَمُ فِي الطَّاءِ.
    explication: 'نَقُولُ: اطَّلَعَ (اطْتَلَعَ ← اطْطَلَعَ ← اطَّلَعَ).'
  - id: ibdal-7
