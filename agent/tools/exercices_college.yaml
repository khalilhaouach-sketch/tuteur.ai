    indice: 'جَمْعُ القِلَّةِ (مِنْ 3 إِلَى 10) أَوْزَانُهُ: أَفْعُلٌ، أَفْعَالٌ، أَفْعِلَةٌ، فِعْلَةٌ؛ وَمَا سِوَاهَا جُمُوعُ كَثْرَةٍ.'
    explication: «أَنْهُرٌ» جَمْعُ قِلَّةٍ عَلَى وَزْنِ «أَفْعُلٌ».
  - id: qilla-5
