      فِعَالٌ: خطأ في أوزان الجموع
    indice: قَابِلِ الحُرُوفَ.
    explication: «أَعْمِدَةٌ» عَلَى وَزْنِ «أَفْعِلَةٌ» (جَمْعُ قِلَّةٍ).
  - id: qilla-10
    difficulte: 3
    enonce: كَمْ وَزْنًا لِجُمُوعِ القِلَّةِ؟ (أَرْبَعَةٌ / سِتَّةٌ / عَشَرَةٌ)
    reponses:
    - أَرْبَعَةٌ
    erreurs:
      سِتَّةٌ: خطأ في أوزان الجموع
      عَشَرَةٌ: خطأ في أوزان الجموع
    indice: 'جَمْعُ القِلَّةِ (مِنْ 3 إِلَى 10) أَوْزَانُهُ: أَفْعُلٌ، أَفْعَالٌ، أَفْعِلَةٌ، فِعْلَةٌ؛ وَمَا سِوَاهَا جُمُوعُ كَثْرَةٍ.'
    explication: 'أَوْزَانُ جَمْعِ القِلَّةِ أَرْبَعَةٌ: أَفْعُلٌ، أَفْعَالٌ، أَفْعِلَةٌ، فِعْلَةٌ.'
  - id: qilla-11
    difficulte: 3
    enonce: مَا نَوْعُ الجَمْعِ «قُلُوبٌ»؟ (جَمْعُ قِلَّةٍ / جَمْعُ كَثْرَةٍ)
    reponses:
    - جَمْعُ كَثْرَةٍ
    erreurs:
      جَمْعُ قِلَّةٍ: خلط بين جمع القلة والكثرة
    indice: 'جَمْعُ القِلَّةِ (مِنْ 3 إِلَى 10) أَوْزَانُهُ: أَفْعُلٌ، أَفْعَالٌ، أَفْعِلَةٌ، فِعْلَةٌ؛ وَمَا سِوَاهَا جُمُوعُ كَثْرَةٍ.'
    explication: «قُلُوبٌ» جَمْعُ كَثْرَةٍ عَلَى وَزْنِ «فُعُولٌ».
  - id: qilla-12
