- notion: العدد المركب والعقود والمعطوف
  exercices:
  - id: murakkab-1
    difficulte: 1
    enonce: 'اِخْتَرِ الصَّحِيحَ: فِي القِسْمِ ... تِلْمِيذًا. (ثَلَاثَةَ عَشَرَ / ثَلَاثَ عَشْرَةَ / ثَلَاثَةَ عَشْرَةَ)'
    reponses:
    - ثَلَاثَةَ عَشَرَ
    erreurs:
      ثَلَاثَ عَشْرَةَ: خطأ في العدد المركب
      ثَلَاثَةَ عَشْرَةَ: خطأ في العدد المركب
    indice: الأَعْدَادُ 11 إِلَى 99 تَمْيِيزُهَا مُفْرَدٌ مَنْصُوبٌ. «عَشَرَ» فِي المُرَكَّبِ تُوَافِقُ المَعْدُودَ، وَالجُزْءُ الأَوَّلُ (3 إِلَى 9) يُخَالِفُهُ.
    explication: 'نَقُولُ: ثَلَاثَةَ عَشَرَ تِلْمِيذًا؛ «ثَلَاثَةَ» تُخَالِفُ المَعْدُودَ وَ«عَشَرَ» تُوَافِقُهُ.'
  - id: murakkab-2
    difficulte: 1
    enonce: 'اِخْتَرِ الصَّحِيحَ: فِي القِسْمِ ... تِلْمِيذَةً. (خَمْسَةَ عَشَرَ / خَمْسَ عَشْرَةَ / خَمْسَ عَشَرَ)'
    reponses:
    - خَمْسَ عَشْرَةَ
    erreurs:
      خَمْسَةَ عَشَرَ: خطأ في العدد المركب
      خَمْسَ عَشَرَ: خطأ في العدد المركب
    indice: الأَعْدَادُ 11 إِلَى 99 تَمْيِيزُهَا مُفْرَدٌ مَنْصُوبٌ. «عَشَرَ» فِي المُرَكَّبِ تُوَافِقُ المَعْدُودَ، وَالجُزْءُ الأَوَّلُ (3 إِلَى 9) يُخَالِفُهُ.
    explication: 'نَقُولُ: خَمْسَ عَشْرَةَ تِلْمِيذَةً.'
  - id: murakkab-3
    difficulte: 1
    enonce: مَا إِعْرَابُ تَمْيِيزِ العَدَدِ «عِشْرُونَ»؟ (مُفْرَدٌ مَنْصُوبٌ / جَمْعٌ مَجْرُورٌ / مُفْرَدٌ مَجْرُورٌ)
    reponses:
    - مُفْرَدٌ مَنْصُوبٌ
    erreurs:
      جَمْعٌ مَجْرُورٌ: خطأ في تمييز العدد
      مُفْرَدٌ مَجْرُورٌ: خطأ في تمييز العدد
    indice: الأَعْدَادُ 11 إِلَى 99 تَمْيِيزُهَا مُفْرَدٌ مَنْصُوبٌ. «عَشَرَ» فِي المُرَكَّبِ تُوَافِقُ المَعْدُودَ، وَالجُزْءُ الأَوَّلُ (3 إِلَى 9) يُخَالِفُهُ.
    explication: 'تَمْيِيزُ العُقُودِ مُفْرَدٌ مَنْصُوبٌ: عِشْرُونَ كِتَابًا.'
  - id: murakkab-4
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: قَرَأْتُ ... قِصَّةً. (عِشْرُونَ / عِشْرِينَ / عِشْرُونَا)'
    reponses:
    - عِشْرِينَ
    erreurs:
      عِشْرُونَ: خطأ في إعراب ألفاظ العقود
      عِشْرُونَا: خطأ في إعراب ألفاظ العقود
    indice: أَلْفَاظُ العُقُودِ تُعْرَبُ كَجَمْعِ المُذَكَّرِ السَّالِمِ؛ وَهِيَ هُنَا مَفْعُولٌ بِهِ.
    explication: 'نَقُولُ: قَرَأْتُ عِشْرِينَ قِصَّةً.'
  - id: murakkab-5
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: حَضَرَ ... رَجُلًا. (وَاحِدٌ وَثَلَاثُونَ / إِحْدَى وَثَلَاثُونَ / وَاحِدٌ وَثَلَاثِينَ)'
    reponses:
    - وَاحِدٌ وَثَلَاثُونَ
    erreurs:
      إِحْدَى وَثَلَاثُونَ: خطأ في العدد المعطوف
      وَاحِدٌ وَثَلَاثِينَ: خطأ في العدد المعطوف
    indice: «وَاحِدٌ» يُوَافِقُ المَعْدُودَ، وَ«ثَلَاثُونَ» مَعْطُوفٌ مَرْفُوعٌ.
    explication: 'نَقُولُ: حَضَرَ وَاحِدٌ وَثَلَاثُونَ رَجُلًا.'
  - id: murakkab-6
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: فِي المَكْتَبَةِ ... كِتَابًا. (خَمْسٌ وَأَرْبَعُونَ / خَمْسَةٌ وَأَرْبَعُونَ / خَمْسَةٌ وَأَرْبَعِينَ)'
    reponses:
    - خَمْسَةٌ وَأَرْبَعُونَ
    erreurs:
      خَمْسٌ وَأَرْبَعُونَ: خطأ في العدد المعطوف
      خَمْسَةٌ وَأَرْبَعِينَ: خطأ في العدد المعطوف
    indice: «خَمْسَةٌ» تُخَالِفُ المَعْدُودَ المُذَكَّرَ.
    explication: 'نَقُولُ: خَمْسَةٌ وَأَرْبَعُونَ كِتَابًا.'
  - id: murakkab-7
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: فِي الفَرِيقِ ... لَاعِبَةً. (اثْنَا عَشَرَ / اثْنَتَا عَشْرَةَ / اثْنَتَيْ عَشَرَ)'
    reponses:
    - اثْنَتَا عَشْرَةَ
    erreurs:
      اثْنَا عَشَرَ: خطأ في العدد المركب
      اثْنَتَيْ عَشَرَ: خطأ في العدد المركب
    indice: «اثْنَا» وَ«عَشَرَ» يُوَافِقَانِ المَعْدُودَ.
    explication: 'نَقُولُ: اثْنَتَا عَشْرَةَ لَاعِبَةً.'
  - id: murakkab-8
    difficulte: 3
    enonce: مَا حُكْمُ العَدَدِ المُرَكَّبِ (مَا عَدَا 12)؟ (مَبْنِيٌّ عَلَى فَتْحِ الجُزْأَيْنِ / مُعْرَبٌ / مَبْنِيٌّ عَلَى الضَّمِّ)
    reponses:
    - مَبْنِيٌّ عَلَى فَتْحِ الجُزْأَيْنِ
    erreurs:
      مُعْرَبٌ: خطأ في إعراب العدد المركب
      مَبْنِيٌّ عَلَى الضَّمِّ: خطأ في إعراب العدد المركب
    indice: 'قَارِنْ: جَاءَ خَمْسَةَ عَشَرَ / رَأَيْتُ خَمْسَةَ عَشَرَ.'
    explication: العَدَدُ المُرَكَّبُ مَبْنِيٌّ عَلَى فَتْحِ الجُزْأَيْنِ، إِلَّا «اثْنَا عَشَرَ» فَيُعْرَبُ صَدْرُهُ كَالمُثَنَّى.
  - id: murakkab-9
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: سَلَّمْتُ عَلَى ... ضَيْفًا. (اثْنَا عَشَرَ / اثْنَيْ عَشَرَ / اثْنَيْنِ عَشَرَ)'
    reponses:
    - اثْنَيْ عَشَرَ
    erreurs:
      اثْنَا عَشَرَ: خطأ في العدد المركب
      اثْنَيْنِ عَشَرَ: خطأ في العدد المركب
    indice: '«اثْنَا» يُعْرَبُ كَالمُثَنَّى: يُجَرُّ بِاليَاءِ وَتُحْذَفُ نُونُهُ.'
    explication: 'نَقُولُ: سَلَّمْتُ عَلَى اثْنَيْ عَشَرَ ضَيْفًا.'
  - id: murakkab-10
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: مَرَرْتُ بِـ... مَنْزِلًا. (ثَلَاثُونَ / ثَلَاثِينَ / ثَلَاثَةٍ)'
    reponses:
    - ثَلَاثِينَ
    erreurs:
      ثَلَاثُونَ: خطأ في إعراب ألفاظ العقود
      ثَلَاثَةٍ: خطأ في إعراب ألفاظ العقود
    indice: بَعْدَ حَرْفِ الجَرِّ تُجَرُّ أَلْفَاظُ العُقُودِ بِاليَاءِ.
    explication: 'نَقُولُ: مَرَرْتُ بِثَلَاثِينَ مَنْزِلًا.'
  - id: murakkab-11
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: عُمْرُ جَدِّي ... سَنَةً. (سَبْعٌ وَسِتُّونَ / سَبْعَةٌ وَسِتُّونَ / سَبْعٌ وَسِتِّينَ)'
    reponses:
    - سَبْعٌ وَسِتُّونَ
    erreurs:
      سَبْعَةٌ وَسِتُّونَ: خطأ في العدد المعطوف
      سَبْعٌ وَسِتِّينَ: خطأ في العدد المعطوف
    indice: «سَنَةٌ» مُؤَنَّثٌ، فَالعَدَدُ «سَبْعٌ» مُذَكَّرٌ.
    explication: 'نَقُولُ: سَبْعٌ وَسِتُّونَ سَنَةً.'
  - id: murakkab-12
    difficulte: 3
    enonce: 'مَا تَمْيِيزُ العَدَدِ فِي: اشْتَرَيْتُ تِسْعَةَ عَشَرَ قَلَمًا؟ (تِسْعَةَ / عَشَرَ / قَلَمًا)'
    reponses:
    - قَلَمًا
    erreurs:
      تِسْعَةَ: خطأ في تمييز العدد
      عَشَرَ: خطأ في تمييز العدد
    indice: الأَعْدَادُ 11 إِلَى 99 تَمْيِيزُهَا مُفْرَدٌ مَنْصُوبٌ. «عَشَرَ» فِي المُرَكَّبِ تُوَافِقُ المَعْدُودَ، وَالجُزْءُ الأَوَّلُ (3 إِلَى 9) يُخَالِفُهُ.
    explication: التَّمْيِيزُ «قَلَمًا» مُفْرَدٌ مَنْصُوبٌ.
  - id: murakkab-13
    difficulte: 3
    enonce: هَلْ تَتَغَيَّرُ أَلْفَاظُ العُقُودِ (عِشْرُونَ...) مَعَ المُذَكَّرِ وَالمُؤَنَّثِ؟ (لَا تَتَغَيَّرُ / تَتَغَيَّرُ)
    reponses:
    - لَا تَتَغَيَّرُ
    erreurs:
      تَتَغَيَّرُ: خطأ في ألفاظ العقود
    indice: عِشْرُونَ رَجُلًا، عِشْرُونَ امْرَأَةً.
    explication: أَلْفَاظُ العُقُودِ لَا تَتَغَيَّرُ مَعَ التَّذْكِيرِ وَالتَّأْنِيثِ.
- notion: كم الاستفهامية والخبرية
  exercices:
  - id: kam-1
    difficulte: 1
    enonce: '«كَمْ» فِي «كَمْ كِتَابًا قَرَأْتَ؟»: (اسْتِفْهَامِيَّةٌ / خَبَرِيَّةٌ)'
    reponses:
    - اسْتِفْهَامِيَّةٌ
    erreurs:
      خَبَرِيَّةٌ: خلط بين كم الاستفهامية والخبرية
    indice: «كَمْ» الاِسْتِفْهَامِيَّةُ تَمْيِيزُهَا مُفْرَدٌ مَنْصُوبٌ (كَمْ كِتَابًا؟)، وَالخَبَرِيَّةُ تَدُلُّ عَلَى الكَثْرَةِ وَتَمْيِيزُهَا مَجْرُورٌ (كَمْ كِتَابٍ قَرَأْتُ!).
    explication: '«كَمْ» اسْتِفْهَامِيَّةٌ: نَسْأَلُ عَنِ العَدَدِ، وَتَمْيِيزُهَا «كِتَابًا» مَنْصُوبٌ.'
  - id: kam-2
    difficulte: 1
    enonce: '«كَمْ» فِي «كَمْ كِتَابٍ قَرَأْتُ!»: (اسْتِفْهَامِيَّةٌ / خَبَرِيَّةٌ)'
    reponses:
    - خَبَرِيَّةٌ
    erreurs:
      اسْتِفْهَامِيَّةٌ: خلط بين كم الاستفهامية والخبرية
    indice: «كَمْ» الاِسْتِفْهَامِيَّةُ تَمْيِيزُهَا مُفْرَدٌ مَنْصُوبٌ (كَمْ كِتَابًا؟)، وَالخَبَرِيَّةُ تَدُلُّ عَلَى الكَثْرَةِ وَتَمْيِيزُهَا مَجْرُورٌ (كَمْ كِتَابٍ قَرَأْتُ!).
    explication: '«كَمْ» خَبَرِيَّةٌ: تَدُلُّ عَلَى الكَثْرَةِ، وَتَمْيِيزُهَا «كِتَابٍ» مَجْرُورٌ.'
  - id: kam-3
    difficulte: 1
    enonce: 'اِخْتَرِ الصَّحِيحَ: كَمْ ... فِي قِسْمِكَ؟ (تِلْمِيذًا / تِلْمِيذٍ / تِلْمِيذٌ)'
    reponses:
    - تِلْمِيذًا
    erreurs:
      تِلْمِيذٍ: خطأ في تمييز كم
      تِلْمِيذٌ: خطأ في تمييز كم
    indice: «كَمْ» الاِسْتِفْهَامِيَّةُ تَمْيِيزُهَا مُفْرَدٌ مَنْصُوبٌ (كَمْ كِتَابًا؟)، وَالخَبَرِيَّةُ تَدُلُّ عَلَى الكَثْرَةِ وَتَمْيِيزُهَا مَجْرُورٌ (كَمْ كِتَابٍ قَرَأْتُ!).
    explication: 'نَقُولُ: كَمْ تِلْمِيذًا فِي قِسْمِكَ؟'
  - id: kam-4
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: كَمْ ... زُرْتُ! (مَدِينَةً / مَدِينَةٍ / مَدِينَةٌ)'
    reponses:
    - مَدِينَةٍ
    erreurs:
      مَدِينَةً: خطأ في تمييز كم
      مَدِينَةٌ: خطأ في تمييز كم
    indice: «كَمْ» هُنَا تُخْبِرُ عَنِ الكَثْرَةِ.
    explication: 'نَقُولُ: كَمْ مَدِينَةٍ زُرْتُ!'
  - id: kam-5
    difficulte: 2
    enonce: مَاذَا تُفِيدُ «كَمْ» الخَبَرِيَّةُ؟ (الكَثْرَةَ / السُّؤَالَ عَنِ العَدَدِ / النَّفْيَ)
    reponses:
    - الكَثْرَةَ
    erreurs:
      السُّؤَالَ عَنِ العَدَدِ: خلط بين كم الاستفهامية والخبرية
      النَّفْيَ: خلط بين كم الاستفهامية والخبرية
    indice: «كَمْ» الاِسْتِفْهَامِيَّةُ تَمْيِيزُهَا مُفْرَدٌ مَنْصُوبٌ (كَمْ كِتَابًا؟)، وَالخَبَرِيَّةُ تَدُلُّ عَلَى الكَثْرَةِ وَتَمْيِيزُهَا مَجْرُورٌ (كَمْ كِتَابٍ قَرَأْتُ!).
    explication: «كَمْ» الخَبَرِيَّةُ تُفِيدُ الكَثْرَةَ.
  - id: kam-6
    difficulte: 2
    enonce: مَا حُكْمُ تَمْيِيزِ «كَمْ» الاِسْتِفْهَامِيَّةِ؟ (مُفْرَدٌ مَنْصُوبٌ / مُفْرَدٌ أَوْ جَمْعٌ مَجْرُورٌ / مَرْفُوعٌ)
    reponses:
    - مُفْرَدٌ مَنْصُوبٌ
    erreurs:
      مُفْرَدٌ أَوْ جَمْعٌ مَجْرُورٌ: خطأ في تمييز كم
      مَرْفُوعٌ: خطأ في تمييز كم
    indice: «كَمْ» الاِسْتِفْهَامِيَّةُ تَمْيِيزُهَا مُفْرَدٌ مَنْصُوبٌ (كَمْ كِتَابًا؟)، وَالخَبَرِيَّةُ تَدُلُّ عَلَى الكَثْرَةِ وَتَمْيِيزُهَا مَجْرُورٌ (كَمْ كِتَابٍ قَرَأْتُ!).
    explication: تَمْيِيزُ «كَمْ» الاِسْتِفْهَامِيَّةِ مُفْرَدٌ مَنْصُوبٌ.
  - id: kam-7
    difficulte: 2
    enonce: مَا حُكْمُ تَمْيِيزِ «كَمْ» الخَبَرِيَّةِ؟ (مُفْرَدٌ أَوْ جَمْعٌ مَجْرُورٌ / مُفْرَدٌ مَنْصُوبٌ / مَرْفُوعٌ)
    reponses:
    - مُفْرَدٌ أَوْ جَمْعٌ مَجْرُورٌ
    erreurs:
      مُفْرَدٌ مَنْصُوبٌ: خطأ في تمييز كم
      مَرْفُوعٌ: خطأ في تمييز كم
    indice: «كَمْ» الاِسْتِفْهَامِيَّةُ تَمْيِيزُهَا مُفْرَدٌ مَنْصُوبٌ (كَمْ كِتَابًا؟)، وَالخَبَرِيَّةُ تَدُلُّ عَلَى الكَثْرَةِ وَتَمْيِيزُهَا مَجْرُورٌ (كَمْ كِتَابٍ قَرَأْتُ!).
    explication: 'تَمْيِيزُ «كَمْ» الخَبَرِيَّةِ مَجْرُورٌ، مُفْرَدًا أَوْ جَمْعًا: كَمْ كِتَابٍ، كَمْ كُتُبٍ.'
  - id: kam-8
    difficulte: 3
    enonce: مَا عَلَامَةُ التَّرْقِيمِ بَعْدَ جُمْلَةِ «كَمْ» الخَبَرِيَّةِ؟ (عَلَامَةُ التَّعَجُّبِ / عَلَامَةُ الاِسْتِفْهَامِ / النُّقْطَتَانِ)
    reponses:
    - عَلَامَةُ التَّعَجُّبِ
    erreurs:
      عَلَامَةُ الاِسْتِفْهَامِ: خلط بين كم الاستفهامية والخبرية
      النُّقْطَتَانِ: خلط بين كم الاستفهامية والخبرية
    indice: «كَمْ نِعْمَةٍ أَنْعَمَ اللَّهُ عَلَيْنَا ...»
    explication: تُخْتَمُ جُمْلَةُ «كَمْ» الخَبَرِيَّةِ بِعَلَامَةِ التَّعَجُّبِ (!).
  - id: kam-9
    difficulte: 3
    enonce: '«كَمْ» فِي «كَمْ مَرَّةٍ نَصَحْتُكَ!»: (اسْتِفْهَامِيَّةٌ / خَبَرِيَّةٌ)'
    reponses:
    - خَبَرِيَّةٌ
    erreurs:
      اسْتِفْهَامِيَّةٌ: خلط بين كم الاستفهامية والخبرية
    indice: «كَمْ» الاِسْتِفْهَامِيَّةُ تَمْيِيزُهَا مُفْرَدٌ مَنْصُوبٌ (كَمْ كِتَابًا؟)، وَالخَبَرِيَّةُ تَدُلُّ عَلَى الكَثْرَةِ وَتَمْيِيزُهَا مَجْرُورٌ (كَمْ كِتَابٍ قَرَأْتُ!).
    explication: '«كَمْ» خَبَرِيَّةٌ: تَمْيِيزُهَا «مَرَّةٍ» مَجْرُورٌ، وَالمَعْنَى: نَصَحْتُكَ مَرَّاتٍ كَثِيرَةً.'
  - id: kam-10
    difficulte: 3
    enonce: '«كَمْ» فِي «كَمْ سَاعَةً تَنَامُ؟»: (اسْتِفْهَامِيَّةٌ / خَبَرِيَّةٌ)'
    reponses:
    - اسْتِفْهَامِيَّةٌ
    erreurs:
      خَبَرِيَّةٌ: خلط بين كم الاستفهامية والخبرية
    indice: «كَمْ» الاِسْتِفْهَامِيَّةُ تَمْيِيزُهَا مُفْرَدٌ مَنْصُوبٌ (كَمْ كِتَابًا؟)، وَالخَبَرِيَّةُ تَدُلُّ عَلَى الكَثْرَةِ وَتَمْيِيزُهَا مَجْرُورٌ (كَمْ كِتَابٍ قَرَأْتُ!).
    explication: «كَمْ» اسْتِفْهَامِيَّةٌ، وَتَمْيِيزُهَا «سَاعَةً» مَنْصُوبٌ.
  - id: kam-11
    difficulte: 3
    enonce: 'مَا إِعْرَابُ «كَمْ» فِي: كَمْ كِتَابًا قَرَأْتَ؟ (اسْمٌ مَبْنِيٌّ فِي مَحَلِّ نَصْبٍ مَفْعُولٌ بِهِ مُقَدَّمٌ / حَرْفٌ / مُبْتَدَأٌ)'
    reponses:
    - اسْمٌ مَبْنِيٌّ فِي مَحَلِّ نَصْبٍ مَفْعُولٌ بِهِ مُقَدَّمٌ
    erreurs:
      حَرْفٌ: خطأ في إعراب كم
      مُبْتَدَأٌ: خطأ في إعراب كم
    indice: الفِعْلُ «قَرَأْتَ» يَحْتَاجُ إِلَى مَفْعُولٍ بِهِ.
    explication: «كَمْ» اسْمُ اسْتِفْهَامٍ مَبْنِيٌّ عَلَى السُّكُونِ فِي مَحَلِّ نَصْبٍ مَفْعُولٌ بِهِ مُقَدَّمٌ.
  - id: kam-12
    difficulte: 3
    enonce: 'اِخْتَرِ الصَّحِيحَ: بِكَمْ ... اشْتَرَيْتَ الكِتَابَ؟ (دِرْهَمًا / دِرْهَمٍ / كِلَاهُمَا جَائِزٌ)'
    reponses:
    - كِلَاهُمَا جَائِزٌ
    erreurs:
      دِرْهَمًا: خطأ في تمييز كم
      دِرْهَمٍ: خطأ في تمييز كم
    indice: إِذَا سُبِقَتْ «كَمْ» الاِسْتِفْهَامِيَّةُ بِحَرْفِ جَرٍّ جَازَ جَرُّ تَمْيِيزِهَا.
    explication: 'يَجُوزُ: بِكَمْ دِرْهَمًا؟ وَبِكَمْ دِرْهَمٍ؟'
  - id: kam-13
    difficulte: 3
    enonce: مَا مَوْقِعُ «كَمْ» دَائِمًا فِي الجُمْلَةِ؟ (فِي أَوَّلِهَا / فِي آخِرِهَا / فِي وَسَطِهَا)
    reponses:
    - فِي أَوَّلِهَا
    erreurs:
      فِي آخِرِهَا: خطأ في إعراب كم
      فِي وَسَطِهَا: خطأ في إعراب كم
    indice: «كَمْ» لَهَا الصَّدَارَةُ.
    explication: «كَمْ» بِنَوْعَيْهَا لَهَا الصَّدَارَةُ فِي الجُمْلَةِ (إِلَّا حَرْفَ الجَرِّ أَوِ المُضَافَ قَبْلَهَا).
- notion: أسلوب التعجب
  exercices:
  - id: taajjub-1
    difficulte: 1
    enonce: أَيُّ جُمْلَةٍ فِيهَا تَعَجُّبٌ قِيَاسِيٌّ؟ (مَا أَجْمَلَ الرَّبِيعَ! / مَا أَجْمَلُ الرَّبِيعِ؟ / الرَّبِيعُ جَمِيلٌ)
    reponses:
    - مَا أَجْمَلَ الرَّبِيعَ!
    erreurs:
      مَا أَجْمَلُ الرَّبِيعِ؟: خلط بين التعجب والاستفهام
      الرَّبِيعُ جَمِيلٌ: خلط بين التعجب والاستفهام
    indice: 'لِلتَّعَجُّبِ صِيغَتَانِ قِيَاسِيَّتَانِ: «مَا أَفْعَلَهُ!» (مَا أَجْمَلَ السَّمَاءَ!) وَ«أَفْعِلْ بِهِ!» (أَجْمِلْ بِالسَّمَاءِ!).'
    explication: «مَا أَجْمَلَ الرَّبِيعَ!» تَعَجُّبٌ عَلَى صِيغَةِ «مَا أَفْعَلَهُ!».
  - id: taajjub-2
    difficulte: 1
    enonce: مَا المُتَعَجَّبُ مِنْهُ فِي «مَا أَوْسَعَ البَحْرَ»؟ (مَا / أَوْسَعَ / البَحْرَ)
    reponses:
    - البَحْرَ
    erreurs:
      مَا: خطأ في عناصر التعجب
      أَوْسَعَ: خطأ في عناصر التعجب
    indice: 'لِلتَّعَجُّبِ صِيغَتَانِ قِيَاسِيَّتَانِ: «مَا أَفْعَلَهُ!» (مَا أَجْمَلَ السَّمَاءَ!) وَ«أَفْعِلْ بِهِ!» (أَجْمِلْ بِالسَّمَاءِ!).'
    explication: المُتَعَجَّبُ مِنْهُ «البَحْرَ»، وَهُوَ مَنْصُوبٌ.
  - id: taajjub-3
    difficulte: 1
    enonce: 'اِخْتَرِ الصَّحِيحَ: مَا أَحْلَى ...! (العَسَلُ / العَسَلَ / العَسَلِ)'
    reponses:
    - العَسَلَ
    erreurs:
      العَسَلُ: خطأ في إعراب المتعجب منه
      العَسَلِ: خطأ في إعراب المتعجب منه
    indice: المُتَعَجَّبُ مِنْهُ بَعْدَ «مَا أَفْعَلَ» مَنْصُوبٌ.
    explication: 'نَقُولُ: مَا أَحْلَى العَسَلَ!'
  - id: taajjub-4
    difficulte: 1
    enonce: 'صُغِ التَّعَجُّبَ مِنْ «كَرُمَ» عَلَى «مَا أَفْعَلَ»: (مَا أَكْرَمَ الضَّيْفَ! / مَا أَكْرَمُ الضَّيْفِ! / مَا كَرِيمُ الضَّيْفِ!)'
    reponses:
    - مَا أَكْرَمَ الضَّيْفَ!
    erreurs:
      مَا أَكْرَمُ الضَّيْفِ!: خطأ في صياغة التعجب
      مَا كَرِيمُ الضَّيْفِ!: خطأ في صياغة التعجب
    indice: 'لِلتَّعَجُّبِ صِيغَتَانِ قِيَاسِيَّتَانِ: «مَا أَفْعَلَهُ!» (مَا أَجْمَلَ السَّمَاءَ!) وَ«أَفْعِلْ بِهِ!» (أَجْمِلْ بِالسَّمَاءِ!).'
    explication: 'نَقُولُ: مَا أَكْرَمَ الضَّيْفَ!'
  - id: taajjub-5
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ عَلَى صِيغَةِ «أَفْعِلْ بِهِ»: (أَجْمِلْ بِالطَّبِيعَةِ! / أَجْمَلَ الطَّبِيعَةُ! / أَجْمِلِ الطَّبِيعَةَ!)'
    reponses:
    - أَجْمِلْ بِالطَّبِيعَةِ!
    erreurs:
      أَجْمَلَ الطَّبِيعَةُ!: خطأ في صياغة التعجب
      أَجْمِلِ الطَّبِيعَةَ!: خطأ في صياغة التعجب
    indice: 'لِلتَّعَجُّبِ صِيغَتَانِ قِيَاسِيَّتَانِ: «مَا أَفْعَلَهُ!» (مَا أَجْمَلَ السَّمَاءَ!) وَ«أَفْعِلْ بِهِ!» (أَجْمِلْ بِالسَّمَاءِ!).'
    explication: 'نَقُولُ: أَجْمِلْ بِالطَّبِيعَةِ!'
  - id: taajjub-6
    difficulte: 2
    enonce: 'اِخْتَرِ الصَّحِيحَ: أَكْرِمْ ...! (بِالمُعَلِّمِ / المُعَلِّمَ / المُعَلِّمُ)'
    reponses:
    - بِالمُعَلِّمِ
    erreurs:
      المُعَلِّمَ: خطأ في صياغة التعجب
      المُعَلِّمُ: خطأ في صياغة التعجب
    indice: صِيغَةُ «أَفْعِلْ بِهِ» يَأْتِي بَعْدَهَا البَاءُ.
    explication: 'نَقُولُ: أَكْرِمْ بِالمُعَلِّمِ!'
  - id: taajjub-7
    difficulte: 2
    enonce: مَا الفَرْقُ بَيْنَ «مَا أَحْسَنَ السَّمَاءَ!» وَ«مَا أَحْسَنُ السَّمَاءِ؟»؟ (الأُولَى تَعَجُّبٌ وَالثَّانِيَةُ اسْتِفْهَامٌ / كِلْتَاهُمَا تَعَجُّبٌ / الأُولَى اسْتِفْهَامٌ)
    reponses:
    - الأُولَى تَعَجُّبٌ وَالثَّانِيَةُ اسْتِفْهَامٌ
    erreurs:
      كِلْتَاهُمَا تَعَجُّبٌ: خلط بين التعجب والاستفهام
      الأُولَى اسْتِفْهَامٌ: خلط بين التعجب والاستفهام
    indice: اُنْظُرْ إِلَى الحَرَكَاتِ وَعَلَامَةِ التَّرْقِيمِ.
    explication: الأُولَى تَعَجُّبٌ («أَحْسَنَ» فِعْلٌ، «السَّمَاءَ» مَفْعُولٌ)، وَالثَّانِيَةُ اسْتِفْهَامٌ عَنْ أَحْسَنِ مَا فِي السَّمَاءِ.
  - id: taajjub-8
    difficulte: 2
    enonce: كَيْفَ نَتَعَجَّبُ مِنْ فِعْلٍ غَيْرِ ثُلَاثِيٍّ مِثْلِ «انْتَصَرَ»؟ (مَا أَعْظَمَ انْتِصَارَ الجَيْشِ! / مَا أَنْتَصَرَ الجَيْشَ! / أَنْتِصِرْ بِالجَيْشِ!)
    reponses:
    - مَا أَعْظَمَ انْتِصَارَ الجَيْشِ!
    erreurs:
      مَا أَنْتَصَرَ الجَيْشَ!: خطأ في صياغة التعجب
      أَنْتِصِرْ بِالجَيْشِ!: خطأ في صياغة التعجب
    indice: نَسْتَعْمِلُ فِعْلًا مُسَاعِدًا (أَعْظَمَ، أَشَدَّ، أَكْثَرَ) + المَصْدَرَ.
    explication: 'نَقُولُ: مَا أَعْظَمَ انْتِصَارَ الجَيْشِ!'
  - id: taajjub-9
    difficulte: 3
    enonce: مَا إِعْرَابُ «مَا» فِي «مَا أَجْمَلَ السَّمَاءَ»؟ (نَكِرَةٌ تَامَّةٌ بِمَعْنَى «شَيْءٌ» فِي مَحَلِّ رَفْعٍ مُبْتَدَأٌ / نَافِيَةٌ / اسْتِفْهَامِيَّةٌ)
    reponses:
    - نَكِرَةٌ تَامَّةٌ بِمَعْنَى «شَيْءٌ» فِي مَحَلِّ رَفْعٍ مُبْتَدَأٌ
    erreurs:
      نَافِيَةٌ: خطأ في إعراب ما التعجبية
      اسْتِفْهَامِيَّةٌ: خطأ في إعراب ما التعجبية
    indice: 'المَعْنَى: شَيْءٌ عَظِيمٌ جَعَلَ السَّمَاءَ جَمِيلَةً.'
    explication: «مَا» التَّعَجُّبِيَّةُ نَكِرَةٌ تَامَّةٌ مَبْنِيَّةٌ فِي مَحَلِّ رَفْعٍ مُبْتَدَأٌ.
  - id: taajjub-10
    difficulte: 3
    enonce: مَا إِعْرَابُ «أَجْمَلَ» فِي «مَا أَجْمَلَ السَّمَاءَ»؟ (فِعْلٌ مَاضٍ جَامِدٌ لِلتَّعَجُّبِ / اسْمُ تَفْضِيلٍ / خَبَرٌ مَرْفُوعٌ)
    reponses:
    - فِعْلٌ مَاضٍ جَامِدٌ لِلتَّعَجُّبِ
    erreurs:
      اسْمُ تَفْضِيلٍ: خطأ في إعراب فعل التعجب
      خَبَرٌ مَرْفُوعٌ: خطأ في إعراب فعل التعجب
    indice: هُوَ فِعْلٌ يَنْصِبُ «السَّمَاءَ».
    explication: «أَجْمَلَ» فِعْلٌ مَاضٍ جَامِدٌ لِإِنْشَاءِ التَّعَجُّبِ، وَالجُمْلَةُ خَبَرُ «مَا».
  - id: taajjub-11
    difficulte: 3
    enonce: أَيُّ هَذِهِ تَعَجُّبٌ سَمَاعِيٌّ؟ (سُبْحَانَ اللَّهِ! / مَا أَطْيَبَ الخُبْزَ! / أَطْيِبْ بِالخُبْزِ!)
    reponses:
    - سُبْحَانَ اللَّهِ!
    erreurs:
      مَا أَطْيَبَ الخُبْزَ!: خلط بين التعجب القياسي والسماعي
      أَطْيِبْ بِالخُبْزِ!: خلط بين التعجب القياسي والسماعي
    indice: السَّمَاعِيُّ لَيْسَ لَهُ صِيغَةٌ ثَابِتَةٌ.
    explication: «سُبْحَانَ اللَّهِ!» تَعَجُّبٌ سَمَاعِيٌّ؛ وَالصِّيغَتَانِ الأُخْرَيَانِ قِيَاسِيَّتَانِ.
  - id: taajjub-12
    difficulte: 3
    enonce: 'صُغِ التَّعَجُّبَ مِنْ «صَدَقَ» عَلَى «أَفْعِلْ بِهِ»: (أَصْدِقْ بِالرَّجُلِ! / أَصْدَقَ الرَّجُلُ! / أَصْدِقِ الرَّجُلَ!)'
    reponses:
    - أَصْدِقْ بِالرَّجُلِ!
    erreurs:
      أَصْدَقَ الرَّجُلُ!: خطأ في صياغة التعجب
      أَصْدِقِ الرَّجُلَ!: خطأ في صياغة التعجب
    indice: 'لِلتَّعَجُّبِ صِيغَتَانِ قِيَاسِيَّتَانِ: «مَا أَفْعَلَهُ!» (مَا أَجْمَلَ السَّمَاءَ!) وَ«أَفْعِلْ بِهِ!» (أَجْمِلْ بِالسَّمَاءِ!).'
    explication: 'نَقُولُ: أَصْدِقْ بِالرَّجُلِ!'
  - id: taajjub-13
    difficulte: 3
    enonce: مَا الحُكْمُ الإِعْرَابِيُّ لِلْمُتَعَجَّبِ مِنْهُ بَعْدَ «أَفْعِلْ»؟ (مَجْرُورٌ بِالبَاءِ لَفْظًا مَرْفُوعٌ مَحَلًّا / مَنْصُوبٌ / مَرْفُوعٌ لَفْظًا)
    reponses:
    - مَجْرُورٌ بِالبَاءِ لَفْظًا مَرْفُوعٌ مَحَلًّا
    erreurs:
      مَنْصُوبٌ: خطأ في إعراب المتعجب منه
      مَرْفُوعٌ لَفْظًا: خطأ في إعراب المتعجب منه
    indice: البَاءُ زَائِدَةٌ.
    explication: 'فِي «أَجْمِلْ بِالسَّمَاءِ!»: «السَّمَاءِ» مَجْرُورٌ بِالبَاءِ الزَّائِدَةِ لَفْظًا، مَرْفُوعٌ مَحَلًّا فَاعِلٌ.'
- notion: أسلوب المدح والذم
  exercices:
  - id: madh-1
    difficulte: 1
    enonce: 'مَا نَوْعُ الأُسْلُوبِ فِي: نِعْمَ الصَّدِيقُ الكِتَابُ؟ (مَدْحٌ / ذَمٌّ)'
    reponses:
    - مَدْحٌ
    erreurs:
      ذَمٌّ: خلط بين المدح والذم
    indice: '«نِعْمَ» لِلْمَدْحِ وَ«بِئْسَ» لِلذَّمِّ: نِعْمَ الخُلُقُ الصِّدْقُ؛ «الخُلُقُ» فَاعِلٌ، وَ«الصِّدْقُ» مَخْصُوصٌ بِالمَدْحِ.'
    explication: «نِعْمَ» لِلْمَدْحِ.
  - id: madh-2
    difficulte: 1
    enonce: 'مَا نَوْعُ الأُسْلُوبِ فِي: بِئْسَ الخُلُقُ الكَذِبُ؟ (مَدْحٌ / ذَمٌّ)'
    reponses:
    - ذَمٌّ
    erreurs:
      مَدْحٌ: خلط بين المدح والذم
    indice: '«نِعْمَ» لِلْمَدْحِ وَ«بِئْسَ» لِلذَّمِّ: نِعْمَ الخُلُقُ الصِّدْقُ؛ «الخُلُقُ» فَاعِلٌ، وَ«الصِّدْقُ» مَخْصُوصٌ بِالمَدْحِ.'
    explication: «بِئْسَ» لِلذَّمِّ.
  - id: madh-3
    difficulte: 1
    enonce: 'مَا المَخْصُوصُ بِالمَدْحِ فِي: نِعْمَ الرِّيَاضَةُ السِّبَاحَةُ؟ (نِعْمَ / الرِّيَاضَةُ / السِّبَاحَةُ)'
    reponses:
    - السِّبَاحَةُ
    erreurs:
      نِعْمَ: خطأ في عناصر المدح والذم
      الرِّيَاضَةُ: خطأ في عناصر المدح والذم
    indice: '«نِعْمَ» لِلْمَدْحِ وَ«بِئْسَ» لِلذَّمِّ: نِعْمَ الخُلُقُ الصِّدْقُ؛ «الخُلُقُ» فَاعِلٌ، وَ«الصِّدْقُ» مَخْصُوصٌ بِالمَدْحِ.'
    explication: المَخْصُوصُ بِالمَدْحِ «السِّبَاحَةُ»، وَ«الرِّيَاضَةُ» فَاعِلٌ.
  - id: madh-4
    difficulte: 1
