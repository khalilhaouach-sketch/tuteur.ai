    indice: 'جَمْعُ القِلَّةِ (مِنْ 3 إِلَى 10) أَوْزَانُهُ: أَفْعُلٌ، أَفْعَالٌ، أَفْعِلَةٌ، فِعْلَةٌ؛ وَمَا سِوَاهَا جُمُوعُ كَثْرَةٍ.'
    explication: «رِجَالٌ» جَمْعُ كَثْرَةٍ عَلَى وَزْنِ «فِعَالٌ».
  - id: qilla-7
    difficulte: 2
    enonce: مَا نَوْعُ الجَمْعِ «فِتْيَةٌ»؟ (جَمْعُ قِلَّةٍ / جَمْعُ كَثْرَةٍ)
    reponses:
    - جَمْعُ قِلَّةٍ
    erreurs:
      جَمْعُ كَثْرَةٍ: خلط بين جمع القلة والكثرة
    indice: 'جَمْعُ القِلَّةِ (مِنْ 3 إِلَى 10) أَوْزَانُهُ: أَفْعُلٌ، أَفْعَالٌ، أَفْعِلَةٌ، فِعْلَةٌ؛ وَمَا سِوَاهَا جُمُوعُ كَثْرَةٍ.'
    explication: «فِتْيَةٌ» جَمْعُ قِلَّةٍ عَلَى وَزْنِ «فِعْلَةٌ».
  - id: qilla-8
    difficulte: 3
    enonce: مَا جَمْعُ الكَثْرَةِ لِـ«نَهْرٌ»؟ (أَنْهُرٌ / أَنْهَارٌ / نُهُورٌ)
    reponses:
    - نُهُورٌ
    erreurs:
      أَنْهُرٌ: خلط بين جمع القلة والكثرة
      أَنْهَارٌ: خلط بين جمع القلة والكثرة
    indice: «أَنْهُرٌ» وَ«أَنْهَارٌ» جَمْعَا قِلَّةٍ.
    explication: 'جَمْعُ الكَثْرَةِ: نُهُورٌ (عَلَى «فُعُولٌ»).'
  - id: qilla-9
    difficulte: 3
    voyelles_obligatoires: true
    enonce: عَلَى أَيِّ وَزْنٍ «أَعْمِدَةٌ»؟ (أَفْعِلَةٌ / أَفْعَالٌ / فِعَالٌ)
    reponses:
