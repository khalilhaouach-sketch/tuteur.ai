    indice: 'مِثَالٌ: ازْدَهَرَ، ادَّعَى، اذَّكَرَ.'
    explication: تُبْدَلُ التَّاءُ دَالًا بَعْدَ الدَّالِ وَالذَّالِ وَالزَّايِ.
  - id: ibdal-6
    difficulte: 2
    enonce: 'صُغْ «افْتَعَلَ» مِنْ «طَلَعَ»: (اطْتَلَعَ / اطَّلَعَ / اتَّلَعَ)'
    reponses:
