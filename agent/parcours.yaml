  - أسماء الإشارة
  - الاسم الموصول
- id: 1ac-4
  titre: الجملة (1AC)
  description: '1AC semestre 2 : المبتدأ والخبر، المتعدي، المبني للمجهول'
  notions:
  - أحوال المبتدأ والخبر
  - تطابق المبتدأ والخبر
  - ظن وأخواتها
  - أعطى وأخواتها
  - المبني للمجهول
- id: 2ac-1
  titre: المفاعيل والمصادر (2AC)
  description: '2AC semestre 1 : المفعول معه، الممنوع من الصرف، المشتقات، المصادر'
  notions:
  - المفعول معه
  - الممنوع من الصرف
  - الصفة المشبهة
  - صيغ المبالغة
  - المصدر الصريح والمصدر المؤول
  - المصدر الميمي والمصدر الصناعي
  - مصدر المرة ومصدر الهيئة
- id: 2ac-2
  titre: النواسخ والتراكيب (2AC)
  description: '2AC semestre 2 : أفعال المقاربة، لا النافية للجنس، الجامد والمتصرف، نونا التوكيد، الإضافة'
  notions:
